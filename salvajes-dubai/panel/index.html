<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Salvajes Dubai · Panel (demo)</title>
<meta name="theme-color" content="#120d0c">
<link rel="icon" href="../img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Panel demo Salvajes Dubai · datos de ejemplo guardados en este navegador (compartidos con la web) */
:root{--cr:#f6f1e8;--cr2:#ece4d6;--w:#fff;--ink:#1d1514;--mu:#7f7266;--rojo:#7a1f2b;--rb:#f5e3e3;--oro:#a7813f;--ob:#f4ebd8;--ok:#3f6b4d;--okb:#e3efe6;--wa:#94621a;--wab:#f7ead3;--bl:#46566c;--blb:#e3e8ef;--bd:rgba(29,21,20,.09);--side:236px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cr);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.mono{font-family:Oswald;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:#120d0c;color:#efe3c9;padding:18px 12px;display:flex;flex-direction:column;z-index:30}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px 20px}
.marca img{width:42px;height:42px;border-radius:6px}.marca b{font-family:'Playfair Display';font-size:18px;letter-spacing:.05em;display:block}.marca small{color:#b3a48a;font-size:11.5px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:6px;color:#cfc2a8;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.on{background:var(--rojo);color:#fff}
.nav .ic{width:20px;text-align:center}.nav .bd{margin-left:auto;background:#c7a160;color:#120d0c;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.yo{border-top:1px solid rgba(255,255,255,.1);padding:12px 6px 0;font-size:12px;color:#b3a48a}
.yo b{color:#efe3c9;display:block;font-size:13px}
.main{margin-left:var(--side);padding:24px 30px 90px;min-height:100vh}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hd h1{margin:4px 0 0;font-family:'Playfair Display';font-size:38px;line-height:1.05}.hd h1 em{color:var(--rojo)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border-radius:6px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.bp{background:var(--ink);color:#fff}.br{background:var(--rojo);color:#fff}.bs{background:var(--w);box-shadow:0 0 0 1px var(--bd);color:var(--ink)}.bw{background:#25d366;color:#05301a}
.peq{padding:6px 10px;font-size:12px}
.card{background:var(--w);border-radius:12px;box-shadow:0 0 0 1px var(--bd);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi small{color:var(--mu);font-size:12.5px}.kpi b{display:block;font-family:'Playfair Display';font-size:38px;line-height:1;margin-top:6px}.kpi .tr{font-size:12px;color:var(--ok);font-weight:600;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-r{background:var(--rb);color:var(--rojo)}.c-bl{background:var(--blb);color:var(--bl)}.c-o{background:var(--ob);color:var(--oro)}.c-n{background:var(--cr2);color:#6e655c}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:10px}.sec-t h3{margin:0;font-family:'Playfair Display';font-size:21px}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row .t{font-size:12px;color:var(--mu);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.row .x{flex:1;min-width:0}.row .x b{font-weight:600;display:block}.row .x small{color:var(--mu);font-size:12.5px}
.row.click{cursor:pointer;border-radius:8px}.row.click:hover{background:var(--cr)}
.av{width:32px;height:32px;border-radius:50%;background:var(--rojo);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.empty{color:var(--mu);text-align:center;padding:22px 0;font-size:13.5px}
.brilla{animation:brilla 2.4s}@keyframes brilla{0%,40%{box-shadow:0 0 0 3px #c7a160}}
/* agenda por barbero */
.ag{display:grid;background:var(--w);border-radius:12px;box-shadow:0 0 0 1px var(--bd);overflow:auto;position:relative}
.ag .h{padding:10px 6px;text-align:center;font-weight:600;font-size:13px;border-bottom:1px solid var(--bd);background:#fbf8f3;position:sticky;top:0;z-index:3}
.ag .h i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.ag .h small{display:block;color:var(--mu);font-weight:400;font-size:11px}
.col{position:relative;border-left:1px solid var(--bd)}
.hcol .hr{height:40px;font-size:10.5px;color:var(--mu);padding:3px 6px;border-top:1px solid var(--bd)}
.col .sl{height:40px;border-top:1px solid var(--bd);cursor:pointer}.col .sl:hover{background:#fbf8f3}
.ev{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 8px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;color:#fff;z-index:2}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{opacity:.85}
.ev.hecha{opacity:.5}.ev.noshow{opacity:.5;text-decoration:line-through}
.ev.web::after{content:'WEB';position:absolute;right:5px;top:4px;font-size:9px;font-weight:700;background:rgba(255,255,255,.25);padding:1px 5px;border-radius:4px}
.ahora{position:absolute;left:52px;right:0;height:2px;background:var(--rojo);z-index:4}
/* clientes */
.cl-wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.search{width:100%;border:0;background:var(--w);box-shadow:0 0 0 1px var(--bd);border-radius:8px;padding:11px 14px;margin-bottom:10px}
.clist{max-height:calc(100vh - 210px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.ci{background:var(--w);border-radius:8px;padding:10px 12px;box-shadow:0 0 0 1px var(--bd);display:flex;gap:10px;align-items:center;cursor:pointer}
.ci.on{box-shadow:0 0 0 2px var(--rojo)}.ci b{font-weight:600;display:block}.ci small{color:var(--mu);font-size:12px}
textarea.nota{width:100%;border:0;background:var(--cr);border-radius:8px;padding:12px;min-height:64px;resize:vertical}
/* barras */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:#d9c7a4}.bars div:last-child i{background:var(--rojo)}
.bars span{font-size:11px;color:var(--mu)}.bars em{font-style:normal;font-size:11.5px;font-weight:600}
.hb{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13px}.hb span{width:90px}.hb i{height:12px;border-radius:3px;display:block}.hb b{margin-left:auto;font-variant-numeric:tabular-nums}
/* caja */
.cj{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.cj-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cj-s button{background:var(--w);box-shadow:0 0 0 1px var(--bd);border-radius:8px;padding:11px;text-align:left}
.cj-s button:hover{box-shadow:0 0 0 2px #c7a160}.cj-s button b{display:block;font-weight:600;font-size:13px}.cj-s button span{font-family:Oswald;font-size:17px}
.tk{position:sticky;top:20px}.tk .ln{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--cr2);font-size:13.5px}
.tk .tot{font-family:'Playfair Display';font-size:36px;text-align:right;margin:10px 0}
.pagos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.pagos button{background:var(--cr);border-radius:6px;padding:9px 0;font-weight:600;font-size:12.5px}.pagos button.on{background:var(--ink);color:#fff}
.movil{width:330px;height:670px;border-radius:44px;background:#120d0c;padding:11px;margin:0 auto}
.movil iframe{width:100%;height:100%;border:0;border-radius:34px;background:#120d0c}
.velo{position:fixed;inset:0;background:rgba(29,21,20,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--w);border-radius:14px;width:100%;max-width:470px;max-height:90vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 6px;font-family:'Playfair Display';font-size:26px}
.modal label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px;font-weight:500}
.modal input,.modal select{width:100%;border:0;background:var(--cr);border-radius:8px;padding:10px 12px}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.wab{background:#e7f8ec;border-radius:10px;padding:13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
#toasts{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#efe3c9;padding:12px 16px;border-radius:10px;font-size:13.5px;max-width:360px}
.toast.web{background:var(--rojo);color:#fff;padding:15px 18px}.toast.web b{display:block;font-size:15px;margin-bottom:2px}
.demo{background:#c7a160;color:#120d0c;font-size:11.5px;padding:7px 10px;border-radius:6px;margin-top:10px;font-weight:600}
.demo button{text-decoration:underline;font-weight:700;font-size:11.5px}
.bnav{display:none}.mtop{display:none}
#login{position:fixed;inset:0;z-index:150;background:#0f0b0a;display:flex;align-items:center;justify-content:center;padding:20px}
#login .lg-c{width:100%;max-width:380px;text-align:center;color:#efe3c9}
#login img{width:96px;height:96px;border-radius:12px;margin:0 auto 18px;display:block}
#login h2{font-family:'Playfair Display';font-size:30px;margin:0 0 4px}
#login p{color:#a99a80;margin:0 0 22px;font-size:13.5px}
#login .us{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
#login .us button{background:#1d1615;border:1px solid rgba(241,230,207,.12);border-radius:10px;padding:12px 6px;color:#efe3c9;font-size:12.5px;transition:.25s}
#login .us button.on{border-color:#c9a462;background:#2a1f1d}
#login .us button i{display:flex;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;align-items:center;justify-content:center;font-style:normal;font-weight:600;color:#fff}
#login input{width:100%;background:#1d1615;border:1px solid rgba(241,230,207,.12);border-radius:10px;padding:13px;color:#efe3c9;text-align:center;letter-spacing:.3em;margin-bottom:12px}
#login .entrar{width:100%;background:#7a1f2b;color:#fff;border-radius:10px;padding:14px;font-weight:600;font-size:14px}
#login small{display:block;margin-top:14px;color:#6f6253;font-size:11.5px}
.ev{touch-action:none;transition:box-shadow .2s}.ev:hover{box-shadow:0 8px 20px -8px rgba(0,0,0,.5);z-index:5}
.ev.arrastra{z-index:20;box-shadow:0 18px 40px -10px rgba(0,0,0,.55);opacity:.95;cursor:grabbing}
.sl.destino{background:rgba(122,31,43,.12)!important;outline:2px dashed var(--rojo);outline-offset:-2px}
.card{transition:box-shadow .3s,transform .3s}.row.click:hover{transform:translateX(2px)}
.nav button{transition:background .25s,color .25s,transform .25s}.nav button:hover{transform:translateX(3px)}
@media(max-width:900px){
 .side{display:none}.main{margin-left:0;padding:14px 12px 100px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#120d0c;z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
 .bnav button{flex:1;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#b3a48a;padding:5px 2px;border-radius:6px}
 .bnav .ic{font-size:16px}.bnav button.on{color:#fff;background:var(--rojo)}
 .g4{grid-template-columns:1fr 1fr}.g2,.g21,.g3,.cl-wrap,.cj{grid-template-columns:1fr}
 .hd h1{font-size:30px}.kpi b{font-size:28px}
 .main{overflow-x:hidden}.hd>div:last-child{width:100%}.hd .btn{padding:9px 12px}
 .ag{max-width:calc(100vw - 24px)}
 .mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
 .movil{width:100%;max-width:330px}.clist{max-height:none}
}
</style></head><body>

<aside class="side">
  <div class="marca"><img src="../img/logo.jpg" alt=""><div><b>SALVAJES</b><small>Dubai · JVC</small></div></div>
  <nav class="nav" id="nav"></nav>
  <div style="margin-top:auto"></div>
  <div class="demo">Demo · datos de ejemplo · <button onclick="reiniciar()">Reiniciar</button></div>
  <div class="yo" style="margin-top:12px"><b>Anuar · Dueño</b>Acceso con usuario propio</div>
</aside>
<div id="login"><div class="lg-c">
  <img src="../img/logo.jpg" alt="Salvajes"><h2>Salvajes · Panel</h2><p>Cada persona del equipo entra con su usuario.</p>
  <div class="us" id="lgUs"></div>
  <input type="password" value="salvajes" aria-label="Contraseña">
  <button class="entrar" onclick="entrar()">Entrar</button>
  <small>Demo · la contraseña ya está puesta</small>
</div></div>
<main class="main" id="main"></main>
<nav class="bnav" id="bnav"></nav>
<div id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../datos.js?v=1"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aed=n=>Math.round(n).toLocaleString('es-ES',{useGrouping:'always'})+' AED';
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fLarga=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fCorta=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const HOY=SV.masD(0);
let DB=svCargar();
const CL=id=>DB.clientes.find(c=>c.id===id)||{n:'—',tel:'',orig:'',lang:'ES'};
const guardar=()=>svGuardar(DB);
function reiniciar(){ try{localStorage.removeItem(SV_CLAVE)}catch(e){} DB=svCargar(); toast('Demo reiniciada'); ir(VISTA); }

/* sonido y avisos */
let ctx; function sonido(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); [0,.12,.24].forEach((t,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=[659,880,1175][i]; g.gain.setValueAtTime(.07,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.4); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.42); }); }catch(e){} }
function toast(m,cls='',ms=3400){ const t=document.createElement('div'); t.className='toast '+cls; t.innerHTML=m; $('toasts').appendChild(t); setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity=0; setTimeout(()=>t.remove(),400); },ms); }
document.addEventListener('pointerdown',()=>{ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){} },{once:true});

/* lo que llega desde la web: reservas y tarjetas regalo */
let _vistas=new Set([...DB.citas.filter(c=>c.web&&c.nueva).map(c=>c.id),...DB.regalos.filter(r=>r.nueva).map(r=>r.id)]);
let RESALTA=null;
function comprobarWeb(){ const n=svCargar();
  const llegan=n.citas.filter(c=>c.web&&c.nueva&&!_vistas.has(c.id)), regs=n.regalos.filter(r=>r.nueva&&!_vistas.has(r.id)); DB=n;
  llegan.forEach(c=>{ _vistas.add(c.id); sonido(); toast(`<b>🔔 Nueva reserva desde la web</b>${esc(CL(c.cl).n)} · ${esc(SV.S(c.s).es)} con ${esc(SV.E(c.e).n)}<br>${fLarga(c.f)} a las ${c.h}`,'web',7000); RESALTA=c.id; if(VISTA==='agenda') DIA=c.f; });
  regs.forEach(r=>{ _vistas.add(r.id); sonido(); toast(`<b>🎁 Tarjeta regalo vendida online</b>${r.id} · ${aed(r.imp)} · pagada con tarjeta`,'web',7000); });
  if(VISTA!=='web') ir(VISTA,1); else navs(); }
addEventListener('storage',e=>{ if(e.key===SV_CLAVE) comprobarWeb(); });

/* WhatsApp en un toque (en el idioma del cliente) */
const MSG={
 recordar:(c,a)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! Te recordamos tu cita de mañana en Salvajes: ${SV.S(a.s).es} con ${SV.E(a.e).n} a las ${a.h}. Si no puedes venir, avísanos y te buscamos otro hueco 💈`:`Hi ${c.n.split(' ')[0]}! Reminder of your appointment tomorrow at Salvajes: ${SV.S(a.s).n} with ${SV.E(a.e).n} at ${a.h}. If you can’t make it, just reply and we’ll find you another slot 💈`,
 confirmar:(c,a)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! Tu cita en Salvajes está confirmada: ${SV.S(a.s).es}, ${fLarga(a.f)} a las ${a.h}. DAMAC Ghalia Tower, local 14, JVC.`:`Hi ${c.n.split(' ')[0]}! Your appointment at Salvajes is confirmed: ${SV.S(a.s).n}, ${new Date(a.f+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${a.h}. DAMAC Ghalia Tower, shop 14, JVC.`,
 vuelve:(c,s,d)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! 💈 Ya van ${d} días desde tu último ${s.es.toLowerCase()} en Salvajes. ¿Te guardamos silla esta semana? Reserva aquí: airmate.es/salvajes-dubai`:`Hi ${c.n.split(' ')[0]}! 💈 It’s been ${d} days since your last ${s.n.toLowerCase()} at Salvajes. Shall we save you a chair this week? Book here: airmate.es/salvajes-dubai`
};
function wa(txt,quien,alHacer){ velo(`<h3>Mensaje de WhatsApp</h3><div class="mono" style="margin-bottom:10px">Para ${esc(quien)}</div><div class="wab">${esc(txt)}</div>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><a class="btn bw" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}" onclick="setTimeout(()=>{cerrar();${alHacer||''}},250)">Abrir WhatsApp</a></div>
  <p style="font-size:11.5px;color:var(--mu);margin:12px 0 0">En la demo se abre WhatsApp sin destinatario. En vuestro panel se abre el chat de ese cliente con el texto listo: un toque y enviado.</p>`); }
function avisado(k){ DB.avisados[k]=Date.now(); guardar(); toast('✓ Mensaje enviado'); ir(VISTA,1); }

/* navegación */
const VISTAS=[['hoy','◐','Hoy','Hoy'],['agenda','▦','Agenda por barbero','Agenda'],['clientes','☺','Clientes','Clientes'],['vuelven','↻','Que vuelvan','Vuelven'],['caja','$','Caja','Caja'],['bonos','✦','Bonos y regalos','Bonos'],['stock','▣','Productos','Stock'],['cifras','▲','Cifras','Cifras'],['web','◎','Tu web','Web']];
let VISTA='hoy', DIA=HOY, SELCL='c0', TICKET=[], PAGO='Tarjeta';
function navs(){ const v=pendVuelven().length, bajo=SV_PROD.filter(p=>DB.stock[p.k]<=p.min).length;
  $('nav').innerHTML=VISTAS.map(([k,ic,t])=>`<button class="${VISTA===k?'on':''}" onclick="ir('${k}')"><span class="ic">${ic}</span>${t}${k==='vuelven'&&v?`<span class="bd">${v}</span>`:''}${k==='stock'&&bajo?`<span class="bd">${bajo}</span>`:''}</button>`).join('');
  $('bnav').innerHTML=VISTAS.map(([k,ic,t,c])=>`<button class="${VISTA===k?'on':''}" onclick="ir('${k}')"><span class="ic">${ic}</span>${c}</button>`).join(''); }
function ir(v,quieto){ VISTA=v; navs(); $('main').innerHTML=R[v](); if(!quieto) scrollTo(0,0); animar(v,quieto); if(v==='agenda') activarArrastre(); }
function animar(v,quieto){ if(!window.gsap) return;
  if(!quieto){ gsap.from('.main .hd',{y:16,opacity:0,duration:.7,ease:'expo.out'}); gsap.from('.main .card, .main .ag',{y:26,opacity:0,duration:.85,ease:'expo.out',stagger:.05,delay:.05}); }
  document.querySelectorAll('.kpi b').forEach(b=>{ const txt=b.textContent.trim(), m=txt.match(/^([\d.]+)( AED)?$/); if(!m||quieto) return; const to=parseInt(m[1].replace(/\./g,'')), suf=m[2]||'', o={v:0};
    gsap.to(o,{v:to,duration:1.2,ease:'expo.out',delay:.15,onUpdate:()=>b.textContent=Math.round(o.v).toLocaleString('es-ES',{useGrouping:'always'})+suf}); });
  if(!quieto){ gsap.from('.ev',{scale:.8,opacity:0,duration:.6,ease:'back.out(1.7)',stagger:.02,delay:.2});
    gsap.from('.bars i',{scaleY:0,transformOrigin:'bottom',duration:1.1,ease:'expo.out',stagger:.08,delay:.2});
    gsap.from('.hb i',{width:0,duration:1.1,ease:'expo.out',stagger:.06,delay:.2});
    gsap.from('.main .row',{x:-10,opacity:0,duration:.6,ease:'expo.out',stagger:.015,delay:.15}); } }
/* arrastrar y soltar citas en la agenda */
function activarArrastre(){ document.querySelectorAll('.ev').forEach(ev=>{ ev.addEventListener('pointerdown',e=>{ e.preventDefault(); const id=ev.dataset.id, x0=e.clientX, y0=e.clientY; let mov=false, dest=null; ev.setPointerCapture(e.pointerId);
  const move=m=>{ const dx=m.clientX-x0, dy=m.clientY-y0; if(!mov&&Math.hypot(dx,dy)<6) return; mov=true; ev.classList.add('arrastra'); ev.style.transform=`translate(${dx}px,${dy}px)`; ev.style.pointerEvents='none';
    const el=document.elementFromPoint(m.clientX,m.clientY); ev.style.pointerEvents=''; document.querySelectorAll('.sl.destino').forEach(x=>x.classList.remove('destino')); dest=el&&el.classList.contains('sl')?el:null; if(dest) dest.classList.add('destino'); };
  const up=()=>{ ev.removeEventListener('pointermove',move); ev.removeEventListener('pointerup',up); ev.removeEventListener('pointercancel',up); document.querySelectorAll('.sl.destino').forEach(x=>x.classList.remove('destino'));
    if(!mov){ verCita(id); return; }
    const a=DB.citas.find(x=>x.id===id); if(dest){ const ne=dest.dataset.e, nh=dest.dataset.h, prev=a.est; a.est='cancelada'; const ok=SV.libreCon(DB,DIA,nh,a.s,ne); a.est=prev;
      if(ok){ a.e=ne; a.h=nh; a.f=DIA; guardar(); sonido(); toast(`✓ ${esc(CL(a.cl).n)} movido a las ${nh} con ${esc(SV.E(ne).n)}`); RESALTA=id; ir('agenda',1); return; }
      toast(SV.puede(ne,a.s)?`${esc(SV.E(ne).n)} ya tiene ese hueco ocupado`:`${esc(SV.E(ne).n)} no hace ${esc(SV.S(a.s).es.toLowerCase())}`); }
    if(window.gsap) gsap.to(ev,{x:0,y:0,duration:.5,ease:'back.out(1.6)',onComplete:()=>{ ev.style.transform=''; ev.classList.remove('arrastra'); }}); else { ev.style.transform=''; ev.classList.remove('arrastra'); } };
  ev.addEventListener('pointermove',move); ev.addEventListener('pointerup',up); ev.addEventListener('pointercancel',up); }); }); }
function cab(kick,tit,btns=''){ return `<div class="mtop"><div style="display:flex;align-items:center;gap:8px"><img src="../img/logo.jpg" style="width:32px;height:32px;border-radius:5px"><b style="font-family:'Playfair Display'">SALVAJES</b></div><button class="chip c-n" onclick="reiniciar()">Demo · Reiniciar ↺</button></div><div class="hd"><div><div class="mono">${kick}</div><h1>${tit}</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div>`; }
const R={};

/* utilidades */
function pendVuelven(){ const out=[];
  DB.clientes.forEach(c=>{ if(DB.citas.some(a=>a.cl===c.id&&a.f>=HOY&&a.est==='conf')) return;
    const ult=DB.citas.filter(a=>a.cl===c.id&&a.est==='hecha'&&a.f<=HOY).sort((a,b)=>b.f.localeCompare(a.f))[0]; if(!ult) return;
    const s=SV.S(ult.s); if(!s.vuelve) return; const dias=Math.round((+SV.hoy0-new Date(ult.f+'T00:00'))/864e5);
    if(dias>=s.vuelve-2) out.push({c,s,dias,f:ult.f,k:'vuelve'+c.id+ult.f}); });
  return out.sort((a,b)=>(b.dias-b.s.vuelve)-(a.dias-a.s.vuelve)); }
const citasDia=f=>DB.citas.filter(a=>a.f===f&&a.est!=='cancelada').sort((a,b)=>a.h.localeCompare(b.h));
function chipEst(a){ return a.est==='hecha'?'<span class="chip c-ok">Atendido</span>':a.est==='noshow'?'<span class="chip c-r">No vino</span>':'<span class="chip c-bl">Confirmada</span>'; }

/* HOY */
R.hoy=()=>{ const cs=citasDia(HOY), man=citasDia(SV.masD(1)), web7=DB.citas.filter(a=>a.web&&a.f>=SV.masD(-7)).length, caja=DB.ventas.filter(v=>v.f===HOY).reduce((a,v)=>a+v.imp,0), vuel=pendVuelven();
  const ocup=SV_EQUIPO.map(e=>({e,n:cs.filter(a=>a.e===e.k).length}));
  return cab(fLarga(HOY),`${new Date().getHours()<14?'Buenos días':'Buenas tardes'}, <em>Salvajes.</em>`,`<a class="btn bs" href="../" target="_blank" rel="noopener">◎ Abrir la web</a><button class="btn br" onclick="nuevaCita()">+ Cita</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><small>Citas hoy</small><b>${cs.length}</b><div class="tr">${cs.filter(a=>a.web).length} reservadas solas desde la web</div></div>
    <div class="card kpi"><small>Reservas web · 7 días</small><b>${web7}</b><div class="tr">sin contestar un solo mensaje</div></div>
    <div class="card kpi"><small>Caja de hoy</small><b>${aed(caja)}</b><div class="tr">${DB.ventas.filter(v=>v.f===HOY).length} cobros</div></div>
    <div class="card kpi"><small>Clientes que toca que vuelvan</small><b>${vuel.length}</b><div class="tr" style="color:var(--wa)">cortes y barbas pendientes</div></div></div>
  <div class="grid g21">
    <div class="card"><div class="sec-t"><h3>Hoy en la barbería</h3><button class="btn bs peq" onclick="DIA=HOY;ir('agenda')">Agenda →</button></div>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${ocup.map(o=>`<span class="chip c-n"><i style="width:8px;height:8px;border-radius:50%;background:${o.e.c};display:inline-block"></i>${esc(o.e.n)} · ${o.n}</span>`).join('')}</div>
     ${cs.map(a=>{ const c=CL(a.cl),s=SV.S(a.s),e=SV.E(a.e); return `<div class="row click ${a.id===RESALTA?'brilla':''}" onclick="verCita('${a.id}')"><span class="t">${a.h}</span><div class="av" style="background:${e.c}">${ini(c.n)}</div><div class="x"><b>${esc(c.n)}</b><small>${esc(s.es)} · ${esc(e.n)}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`; }).join('')||'<div class="empty">Sin citas hoy</div>'}</div>
    <div>
     <div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Recordar mañana</h3><span class="chip c-n">${man.length}</span></div>
      ${man.slice(0,6).map(a=>{ const c=CL(a.cl),k='rec'+a.id; return `<div class="row"><span class="t">${a.h}</span><div class="x"><b>${esc(c.n)}</b><small>${esc(SV.S(a.s).es)} · ${c.lang}</small></div>${DB.avisados[k]?'<span class="chip c-ok">Avisado</span>':`<button class="btn bw peq" onclick="wa(MSG.recordar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${a.id}')),'${esc(c.n)}','avisado(\\'${k}\\')')">Recordar</button>`}</div>`; }).join('')||'<div class="empty">Nada para mañana</div>'}</div>
     <div class="card"><div class="sec-t"><h3>Que vuelvan</h3><button class="btn bs peq" onclick="ir('vuelven')">Ver →</button></div>
      ${vuel.slice(0,3).map(v=>`<div class="row"><span>↻</span><div class="x"><b>${esc(v.c.n)}</b><small>${esc(v.s.es)} hace ${v.dias} días</small></div>${DB.avisados[v.k]?'<span class="chip c-ok">Avisado</span>':'<span class="chip c-wa">Toca</span>'}</div>`).join('')||'<div class="empty">Todos al día</div>'}</div>
    </div></div>`; };

/* AGENDA por barbero */
const H0=SV.min('10:00'), PX=40/30;
R.agenda=()=>{ const cs=citasDia(DIA), x=new Date(DIA+'T12:00'), cols=SV_EQUIPO.length;
  let g=`<div class="ag" style="grid-template-columns:52px repeat(${cols},minmax(120px,1fr))"><div class="h"></div>${SV_EQUIPO.map(e=>`<div class="h"><i style="background:${e.c}"></i>${esc(e.n)}<small>${esc(e.rol)}</small></div>`).join('')}`;
  g+=`<div class="hcol">${SV_HORAS.map(h=>`<div class="hr">${h}</div>`).join('')}</div>`;
  g+=SV_EQUIPO.map(e=>`<div class="col">${SV_HORAS.map(h=>`<div class="sl" data-e="${e.k}" data-h="${h}" onclick="nuevaCita('${DIA}','${h}','${e.k}')"></div>`).join('')}${cs.filter(c=>c.e===e.k).map(c=>{ const s=SV.S(c.s), top=(SV.min(c.h)-H0)*PX+1, alto=Math.max(36,s.min*PX-3);
    return `<div class="ev ${c.est} ${c.web?'web':''} ${c.id===RESALTA?'brilla':''}" data-id="${c.id}" style="top:${top}px;height:${alto}px;background:${e.c}"><b>${esc(CL(c.cl).n)}</b><small>${c.h} · ${esc(s.es)}</small></div>`; }).join('')}</div>`).join('');
  const ah=new Date().getHours()*60+new Date().getMinutes(); if(DIA===HOY&&ah>=H0&&ah<=22*60) g+=`<div class="ahora" style="top:${(ah-H0)*PX+46}px"></div>`;
  return cab('Agenda · '+fLarga(DIA),`${DN[x.getDay()]} <em>${x.getDate()}</em>`,`<button class="btn bs" onclick="moverDia(-1)">‹</button><button class="btn bs" onclick="DIA=HOY;ir('agenda',1)">Hoy</button><button class="btn bs" onclick="moverDia(1)">›</button><button class="btn br" onclick="nuevaCita('${DIA}')">+ Cita</button>`)+
  `<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:10px"><span>${cs.length} citas</span><span><b style="font-size:10px;background:var(--cr2);padding:1px 5px;border-radius:4px">WEB</b> = la reservó el cliente solo</span><span>Toca un hueco para añadir una cita · arrastra una cita para moverla</span></div>`+g+'</div>'; };
function moverDia(n){ DIA=SV.iso(+new Date(DIA+'T12:00')+n*864e5); ir('agenda',1); }
function verCita(id){ const a=DB.citas.find(x=>x.id===id), c=CL(a.cl), s=SV.S(a.s), e=SV.E(a.e);
  velo(`<h3>${esc(c.n)}</h3><div class="mono">${esc(s.es)} · ${s.min} min · ${s.p} AED</div><p style="font-size:15px;margin:14px 0">${fLarga(a.f)} · <b>${a.h}</b> · con ${esc(e.n)}</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${chipEst(a)}${a.web?'<span class="chip c-o">Reservó desde la web</span>':''}<span class="chip c-n">Idioma: ${c.lang}</span>${c.notas?`<span class="chip c-wa">📝 ${esc(c.notas.slice(0,46))}${c.notas.length>46?'…':''}</span>`:''}</div>
  <div class="pie"><button class="btn bs" onclick="estado('${id}','cancelada')">Cancelar</button><button class="btn bs" onclick="cerrar();SELCL='${a.cl}';ir('clientes')">Ficha</button>
   <button class="btn bw" onclick="cerrar();wa(MSG.confirmar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${id}')),'${esc(c.n)}')">WhatsApp</button>
   ${a.est==='conf'?`<button class="btn bs" onclick="estado('${id}','noshow')">No vino</button><button class="btn bp" onclick="cobrarCita('${id}')">✓ Atendido y cobrar</button>`:''}</div>`); }
function estado(id,e){ DB.citas.find(x=>x.id===id).est=e; guardar(); cerrar(); toast(e==='cancelada'?'Cita cancelada · el hueco vuelve a salir libre en la web':'Marcado como «no vino» · queda en su ficha'); ir(VISTA,1); }
function cobrarCita(id){ const a=DB.citas.find(x=>x.id===id); a.est='hecha'; guardar(); cerrar(); const s=SV.S(a.s); TICKET=[{n:s.es,p:s.p,cl:a.cl,e:a.e,tipo:'serv'}]; ir('caja'); }
function nuevaCita(f,h,e){ f=f||HOY;
  velo(`<h3>Nueva cita</h3><label>Cliente</label><select id="nC">${DB.clientes.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select>
  <label>Servicio</label><select id="nS">${SV_SERV.filter(s=>!e||SV.puede(e,s.k)).map(s=>`<option value="${s.k}">${esc(s.es)} · ${s.min} min</option>`).join('')}</select>
  <label>Barbero</label><select id="nE">${SV_EQUIPO.map(x=>`<option value="${x.k}" ${x.k===e?'selected':''}>${esc(x.n)} · ${esc(x.rol)}</option>`).join('')}</select>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Día</label><input type="date" id="nF" value="${f}"></div><div><label>Hora</label><select id="nH">${SV_HORAS.map(x=>`<option ${x===h?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <p id="nX" style="color:var(--rojo);font-size:13px;min-height:16px;margin:8px 0 0"></p>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="guardaCita()">Guardar</button></div>`); }
function guardaCita(){ const f=$('nF').value,h=$('nH').value,s=$('nS').value,e=$('nE').value;
  if(!SV.puede(e,s)){ $('nX').textContent=SV.E(e).n+' no hace ese servicio.'; return; }
  if(!SV.libreCon(DB,f,h,s,e)){ $('nX').textContent=SV.E(e).n+' ya tiene ese hueco ocupado.'; return; }
  const id='a'+Date.now(); DB.citas.push({id,f,h,cl:$('nC').value,s,e,est:'conf'}); guardar(); cerrar(); toast('✓ Cita guardada · ese hueco ya no sale libre en la web'); RESALTA=id; ir(VISTA,1); }

/* CLIENTES */
R.clientes=()=>cab(DB.clientes.length+' clientes','Cada cliente, <em>con su corte.</em>',`<button class="btn br" onclick="nuevoCliente()">+ Cliente</button>`)+
  `<div class="cl-wrap"><div><input class="search" placeholder="Buscar por nombre o teléfono…" oninput="$('clist').innerHTML=listaCl(this.value)"><div class="clist" id="clist">${listaCl('')}</div></div><div id="ficha">${ficha(CL(SELCL))}</div></div>`;
function listaCl(q){ q=q.toLowerCase(); return DB.clientes.filter(c=>c.n.toLowerCase().includes(q)||c.tel.includes(q)).map(c=>`<div class="ci ${c.id===SELCL?'on':''}" onclick="SELCL='${c.id}';document.querySelectorAll('.ci').forEach(x=>x.classList.remove('on'));this.classList.add('on');$('ficha').innerHTML=ficha(CL('${c.id}'));if(innerWidth<900)$('ficha').scrollIntoView({behavior:'smooth'})"><div class="av" style="background:${SV.E(c.fav).c}">${ini(c.n)}</div><div><b>${esc(c.n)}</b><small>${resumenCl(c)}</small></div></div>`).join('')||'<div class="empty">Nadie con ese nombre</div>'; }
function resumenCl(c){ const v=DB.citas.filter(a=>a.cl===c.id&&a.est==='hecha').sort((a,b)=>b.f.localeCompare(a.f)); return v.length?`Último: ${esc(SV.S(v[0].s).es.toLowerCase())} · ${fCorta(v[0].f)}`:'Cliente nuevo'; }
function ficha(c){ const vis=DB.citas.filter(a=>a.cl===c.id).sort((a,b)=>b.f.localeCompare(a.f)), hechas=vis.filter(a=>a.est==='hecha'), gast=hechas.reduce((t,a)=>t+SV.S(a.s).p,0), nos=vis.filter(a=>a.est==='noshow').length, bono=DB.bonos.find(b=>b.cl===c.id);
  const ult=hechas[0], sug=ult&&SV.S(ult.s).vuelve?SV.masD(Math.round((new Date(ult.f+'T00:00')-SV.hoy0)/864e5)+SV.S(ult.s).vuelve):null;
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div style="display:flex;gap:14px;align-items:center"><div class="av" style="width:54px;height:54px;font-size:18px;background:${SV.E(c.fav).c}">${ini(c.n)}</div><div><div style="font-family:'Playfair Display';font-size:28px;line-height:1.05">${esc(c.n)}</div><div style="color:var(--mu);font-size:13px;margin-top:5px">Desde ${fCorta(c.alta)} · vino por ${esc(c.orig)} · ${esc(c.tel)} · idioma ${c.lang} · su barbero: ${esc(SV.E(c.fav).n)}</div></div></div>
    <button class="btn br peq" onclick="nuevaCita()">+ Cita</button></div>
   <div class="grid g3" style="margin:16px 0"><div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Visitas</small><b>${hechas.length}</b></div><div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Gastado</small><b style="font-size:28px">${aed(gast)}</b></div><div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Debería volver</small><b style="font-size:24px;margin-top:10px">${sug?fCorta(sug):'—'}</b></div></div>
   ${bono?`<p class="chip c-o" style="margin:0 6px 12px 0">✦ ${esc(bono.n)}: le quedan ${bono.total-bono.usadas}</p>`:''}${nos?`<p class="chip c-r" style="margin:0 0 12px">No vino ${nos} vez${nos>1?'es':''}</p>`:''}
   <div class="mono" style="margin-bottom:6px">Notas · cómo le gusta el corte</div>
   <textarea class="nota" onchange="CL('${c.id}').notas=this.value;guardar();toast('✓ Nota guardada')" placeholder="Ej.: fade 0.5, tijera arriba, raya a la izquierda">${esc(c.notas||'')}</textarea>
   <div class="sec-t" style="margin-top:16px"><h3>Historial</h3></div>
   ${vis.map(a=>`<div class="row"><span class="t" style="width:60px">${fCorta(a.f)}</span><div class="av" style="background:${SV.E(a.e).c};width:26px;height:26px;font-size:10px">${SV.E(a.e).n[0]}</div><div class="x"><b>${esc(SV.S(a.s).es)}</b><small>${a.h} · ${esc(SV.E(a.e).n)}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`).join('')||'<div class="empty">Sin visitas todavía</div>'}</div>`; }
function nuevoCliente(){ velo(`<h3>Nuevo cliente</h3><label>Nombre</label><input id="cN"><label>Móvil</label><input id="cT" inputmode="tel" placeholder="+971"><label>Idioma</label><select id="cL"><option>ES</option><option>EN</option><option>AR</option></select><label>Cómo nos conoció</label><select id="cO"><option>Instagram</option><option>Recomendación</option><option>Vive en JVC</option><option>Google Maps</option><option>Fresha</option></select>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="if($('cN').value.trim().length<2)return;const id='c'+Date.now();DB.clientes.unshift({id,n:$('cN').value.trim(),tel:$('cT').value,lang:$('cL').value,orig:$('cO').value,alta:HOY,fav:'b1',notas:''});guardar();SELCL=id;cerrar();toast('✓ Cliente guardado');ir('clientes',1)">Guardar</button></div>`); }

/* QUE VUELVAN */
R.vuelven=()=>{ const l=pendVuelven();
  return cab('Cortes cada 3 semanas, barbas cada 2','Que <em>vuelvan.</em>')+
  `<div class="card" style="margin-bottom:14px;background:var(--ob);box-shadow:none"><b>Cómo funciona:</b> cada servicio tiene su ritmo (corte cada 3 semanas, barba cada 2, mechas cada 8…). Cuando a un cliente le toca y no tiene cita, sale aquí con el mensaje escrito <b>en su idioma</b>. Un toque y le llega por WhatsApp.</div>
  <div class="card">${l.map(v=>`<div class="row"><div class="av" style="background:${SV.E(v.c.fav).c}">${ini(v.c.n)}</div><div class="x"><b>${esc(v.c.n)}</b><small>${esc(v.s.es)} el ${fCorta(v.f)} · hace ${v.dias} días · ${v.c.lang}</small></div>${v.dias>v.s.vuelve?'<span class="chip c-r">Se pasó</span>':'<span class="chip c-wa">Le toca</span>'}${DB.avisados[v.k]?'<span class="chip c-ok">Avisado</span>':`<button class="btn bw peq" onclick="wa(MSG.vuelve(CL('${v.c.id}'),SV.S('${v.s.k}'),${v.dias}),'${esc(v.c.n)}','avisado(\\'${v.k}\\')')">WhatsApp</button>`}</div>`).join('')||'<div class="empty">Todos tienen su próxima cita 💈</div>'}</div>`; };

/* CAJA */
R.caja=()=>{ const hoyV=DB.ventas.filter(v=>v.f===HOY), tot=TICKET.reduce((a,l)=>a+l.p,0), met={}; hoyV.forEach(v=>met[v.pago]=(met[v.pago]||0)+v.imp);
  return cab('Caja · '+fLarga(HOY),'Cobrar en <em>un momento.</em>')+
  `<div class="cj"><div><div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Servicios</h3><span class="mono">Toca para añadir</span></div><div class="cj-s">${SV_SERV.map(s=>`<button onclick="TICKET.push({n:'${esc(s.es)}',p:${s.p},tipo:'serv'});ir('caja',1)"><b>${esc(s.es)}</b><span>${s.p} AED</span></button>`).join('')}</div></div>
   <div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Productos</h3><span class="mono">Se descuentan del stock</span></div><div class="cj-s">${SV_PROD.map(p=>`<button onclick="TICKET.push({n:'${esc(p.n)}',p:${p.p},tipo:'prod',k:'${p.k}'});ir('caja',1)"><b>${esc(p.n)}</b><span>${p.p} AED</span><small style="display:block;color:${DB.stock[p.k]<=p.min?'var(--rojo)':'var(--mu)'};font-size:11.5px">quedan ${DB.stock[p.k]}</small></button>`).join('')}</div></div>
   <div class="card"><div class="sec-t"><h3>Cobrado hoy</h3><b style="font-family:'Playfair Display';font-size:22px">${aed(hoyV.reduce((a,v)=>a+v.imp,0))}</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${Object.entries(met).map(([m,v])=>`<span class="chip c-n">${m}: ${aed(v)}</span>`).join('')}</div>
    ${hoyV.slice().reverse().map(v=>`<div class="row"><div class="x"><b>${esc(v.c)}</b><small>${esc(CL(v.cl).n)} · ${v.pago}</small></div><b>${aed(v.imp)}</b></div>`).join('')||'<div class="empty">Aún nada</div>'}</div></div>
  <div class="card tk"><div class="sec-t"><h3>Ticket</h3>${TICKET.length?'<button class="chip c-n" onclick="TICKET=[];ir(\'caja\',1)">Vaciar</button>':''}</div>
   ${TICKET.map((l,i)=>`<div class="ln"><span>${esc(l.n)}</span><span>${l.p} AED <button style="color:var(--mu)" onclick="TICKET.splice(${i},1);ir('caja',1)">✕</button></span></div>`).join('')||'<div class="empty">Añade servicios o productos, o cobra una cita desde la agenda</div>'}
   <div class="tot">${aed(tot)}</div>
   <div class="pagos">${['Tarjeta','Efectivo','Apple Pay','Tarjeta regalo'].map(m=>`<button class="${PAGO===m?'on':''}" onclick="PAGO='${m}';ir('caja',1)">${m}</button>`).join('')}</div>
   <button class="btn br" style="width:100%;justify-content:center;margin-top:12px;padding:14px" ${TICKET.length?'':'disabled'} onclick="cobrar()">Cobrar ${aed(tot)}</button></div></div>`; };
function cobrar(){ if(!TICKET.length) return; TICKET.forEach(l=>{ DB.ventas.push({id:'v'+Date.now()+Math.random(),f:HOY,cl:l.cl||'c0',c:l.n,e:l.e||'b1',imp:l.p,pago:PAGO,tipo:l.tipo}); if(l.tipo==='prod') DB.stock[l.k]=Math.max(0,DB.stock[l.k]-1); });
  guardar(); sonido(); const bajos=SV_PROD.filter(p=>TICKET.some(l=>l.k===p.k)&&DB.stock[p.k]<=p.min); toast('✓ Cobrado '+aed(TICKET.reduce((a,l)=>a+l.p,0))+' · '+PAGO+(bajos.length?`<br>⚠ Queda poco: ${bajos.map(p=>p.n).join(', ')}`:'')); TICKET=[]; ir('caja',1); }

/* BONOS Y TARJETAS REGALO */
R.bonos=()=>cab('Se venden en caja o online','Bonos y <em>tarjetas regalo.</em>',`<button class="btn br" onclick="venderBono()">+ Vender bono</button>`)+
  `<div class="grid g2"><div class="card"><div class="sec-t"><h3>Bonos activos</h3><span class="chip c-n">${DB.bonos.length}</span></div>
   ${DB.bonos.map(b=>`<div class="row"><div class="av">${ini(CL(b.cl).n)}</div><div class="x"><b>${esc(CL(b.cl).n)}</b><small>${esc(b.n)} · comprado ${fCorta(b.alta)}</small><div style="display:flex;gap:3px;margin-top:6px">${[...Array(b.total)].map((_,i)=>`<i style="width:14px;height:6px;border-radius:2px;background:${i<b.usadas?'var(--rojo)':'var(--cr2)'}"></i>`).join('')}</div></div><span class="chip c-o">Quedan ${b.total-b.usadas}</span><button class="btn bs peq" ${b.usadas>=b.total?'disabled':''} onclick="usarBono('${b.id}')">Gastar 1</button></div>`).join('')}</div>
  <div class="card"><div class="sec-t"><h3>Tarjetas regalo</h3><a class="btn bs peq" href="../#regalo" target="_blank" rel="noopener">Comprar una en la web ↗</a></div>
   ${DB.regalos.map(r=>`<div class="row"><span style="font-size:20px">🎁</span><div class="x"><b>${r.id} · ${aed(r.imp)}</b><small>${fCorta(r.f)} · ${r.online?'pagada online con tarjeta':'vendida en caja'}${r.de!=='—'?' · de '+esc(r.de):''}</small></div>${r.canjeada?'<span class="chip c-n">Canjeada</span>':`<button class="btn bs peq" onclick="canjear('${r.id}')">Canjear</button>`}</div>`).join('')}</div></div>`;
function usarBono(id){ const b=DB.bonos.find(x=>x.id===id); b.usadas++; guardar(); toast(`✓ Descontado · a ${esc(CL(b.cl).n)} le quedan ${b.total-b.usadas}`); ir('bonos',1); }
function canjear(id){ DB.regalos.find(x=>x.id===id).canjeada=true; guardar(); toast('✓ Tarjeta canjeada'); ir('bonos',1); }
function venderBono(){ velo(`<h3>Vender bono</h3><label>Cliente</label><select id="bC">${DB.clientes.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select><label>Bono</label><select id="bT"><option value="5c">Bono 5 cortes · 360 AED</option><option value="10b">Bono 10 barbas · 400 AED</option></select>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="const t=$('bT').value;DB.bonos.unshift({id:'bo'+Date.now(),cl:$('bC').value,n:t==='5c'?'Bono 5 cortes':'Bono 10 barbas',total:t==='5c'?5:10,usadas:0,alta:HOY});DB.ventas.push({id:'v'+Date.now(),f:HOY,cl:$('bC').value,c:t==='5c'?'Bono 5 cortes':'Bono 10 barbas',e:'b1',imp:t==='5c'?360:400,pago:'Tarjeta',tipo:'bono'});guardar();cerrar();toast('✓ Bono vendido y cobrado');ir('bonos',1)">Vender y cobrar</button></div>`); }

/* STOCK */
R.stock=()=>cab('Ceras, aceites y champús','Productos y <em>stock.</em>')+
  `<div class="card">${SV_PROD.map(p=>{ const st=DB.stock[p.k], bajo=st<=p.min; return `<div class="row"><div class="av" style="background:${bajo?'var(--rojo)':'#c7a160'}">${st}</div><div class="x"><b>${esc(p.n)}</b><small>${p.p} AED · aviso cuando quedan ${p.min}</small></div>${bajo?'<span class="chip c-r">Queda poco · pedir</span>':'<span class="chip c-ok">Bien</span>'}<button class="btn bs peq" onclick="DB.stock['${p.k}']+=10;guardar();toast('✓ +10 unidades de ${esc(p.n)}');ir('stock',1)">+10 recibidas</button></div>`; }).join('')}</div>
  <p style="color:var(--mu);font-size:13px">Cada producto vendido en caja se descuenta solo.</p>`;

/* CIFRAS */
R.cifras=()=>{ const sem=[3,2,1,0].map(k=>{ const d0=SV.masD(-7*k-6), d1=SV.masD(-7*k); return {t:k?`Hace ${k} sem.`:'Esta semana', v:DB.ventas.filter(v=>v.f>=d0&&v.f<=d1).reduce((a,v)=>a+v.imp,0)}; }), mx=Math.max(...sem.map(s=>s.v))||1;
  const mes=DB.ventas.filter(v=>v.f>=SV.masD(-27)), porE=SV_EQUIPO.map(e=>({e,v:mes.filter(v=>v.e===e.k&&v.tipo==='serv').reduce((t,v)=>t+v.imp,0)})), mxE=Math.max(...porE.map(x=>x.v))||1;
  const prod=mes.filter(v=>v.tipo==='prod').reduce((t,v)=>t+v.imp,0), orig={}; DB.clientes.forEach(c=>orig[c.orig]=(orig[c.orig]||0)+1);
  const cit=DB.citas.filter(a=>a.f>=SV.masD(-27)&&a.f<=HOY), web=cit.filter(a=>a.web).length, ns=cit.filter(a=>a.est==='noshow').length;
  return cab('Últimas 4 semanas','Vuestros <em>números.</em>')+
  `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Ingresos 4 semanas</small><b>${aed(sem.reduce((a,s)=>a+s.v,0))}</b></div><div class="card kpi"><small>Venta de productos</small><b>${aed(prod)}</b></div><div class="card kpi"><small>Reservas desde la web</small><b>${web}</b><div class="tr">${cit.length?Math.round(web*100/cit.length):0}% de las citas</div></div><div class="card kpi"><small>No vinieron</small><b>${ns}</b><div class="tr" style="color:var(--mu)">apuntados en su ficha</div></div></div>
  <div class="grid g2"><div class="card"><div class="sec-t"><h3>Ingresos por semana</h3></div><div class="bars">${sem.map(s=>`<div><em>${aed(s.v)}</em><i style="height:${Math.max(6,s.v*100/mx)}%"></i><span>${s.t}</span></div>`).join('')}</div></div>
   <div class="card"><div class="sec-t"><h3>Por barbero</h3><span class="mono">servicios · 4 semanas</span></div>${porE.map(x=>`<div class="hb"><span>${esc(x.e.n)}</span><i style="width:${Math.max(4,x.v*55/mxE)}%;background:${x.e.c}"></i><b>${aed(x.v)}</b></div>`).join('')}
    <div class="sec-t" style="margin-top:14px"><h3>Cómo os conocen</h3></div>${Object.entries(orig).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`<div class="hb"><span>${esc(o)}</span><b>${n}</b></div>`).join('')}</div></div>`; };

/* WEB */
R.web=()=>cab('airmate.es/salvajes-dubai','Vuestra <em>web.</em>',`<a class="btn br" href="../" target="_blank" rel="noopener">Abrir en otra pestaña ↗</a>`)+
  `<div class="grid g2" style="align-items:center"><div class="movil"><iframe src="../?embed&v=5#reservar" title="Web de Salvajes"></iframe></div>
   <div class="card"><h3 style="font-family:'Playfair Display';font-size:26px;margin:0 0 8px">Pruébalo ahora.</h3>
    <p style="color:var(--mu);line-height:1.6">Reserva una cita en el móvil de la izquierda, como haría un cliente a las 11 de la noche. Al confirmar, <b style="color:var(--ink)">suena aquí y aparece en la agenda de ese barbero</b>.</p>
    <div class="row"><span>✦</span><div class="x"><b>En inglés y en español</b><small>El cliente elige idioma; los WhatsApp le llegan en el suyo.</small></div></div>
    <div class="row"><span>✦</span><div class="x"><b>Solo huecos libres de verdad</b><small>Por barbero y según lo que dura cada servicio.</small></div></div>
    <div class="row"><span>✦</span><div class="x"><b>Sin comisión por reserva</b><small>La web es vuestra: el cliente reserva con vosotros, no con una plataforma.</small></div></div>
    <div class="row"><span>✦</span><div class="x"><b>Tarjetas regalo online</b><small>Se pagan con tarjeta en la web y aparecen aquí al momento.</small></div></div></div></div>`;

function velo(h){ cerrar(); const v=document.createElement('div'); v.className='velo'; v.id='velo'; v.innerHTML=`<div class="modal">${h}</div>`; v.onclick=e=>{ if(e.target===v) cerrar(); }; document.body.appendChild(v); }
function cerrar(){ $('velo')?.remove(); }
addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });
const q=new URLSearchParams(location.search); if(q.get('v')&&R[q.get('v')]) VISTA=q.get('v');
ir(VISTA);
const USERS=[['Anuar','Dueño','#7a1f2b'],['Laia','Dueña','#9b4d6a'],['Andrés','Barbero','#3f5a4a']]; let USEL=0;
function pintarUs(){ $('lgUs').innerHTML=USERS.map((u,i)=>`<button class="${i===USEL?'on':''}" onclick="USEL=${i};pintarUs()"><i style="background:${u[2]}">${u[0][0]}</i>${u[0]}<br><span style="color:#a99a80">${u[1]}</span></button>`).join(''); }
function entrar(){ const u=USERS[USEL]; document.querySelector('.yo').innerHTML=`<b>${u[0]} · ${u[1]}</b>Acceso con usuario propio`; try{sessionStorage.setItem('sv_in','1')}catch(e){}
  if(window.gsap){ gsap.to('#login .lg-c',{y:-20,opacity:0,duration:.4,ease:'power2.in'}); gsap.to('#login',{clipPath:'inset(0 0 100% 0)',duration:.9,ease:'expo.inOut',delay:.25,onComplete:()=>$('login').remove()}); gsap.from('.side',{x:-40,opacity:0,duration:1,ease:'expo.out',delay:.6}); setTimeout(()=>ir(VISTA),500); } else $('login').remove(); }
(()=>{ let dentro=false; try{dentro=sessionStorage.getItem('sv_in')==='1'}catch(e){} if(dentro||q.has('rapido')) $('login').remove(); else { pintarUs(); if(window.gsap) gsap.from('#login .lg-c > *',{y:20,opacity:0,duration:.8,ease:'expo.out',stagger:.07}); } })();
</script>
</body></html>
