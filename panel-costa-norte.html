<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Panel · Costa Norte Surf Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2240;--navy2:#1a3560;--acc:#1d6fb8;--acc-bg:#eff6ff;
  --bg:#f4f6f9;--surface:#fff;--border:#dde3ec;--border2:#eef1f6;
  --txt:#0f1923;--txt2:#4a5568;--txt3:#94a3b8;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
  --orange:#d97706;--orange-bg:#fffbeb;
  --blue:#3b82f6;--blue-bg:#eff6ff;
  --rad:8px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:24px}
.login-box{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-brand{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--txt3);margin-bottom:28px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:11px;font-weight:600;color:var(--txt2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:5px}
.login-field input{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--rad);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .15s}
.login-field input:focus{border-color:var(--acc)}
.login-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:var(--rad);font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px;transition:background .15s}
.login-btn:hover{background:var(--navy2)}
.login-err{font-size:12px;color:var(--red);margin-top:8px;display:none}

/* APP */
#app{display:none}
.topbar{background:var(--navy);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;color:#fff}
.topbar-right{display:flex;align-items:center;gap:10px}
.tb-btn{padding:7px 14px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:'Inter',sans-serif}
.tb-refresh{background:rgba(255,255,255,.12);color:#fff}
.tb-refresh:hover{background:rgba(255,255,255,.2)}
.tb-logout{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15)}
.tb-logout:hover{color:#fff}

.page{max-width:1100px;margin:0 auto;padding:24px 20px 60px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.stat-num{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.stat-label{font-size:11px;color:var(--txt3);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}

/* FILTERS */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--txt2);transition:all .15s;font-family:'Inter',sans-serif}
.filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.filter-btn:hover:not(.active){border-color:var(--acc);color:var(--acc)}
.date-input{padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'Inter',sans-serif;color:var(--txt);outline:none;background:var(--surface)}
.date-input:focus{border-color:var(--acc)}
.spacer{flex:1}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-head{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr 1.2fr 1.2fr;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em}
.table-row{display:grid;grid-template-columns:2fr 1.2fr 1.2fr 1fr 1.2fr 1.2fr;padding:13px 16px;border-bottom:1px solid var(--border2);align-items:center;transition:background .1s}
.table-row:last-child{border-bottom:none}
.table-row:hover{background:#fafbfd}
.cell-name{font-weight:600;color:var(--txt)}
.cell-name-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.cell{font-size:13px;color:var(--txt2)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge-pending{background:var(--orange-bg);color:var(--orange)}
.badge-confirmed{background:var(--green-bg);color:var(--green)}
.badge-cancelled{background:#f1f5f9;color:var(--txt3)}
.badge-contacted{background:var(--blue-bg);color:var(--blue)}

/* ACTIONS */
.action-row{display:flex;gap:5px;flex-wrap:wrap}
.act-btn{padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:all .15s;font-family:'Inter',sans-serif}
.ab-contact{background:var(--blue-bg);border-color:rgba(59,130,246,.3);color:var(--blue)}
.ab-confirm{background:var(--green-bg);border-color:rgba(22,163,74,.3);color:var(--green)}
.ab-cancel{background:var(--red-bg);border-color:rgba(220,38,38,.2);color:var(--red)}
.ab-wa{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.3);color:#16a34a;display:flex;align-items:center;gap:4px}
.act-btn:hover{opacity:.75}

.empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.loading{text-align:center;padding:40px;color:var(--txt3);font-style:italic}

/* DETAIL PANEL */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-start;justify-content:flex-end}
.detail-overlay.open{display:flex}
.detail-panel{background:#fff;width:380px;height:100vh;overflow-y:auto;padding:24px;box-shadow:-8px 0 32px rgba(0,0,0,.12)}
.detail-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--txt3);line-height:1}
.detail-title{font-size:16px;font-weight:700;color:var(--txt);margin-bottom:4px}
.detail-sub{font-size:12px;color:var(--txt3);margin-bottom:20px}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13px}
.detail-row:last-of-type{border-bottom:none}
.dr-label{color:var(--txt2)}
.dr-val{font-weight:600;color:var(--txt);text-align:right;max-width:60%;word-break:break-all}
.detail-actions{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.da-btn{width:100%;padding:11px;border-radius:var(--rad);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:background .15s}
.da-confirm{background:var(--navy);color:#fff}
.da-confirm:hover{background:var(--navy2)}
.da-contact{background:var(--acc-bg);color:var(--acc)}
.da-cancel{background:var(--red-bg);color:var(--red)}
.da-wa{background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}

@media(max-width:800px){
  .stats{grid-template-columns:1fr 1fr}
  .table-head{display:none}
  .table-row{grid-template-columns:1fr;gap:4px;padding:14px 16px}
  .detail-panel{width:100%}
  .topbar{padding:0 16px}
  .page{padding:16px 12px 50px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-brand">Costa Norte Surf Center</div>
    <div class="login-sub">Panel de gestión · Escuela de Surf</div>
    <div class="login-field"><label>Contrasena</label><input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" onclick="doLogin()">Acceder al panel</button>
    <div class="login-err" id="login-err">Contrasena incorrecta</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">Costa Norte · Reservas de Clases</div>
    <div class="topbar-right">
      <button class="tb-btn tb-refresh" onclick="loadData()">↻ Actualizar</button>
      <button class="tb-btn tb-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="page">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="st-total">—</div><div class="stat-label">Total reservas</div></div>
      <div class="stat"><div class="stat-num" id="st-pending" style="color:var(--orange)">—</div><div class="stat-label">Pendientes</div></div>
      <div class="stat"><div class="stat-num" id="st-confirmed" style="color:var(--green)">—</div><div class="stat-label">Confirmadas</div></div>
      <div class="stat"><div class="stat-num" id="st-today" style="color:var(--acc)">—</div><div class="stat-label">Hoy</div></div>
    </div>

    <div class="toolbar">
      <button class="filter-btn active" onclick="setFilter(this,'all')">Todas</button>
      <button class="filter-btn" onclick="setFilter(this,'pending')">Pendientes</button>
      <button class="filter-btn" onclick="setFilter(this,'contacted')">Contactadas</button>
      <button class="filter-btn" onclick="setFilter(this,'confirmed')">Confirmadas</button>
      <button class="filter-btn" onclick="setFilter(this,'cancelled')">Canceladas</button>
      <div class="spacer"></div>
      <input type="date" class="date-input" id="filter-date" onchange="loadData()" placeholder="Filtrar por fecha">
      <button class="filter-btn" onclick="document.getElementById('filter-date').value='';loadData()">Limpiar fecha</button>
    </div>

    <div class="table-wrap">
      <div class="table-head">
        <div>Cliente</div>
        <div>Clase</div>
        <div>Fecha</div>
        <div>Franja</div>
        <div>Estado</div>
        <div>Acciones</div>
      </div>
      <div id="table-body"><div class="loading">Cargando reservas...</div></div>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="detail-overlay" id="detail-overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel">
    <button class="detail-close" onclick="closeDetail()">✕</button>
    <div class="detail-title" id="d-name"></div>
    <div class="detail-sub" id="d-sub"></div>
    <div id="d-rows"></div>
    <div class="detail-actions" id="d-actions"></div>
  </div>
</div>

<script>
const SB_URL='https://vjofxmfwdybktpwiuanc.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE';
const SLUG='costa-norte';
const PASS='costanorte2025';

let ALL=[], CUR_FILTER='all', CUR_DETAIL=null;

function doLogin(){
  if(document.getElementById('login-pass').value===PASS){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadData();
  } else {
    document.getElementById('login-err').style.display='block';
  }
}
function doLogout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-pass').value='';
}

async function loadData(){
  document.getElementById('table-body').innerHTML='<div class="loading">Cargando...</div>';
  const dateFilter=document.getElementById('filter-date').value;
  let url=`${SB_URL}/rest/v1/appointments?business_slug=eq.${SLUG}&order=starts_at.desc`;
  if(dateFilter) url+=`&starts_at=gte.${dateFilter}T00:00:00&starts_at=lte.${dateFilter}T23:59:59`;
  try{
    const res=await fetch(url,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
    ALL=await res.json();
    renderStats();
    renderTable();
  }catch(e){
    document.getElementById('table-body').innerHTML='<div class="empty">Error al cargar datos</div>';
  }
}

function renderStats(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('st-total').textContent=ALL.length;
  document.getElementById('st-pending').textContent=ALL.filter(r=>r.status==='pending').length;
  document.getElementById('st-confirmed').textContent=ALL.filter(r=>r.status==='confirmed').length;
  document.getElementById('st-today').textContent=ALL.filter(r=>r.starts_at&&r.starts_at.startsWith(today)).length;
}

function setFilter(btn,f){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  CUR_FILTER=f;
  renderTable();
}

function renderTable(){
  const data=CUR_FILTER==='all'?ALL:ALL.filter(r=>r.status===CUR_FILTER);
  if(!data.length){
    document.getElementById('table-body').innerHTML='<div class="empty">No hay reservas en esta categoria</div>';
    return;
  }
  const statusLabel={pending:'Pendiente',contacted:'Contactado',confirmed:'Confirmada',cancelled:'Cancelada'};
  const statusBadge={pending:'badge-pending',contacted:'badge-contacted',confirmed:'badge-confirmed',cancelled:'badge-cancelled'};
  document.getElementById('table-body').innerHTML=data.map(r=>{
    const fecha=r.starts_at?new Date(r.starts_at).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'—';
    const hora=r.starts_at?new Date(r.starts_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
    const notes=parseNotes(r.notes);
    const wa=r.client_phone?`https://wa.me/${r.client_phone.replace(/[^0-9]/g,'')}?text=Hola%20${encodeURIComponent((r.client_name||'').split(' ')[0])}%2C%20soy%20del%20equipo%20de%20Costa%20Norte.`:'';
    const st=r.status||'pending';
    return `<div class="table-row" onclick="openDetail(${r.id})">
      <div><div class="cell-name">${esc(r.client_name||'—')}</div><div class="cell-name-sub">${esc(r.client_email||'')}${notes.dni?' · '+notes.dni:''}</div></div>
      <div class="cell">${esc(r.service||'—')}</div>
      <div class="cell">${fecha}</div>
      <div class="cell">${hora} h</div>
      <div><span class="badge ${statusBadge[st]||'badge-pending'}">${statusLabel[st]||st}</span></div>
      <div class="action-row" onclick="event.stopPropagation()">
        ${wa?`<a href="${wa}" target="_blank" class="act-btn ab-wa"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>WA</a>`:''}
        ${st!=='confirmed'?`<button class="act-btn ab-confirm" onclick="updateStatus(${r.id},'confirmed')">Confirmar</button>`:''}
        ${st!=='cancelled'?`<button class="act-btn ab-cancel" onclick="updateStatus(${r.id},'cancelled')">Cancelar</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function openDetail(id){
  const r=ALL.find(x=>x.id===id); if(!r) return;
  CUR_DETAIL=r;
  const notes=parseNotes(r.notes);
  const fecha=r.starts_at?new Date(r.starts_at).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'—';
  const hora=r.starts_at?new Date(r.starts_at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';
  const statusLabel={pending:'Pendiente',contacted:'Contactado',confirmed:'Confirmada',cancelled:'Cancelada'};
  document.getElementById('d-name').textContent=r.client_name||'—';
  document.getElementById('d-sub').textContent='Reserva recibida el '+new Date(r.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});
  document.getElementById('d-rows').innerHTML=[
    {l:'Clase',v:r.service||'—'},
    {l:'Fecha',v:fecha},
    {l:'Hora',v:hora+' h (2 horas)'},
    {l:'Telefono',v:r.client_phone||'—'},
    {l:'Email',v:r.client_email||'—'},
    {l:'DNI / NIE',v:notes.dni||'—'},
    {l:'Estado',v:statusLabel[r.status]||r.status},
    {l:'Dias reservados',v:notes.dias_totales||1},
    ...(notes.notas_cliente?[{l:'Notas cliente',v:notes.notas_cliente}]:[]),
  ].map(x=>`<div class="detail-row"><span class="dr-label">${x.l}</span><span class="dr-val">${esc(String(x.v))}</span></div>`).join('');

  const wa=r.client_phone?`https://wa.me/${r.client_phone.replace(/[^0-9]/g,'')}?text=Hola%20${encodeURIComponent((r.client_name||'').split(' ')[0])}%2C%20soy%20del%20equipo%20de%20Costa%20Norte%20Surf%20Center.%20Te%20contactamos%20respecto%20a%20tu%20solicitud%20de%20clase.`:'';
  document.getElementById('d-actions').innerHTML=`
    ${wa?`<a href="${wa}" target="_blank" class="da-btn da-wa"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>Abrir WhatsApp</a>`:''}
    <button class="da-btn da-confirm" onclick="updateStatus(${r.id},'confirmed');closeDetail()">Marcar como confirmada</button>
    <button class="da-btn da-contact" onclick="updateStatus(${r.id},'contacted');closeDetail()">Marcar como contactado</button>
    <button class="da-btn da-cancel" onclick="updateStatus(${r.id},'cancelled');closeDetail()" style="background:var(--red-bg);color:var(--red)">Cancelar reserva</button>
  `;
  document.getElementById('detail-overlay').classList.add('open');
}
function closeDetail(){document.getElementById('detail-overlay').classList.remove('open')}

async function updateStatus(id,status){
  try{
    await fetch(`${SB_URL}/rest/v1/appointments?id=eq.${id}`,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({status})
    });
    const r=ALL.find(x=>x.id===id);
    if(r){r.status=status;renderStats();renderTable();}
  }catch(e){alert('Error al actualizar')}
}

function parseNotes(n){try{return JSON.parse(n)||{}}catch{return{}}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
</script>
</body>
</html>
