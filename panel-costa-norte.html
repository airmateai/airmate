<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costa Norte · Panel de Apartamentos</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f7f8fc;--white:#fff;--border:#e5e8ef;
  --text:#0f1117;--muted:#6b7280;--muted2:#9ca3af;
  --blue:#1e3a5f;--teal:#0d9488;--teal2:#f0fdfa;
  --card-shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.header{background:var(--blue);color:#fff;padding:0 32px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
.logo{font-size:16px;font-weight:700;letter-spacing:-.3px}
.logo span{color:#5eead4;font-weight:300}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.hdr-stat{font-size:12px;color:rgba(255,255,255,.6);padding:5px 12px;background:rgba(255,255,255,.08);border-radius:20px;display:flex;align-items:center;gap:6px}
.hdr-stat strong{color:#fff;font-weight:600}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:28px 24px}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--card-shadow)}
.stat-val{font-size:26px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.8px;font-weight:500}
.stat-sub{font-size:11px;color:var(--teal);margin-top:4px;font-weight:500}

/* FILTROS */
.filters{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--muted);transition:all .15s;font-family:inherit}
.filter-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.filter-btn:hover:not(.active){border-color:#9ca3af;color:var(--text)}
.search-wrap{margin-left:auto;position:relative}
.search-wrap input{padding:7px 14px 7px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--white);color:var(--text);font-family:inherit;outline:none;width:200px;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--teal)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted2);fill:none;stroke-width:1.5}

/* EDIFICIO SECTION */
.edificio-section{margin-bottom:32px}
.edificio-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.edificio-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.edificio-badge{font-size:11px;color:var(--muted);background:var(--border);padding:3px 10px;border-radius:10px;font-weight:500}
.edificio-addr{font-size:11px;color:var(--muted);margin-left:auto}

/* GRID APARTAMENTOS */
.aptos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* CARD APARTAMENTO */
.apto-card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow);cursor:pointer;transition:all .18s;position:relative}
.apto-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-1px);border-color:#d1d5db}
.apto-card-top{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.apto-codigo{font-size:13px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.apto-tipo{font-size:11px;color:var(--muted);margin-top:2px}
.apto-estado{position:absolute;top:12px;right:12px}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px}
.badge-disponible{background:#dcfce7;color:#15803d}
.badge-ocupado{background:#fee2e2;color:#dc2626}
.badge-mantenimiento{background:#fef3c7;color:#92400e}

.apto-card-body{padding:12px 16px}
.apto-specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.spec{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.spec svg{width:13px;height:13px;stroke:var(--muted2);fill:none;stroke-width:1.5;flex-shrink:0}
.spec strong{color:var(--text);font-weight:600}

.apto-amenities{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.amenity{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted);border:1px solid var(--border);font-weight:500}
.amenity.si{background:var(--teal2);color:var(--teal);border-color:#99f6e4}

.apto-card-foot{padding:8px 16px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.foot-detail{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.foot-detail svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.5}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--white);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--white);z-index:1}
.modal-head h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.modal-head p{font-size:12px;color:var(--muted);margin-top:2px}
.modal-close{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-close svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.modal-body{padding:20px 24px}
.modal-section{margin-bottom:20px}
.modal-section h3{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--bg);border-radius:8px}
.modal-row .k{font-size:12px;color:var(--muted);font-weight:500}
.modal-row .v{font-size:12px;font-weight:600;color:var(--text)}
.v-si{color:#16a34a}
.v-no{color:var(--muted2)}
.modal-nota{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;color:var(--text);resize:vertical;min-height:70px;outline:none;background:var(--white)}
.modal-nota:focus{border-color:var(--teal)}
.btn-guardar{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;margin-top:10px}
.btn-guardar:hover{opacity:.88}

.estado-btns{display:flex;gap:8px;margin-top:6px}
.e-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s;font-family:inherit}
.e-disponible{background:#dcfce7;color:#15803d;border-color:#86efac}
.e-disponible.sel,.e-disponible:hover{background:#15803d;color:#fff;border-color:#15803d}
.e-ocupado{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.e-ocupado.sel,.e-ocupado:hover{background:#dc2626;color:#fff;border-color:#dc2626}
.e-mantenimiento{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.e-mantenimiento.sel,.e-mantenimiento:hover{background:#d97706;color:#fff;border-color:#d97706}

@media(max-width:600px){.stats-row{grid-template-columns:repeat(2,1fr)}.modal-grid{grid-template-columns:1fr}}
</style>
</head>

const ESTADOS_KEY='cn_estados';
const NOTAS_KEY='cn_notas';
function getEstados(){try{return JSON.parse(localStorage.getItem(ESTADOS_KEY)||'{}')}catch(e){return{}}}
function setEstado(id,val){const e=getEstados();e[id]=val;localStorage.setItem(ESTADOS_KEY,JSON.stringify(e))}
function getNotas(){try{return JSON.parse(localStorage.getItem(NOTAS_KEY)||'{}')}catch(e){return{}}}
function setNota(id,val){const n=getNotas();n[id]=val;localStorage.setItem(NOTAS_KEY,JSON.stringify(n))}

let filtroActivo='todos', busquedaActiva='';
function getEstadoApto(id){return getEstados()[id]||'disponible'}

function filtrar(f,btn){
  filtroActivo=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function buscar(q){busquedaActiva=q.toLowerCase();render();}

    if(filtroActivo==='disponible') return getEstadoApto(a.id)==='disponible';
    if(filtroActivo==='mascotas') return a.mascotas==='SI';
    if(filtroActivo!=='todos') return a.edificio===filtroActivo;
    return true;
  });
  if(busquedaActiva) aptos=aptos.filter(a=>
    a.codigo.toLowerCase().includes(busquedaActiva)||
    a.edificio.toLowerCase().includes(busquedaActiva)||
    a.tipo.toLowerCase().includes(busquedaActiva)||
    a.camas.toLowerCase().includes(busquedaActiva)
  );
  const edificios=['Las Villitas','Surfing Loft','Costa Norte','Surf'];
  let html='';
  edificios.forEach(ed=>{
    const grupo=aptos.filter(a=>a.edificio===ed);
    if(!grupo.length) return;
    html+=`<div class="edificio-section">
      <div class="edificio-header">
        <span class="edificio-title">${ed}</span>
        <span class="edificio-badge">${grupo.length} apto${grupo.length!==1?'s':''}</span>
        <span class="edificio-addr">${grupo[0].dir}</span>
      </div>
      <div class="aptos-grid">${grupo.map(cardHTML).join('')}</div>
    </div>`;
  });
  document.getElementById('contenido').innerHTML=html||'<p style="color:var(--muted);text-align:center;padding:40px">No hay apartamentos con ese filtro.</p>';
  updateStats();
}

function cardHTML(a){
  const estado=getEstadoApto(a.id);
  const badges={disponible:'badge-disponible',ocupado:'badge-ocupado',mantenimiento:'badge-mantenimiento'};
  const labels={disponible:'Disponible',ocupado:'Ocupado',mantenimiento:'Mantenimiento'};
  return`<div class="apto-card" onclick="abrirModal('${a.id}')">
    <div class="apto-card-top">
      <div class="apto-codigo">${a.edificio} · <strong>${a.codigo}</strong></div>
      <div class="apto-tipo">${a.tipo} · Planta ${a.planta}</div>
      <div class="apto-estado"><span class="badge ${badges[estado]}">${labels[estado]}</span></div>
    </div>
    <div class="apto-card-body">
      <div class="apto-specs">
        <div class="spec"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>${a.m2} m²</span></div>
        <div class="spec"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>Máx. <strong>${a.cap}</strong> pers.</span></div>
        <div class="spec"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><span>${a.hab||'Estudio'} hab.</span></div>
        <div class="spec"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg><span>${a.camas.split('+')[0].trim()}</span></div>
      </div>
      <div class="apto-amenities">
        <span class="amenity ${a.terraza==='SI'?'si':''}">Terraza</span>
        <span class="amenity ${a.garaje==='SI'?'si':''}">Garaje</span>
        <span class="amenity ${a.mascotas==='SI'?'si':''}">Mascotas</span>
        <span class="amenity si">WiFi 1Gb</span>
        <span class="amenity ${a.tv==='SI'?'si':''}">Smart TV</span>
      </div>
    </div>
    <div class="apto-card-foot">
      <div class="foot-detail"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${a.dir.split(' ').slice(-1)[0]}</div>
      <div class="foot-detail">${a.acceso}</div>
    </div>
  </div>`;
}

function updateStats(){
  let disp=0,ocup=0;
  APTOS.forEach(a=>{const e=getEstadoApto(a.id);if(e==='disponible')disp++;if(e==='ocupado')ocup++;});
  ['s-disp','cnt-disp'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=disp;});
  ['s-ocup','cnt-ocup'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=ocup;});
}

let modalApto=null;
function abrirModal(id){
  const a=APTOS.find(x=>x.id===id);
  if(!a)return;
  modalApto=a;
  const estado=getEstadoApto(id);
  const nota=getNotas()[id]||'';
  document.getElementById('m-titulo').textContent=`${a.edificio} · ${a.codigo}`;
  document.getElementById('m-sub').textContent=`${a.tipo} · ${a.dir}`;
  const si=v=>v==='SI'?'<span class="v v-si">Sí</span>':'<span class="v v-no">No</span>';
  const row=(k,v)=>`<div class="modal-row"><span class="k">${k}</span>${typeof v==='string'&&(v==='SI'||v==='NO')?si(v):`<span class="v">${v}</span>`}</div>`;
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-section">
      <h3>Características</h3>
      <div class="modal-grid">
        ${row('Superficie',a.m2+' m²')}${row('Capacidad',a.cap+' personas')}
        ${row('Habitaciones',a.hab||'Estudio/Loft')}${row('Camas',a.camas)}
        ${row('Planta',a.planta)}${row('Terraza',a.terraza)}
        ${row('Vistas al mar',a.vistas)}${row('Garaje',a.garaje)}
        ${row('Mascotas',a.mascotas)}${row('Acceso',a.acceso)}
      </div>
    </div>
    <div class="modal-section">
      <h3>Equipamiento</h3>
      <div class="modal-grid">
        ${row('Aire acondicionado',a.ac)}${row('Ventiladores',a.ventiladores+' uds.')}
        ${row('Calefacción',a.calefaccion+' radiadores')}${row('Lavadora',a.lavadora)}
        ${row('Microondas',a.micro)}${row('Nevera',a.nevera)}
        ${row('Smart TV / Netflix',a.tv)}${row('Cafetera',a.cafetera)}
        ${row('WiFi',a.wifi)}${row('Jacuzzi',a.jacuzzi)}
      </div>
    </div>
    <div class="modal-section">
      <h3>Estado</h3>
      <div class="estado-btns">
        <button class="e-btn e-disponible ${estado==='disponible'?'sel':''}" onclick="cambiarEstado('disponible')">Disponible</button>
        <button class="e-btn e-ocupado ${estado==='ocupado'?'sel':''}" onclick="cambiarEstado('ocupado')">Ocupado</button>
        <button class="e-btn e-mantenimiento ${estado==='mantenimiento'?'sel':''}" onclick="cambiarEstado('mantenimiento')">Mantenimiento</button>
      </div>
    </div>
    <div class="modal-section">
      <h3>Notas internas</h3>
      <textarea class="modal-nota" id="modal-nota" placeholder="Huésped actual, fechas, incidencias…">${nota}</textarea>
      <button class="btn-guardar" onclick="guardarNota()">Guardar nota</button>
    </div>`;
  document.getElementById('modal-bg').classList.add('open');
}

function cambiarEstado(estado){
  if(!modalApto)return;
  setEstado(modalApto.id,estado);
  document.querySelectorAll('.estado-btns .e-btn').forEach(b=>{
    b.classList.remove('sel');
    if(b.classList.contains('e-'+estado)) b.classList.add('sel');
  });
  render();
}

function guardarNota(){
  if(!modalApto)return;
  setNota(modalApto.id,document.getElementById('modal-nota').value);
  const btn=document.querySelector('.btn-guardar');
  btn.textContent='Guardado';
  setTimeout(()=>btn.textContent='Guardar nota',1500);
}

function cerrarModal(e){
  if(e&&e.target!==document.getElementById('modal-bg'))return;
  document.getElementById('modal-bg').classList.remove('open');
  modalApto=null;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModal();});

render();
</script>
</body>
</html>
