<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Estela García · Asesora Energética</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --nav:#0d0a05;
  --nav2:#161009;
  --acc:#8B6914;
  --acc-d:#6B5010;
  --acc-g:#b8932a;
  --terra:#C4956A;
  --bg:#f7f4ef;
  --surface:#ffffff;
  --border:rgba(139,105,20,.12);
  --border2:rgba(139,105,20,.07);
  --txt:#1a1505;
  --txt2:#3d3010;
  --txt3:#7a6535;
  --txt4:#a89060;
  --green:#22c55e;
  --amber:#f59e0b;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);display:flex;height:100vh;overflow:hidden;cursor:none}

/* CURSOR */
#kc{position:fixed;width:8px;height:8px;background:var(--acc);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
#kc2{position:fixed;width:26px;height:26px;border:1.5px solid rgba(139,105,20,.45);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}

/* SIDEBAR */
.sidebar{width:228px;background:var(--nav);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:0}
.logo-wrap{padding:22px 18px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo-icon{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc-d));display:flex;align-items:center;justify-content:center}
.logo-name{font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px}
.logo-sub{font-size:10px;color:rgba(255,255,255,.28);line-height:1.5}
.nav-section{padding:20px 14px 5px;font-size:9px;font-weight:600;color:rgba(255,255,255,.22);letter-spacing:2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:9px;font-size:12px;color:rgba(255,255,255,.45);cursor:none;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.75)}
.nav-item.active{background:rgba(139,105,20,.2);color:rgba(196,149,106,.95);font-weight:500}
.nav-item svg{flex-shrink:0;opacity:.65}
.nav-item.active svg{opacity:1}
.sidebar-footer{margin-top:auto;padding:14px 12px;border-top:1px solid rgba(255,255,255,.06)}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--terra));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.user-role{font-size:9px;color:rgba(255,255,255,.28)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:14px;flex-shrink:0}
.topbar-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;color:var(--txt);flex:1}
.topbar-title span{color:var(--acc)}
.tb-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:11px;font-weight:500;cursor:none;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.tb-btn-acc{background:var(--acc);color:#fff}
.tb-btn-acc:hover{background:var(--acc-d)}
.tb-btn-ghost{background:transparent;color:var(--txt3);border:1px solid var(--border)}
.tb-btn-ghost:hover{background:rgba(139,105,20,.05)}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--txt3);cursor:none}
.content{flex:1;overflow-y:auto;padding:22px 24px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(139,105,20,.15);border-radius:2px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}

/* STAT CARDS — dark con borde dorado */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:var(--nav2);border:1px solid rgba(139,105,20,.25);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--terra))}
.stat-label{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:500}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;color:#fff;line-height:1}
.stat-sub{font-size:10px;color:rgba(255,255,255,.28);margin-top:4px}
.trend-up{color:#4ade80 !important}

.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-style:italic;color:var(--txt)}
.section-title span{color:var(--acc)}
.see-all{font-size:11px;color:var(--acc);cursor:none;font-weight:500}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.badge-green{background:rgba(34,197,94,.12);color:#16a34a}
.badge-amber{background:rgba(245,158,11,.12);color:#d97706}
.badge-blue{background:rgba(96,165,250,.12);color:#2563eb}
.badge-terra{background:rgba(196,149,106,.18);color:var(--acc)}
.badge-gray{background:rgba(139,105,20,.08);color:var(--txt3)}
.badge-red{background:rgba(239,68,68,.1);color:#dc2626}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:22px}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--border2)}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
td{padding:11px 14px;font-size:12px;color:var(--txt2);border-bottom:1px solid var(--border2)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s;cursor:none}
tbody tr:hover{background:rgba(139,105,20,.03)}

/* KANBAN */
.kanban-col{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.kanban-hdr{padding:11px 14px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:8px}
.kanban-list{padding:10px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.lead-card{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:12px 14px;transition:all .2s;cursor:none}
.lead-card:hover{border-color:rgba(139,105,20,.3);box-shadow:0 4px 12px rgba(0,0,0,.06);transform:translateY(-1px)}
.lead-empresa{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:3px}
.lead-meta{font-size:10px;color:var(--txt3)}
.lead-val{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--acc);font-weight:600;margin-top:6px}

/* AGENDA */
.agenda-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border2)}
.agenda-item:last-child{border-bottom:none}
.agenda-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:4px}
.agenda-title{font-size:12px;font-weight:500;color:var(--txt);margin-bottom:2px}
.agenda-meta{font-size:10px;color:var(--txt3)}

/* AHORRO */
.ahorro-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;transition:all .2s;margin-bottom:10px}
.ahorro-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.07);transform:translateY(-2px)}
.prog-bar{background:var(--bg);border-radius:4px;height:5px;overflow:hidden;margin-top:8px}
.prog-fill{height:5px;border-radius:4px;background:linear-gradient(90deg,var(--acc),#4ade80)}

/* PROP CARD */
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;transition:all .2s;cursor:none}
.prop-card:hover{border-color:rgba(139,105,20,.28);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.prop-ico{width:38px;height:38px;border-radius:10px;background:rgba(139,105,20,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:420px;border-radius:14px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.chat-msgs::-webkit-scrollbar{width:3px}
.msg{padding:10px 13px;border-radius:12px;font-size:12px;line-height:1.5;max-width:82%}
.msg-ai{background:var(--surface);border:1px solid var(--border);color:var(--txt2);align-self:flex-start;border-bottom-left-radius:4px}
.msg-user{background:var(--acc);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--surface)}
.chat-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:12px;outline:none;font-family:'Inter',sans-serif;color:var(--txt);background:var(--bg)}
.chat-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;background:var(--surface)}
.chip{padding:5px 10px;border:1px solid var(--border);border-radius:20px;font-size:10px;color:var(--txt3);cursor:none;transition:all .15s;background:var(--bg)}
.chip:hover{background:rgba(139,105,20,.08);border-color:var(--acc);color:var(--acc)}

/* ANIM */
.view-anim{animation:fadeInScale .3s ease-out}
@keyframes fadeInScale{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sk{background:linear-gradient(90deg,#ede8df 25%,#f5f2ec 50%,#ede8df 75%);background-size:200% 100%;animation:skShimmer 1.4s infinite;border-radius:10px}
@keyframes skShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div id="kc"></div>
<div id="kc2"></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo-wrap">
    <div class="logo-mark">
      <div class="logo-icon">
        <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="logo-name">Estela García</div>

  <div class="nav-section">Principal</div>

  </div>
  <div class="nav-item" onclick="setView('ahorros',this)">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>

  </div>
  <div class="nav-item" onclick="setView('propuestas',this)">

    Propuestas / auditorías
  </div>

  <div class="nav-section">Gestión</div>
  <div class="nav-item" onclick="setView('agenda',this)">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Agenda
  </div>
  <div class="nav-item" onclick="setView('agente',this)">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    Asistente IA
    <span style="margin-left:auto;background:var(--acc);color:#fff;border-radius:10px;font-size:8px;padding:1px 6px;font-weight:600">IA</span>
  </div>

  <div class="sidebar-footer">
    <div class="user-chip">
      <div class="user-av">EG</div>
      <div>
        <div class="user-name">Estela García</div>
        <div class="user-role">ARSEM · Asesora energética</div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbarTitle">Panel <span>principal</span></div>
    <div class="tb-search">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Buscar empresa...
    </div>
    <button class="tb-btn tb-btn-acc">+ Nuevo lead</button>
  </div>
  <div class="content" id="mainContent"></div>
</div>

<script>
// CURSOR
const kc=document.getElementById('kc'),kc2=document.getElementById('kc2');
let mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;kc.style.left=mx+'px';kc.style.top=my+'px';});
(function loop(){cx+=(mx-cx)*.12;cy+=(my-cy)*.12;kc2.style.left=cx+'px';kc2.style.top=cy+'px';requestAnimationFrame(loop)})();

const CLIENTES=[
  {empresa:'Grupo Industrial Mora',sector:'Industrial',contacto:'Luis Mora',contrato:'3 años',ahorro:'18.400€/año',estado:'Activo',prox:'Renovación Oct 2026',pct:78},
  {empresa:'Supermercados Valcor',sector:'Distribución',contacto:'Carmen Valcor',contrato:'2 años',ahorro:'11.200€/año',estado:'Activo',prox:'Revisión Sep 2026',pct:61},
  {empresa:'Clínica Santa Rosa',sector:'Salud',contacto:'Dr. Andrés Sanz',contrato:'1 año',ahorro:'6.800€/año',estado:'Activo',prox:'Auditoría Jul 2026',pct:44},
  {empresa:'Talleres AutoCentro',sector:'Automoción',contacto:'Pedro Ruiz',contrato:'2 años',ahorro:'8.900€/año',estado:'Activo',prox:'Seguimiento Ago 2026',pct:55},
  {empresa:'Panadería Hermanos Gil',sector:'Alimentación',contacto:'Ana Gil',contrato:'1 año',ahorro:'3.100€/año',estado:'Activo',prox:'Revisión Dic 2026',pct:30},
  {empresa:'Logística Noreste SL',sector:'Logística',contacto:'Marta Iglesias',contrato:'—',ahorro:'—',estado:'En negociación',prox:'Propuesta enviada',pct:0},
];

const LEADS_DATA={
  contacto:[
    {empresa:'Hormigones del Centro',sector:'Construcción',val:'~9.000€/año',dias:2},
    {empresa:'Frutas Cano',sector:'Alimentación',val:'~3.500€/año',dias:5},
  ],
  analisis:[
    {empresa:'Residencia Los Pinos',sector:'Social',val:'~12.000€/año',dias:8},
    {empresa:'Gasolinera Hnos Torres',sector:'Energía',val:'~7.200€/año',dias:3},
  ],
  propuesta:[
    {empresa:'Logística Noreste SL',sector:'Logística',val:'~14.000€/año',dias:12},
  ],
  cerrado:[
    {empresa:'Clínica Santa Rosa',sector:'Salud',val:'6.800€/año',dias:45},
    {empresa:'Supermercados Valcor',sector:'Distribución',val:'11.200€/año',dias:60},
  ],
};

const AGENDA_DATA=[
  {dia:'18',mes:'Jun',hora:'09:30',titulo:'Auditoría Grupo Industrial Mora',lugar:'Ocaña · Presencial',tipo:'Auditoría'},
  {dia:'19',mes:'Jun',hora:'11:00',titulo:'Presentación Logística Noreste',lugar:'Videoconferencia',tipo:'Propuesta'},
  {dia:'20',mes:'Jun',hora:'16:00',titulo:'Revisión factura Supermercados Valcor',lugar:'Teléfono',tipo:'Seguimiento'},
  {dia:'24',mes:'Jun',hora:'10:00',titulo:'Reunión ARSEM — briefing semanal',lugar:'Toledo · Oficina',tipo:'Interno'},
  {dia:'26',mes:'Jun',hora:'12:30',titulo:'Cierre contrato Residencia Los Pinos',lugar:'Presencial',tipo:'Cierre'},
];

const AI_MSGS=[
  {r:true,t:'Hola Estela, soy tu asistente energético. Puedo ayudarte a preparar propuestas, revisar contratos o analizar el consumo de tus clientes. ¿En qué trabajamos hoy?'},
];

function setView(v,el){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(el)el.classList.add('active');
  const c=document.getElementById('mainContent');
  c.innerHTML=`<div class="stats-grid">${Array(4).fill(0).map(()=>`<div class="sk" style="height:90px"></div>`).join('')}</div><div class="sk" style="height:180px;margin-bottom:16px"></div><div class="grid-2">${Array(2).fill(0).map(()=>`<div class="sk" style="height:200px"></div>`).join('')}</div>`;
  setTimeout(()=>renderView(v),320);
}
function renderView(v){
  const c=document.getElementById('mainContent');
  c.innerHTML='';
  const titles={dashboard:'Panel <span>principal</span>',clientes:'Empresas <span>clientes</span>',leads:'Pipeline de <span>leads</span>',ahorros:'Ahorros <span>conseguidos</span>',propuestas:'Propuestas <span>y auditorías</span>',agenda:'<span>Agenda</span>',agente:'Asistente <span>IA</span>'};
  document.getElementById('topbarTitle').innerHTML=titles[v]||v;
  const wrap=document.createElement('div');
  wrap.className='view-anim';
  if(v==='dashboard')wrap.innerHTML=dashboardHTML();
  else if(v==='clientes')wrap.innerHTML=clientesHTML();
  else if(v==='leads')wrap.innerHTML=leadsHTML();
  else if(v==='ahorros')wrap.innerHTML=ahorrosHTML();
  else if(v==='propuestas')wrap.innerHTML=propuestasHTML();
  else if(v==='agenda')wrap.innerHTML=agendaHTML();
  else if(v==='agente')wrap.innerHTML=agenteHTML();
  c.appendChild(wrap);
  if(v==='dashboard')setTimeout(drawChartDash,100);
  if(v==='ahorros')setTimeout(drawChartAhorro,100);
  if(v==='agente')setTimeout(renderMsgs,100);
}

function dashboardHTML(){return`
<!-- HERO -->
<div style="border-radius:18px;overflow:hidden;position:relative;height:210px;margin-bottom:22px">
  <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?w=1400&q=80" style="width:100%;height:100%;object-fit:cover;display:block">
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,10,5,.92) 0%,rgba(13,10,5,.55) 60%,rgba(13,10,5,.1) 100%)"></div>
  <div style="position:absolute;inset:0;padding:32px 36px;display:flex;flex-direction:column;justify-content:center">
    <div style="font-size:9px;color:rgba(196,149,106,.85);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px">Buenos días, Estela · Junio 2026</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:30px;color:#fff;font-weight:500;line-height:1.2;margin-bottom:8px">Tu cartera energética,<br><span style="color:var(--terra)">en un solo lugar.</span></div>
    <div style="font-size:11px;color:rgba(255,255,255,.38);margin-bottom:18px">5 empresas activas · 48.400€ en ahorros anuales gestionados</div>
    <div style="display:flex;gap:28px">

function renderMsgs(){
  const el=document.getElementById('chatMsgs');
  if(!el)return;
  el.innerHTML=AI_MSGS.map(m=>`<div class="msg ${m.r?'msg-ai':'msg-user'}">${m.t}</div>`).join('');
  el.scrollTop=el.scrollHeight;
}
function sendMsg(){
  const inp=document.getElementById('chatIn');
  if(!inp||!inp.value.trim())return;
  sendChip(inp.value);inp.value='';
}
function sendChip(txt){
  const r={
    'Prepara propuesta para nueva empresa':'Claro. Dime el nombre de la empresa, sector, consumo mensual aproximado (kWh) y si tienen contrato de luz y gas activo. Con eso preparo el borrador en minutos.',
    '¿Cómo optimizo la tarifa de Mora?':'Para Grupo Industrial Mora recomiendo: (1) revisar la potencia contratada vs. picos reales en el último año, (2) analizar discriminación horaria, (3) evaluar contrato con comercializadora independiente. ¿Quieres que prepare el análisis?',
    'Resumen de ahorros del mes':'En junio 2026 llevas 48.400€ anuales gestionados en 5 empresas. El mayor ahorro es Grupo Industrial Mora con 18.400€/año. Tienes 3 propuestas en proceso con ~33.200€ potencial adicional.',
    'Calcula ROI auditoría':'Con inversión media de 1.200€ en auditoría y ahorro de 9.700€/año (tu media por cliente), el ROI es del 708% en el primer año. Recuperas la inversión en 45 días.',
  };
  AI_MSGS.push({r:false,t:txt});
  renderMsgs();
  setTimeout(()=>{
    AI_MSGS.push({r:true,t:r[txt]||'Entendido. Analizando la información energética de tu cartera para darte la mejor recomendación. ¿Lo aplico a un cliente específico?'});
    renderMsgs();
  },800);
}
