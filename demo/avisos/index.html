<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hoy · A quién escribir · Demo Airmate</title>
<meta name="theme-color" content="#071A2F">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--n:#071A2F;--n2:#0e2742;--l:#B7F34A;--bg:#f3f5f8;--card:#fff;--tx:#0b1b2e;--mu:#6b7a8c;--bd:#e3e8ef;--wa:#25D366;--e:cubic-bezier(.16,1,.3,1);--s:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
header{background:radial-gradient(circle at 85% 0,#16406b,var(--n) 60%);color:#fff;padding:22px 18px 70px;position:relative;overflow:hidden}
.top{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.lg{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px}.lg i{width:9px;height:9px;border-radius:50%;background:var(--l);box-shadow:0 0 0 0 rgba(183,243,74,.6);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(183,243,74,0)}100%{box-shadow:0 0 0 0 rgba(183,243,74,0)}}
select{font:inherit;font-weight:700;font-size:13px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 12px}
select option{color:#000}
.hi{max-width:760px;margin:26px auto 0}
.hi small{display:inline-block;color:#9fb3c8;font-weight:600}.hi small::first-letter{text-transform:uppercase}
h1{font-family:Fraunces,serif;font-weight:900;font-size:clamp(30px,6vw,44px);line-height:1.05;margin:6px 0 0;letter-spacing:-.02em}h1 em{font-style:normal;color:var(--l)}
.prog{margin-top:18px;display:flex;align-items:center;gap:12px}.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--l);border-radius:99px;transition:width .9s var(--e)}.prog b{font-size:13px;white-space:nowrap}
main{max-width:760px;margin:-46px auto 0;padding:0 14px 120px;position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(7,26,47,.06);transition:transform .3s var(--s),background .3s,color .3s}
.chip span{min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:12px;background:var(--bg)}
.chip.on{background:var(--n);color:#fff;border-color:var(--n)}.chip.on span{background:var(--l);color:var(--n)}.chip:active{transform:scale(.95)}
.sec{margin-top:10px}
.sh{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}.sh .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px}
.sh h2{margin:0;font-size:17px}.sh p{margin:2px 0 0;color:var(--mu);font-size:13px}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:8px;opacity:0;transform:translateY(16px);animation:in .6s var(--e) forwards;animation-delay:calc(var(--i)*55ms);transition:opacity .4s,transform .5s var(--e),max-height .5s var(--e),margin .5s,padding .5s;max-height:120px;overflow:hidden}
@keyframes in{to{opacity:1;transform:none}}
.av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.it .tx{flex:1;min-width:0}.it b{display:block;font-size:15px}.it small{display:block;color:var(--mu);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa{flex:none;display:flex;align-items:center;gap:7px;background:var(--wa);color:#fff;font-weight:800;font-size:14px;padding:11px 14px;border-radius:12px;transition:transform .25s var(--s)}
.wa:active{transform:scale(.94)}.wa svg{width:17px;height:17px;fill:#fff}
.it.hecho{opacity:.5}.it.hecho .wa{background:#e6f9ec;color:#11883d}.it.hecho .wa svg{fill:#11883d}
.vac{background:var(--card);border:1px dashed var(--bd);border-radius:16px;padding:16px;color:var(--mu);font-size:14px;text-align:center}
/* hoja de mensaje */
.ov{position:fixed;inset:0;background:rgba(7,26,47,.5);backdrop-filter:blur(4px);z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:#efe7dd;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .55s var(--e)}
.hoja.on{transform:none}.hoja .hd{display:flex;align-items:center;gap:10px;background:#075E54;color:#fff;margin:-16px -16px 14px;padding:14px 16px;border-radius:24px 24px 0 0}
.hoja .hd b{flex:1}.hoja .hd button{color:#fff;font-size:22px}
.bub{background:#dcf8c6;border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:15px;line-height:1.45;margin-left:30px;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-wrap;transform-origin:bottom right;animation:bub .5s var(--s)}
@keyframes bub{from{transform:scale(.6);opacity:0}}
.hoja textarea{width:100%;margin-top:12px;border:1px solid #d6cfc4;border-radius:12px;padding:10px;font:inherit;font-size:14px;min-height:80px;resize:vertical}
.hoja .env{width:100%;margin-top:12px;background:var(--wa);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.hoja .env svg{width:20px;height:20px;fill:#fff}.hoja .nt{text-align:center;color:#6b6257;font-size:12px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;z-index:30;transform:translate(-50%,140%);background:var(--n);color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;transition:transform .5s var(--s)}.toast.on{transform:translate(-50%,0)}
.demo{position:fixed;right:12px;bottom:12px;z-index:10;background:#fba458;color:#0d2547;font:700 11px Inter;padding:7px 12px;border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.it{opacity:1;transform:none}}
</style></head><body>
<header>
  <div class="top"><div class="lg"><i></i><span id="neg">Tu negocio</span></div>
    <select id="sector" aria-label="Sector"><option value="pelu">Peluquería</option><option value="estetica">Estética</option><option value="clinica">Clínica</option><option value="gym">Gimnasio</option><option value="surf">Escuela de surf</option></select></div>
  <div class="hi"><small id="fecha"></small><h1>Hoy tienes <em id="total">0</em> mensajes<br>que te traen dinero</h1>
    <div class="prog"><div class="bar"><i id="barra"></i></div><b id="hechos">0 enviados</b></div></div>
</header>
<main>
  <div class="chips" id="chips"></div>
  <div id="lista"></div>
</main>
<div class="ov" id="ov"></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true">
  <div class="hd"><svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg><b id="hn"></b><button id="cerrar" aria-label="Cerrar">×</button></div>
  <div class="bub" id="bub"></div>
  <textarea id="edit" aria-label="Editar mensaje"></textarea>
  <button class="env" id="env"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>Enviar por WhatsApp</button>
  <div class="nt">En tu panel se abre tu WhatsApp con este mensaje ya escrito. Sin coste.</div>
</div>
<div class="toast" id="toast"></div>
<div class="demo">DEMO · datos de ejemplo</div>
<script src="avisos-core.js"></script>
<script>
const SECT={
  pelu:{neg:'Peluquería Nova',serv:['Corte y peinado','Color','Mechas','Corte caballero','Tratamiento keratina'],bono:'bono de 5 lavados'},
  estetica:{neg:'Centro Lúa',serv:['Higiene facial','Manicura semipermanente','Depilación láser','Masaje relajante','Pedicura'],bono:'bono de 5 faciales'},
  clinica:{neg:'Clínica Fisio Mar',serv:['Sesión de fisioterapia','Punción seca','Osteopatía','Valoración inicial','Pilates terapéutico'],bono:'bono de 10 sesiones'},
  gym:{neg:'Forja Gym',serv:['Entrenamiento personal','Valoración física','Clase de fuerza','Revisión de plan','Nutrición'],bono:'bono de 10 entrenos'},
  surf:{neg:'Escuela Ola',serv:['Clase de surf','Clase de paddle','Curso fin de semana','Clase particular','Alquiler de tabla'],bono:'bono de 5 clases'}
};
const NOM=['Ana Martín','Carlos Ruiz','Lucía Pérez','Javier Gómez','Marta Díaz','Sergio López','Paula Navarro','Daniel Romero','Elena Torres','Hugo Sanz','Irene Molina','Pablo Castro','Sara Ortega','Adrián Vidal','Nerea Blanco','Raúl Medina'];
const COL=['#e4572e','#2e86ab','#7b2cbf','#f18f01','#2a9d8f','#c1121f','#3a86ff','#8338ec'];
const TIPOS=[
  {k:'manana',t:'Recordar cita de mañana',d:'Menos ausencias',ic:'📅',bg:'#e8f0ff'},
  {k:'resenas',t:'Pedir reseña en Google',d:'Más reseñas, más clientes nuevos',ic:'⭐',bg:'#fff6dc'},
  {k:'bonos',t:'Bono a punto de acabar',d:'Renovación antes de que se enfríe',ic:'🔁',bg:'#e9fbe0'},
  {k:'dormidos',t:'Clientes que no vuelven',d:'Recuperar a quien se fue',ic:'💤',bg:'#f1ecff'},
  {k:'cumples',t:'Cumpleaños de hoy',d:'Un detalle que se recuerda',ic:'🎂',bg:'#ffe9ef'}];
let filtro='todos',listas={},actual=null;
const K='airmate-avisos-demo';let hechos={};try{hechos=JSON.parse(sessionStorage.getItem(K)||'{}')}catch(e){}
const guardar=()=>{try{sessionStorage.setItem(K,JSON.stringify(hechos))}catch(e){}};
function datos(sec){
  const S=SECT[sec],hoy=new Date(),d=n=>{const x=new Date(hoy);x.setDate(x.getDate()+n);return x};
  const clientes=NOM.map((n,i)=>({id:'c'+i,nombre:n,tel:'6000000'+String(10+i)}));
  const md=x=>String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  clientes[3].cumple='1990-'+md(hoy);clientes[11].cumple=md(hoy);
  clientes[1].bono={nombre:S.bono,total:5,quedan:1};clientes[6].bono={nombre:S.bono,total:10,quedan:0};clientes[9].bono={nombre:S.bono,total:5,quedan:1};
  const citas=[];let id=0;const c=(ci,dd,h,m,est,s)=>{const t=d(dd);t.setHours(h,m,0,0);citas.push({id:'a'+(id++),clienteId:'c'+ci,servicio:S.serv[s%S.serv.length],inicio:t,estado:est})};
  [[0,10,0],[2,11,30],[4,13,0],[7,17,0],[8,18,30]].forEach(([ci,h,m],i)=>c(ci,1,h,m,'confirmada',i));
  [[5,0],[10,0],[12,-1]].forEach(([ci,dd],i)=>c(ci,dd,10+i,0,'completada',i+1));
  [[13,-52],[14,-68],[15,-90],[6,-47]].forEach(([ci,dd],i)=>c(ci,dd,12,0,'completada',i+2));
  [[1,-10],[9,-6],[3,-20],[11,-15],[0,-30],[2,-25],[4,-12],[7,-8],[8,-18]].forEach(([ci,dd],i)=>c(ci,dd,11,0,'completada',i));
  return {clientes,citas,ajustes:{negocio:S.neg,enlaceResena:'g.page/r/'+S.neg.toLowerCase().replace(/\W+/g,'-'),diasDormido:45}};
}
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);
const WA='<svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>';
function render(){
  const sec=document.getElementById('sector').value;const D=datos(sec);
  document.getElementById('neg').textContent=D.ajustes.negocio;
  listas=AirmateAvisos.calcular({...D,hoy:new Date()});
  const todos=TIPOS.flatMap(t=>listas[t.k]);const n=todos.length,h=todos.filter(x=>hechos[sec+x.clave]).length;
  document.getElementById('total').textContent=n-h;
  document.getElementById('hechos').textContent=h+' de '+n+' enviados';
  document.getElementById('barra').style.width=(n?h/n*100:0)+'%';
  document.getElementById('chips').innerHTML=[{k:'todos',t:'Todo',c:n-h},...TIPOS.map(t=>({k:t.k,t:t.ic+' '+t.t.split(' ').slice(0,2).join(' '),c:listas[t.k].filter(x=>!hechos[sec+x.clave]).length}))]
    .map(x=>`<button class="chip${filtro===x.k?' on':''}" data-k="${x.k}">${x.t}<span>${x.c}</span></button>`).join('');
  let i=0;
  document.getElementById('lista').innerHTML=TIPOS.filter(t=>filtro==='todos'||filtro===t.k).map(t=>{
    const L=listas[t.k];
    return `<div class="sec"><div class="sh"><div class="ic" style="background:${t.bg}">${t.ic}</div><div><h2>${t.t}</h2><p>${t.d}</p></div></div>`+
      (L.length?L.map(x=>{const hd=hechos[sec+x.clave];return `<div class="it${hd?' hecho':''}" style="--i:${i++}"><div class="av" style="background:${COL[x.cliente.id.slice(1)%COL.length]}">${ini(x.cliente.nombre)}</div><div class="tx"><b>${x.cliente.nombre}</b><small>${x.detalle}</small></div><button class="wa" data-c="${x.clave}" data-t="${t.k}">${WA}${hd?'Enviado':'Escribir'}</button></div>`}).join('')
      :`<div class="vac">Nada por aquí hoy</div>`)+`</div>`}).join('');
}
document.getElementById('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;filtro=b.dataset.k;render()});
document.getElementById('lista').addEventListener('click',e=>{const b=e.target.closest('.wa');if(!b)return;
  actual=listas[b.dataset.t].find(x=>x.clave===b.dataset.c);if(!actual)return;
  document.getElementById('hn').textContent=actual.cliente.nombre;
  document.getElementById('bub').textContent=actual.texto;document.getElementById('edit').value=actual.texto;
  const bub=document.getElementById('bub');bub.style.animation='none';void bub.offsetWidth;bub.style.animation='';
  document.getElementById('ov').classList.add('on');document.getElementById('hoja').classList.add('on')});
document.getElementById('edit').addEventListener('input',e=>document.getElementById('bub').textContent=e.target.value);
const cerrar=()=>{document.getElementById('ov').classList.remove('on');document.getElementById('hoja').classList.remove('on')};
document.getElementById('ov').onclick=cerrar;document.getElementById('cerrar').onclick=cerrar;
document.getElementById('env').onclick=()=>{
  const sec=document.getElementById('sector').value;
  // En un panel real: window.open(AirmateAvisos.enlace(actual.cliente.tel, texto)) y guardar en la base de datos que se envió.
  hechos[sec+actual.clave]=1;guardar();cerrar();
  const t=document.getElementById('toast');t.textContent='✓ Enviado a '+actual.cliente.nombre.split(' ')[0];t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);
  setTimeout(render,350)};
document.getElementById('sector').onchange=()=>{filtro='todos';render()};
document.getElementById('fecha').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
render();
</script></body></html>
