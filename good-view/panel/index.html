<style>

<script>
/* ── utilidades ── */
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('es-ES',{useGrouping:'always'})+' €';
const DIA=864e5, hoy0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const dIso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const masD=n=>dIso(+hoy0+n*DIA), DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fLarga=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fCorta=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
function laborable(n){let d=new Date(+hoy0+n*DIA);while(d.getDay()===0)d=new Date(+d+DIA);return dIso(d)}

/* ── servicios ── */
const SERV=[{k:'rev',n:'Revisión visual completa',min:30,c:0},{k:'len',n:'Adaptación de lentillas',min:45,c:1},{k:'inf',n:'Control visual infantil',min:30,c:2},{k:'aju',n:'Ajuste o reparación',min:15,c:4},{k:'rec',n:'Recogida de encargo',min:15,c:3}];
const SV=k=>SERV.find(s=>s.k===k)||SERV[0];
const HORAS=['10:00','10:30','11:00','11:30','12:00','12:30','13:00','17:00','17:30','18:00','18:30','19:00','19:30'];

/* ── datos de ejemplo ── */
function semilla(){
 const nombres=['Marta Rodríguez','Javier Pérez','Lucía González','Andrés Martín','Elena Suárez','Pedro Díaz','Nuria Cabrera','Iván Torres','Carmen Hernández','Rosa Fariña','Tomás León','Sara Afonso','Diego Expósito','Laura Méndez','Pablo García','Ana Luis','Miguel Delgado','Clara Rivero','Hugo Padrón','Irene Febles'];
 const origen=['Web','Instagram','Recomendación','De paso','Web','Instagram','Web','De paso'];
 const clientes=nombres.map((n,i)=>{
  const meses=[13,11,2,6,1,14,3,12,0,9,4,16,5,1,13,7,2,10,0,3][i];
  const esf=-(0.5+((i*37)%30)/10).toFixed(2)*1, esf2=+(esf-((i%3)*.25)).toFixed(2);

  </div></div>`}

 c.revs.unshift({f:dIso(hoy0),od:{esf:n('r1'),cil:n('r2'),eje:n('r3')},oi:{esf:n('r4'),cil:n('r5'),eje:n('r6')},add:c.revs[0].add,av:'1,0'});if($('r7').value)c.notas=$('r7').value;guardar();cerrar();sonido();toast('✓ Revisión guardada en la ficha');ir('clientes',1)}

 `<p style="color:var(--mu);margin:-8px 0 16px;font-size:13px">Arrastra las tarjetas entre columnas o toca «Siguiente».</p><div class="kan">${EST.map(([t],i)=>{const es=DB.encargos.filter(e=>e.est===i);

 <label>Qué se encarga</label><input id="j2" placeholder="Ej.: progresivas + montura acetato">

 `<div class="tabs"><button class="${TABR==='rev'?'on':''}" onclick="TABR='rev';ir('revisiones',1)">Revisión anual · ${pendRevision().length}</button><button class="${TABR==='len'?'on':''}" onclick="TABR='len';ir('revisiones',1)">Lentillas · ${pendLentes().length}</button></div>

 ${L.map(c=>{const k=TABR==='rev'?'revision':'lentes',d=TABR==='rev'?'Última revisión: '+fCorta(c.revs[0].f):c.lentes.tipo+' · última caja '+fCorta(c.lentes.ult);

 <div class="card" style="background:var(--ink);color:var(--iv);box-shadow:none"><div class="mono" style="color:var(--tl)">Cómo funciona</div><p class="serif" style="font-size:26px;line-height:1.15;margin:10px 0">El panel lleva la cuenta. <em style="color:var(--tl)">Vosotros solo tocáis «Enviar».</em></p>

 `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Hoy</small><b data-n="${DB.ventas.filter(v=>v.f===H).reduce((a,v)=>a+v.imp,0)}" data-s=" €">0</b></div>

 <label>Qué</label><select id="w2"><option>Gafas graduadas</option><option>Progresivas</option><option>Gafas de sol</option><option>Lentillas</option><option>Accesorios</option></select>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Importe €</label><input id="w3" inputmode="decimal" value="120"></div><div><label>Pago</label><select id="w4"><option>Tarjeta</option><option>Efectivo</option><option>Bizum</option></select></div></div>
 <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="guardaVenta()">Guardar</button></div>`)}

R.cifras=()=>{const sem=[3,2,1,0].map(k=>DB.ventas.filter(v=>{const d=(+hoy0-new Date(v.f+'T00:00'))/DIA;return d>=k*7&&d<k*7+7}).reduce((a,v)=>a+v.imp,0));const mx=Math.max(...sem,1);
 const og={};DB.clientes.forEach(c=>og[c.orig]=(og[c.orig]||0)+1);const ogs=Object.entries(og).sort((a,b)=>b[1]-a[1]),tot=DB.clientes.length,col=['#7a3a2a','#d39a82','#3a5680','#c9b8a6'];
 let acc=0;const arcs=ogs.map(([k,v],i)=>{const a0=acc/tot*Math.PI*2,a1=(acc+v)/tot*Math.PI*2;acc+=v;const p=(a)=>[75+60*Math.sin(a),75-60*Math.cos(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `<path d="M${x0},${y0} A60,60 0 ${a1-a0>Math.PI?1:0} 1 ${x1},${y1}" fill="none" stroke="${col[i]}" stroke-width="22"/>`}).join('');
 const sv={};DB.citas.forEach(a=>sv[a.s]=(sv[a.s]||0)+1);const web=DB.citas.filter(a=>a.web).length;
 return cab('Cifras','Cómo va Good View, <em>sin abrir un Excel.</em>')+
 `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Citas esta semana y la que viene</small><b data-n="${DB.citas.length}">0</b></div><div class="card kpi"><small>Reservadas desde la web</small><b data-n="${Math.round(web/DB.citas.length*100)}" data-s=" %">0</b></div><div class="card kpi"><small>Clientes</small><b data-n="${tot}">0</b></div><div class="card kpi"><small>Venta media</small><b data-n="${DB.ventas.reduce((a,v)=>a+v.imp,0)/DB.ventas.length}" data-s=" €">0</b></div></div>
 <div class="grid g3"><div class="card"><div class="sec-t"><h3>Ventas por semana</h3></div><div class="bars">${sem.map((v,i)=>`<div><small style="font-size:11px;font-weight:600">${fmt(v)}</small><i style="height:${v/mx*100}%;animation-delay:${i*.1}s"></i><span>${i===3?'Esta':'Hace '+(3-i)}</span></div>`).join('')}</div></div>
 <div class="card"><div class="sec-t"><h3>De dónde vienen</h3></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg class="donut" viewBox="0 0 150 150">${arcs}</svg><div class="lg" style="flex:1;min-width:120px">${ogs.map(([k,v],i)=>`<div><i style="background:${col[i]}"></i>${k}<b>${Math.round(v/tot*100)} %</b></div>`).join('')}</div></div></div>

 const ocup=DB.citas.filter(a=>a.f===WB.d).map(a=>a.h);

  <div class="lab">Hora</div><div class="hh">${HORAS.map(h=>`<button ${ocup.includes(h)?'disabled':''} class="${WB.h===h?'on':''}" onclick="WB.h='${h}';ir('web',1)">${h}</button>`).join('')}</div>
  <div class="lab">Tus datos</div><input class="inp" id="wbN" placeholder="Nombre y apellidos" value="Carmen Toledo"><input class="inp" placeholder="Móvil" value="6•• ••• •••">
  <button class="btn bp" style="width:100%;justify-content:center;margin-top:8px;padding:13px" onclick="reservaWeb()">Confirmar cita</button></div></div></div>`};
function reservaWeb(){if(!WB.h){toast('Elige una hora');return}const n=($('wbN').value||'Cliente web').trim();
 let c=DB.clientes.find(x=>x.n.toLowerCase()===n.toLowerCase());if(!c){c={id:'c'+Date.now(),n,tel:'',orig:'Web',alta:dIso(hoy0),lentes:null,revs:[{f:dIso(hoy0),od:{esf:0,cil:0,eje:0},oi:{esf:0,cil:0,eje:0},add:0,av:'—'}],lleva:'—',notas:'Cliente nuevo desde la web'};DB.clientes.unshift(c)}
 const a={id:'a'+Date.now(),f:WB.d,h:WB.h,cl:c.id,s:WB.s,est:'conf',web:true};DB.citas.push(a);guardar();WB.h=null;
 velo(`<div style="text-align:center;padding:10px 0"><div style="width:70px;height:70px;border-radius:50%;background:var(--t);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;animation:mIn .6s var(--s)">✓</div><h3>¡Cita confirmada!</h3><p style="color:var(--mu)">${SV(a.s).n}<br><b style="color:var(--ink)">${fLarga(a.f)} a las ${a.h}</b></p></div>`);

/* modal */

addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});

/* arranque */
const q=new URLSearchParams(location.search);
ir(q.get('v')||'hoy');
setTimeout(()=>$('intro').classList.add('fuera'),q.has('rapido')?0:2000);
