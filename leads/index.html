<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Leads · Airmate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#191510;--txt:#3a332b;--mut:#7d7266;--line:#e6dccf;--acc:#1f7a4d;--warm:#c2703d;--red:#b4372f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:30px;letter-spacing:-.03em;color:var(--ink)}h1 em{font-family:"Instrument Serif";font-weight:400;color:var(--acc)}
.login{max-width:360px;margin:16vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.login p{color:var(--mut);font-size:14px;margin:6px 0 16px}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff}
.btn.w{width:100%;margin-top:12px}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:1px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .r{margin-left:auto;display:flex;gap:8px}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.k small{color:var(--mut);font-size:12px}.k b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.02em}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fil button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px;color:var(--mut);cursor:pointer}
.fil button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.l{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:start}
.l.new{border-left:4px solid var(--warm)}
.l b{color:var(--ink);font-size:16px}.l .m{color:var(--mut);font-size:12.5px;margin-top:2px}
.l .d{grid-column:1/-1;font-size:14px;color:var(--txt);white-space:pre-wrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:#efe7dc;color:var(--warm);margin-right:6px}
.acts{display:flex;gap:6px;align-items:center}
.acts a{background:#25d366;color:#04210f;font-weight:700;font-size:13px;padding:9px 12px;border-radius:10px;text-decoration:none;white-space:nowrap}
.acts select{width:auto;padding:8px 10px;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}.l{grid-template-columns:1fr}.acts{flex-wrap:wrap}}
</style></head><body>
<div class="wrap">
  <div class="login" id="login">
    <h1>Leads <em>Airmate</em></h1><p>Solo para ti. Entra con tu contraseña de owner.</p>
    <form id="lf"><input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña"><button class="btn w">Entrar</button><div class="err" id="lerr"></div></form>
  </div>
  <div id="app" style="display:none">
    <div class="top"><h1>Leads <em>Airmate</em></h1><div class="r"><button class="btn ghost" id="rel">↻</button><button class="btn ghost" id="out">Salir</button></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="fil" id="fil"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const SB='https://vjofxmfwdybktpwiuanc.supabase.co', ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE', API='https://airmate-phi.vercel.app/api/owner-login';
const $=id=>document.getElementById(id), esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=null, ROWS=[], FIL='todos';
try{ TOKEN=sessionStorage.getItem('al_t'); }catch(e){}
const EST={pending:'Nuevo',contactado:'Contactado',demo:'Demo',cliente:'Cliente',descartado:'Descartado'};
const campa=r=>{ const m=(r.description||'').match(/^\[([^\]]+)\]/); return m?m[1]:'Web'; };
async function api(path,opt={}){ const r=await fetch(SB+'/rest/v1/'+path,{...opt,headers:{apikey:ANON,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',...(opt.headers||{})}}); if(r.status===401){ salir(); throw new Error('sesión caducada'); } if(!r.ok) throw new Error(await r.text()); return r.status===204?null:r.json(); }
async function cargar(){ try{ ROWS=await api('web_requests?select=*&order=created_at.desc&limit=500'); pintar(); }catch(e){ $('list').innerHTML='<div class="empty">No se pudieron cargar: '+esc(e.message)+'</div>'; } }
function pintar(){
  const camps=[...new Set(ROWS.map(campa))];
  const hoy=new Date().toDateString(), n=s=>ROWS.filter(r=>(r.status||'pending')===s).length;
  $('kpis').innerHTML=`<div class="k"><small>Total</small><b>${ROWS.length}</b></div><div class="k"><small>Nuevos</small><b>${n('pending')}</b></div><div class="k"><small>Hoy</small><b>${ROWS.filter(r=>new Date(r.created_at).toDateString()===hoy).length}</b></div><div class="k"><small>Clientes</small><b>${n('cliente')}</b></div>`;
  $('fil').innerHTML=['todos','nuevos',...camps].map(f=>`<button data-f="${esc(f)}" class="${f===FIL?'on':''}">${esc(f==='todos'?'Todos':f==='nuevos'?'Nuevos':f)}</button>`).join('');
  $('fil').querySelectorAll('button').forEach(b=>b.onclick=()=>{ FIL=b.dataset.f; pintar(); });
  const l=ROWS.filter(r=>FIL==='todos'||(FIL==='nuevos'?(r.status||'pending')==='pending':campa(r)===FIL));
  $('list').innerHTML=l.length?l.map(r=>{ const tel=String(r.phone||'').replace(/\D/g,''), t=tel.length===9?'34'+tel:tel, st=r.status||'pending';
    return `<div class="l ${st==='pending'?'new':''}"><div><span class="tag">${esc(campa(r))}</span><b>${esc(r.business_name||'Sin nombre')}</b><div class="m">${new Date(r.created_at).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${r.business_type?' · '+esc(r.business_type):''}${r.phone?' · '+esc(r.phone):''}${r.email?' · '+esc(r.email):''}</div></div>
    <div class="acts">${t?`<a href="https://wa.me/${t}?text=${encodeURIComponent('¡Hola! Soy Fabio, de Airmate. He visto tu solicitud y me encantaría ayudarte 🙂')}" target="_blank" rel="noopener">WhatsApp</a>`:''}<select data-id="${r.id}">${Object.entries(EST).map(([k,v])=>`<option value="${k}" ${k===st?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="d">${esc((r.description||'').replace(/^\[[^\]]+\]\s*/,''))}</div></div>`; }).join(''):'<div class="empty">No hay leads aquí todavía.</div>';
  $('list').querySelectorAll('select').forEach(s=>s.onchange=async()=>{ try{ await api('web_requests?id=eq.'+s.dataset.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:s.value})}); const r=ROWS.find(x=>String(x.id)===s.dataset.id); if(r) r.status=s.value; pintar(); }catch(e){ alert('No se pudo guardar'); } });
}
function entrar(){ $('login').style.display='none'; $('app').style.display=''; cargar(); }
function salir(){ TOKEN=null; try{ sessionStorage.removeItem('al_t'); }catch(e){} $('app').style.display='none'; $('login').style.display=''; }
$('lf').onsubmit=async e=>{ e.preventDefault(); $('lerr').textContent='Comprobando…';
  try{ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})}); const j=await r.json();
    if(!r.ok||!j.token) throw new Error(j.error||'Contraseña incorrecta'); TOKEN=j.token; try{ sessionStorage.setItem('al_t',TOKEN); }catch(e){} $('pw').value=''; $('lerr').textContent=''; entrar();
  }catch(e){ $('lerr').textContent=e.message; } };
$('rel').onclick=cargar; $('out').onclick=salir;
if(TOKEN) entrar();
setInterval(()=>{ if(TOKEN) cargar(); },60000);
</script>
</body></html>
