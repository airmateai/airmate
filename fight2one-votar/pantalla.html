<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pantalla de votación · Fight2One</title>
<link rel="icon" href="../panel-fight2one/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#000;--p1:#0f0f10;--p2:#1b1b1f;--line:#2c2c30;--ink:#f5f5f4;--mut:#a3a3a8;--acc:#d4a72c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 0%,#2a2208 0%,#000 60%)}
.p{display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,26vw,420px);gap:3vw;height:100%;padding:3.5vh 3.5vw}
.izq{display:flex;flex-direction:column;min-height:0}
.cab{display:flex;align-items:center;gap:1.2vw;margin-bottom:2.5vh}
.cab img{width:clamp(48px,5vw,84px);height:clamp(48px,5vw,84px);border-radius:14px;object-fit:cover}
.cab small{display:block;color:var(--acc);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:clamp(12px,1.1vw,18px)}
.cab h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(28px,3.6vw,64px);letter-spacing:.04em;margin:0;line-height:1;text-transform:uppercase}
.cats{flex:1;min-height:0;display:grid;gap:2.2vh;grid-auto-rows:minmax(0,1fr)}
.cat{background:rgba(15,15,16,.85);border:1px solid var(--line);border-radius:18px;padding:2vh 1.6vw;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cat h2{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.06em;margin:0 0 1.2vh;font-size:clamp(18px,1.9vw,34px);text-transform:uppercase;color:var(--acc)}
.filas{display:flex;flex-direction:column;gap:1vh;min-height:0;flex:1;justify-content:space-around}
.fila{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1vw}
.fila .ft{width:clamp(34px,3vw,56px);height:clamp(34px,3vw,56px);border-radius:50%;background:var(--p2) center/cover;border:2px solid var(--line)}
.fila.top .ft{border-color:var(--acc)}
.fila .nm{font-weight:800;font-size:clamp(14px,1.35vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.5vh}
.fila .bar{height:clamp(8px,1vh,14px);background:var(--p2);border-radius:8px;overflow:hidden}
.fila .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8a6a14,var(--acc));border-radius:8px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fila .pc{font-family:Anton,Impact,sans-serif;font-size:clamp(18px,2vw,36px);min-width:3.2em;text-align:right}
.der{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2vh}
.qr{background:#fff;padding:clamp(12px,1.2vw,22px);border-radius:22px;box-shadow:0 0 0 6px rgba(212,167,44,.35),0 30px 80px rgba(0,0,0,.6)}
.qr img,.qr canvas{display:block;width:100%!important;height:auto!important}
.der h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(28px,3.2vw,58px);margin:0;letter-spacing:.05em;line-height:1;text-transform:uppercase}
.der h3 em{font-style:normal;color:var(--acc)}
.der p{margin:0;color:var(--mut);font-size:clamp(14px,1.3vw,22px)}
.cont{font-family:Anton,Impact,sans-serif;font-size:clamp(40px,5vw,96px);line-height:1;color:var(--ink)}
.cont small{display:block;font-family:'Inter Tight';font-weight:800;font-size:clamp(12px,1vw,16px);letter-spacing:.2em;color:var(--mut);text-transform:uppercase;margin-top:.6vh}
.estado{display:inline-block;padding:.6vh 1.2vw;border-radius:999px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(12px,1vw,16px)}
.estado.abierta{background:#3ecf8e;color:#000}.estado.cerrada{background:var(--p2);color:var(--mut)}.estado.terminada{background:var(--acc);color:#000}
.oculto-res .filas{filter:blur(14px);opacity:.5}
.aviso{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--mut);font-size:20px}
.ctl{position:fixed;right:12px;bottom:10px;display:flex;gap:8px;opacity:0;transition:opacity .3s}
body:hover .ctl{opacity:1}
.ctl button{background:var(--p2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}
@media (max-width:820px){html,body{overflow:auto}.p{grid-template-columns:1fr;height:auto}.der{order:-1}.qr{width:min(70vw,320px)}}
</style>
</head>
<body>
<div class="p" id="p" hidden>
  <div class="izq">
    <div class="cab"><img src="../panel-fight2one/logo.jpg" alt=""><div><small id="velada">Fight2One</small><h1 id="titulo">Vota a los mejores</h1></div></div>
    <div class="cats" id="cats"></div>
  </div>
  <div class="der">
    <span class="estado" id="estado"></span>
    <h3>Escanea y <em>vota</em></h3>
    <div class="qr" id="qr" style="width:100%"></div>
    <p id="url"></p>
    <div class="cont"><span id="votantes">0</span><small>personas han votado</small></div>
  </div>
</div>
<div class="aviso" id="aviso">Cargando…</div>
<div class="ctl"><button id="b-ocultar" title="Ocultar los porcentajes (suspense)">Ocultar %</button><button id="b-full">Pantalla completa</button></div>
<script>
/* Pantalla grande del pabellón: QR para votar + resultados en directo.
   Si se abre desde el navegador donde Moi tiene el panel abierto, ve los resultados aunque no sean públicos. */
const SB_URL='https://vjofxmfwdybktpwiuanc.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE';
const ID=new URLSearchParams(location.search).get('v')||'';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const foto=u=>!u?'':/^https?:\/\//.test(u)?u:'/'+String(u).replace(/^\/+/,'');
const VOTAR=new URL('./?v='+ID,location.href).href;
let ocultarPc=false; try{ ocultarPc=localStorage.getItem('f2o_pantalla_ocultar')==='1'; }catch(e){}

function token(){ try{ const s=JSON.parse(localStorage.getItem('f2o-panel-auth')||'null'); if(s?.access_token&&(!s.expires_at||s.expires_at*1000>Date.now())) return s.access_token; }catch(e){} return SB_ANON; }
async function resultados(){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/f2o_vot_resultados`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+token()},body:JSON.stringify({p_votacion:ID})});
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}
let _hecho=false;
function montar(){ if(_hecho) return; _hecho=true;
  $('#p').hidden=false; $('#aviso').hidden=true;
  new QRCode($('#qr'),{text:VOTAR,width:600,height:600,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  $('#url').textContent=VOTAR.replace(/^https?:\/\//,'');
}
const ESTADOS={abierta:'● Votación abierta',cerrada:'Votación aún cerrada',terminada:'Votación terminada'};
async function tick(){
  try{
    const R=await resultados();
    if(!R){ $('#aviso').textContent='Esta votación no existe. Ábrela desde el panel de Fight2One.'; return; }
    montar();
    $('#titulo').textContent=R.titulo; $('#velada').textContent=R.velada||'Fight2One';
    const e=$('#estado'); e.className='estado '+R.estado; e.textContent=ESTADOS[R.estado]||R.estado;
    if(R.privado){ $('#cats').innerHTML='<div class="cat" style="justify-content:center;align-items:center;text-align:center"><h2>Resultados al final de la velada</h2><p style="color:var(--mut);margin:0">Abre esta pantalla desde el panel para verlos en directo.</p></div>'; return; }
    $('#votantes').textContent=Number(R.votantes||0).toLocaleString('es-ES');
    const cats=R.categorias.filter(c=>c.opciones.length);
    const cont=$('#cats');
    if(cont.dataset.k!==cats.map(c=>c.id+c.opciones.length).join()){ cont.dataset.k=cats.map(c=>c.id+c.opciones.length).join();
      cont.innerHTML=cats.map(c=>`<div class="cat" data-c="${c.id}"><h2>${esc(c.nombre)}</h2><div class="filas"></div></div>`).join(''); }
    cont.classList.toggle('oculto-res',ocultarPc);
    cats.forEach(c=>{ const tot=c.opciones.reduce((a,o)=>a+o.votos,0); const max=Math.max(1,...c.opciones.map(o=>o.votos));
      const filas=[...c.opciones].sort((a,b)=>b.votos-a.votos).slice(0,cats.length>=3?3:cats.length===2?4:6);
      const el=cont.querySelector(`[data-c="${c.id}"] .filas`);
      el.innerHTML=filas.map((o,i)=>`<div class="fila ${i===0&&o.votos?'top':''}">${o.foto?`<span class="ft" style="background-image:url('${esc(foto(o.foto))}')"></span>`:'<span></span>'}<div style="min-width:0"><div class="nm">${i===0&&o.votos?'🏆 ':''}${esc(o.etiqueta)}</div><div class="bar"><i data-w="${o.votos*100/max}"></i></div></div><span class="pc">${tot?Math.round(o.votos*100/tot):0}%</span></div>`).join('');
      requestAnimationFrame(()=>el.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
    });
  }catch(e){ if(!_hecho) $('#aviso').textContent='Sin conexión. Reintentando…'; }
}
$('#b-ocultar').onclick=()=>{ ocultarPc=!ocultarPc; try{ localStorage.setItem('f2o_pantalla_ocultar',ocultarPc?'1':'0'); }catch(e){} $('#b-ocultar').textContent=ocultarPc?'Mostrar %':'Ocultar %'; $('#cats').classList.toggle('oculto-res',ocultarPc); };
$('#b-ocultar').textContent=ocultarPc?'Mostrar %':'Ocultar %';
$('#b-full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
if(!/^[0-9a-f-]{36}$/i.test(ID)) $('#aviso').textContent='Falta la votación. Ábrela desde el panel de Fight2One (Votación → Pantalla grande).';
else { tick(); setInterval(tick,4000); }
</script>
</body>
</html>
