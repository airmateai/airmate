<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Vota · Fight2One</title>
<meta name="description" content="Votación oficial del público de Fight2One: elige al mejor de la noche.">
<link rel="icon" href="../panel-fight2one/logo.jpg">
<link rel="preload" as="image" href="../fight2one/img/amb-jaula.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--p1:#0d0d0f;--p2:#18181b;--line:#2c2c30;--ink:#f5f5f4;--mut:#a3a3a8;--acc:#d4a72c;--acc2:#ffd863;--cian:#22e1d7;--mag:#ff3d6e;--red:#ff5a68;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase}

/* Fondo vivo: fotos del pabellón con zoom lento + rejilla + grano */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
.fondo i{position:absolute;inset:-6%;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;animation:kb 14s ease-in-out infinite alternate}
.fondo i.on{opacity:.55}
.fondo::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(0,0,0,.15),rgba(0,0,0,.92) 70%),linear-gradient(180deg,rgba(0,0,0,.2),#000 92%)}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-2%,-3%)}}

.vista{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.cab{display:flex;align-items:center;gap:10px}
.cab img{width:38px;height:38px;border-radius:10px;object-fit:cover}
.cab small{display:block;color:var(--acc);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.cab b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:18px;letter-spacing:.06em}

/* Glitch del cartel F2O */
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;pointer-events:none}
.glitch::before{color:var(--cian);transform:translate(-2px,0);mix-blend-mode:screen;opacity:.75;animation:gl1 3.2s infinite steps(1)}
.glitch::after{color:var(--mag);transform:translate(2px,0);mix-blend-mode:screen;opacity:.75;animation:gl2 2.7s infinite steps(1)}
@keyframes gl1{0%,92%,100%{clip-path:inset(0 0 0 0);transform:translate(-2px,0)}93%{clip-path:inset(20% 0 55% 0);transform:translate(-8px,0)}95%{clip-path:inset(60% 0 10% 0);transform:translate(6px,0)}}
@keyframes gl2{0%,90%,100%{clip-path:inset(0 0 0 0);transform:translate(2px,0)}91%{clip-path:inset(45% 0 30% 0);transform:translate(9px,0)}94%{clip-path:inset(5% 0 75% 0);transform:translate(-6px,0)}}

/* Portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6vh}
.sello{width:96px;height:96px;margin:0 0 22px;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px rgba(212,167,44,.5),0 0 60px rgba(212,167,44,.35);animation:latido 2.4s ease-in-out infinite}
.sello img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.eyebrow{color:var(--acc);font-weight:800;letter-spacing:.24em;font-size:12px;text-transform:uppercase;margin-bottom:10px}
.mega{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(58px,19vw,104px);line-height:.88;letter-spacing:.01em;margin:0}
.mega em{font-style:normal;color:var(--acc);display:block}
.lead{color:#d4d4d8;font-size:17px;line-height:1.45;margin:18px 0 26px;max-width:420px}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:64px;border-radius:16px;background:linear-gradient(90deg,#b88a16,var(--acc2),#b88a16);background-size:200% 100%;color:#000;font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.08em;text-transform:uppercase;overflow:hidden;animation:brillo 3s linear infinite;box-shadow:0 10px 40px rgba(212,167,44,.35)}
.cta:disabled{background:var(--p2);color:var(--mut);box-shadow:none;animation:none}
.cta:active{transform:scale(.98)}
@keyframes brillo{to{background-position:-200% 0}}
.nota{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}
.espera{display:flex;align-items:center;gap:10px;justify-content:center;background:rgba(15,15,16,.8);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700}
.espera i{width:10px;height:10px;border-radius:50%;background:var(--acc);animation:latido 1s ease-in-out infinite}

/* Pasos */
.progreso{display:flex;gap:6px;margin:16px 0 18px}
.progreso span{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.progreso span i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s}
.progreso span.hecho i{width:100%}
.paso-n{color:var(--acc);font-weight:800;letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.paso h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(34px,10vw,52px);line-height:.95;margin:6px 0 18px;letter-spacing:.02em}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:20px}
.tarjeta{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--p2);border:2px solid rgba(255,255,255,.08);text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;opacity:0;animation:entra .5s forwards;animation-delay:calc(var(--n)*45ms)}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.tarjeta .ft{position:absolute;inset:0;background:center 20%/cover no-repeat;filter:saturate(.9) contrast(1.05);transition:transform .5s}
.tarjeta .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:64px;color:rgba(212,167,44,.22);background:radial-gradient(circle at 50% 35%,#26262b,#111)}
.tarjeta::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.92))}
.tarjeta .tx{position:absolute;left:12px;right:12px;bottom:11px;z-index:2}
.tarjeta b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:21px;line-height:1;text-transform:uppercase;letter-spacing:.02em}
.tarjeta small{display:block;color:#c8c8cc;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarjeta.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(212,167,44,.35),0 18px 50px rgba(212,167,44,.25);transform:scale(1.03)}
.tarjeta.on .ft{transform:scale(1.08)}
.tarjeta.on::before{content:'✓';position:absolute;z-index:3;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--acc);color:#000;display:grid;place-items:center;font-weight:800;font-size:18px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.rejilla.otro .tarjeta:not(.on){opacity:.45!important;filter:grayscale(.6)}
/* Tarjeta VS de combate */
.rejilla.vs{grid-template-columns:1fr}
.tarjeta.vs{aspect-ratio:16/9}
.tarjeta.vs .ft{inset:0 50% 0 0;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);right:46%}
.tarjeta.vs .ft.b{left:46%;right:0;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}
.tarjeta.vs .x{position:absolute;z-index:2;left:50%;top:42%;transform:translate(-50%,-50%);font-family:Anton,Impact,sans-serif;font-size:44px;color:var(--acc);text-shadow:0 0 20px rgba(212,167,44,.7),2px 0 var(--mag),-2px 0 var(--cian)}
.tarjeta.vs b{text-align:center;font-size:22px}
.tarjeta.vs small{text-align:center}
.atras{color:var(--mut);font-weight:700;padding:8px 0;margin-left:auto}

/* Resumen */
.cartel{display:grid;gap:12px;margin-bottom:18px}
.eleccion{display:flex;align-items:center;gap:14px;background:rgba(15,15,16,.85);border:1px solid var(--line);border-radius:16px;padding:10px;opacity:0;animation:entra .5s forwards;animation-delay:calc(var(--n)*120ms)}
.eleccion .mini{width:64px;height:64px;border-radius:12px;background:var(--p2) center 20%/cover;flex:none;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;color:rgba(212,167,44,.4);font-size:24px}
.eleccion small{display:block;color:var(--acc);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.eleccion b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.05}
.eleccion button{margin-left:auto;color:var(--mut);font-size:13px;font-weight:700;padding:8px}
.codigo{background:rgba(15,15,16,.9);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.codigo label{display:block;font-weight:800;margin-bottom:8px}
.codigo input{width:100%;font:inherit;font-size:26px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.codigo input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.codigo small{display:block;color:var(--mut);margin-top:8px;font-size:13px}
.error{color:var(--red);font-weight:700;text-align:center;margin:0 0 10px;min-height:1px}
.pie-fijo{margin-top:auto;padding-top:10px}

/* Golpe de envío */
.flash{position:fixed;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.temblor{animation:tb .45s}
@keyframes tb{10%,50%,90%{transform:translate(-6px,2px)}30%,70%{transform:translate(6px,-2px)}}
canvas.chispas{position:fixed;inset:0;z-index:15;pointer-events:none;width:100%;height:100%}

/* Gracias */
.gracias{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.estampa{display:inline-block;margin:0 auto 14px;padding:8px 18px;border:3px solid var(--acc);color:var(--acc);border-radius:10px;font-family:Anton,Impact,sans-serif;font-size:20px;letter-spacing:.14em;transform:rotate(-6deg);animation:estampa .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes estampa{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.story{width:min(62vw,250px);aspect-ratio:9/16;margin:18px auto 14px;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 0 1px rgba(212,167,44,.4);background:var(--p2)}
.story img{width:100%;height:100%;display:block;object-fit:cover}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:rgba(24,24,27,.9);border:1px solid var(--line);font-weight:800;color:var(--ink);text-decoration:none;margin-top:10px}
.res{margin-top:22px;text-align:left}
.res h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.05em;margin:18px 0 8px;text-transform:uppercase}
.res .fila{margin:8px 0}
.res .fila div{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px}
.res .bar{height:10px;border-radius:6px;background:var(--p2);overflow:hidden}
.res .bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.pie{color:#55555b;font-size:12px;text-align:center;margin-top:24px}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:auto;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.vista.sale{animation:sale .28s forwards}
.vista.llega{animation:llega .4s}
@keyframes sale{to{opacity:0;transform:translateX(-30px)}}
@keyframes llega{from{opacity:0;transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.tarjeta,.eleccion{opacity:1}}
</style>
</head>
<body>
<div class="fondo" id="fondo" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div>
<main class="vista" id="app"><div class="spin" aria-label="Cargando"></div></main>
<div class="flash" id="flash"></div>
<script>
/* Fight2One · Votación del público (se abre con el QR de la velada)
   Solo usa funciones públicas de Supabase: f2o_vot_papeleta, f2o_vot_votar y f2o_vot_resultados. */
const SB_URL='https://vjofxmfwdybktpwiuanc.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE';
const ID=new URLSearchParams(location.search).get('v')||'';
const LOGO='../fight2one/img/logo.webp';
const FONDOS=['amb-jaula','amb-estelar','amb-golpe','amb-victoria','amb-k1'].map(f=>`../fight2one/img/${f}.webp`);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales=t=>String(t||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const foto=u=>!u?'':/^https?:\/\//.test(u)?u:'/'+String(u).replace(/^\/+/,'');
const leer=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const guardar=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
const vibrar=p=>{ try{ navigator.vibrate?.(p); }catch(e){} };
const QUIETO=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Fondo: fotos del pabellón que se van cruzando */
(function(){ const f=$('#fondo'); f.innerHTML=FONDOS.map(u=>`<i style="background-image:url('${u}')"></i>`).join(''); const capas=[...f.children]; let n=0; capas[0].classList.add('on');
  if(!QUIETO) setInterval(()=>{ capas[n].classList.remove('on'); n=(n+1)%capas.length; capas[n].classList.add('on'); },6000); })();

function votante(){
  let id=leer('f2o_votante')||(document.cookie.match(/f2o_votante=([\w-]+)/)||[])[1];
  if(!id) id=crypto.randomUUID?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
  guardar('f2o_votante',id); document.cookie=`f2o_votante=${id};max-age=31536000;path=/;SameSite=Lax`; return id;
}
async function rpc(fn,body){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}

let P=null, CATS=[], PASO=0, _espera=null; const ELEC={};
const marca=()=>`<img src="${LOGO}" alt="Fight2One"><div><small>${esc(P?.velada||'Fight2One')}</small><b>FIGHT2ONE</b></div>`;
const cab=()=>`<div class="cab">${marca()}</div>`;
function mostrar(html,anim=true){ const a=$('#app');
  return new Promise(listo=>{
    const poner=()=>{ a.innerHTML=html; a.classList.remove('sale'); if(anim&&!QUIETO){ a.classList.remove('llega'); void a.offsetWidth; a.classList.add('llega'); } scrollTo(0,0); listo(); };
    if(anim&&!QUIETO&&a.children.length){ a.classList.add('sale'); setTimeout(poner,260); } else poner(); }); }
function estado(ic,titulo,texto,extra=''){ mostrar(`${cab()}<div class="gracias"><div style="font-size:60px">${ic}</div><h1 class="mega" style="font-size:clamp(40px,12vw,64px)">${titulo}</h1><p class="lead" style="margin:14px auto">${texto}</p>${extra}</div><p class="pie">Votación oficial de Fight2One</p>`); }

async function cargar(){
  if(!/^[0-9a-f-]{36}$/i.test(ID)){ estado('🤔','Enlace no válido','Vuelve a escanear el código QR del pabellón.'); return; }
  try{ P=await rpc('f2o_vot_papeleta',{p_votacion:ID}); }
  catch(e){ estado('📶','Sin conexión','No hemos podido cargar la votación. Revisa tu conexión y prueba otra vez.',`<button class="cta" onclick="location.reload()">Reintentar</button>`); return; }
  if(!P){ estado('🤔','No existe','Vuelve a escanear el código QR del pabellón.'); return; }
  clearTimeout(_espera);
  CATS=P.categorias.filter(c=>c.opciones.length);
  if(leer('f2o_votado_'+ID)){ gracias(JSON.parse(leer('f2o_mivoto_'+ID)||'null')); return; }
  if(P.estado==='terminada'){ terminada(); return; }
  portada();
  if(P.estado==='cerrada') _espera=setTimeout(cargar,20000+Math.random()*10000);
}

function portada(){
  const abierta=P.estado==='abierta';
  mostrar(`${cab()}<section class="portada">
    <div class="sello"><img src="${LOGO}" alt=""></div>
    <div class="eyebrow">${esc(P.velada||'Fight2One')} · Votación oficial</div>
    <h1 class="mega"><span class="glitch" data-t="Tu voto">Tu voto</span><em class="glitch" data-t="decide">decide</em></h1>
    <p class="lead">${CATS.length===1?'Elige':'Elige en '+CATS.length+' categorías'} quién ha sido lo mejor de la noche. Solo tienes un voto: que cuente.</p>
    ${abierta?`<button class="cta" id="empezar">Empezar ⟶</button><p class="nota">Tarda 20 segundos · sin registrarte</p>`
      :`<div class="espera"><i></i>La votación se abre durante la velada</div><p class="nota">Deja esta página abierta: se actualiza sola.</p>`}
  </section>`,false);
  $('#empezar')?.addEventListener('click',()=>{ vibrar(15); PASO=0; paso(); });
}

function tarjeta(o,i,cat){
  const on=ELEC[cat.id]===o.id;
  if(o.foto_a||o.foto_b||/ vs /i.test(o.etiqueta)&&!o.foto){ const [a,b]=o.etiqueta.split(/ vs /i);
    return `<button class="tarjeta vs ${on?'on':''}" style="--n:${i}" data-op="${o.id}" aria-pressed="${on}">
      ${o.foto_a?`<span class="ft" style="background-image:url('${esc(foto(o.foto_a))}')"></span>`:`<span class="ft ini" style="right:50%">${esc(iniciales(a))}</span>`}
      ${o.foto_b?`<span class="ft b" style="background-image:url('${esc(foto(o.foto_b))}')"></span>`:`<span class="ft b ini" style="left:50%">${esc(iniciales(b))}</span>`}
      <span class="x">VS</span><span class="tx"><b>${esc(o.etiqueta)}</b>${o.detalle?`<small>${esc(o.detalle)}</small>`:''}</span></button>`; }
  return `<button class="tarjeta ${on?'on':''}" style="--n:${i}" data-op="${o.id}" aria-pressed="${on}">
    ${o.foto?`<span class="ft" style="background-image:url('${esc(foto(o.foto))}')"></span>`:`<span class="ini">${esc(iniciales(o.etiqueta))}</span>`}
    <span class="tx"><b>${esc(o.etiqueta)}</b>${o.detalle?`<small>${esc(o.detalle)}</small>`:''}</span></button>`;
}
function paso(){
  const c=CATS[PASO]; const esVS=c.opciones.some(o=>o.foto_a||o.foto_b||/ vs /i.test(o.etiqueta));
  mostrar(`<div class="cab">${marca()}<button class="atras" id="atras">${PASO?'← Atrás':'✕'}</button></div>
    <div class="progreso">${CATS.map((x,i)=>`<span class="${i<PASO||ELEC[x.id]&&i===PASO?'hecho':''}"><i></i></span>`).join('')}<span><i></i></span></div>
    <section class="paso"><div class="paso-n">Categoría ${PASO+1} de ${CATS.length}</div><h2>${esc(c.nombre)}</h2>
      <div class="rejilla ${esVS?'vs':''} ${ELEC[c.id]?'otro':''}" id="rejilla">${c.opciones.map((o,i)=>tarjeta(o,i,c)).join('')}</div></section>`);
  setTimeout(()=>{
    $('#atras').onclick=()=>{ vibrar(10); if(PASO){ PASO--; paso(); } else portada(); };
    $('#rejilla').addEventListener('click',e=>{ const b=e.target.closest('.tarjeta'); if(!b) return;
      ELEC[c.id]=b.dataset.op; vibrar(25);
      $('#rejilla').classList.add('otro'); document.querySelectorAll('.tarjeta').forEach(t=>{ t.classList.toggle('on',t===b); t.setAttribute('aria-pressed',t===b); });
      document.querySelectorAll('.progreso span')[PASO].classList.add('hecho');
      clearTimeout(window._sig); window._sig=setTimeout(()=>{ if(PASO<CATS.length-1){ PASO++; paso(); } else resumen(); },650); });
  },QUIETO?0:280);
}
const opcion=(c,id)=>c.opciones.find(o=>o.id===id);
function resumen(){
  mostrar(`<div class="cab">${marca()}<button class="atras" id="atras">← Atrás</button></div>
    <div class="progreso">${CATS.map(()=>'<span class="hecho"><i></i></span>').join('')}<span><i style="width:60%"></i></span></div>
    <div class="paso-n">Último paso</div><h2 class="anton" style="font-size:clamp(34px,10vw,52px);margin:6px 0 16px;line-height:.95">Tu cartel</h2>
    <div class="cartel">${CATS.map((c,i)=>{ const o=opcion(c,ELEC[c.id]); const f=o.foto||o.foto_a;
      return `<div class="eleccion" style="--n:${i}"><span class="mini" style="${f?`background-image:url('${esc(foto(f))}')`:''}">${f?'':esc(iniciales(o.etiqueta))}</span><span><small>${esc(c.nombre)}</small><b>${esc(o.etiqueta)}</b></span><button data-cambiar="${i}">Cambiar</button></div>`; }).join('')}</div>
    ${P.requiere_codigo?`<div class="codigo"><label for="cod">Código de tu entrada</label><input id="cod" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="ABC123" value="${esc(leer('f2o_cod_'+ID)||'')}"><small>Lo tienes impreso en tu entrada. Cada código vota una sola vez.</small></div>`:''}
    <div class="pie-fijo"><p class="error" id="err" role="alert"></p><button class="cta" id="enviar">Enviar mi voto 🥊</button><p class="nota">Una vez enviado no se puede cambiar.</p></div>`);
  setTimeout(()=>{
    $('#atras').onclick=()=>{ PASO=CATS.length-1; paso(); };
    document.querySelectorAll('[data-cambiar]').forEach(b=>b.onclick=()=>{ PASO=Number(b.dataset.cambiar); paso(); });
    $('#enviar').onclick=enviar;
  },QUIETO?0:280);
}

async function enviar(){
  const b=$('#enviar'), err=$('#err'); err.textContent='';
  const cod=$('#cod')?.value.trim()||null;
  if(P.requiere_codigo&&!cod){ err.textContent='Escribe el código de tu entrada.'; $('#cod').focus(); return; }
  b.disabled=true; b.textContent='Enviando…';
  try{
    const r=await rpc('f2o_vot_votar',{p_votacion:ID,p_votante:votante(),p_codigo:cod,p_votos:CATS.map(c=>({categoria:c.id,opcion:ELEC[c.id]}))});
    if(r.ok||r.error==='ya_votado'){
      const mio=CATS.map(c=>{ const o=opcion(c,ELEC[c.id]); return {cat:c.nombre,etiqueta:o.etiqueta,foto:o.foto||o.foto_a||'',foto_b:o.foto_b||''}; });
      guardar('f2o_votado_'+ID,'1'); guardar('f2o_mivoto_'+ID,JSON.stringify(mio));
      golpe(); setTimeout(()=>gracias(mio,r.error==='ya_votado'),QUIETO?0:550); return; }
    if(r.error==='codigo') err.textContent='Ese código no es válido. Revísalo en tu entrada.';
    else if(r.error==='cerrada'){ err.textContent='La votación está cerrada en este momento.'; }
    else err.textContent='No se pudo guardar el voto. Prueba otra vez.';
  }catch(e){ err.textContent='Sin conexión. Prueba otra vez en unos segundos.'; }
  b.disabled=false; b.textContent='Enviar mi voto 🥊';
}

/* El «golpe»: destello, temblor y chispas doradas */
function golpe(){ vibrar([40,40,90]); if(QUIETO) return;
  const f=$('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  document.body.classList.remove('temblor'); void document.body.offsetWidth; document.body.classList.add('temblor');
  chispas(innerWidth/2,innerHeight*.6,140); }
function chispas(x,y,n){
  const c=document.createElement('canvas'); c.className='chispas'; const d=devicePixelRatio||1; c.width=innerWidth*d; c.height=innerHeight*d; document.body.appendChild(c);
  const g=c.getContext('2d'); g.scale(d,d);
  const P_=Array.from({length:n},()=>{ const a=Math.random()*Math.PI*2, v=4+Math.random()*10; return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,v:1,r:1+Math.random()*2.6,c:Math.random()<.75?'#ffd863':Math.random()<.5?'#22e1d7':'#ff3d6e'}; });
  const t0=performance.now();
  (function f(t){ g.clearRect(0,0,innerWidth,innerHeight); let vivos=0;
    P_.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.32; p.vx*=.985; p.v-=.012; if(p.v>0){ vivos++; g.globalAlpha=p.v; g.fillStyle=p.c; g.beginPath(); g.arc(p.x,p.y,p.r,0,7); g.fill(); } });
    if(vivos&&t-t0<3500) requestAnimationFrame(f); else c.remove(); })(t0);
}

/* Imagen para Instagram Stories (1080×1920) */
const conTiempo=(p,ms,v=null)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(v),ms))]);
const cargarImg=src=>conTiempo(new Promise(r=>{ if(!src) return r(null); const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }),6000);
function redondo(g,x,y,w,h,r){ if(g.roundRect) return g.roundRect(x,y,w,h,r); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function aBlob(c){ return new Promise(r=>{ const desdeURL=()=>fetch(c.toDataURL('image/jpeg',.9)).then(x=>x.blob()).then(r,()=>r(null));
  if(!c.toBlob) return desdeURL(); try{ c.toBlob(b=>b?r(b):desdeURL(),'image/jpeg',.9); }catch(e){ desdeURL(); } }); }
function cubrir(g,img,x,y,w,h,foco=.2){ const k=Math.max(w/img.width,h/img.height), iw=img.width*k, ih=img.height*k; g.drawImage(img,x+(w-iw)/2,y+(h-ih)*foco,iw,ih); }
async function crearStory(mio){
  await conTiempo(document.fonts?.ready||Promise.resolve(),1500);
  const W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const principal=mio[0];
  const [bg,logo,f1,f2]=await Promise.all([cargarImg(FONDOS[0]),cargarImg(LOGO),cargarImg(foto(principal.foto)),cargarImg(foto(principal.foto_b))]);
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  if(bg){ g.globalAlpha=.45; cubrir(g,bg,0,0,W,H,.5); g.globalAlpha=1; }
  let gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'rgba(0,0,0,.5)'); gr.addColorStop(.55,'rgba(0,0,0,.2)'); gr.addColorStop(1,'#000'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  // marco de la foto
  const fx=140,fy=430,fw=800,fh=880;
  g.save(); g.beginPath(); redondo(g,fx,fy,fw,fh,40); g.clip(); g.fillStyle='#18181b'; g.fillRect(fx,fy,fw,fh);
  if(f1&&f2){ cubrir(g,f1,fx,fy,fw/2,fh); cubrir(g,f2,fx+fw/2,fy,fw/2,fh); }
  else if(f1) cubrir(g,f1,fx,fy,fw,fh);
  else { g.fillStyle='rgba(212,167,44,.25)'; g.font='400 300px Anton'; g.textAlign='center'; g.fillText(iniciales(principal.etiqueta),W/2,fy+fh/2+110); }
  gr=g.createLinearGradient(0,fy+fh*.5,0,fy+fh); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.85)'); g.fillStyle=gr; g.fillRect(fx,fy,fw,fh); g.restore();
  g.strokeStyle='#d4a72c'; g.lineWidth=6; g.beginPath(); redondo(g,fx,fy,fw,fh,40); g.stroke();
  // textos
  g.textAlign='center'; g.fillStyle='#d4a72c'; g.font='800 34px "Inter Tight"'; g.fillText((P?.velada||'FIGHT2ONE').toUpperCase()+'  ·  VOTACIÓN OFICIAL',W/2,190);
  const titulo=(t,y,size,col)=>{ g.font=`400 ${size}px Anton`; g.globalAlpha=.7; g.fillStyle='#22e1d7'; g.fillText(t,W/2-5,y); g.fillStyle='#ff3d6e'; g.fillText(t,W/2+5,y); g.globalAlpha=1; g.fillStyle=col; g.fillText(t,W/2,y); };
  titulo('HE VOTADO',380,150,'#f5f5f4');
  g.fillStyle='#d4a72c'; g.font='800 32px "Inter Tight"'; g.fillText(principal.cat.toUpperCase(),W/2,fy+fh-185);
  let size=110; g.font=`400 ${size}px Anton`; while(g.measureText(principal.etiqueta.toUpperCase()).width>fw-80&&size>50){ size-=6; g.font=`400 ${size}px Anton`; }
  g.fillStyle='#fff'; g.fillText(principal.etiqueta.toUpperCase(),W/2,fy+fh-50);
  let y=fy+fh+110; mio.slice(1,3).forEach(m=>{ g.fillStyle='#a3a3a8'; g.font='800 28px "Inter Tight"'; g.fillText(m.cat.toUpperCase(),W/2,y); g.fillStyle='#f5f5f4'; g.font='400 56px Anton'; g.fillText(m.etiqueta.toUpperCase(),W/2,y+64); y+=150; });
  if(logo){ g.save(); g.beginPath(); redondo(g,W/2-60,H-250,120,120,26); g.clip(); g.drawImage(logo,W/2-60,H-250,120,120); g.restore(); }
  g.fillStyle='#f5f5f4'; g.font='800 36px "Inter Tight"'; g.fillText('@fight2one',W/2,H-80);
  return aBlob(c);
}

async function resultadosHTML(){
  try{ const R=await rpc('f2o_vot_resultados',{p_votacion:ID}); if(!R||R.privado||!R.categorias?.length||R.categorias[0].opciones?.[0]?.votos==null) return '';
    return `<div class="res">${R.categorias.map(c=>{ const tot=c.opciones.reduce((a,o)=>a+o.votos,0)||1; return `<h3>${esc(c.nombre)}</h3>`+
      [...c.opciones].sort((a,b)=>b.votos-a.votos).slice(0,5).map((o,i)=>`<div class="fila"><div><span>${i===0&&o.votos?'🏆 ':''}${esc(o.etiqueta)}</span><span>${Math.round(o.votos*100/tot)}%</span></div><div class="bar"><i style="width:${o.votos*100/tot}%"></i></div></div>`).join(''); }).join('')}</div>`; }
  catch(e){ return ''; }
}
async function gracias(mio,repetido){
  clearTimeout(_espera);
  await mostrar(`${cab()}<section class="gracias">
    <div><span class="estampa">${repetido?'Ya votaste':'Voto registrado'}</span></div>
    <h1 class="mega" style="font-size:clamp(44px,13vw,72px)">${repetido?'Tu voto<em>ya cuenta</em>':'Ya eres parte<em>de la noche</em>'}</h1>
    <p class="lead" style="margin:14px auto 0">${repetido?'Desde este móvil ya se votó. Solo cuenta un voto por persona.':'Los ganadores se anuncian en la pantalla grande del pabellón. ¡Atento!'}</p>
    ${mio?`<div class="story" id="story"><div class="spin" style="margin-top:60%"></div></div>
      <button class="cta" id="compartir" disabled>Preparando tu imagen…</button><p class="nota" id="nota-story"></p>`:''}
    <a class="btn2" href="https://www.instagram.com/fight2one/" target="_blank" rel="noopener">Sigue a @fight2one</a>
    <div id="res"></div></section><p class="pie">Votación oficial de Fight2One</p>`,!repetido);
  if(mio){ const btn=$('#compartir'), nota=$('#nota-story'), caja=$('#story');
    try{
      const blob=await conTiempo(crearStory(mio),15000); if(!blob) throw new Error('sin imagen');
      const url=URL.createObjectURL(blob); caja.innerHTML=`<img src="${url}" alt="Tu voto en formato Story">`;
      let file=null; try{ file=new File([blob],'mi-voto-fight2one.jpg',{type:'image/jpeg'}); }catch(e){}
      const puedeCompartir=!!(file&&navigator.canShare?.({files:[file]}));
      btn.disabled=false; btn.textContent=puedeCompartir?'Compartir en Stories 📲':'Guardar imagen 📲';
      nota.textContent=puedeCompartir?'Elige Instagram → Historia. Etiqueta a @fight2one.':'Si no se guarda sola, mantén pulsada la imagen y elige «Guardar».';
      btn.onclick=async()=>{ vibrar(15);
        if(puedeCompartir){ try{ await navigator.share({files:[file],text:'He votado en '+(P?.velada||'Fight2One')+' 🥊 @fight2one'}); return; }catch(e){ if(e?.name==='AbortError') return; } }
        const a=document.createElement('a'); a.href=url; a.download='mi-voto-fight2one.jpg'; document.body.appendChild(a); a.click(); a.remove(); };
    }catch(e){ caja.remove(); btn.remove(); nota.textContent=''; console.warn('Story:',e); } }
  $('#res').innerHTML=await resultadosHTML();
  if(P?.estado==='abierta'&&!P.resultados_publicos) _espera=setTimeout(async()=>{ try{ P=await rpc('f2o_vot_papeleta',{p_votacion:ID}); if(P?.resultados_publicos) $('#res').innerHTML=await resultadosHTML(); }catch(e){} },45000+Math.random()*15000);
}
async function terminada(){ estado('🏁','Votación<em>cerrada</em>','Gracias a todos los que habéis votado. Los ganadores se anuncian en el pabellón.',await resultadosHTML()); }

cargar();
</script>
