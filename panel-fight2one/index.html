<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Fight2One · Panel</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#000;--p1:#0f0f10;--p2:#19191b;--p3:#232326;--line:#2c2c30;--ink:#f4f4f4;--mut:#a3a3a8;--acc:#d4a72c;--acc2:#b88a12;--accsoft:#2a2108;--red:#ff5a68;--redsoft:#3a1418;--ok:#3ecf8e;--oksoft:#0f2b20;--amb:#f0b43c;--ambsoft:#33270b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{margin:0}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.04em}
.oculto{display:none!important}
/* Entrada */
#entrada{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(800px 400px at 50% -10%,#d4a72c22,transparent 70%),#000}
.caja-entrada{width:min(380px,100%);background:var(--p1);border:1px solid var(--line);border-radius:22px;padding:26px 22px;text-align:center}
.caja-entrada img{width:72px;height:72px;border-radius:16px}
.caja-entrada h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;letter-spacing:.05em;margin:12px 0 2px}
.caja-entrada p{color:var(--mut);margin:0 0 18px;font-size:14px}
.campo{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:12px}
.campo>span{font-size:13px;font-weight:700;color:var(--mut)}
.campo input,.campo select,.campo textarea{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--acc)}
.campo textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:1px solid var(--line);background:var(--p2);border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#000}
.btn.peligro{color:var(--red)}
.btn.ancho{width:100%}
.btn.peq{min-height:38px;padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5}
.error{color:var(--red);font-size:13.5px;min-height:18px;margin:6px 0 0}
.aviso-app{font-size:13px;color:var(--amb);background:var(--ambsoft);border-radius:12px;padding:10px 12px;margin:10px 0 0;text-align:left}
.instalar{display:flex;gap:12px;align-items:center;background:var(--p1);border:1px solid #d4a72c55;border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.instalar p{margin:0;font-size:14px;color:var(--mut)}
.instalar b{color:var(--ink)}
/* Estructura */
#app{min-height:100vh}
.cab{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.cab img{width:34px;height:34px;border-radius:9px}
.cab .velada{flex:1;min-width:0}
.cab select{width:100%;max-width:320px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;font-size:15px}
.cab .yo{border:1px solid var(--line);background:var(--p2);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.lateral{display:none}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:900px;margin:0 auto}
main.lleno{max-width:none;padding:0}
.abajo{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,10,11,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.abajo button,.lateral button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--mut);border-radius:12px}
.abajo button .i{font-size:22px;line-height:1}
.abajo button.on,.lateral button.on{color:var(--acc)}
.titulo{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.titulo h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:.04em}
.titulo .btn{margin-left:auto}
.sub{color:var(--mut);font-size:14px;margin:-8px 0 14px}
.tarjeta{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.lista{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:64px}
.item:active{background:var(--p2)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:16px}
.item .t small{display:block;color:var(--mut);font-size:13.5px;margin-top:2px;line-height:1.35}
.item .d{text-align:right;font-weight:800;white-space:nowrap}
.item .ic{font-size:24px;width:32px;text-align:center;flex:0 0 auto}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.ok{background:var(--oksoft);color:var(--ok)}.tag.no{background:var(--redsoft);color:var(--red)}.tag.med{background:var(--ambsoft);color:var(--amb)}.tag.gris{background:var(--p3);color:var(--mut)}
.vacio{text-align:center;color:var(--mut);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.vacio b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.grupo{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
/* Inicio */
.portada{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#1a1405,#0b0b0c);border:1px solid #d4a72c55;border-radius:20px;padding:16px;margin-bottom:14px}
.dona{position:relative;width:86px;height:86px;flex:0 0 auto}
.dona svg{transform:rotate(-90deg)}
.dona b{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px}
.portada h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1.05}
.portada p{margin:4px 0 0;color:var(--mut);font-size:14px}
.atajos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.atajo{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--p1);border-radius:var(--r);padding:14px;text-align:left;min-height:86px}
.atajo .i{font-size:26px}
.atajo b{font-size:15px}
.atajo small{color:var(--mut);font-size:12.5px}
.falta .item{border-left:4px solid var(--amb)}
.falta .item.urg{border-left-color:var(--red)}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.cifra{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cifra small{color:var(--mut);font-size:12.5px;font-weight:700}
.cifra b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.02em;margin-top:2px}
.cifra.ok b{color:var(--ok)}.cifra.no b{color:var(--red)}.cifra.acc b{color:var(--acc)}
/* Combates */
.combate{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.combate .arriba{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0 8px}
.vs .p{font-weight:800;font-size:16px}
.vs .p small{display:block;font-weight:600;color:var(--mut);font-size:12.5px}
.vs .p.b{text-align:right}
.vs .x{font-family:Anton,Impact,sans-serif;color:var(--acc);font-size:18px}
.papeles{display:flex;flex-wrap:wrap;gap:6px}
/* Viajes */
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--p2);border-radius:999px;padding:10px 14px;font-weight:700;font-size:14px;min-height:44px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.cont{display:flex;align-items:center;gap:8px}
.cont button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--p2);font-weight:800;font-size:15px}
/* Formulario */
.velo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.form{width:min(560px,100%);max-height:92vh;overflow-y:auto;background:#0e0e0f;border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.form .fcab{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.form h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.04em}
.form .x{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--p2);font-size:18px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .pie{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:-18px;background:#0e0e0f;padding:10px 0 4px}
.form .pie .btn{flex:1}
.pant-prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--acc);background:#000;margin:0 0 10px;box-shadow:0 0 0 3px rgba(212,167,44,.15)}
.pant-prev iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
.pant-vivo{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.75);color:#3ecf8e;font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px}
.item.on-pant{border-color:var(--acc);box-shadow:0 0 0 2px rgba(212,167,44,.35)}
.check{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-weight:700;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--acc)}
.bloque{border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0 12px}
.bloque>b{display:block;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);z-index:60;background:var(--ink);color:#000;font-weight:800;border-radius:999px;padding:12px 18px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.mal{background:var(--red);color:#fff}
.marco3d{position:relative;height:calc(100vh - 62px - 72px - env(safe-area-inset-bottom));border:none;width:100%;display:block;background:#000}
.menu-mas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ───────── Motion Fight2One ───────── */
@keyframes f2o-brillo{0%{transform:translateX(-140%) skewX(-20deg)}55%,100%{transform:translateX(240%) skewX(-20deg)}}
@keyframes f2o-latido{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #d4a72c00)}50%{transform:scale(1.06);filter:drop-shadow(0 0 22px #d4a72caa)}}
@keyframes f2o-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes f2o-sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes f2o-letra{from{opacity:0;transform:translateY(60%) scaleY(1.4);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes f2o-barra{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes f2o-gira{to{transform:rotate(360deg)}}
@keyframes f2o-luz{0%,100%{transform:translate(-20%,-10%)}50%{transform:translate(20%,10%)}}
@keyframes f2o-anillo{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes f2o-dona{from{stroke-dasharray:0 227}}
@keyframes f2o-pop{0%{transform:translateX(-50%) translateY(20px) scale(.9)}60%{transform:translateX(-50%) translateY(-4px) scale(1.03)}100%{transform:translateX(-50%) scale(1)}}
/* Logo con brillo dorado que pasa */
.logo-f2o{position:relative;display:inline-block;overflow:hidden;border-radius:22%;flex:0 0 auto;line-height:0}
.logo-f2o img{display:block;width:100%;height:100%}
.logo-f2o::after{content:"";position:absolute;inset:-10% auto -10% 0;width:40%;background:linear-gradient(90deg,transparent,#fff6,#ffe7a0aa,#fff6,transparent);transform:translateX(-140%) skewX(-20deg);animation:f2o-brillo 4.5s ease-in-out infinite 1s;pointer-events:none}
/* Pantalla de carga */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(600px 380px at 50% 45%,#d4a72c26,transparent 70%),#000;transition:opacity .55s ease,visibility .55s}
#intro.fuera{opacity:0;visibility:hidden}
#intro .centro{display:flex;flex-direction:column;align-items:center;gap:18px}
#intro .marco{position:relative;width:118px;height:118px}
#intro .marco .logo-f2o{width:118px;height:118px;animation:f2o-latido 1.6s ease-in-out infinite}
#intro .marco::before,#intro .marco::after{content:"";position:absolute;inset:0;border:2px solid #d4a72c;border-radius:30%;animation:f2o-anillo 1.6s ease-out infinite}
#intro .marco::after{animation-delay:.8s}
#intro h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;letter-spacing:.08em;margin:0;display:flex;overflow:hidden}
#intro h1 span{display:inline-block;animation:f2o-letra .5s cubic-bezier(.2,.8,.2,1) both}
#intro h1 .o{color:var(--acc)}
#intro .lema{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.32em;text-transform:uppercase;animation:f2o-sube .6s .55s both}
#intro .barra{width:180px;height:3px;border-radius:3px;background:#1d1d20;overflow:hidden}
#intro .barra i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--acc),#ffe7a0,var(--acc),transparent);animation:f2o-barra 1.1s ease-in-out infinite}
/* Entrada (login) */
#entrada{position:relative;overflow:hidden}
#entrada::before{content:"";position:absolute;inset:-30%;background:radial-gradient(420px 300px at 30% 30%,#d4a72c1f,transparent 70%),radial-gradient(380px 280px at 70% 70%,#d4a72c14,transparent 70%);animation:f2o-luz 14s ease-in-out infinite;pointer-events:none}
#entrada::after{content:"";position:absolute;inset:0;background:url(logo.jpg) center/520px no-repeat;opacity:.035;filter:grayscale(1);animation:f2o-gira 120s linear infinite;pointer-events:none}
.caja-entrada{position:relative;z-index:1;animation:f2o-sube .6s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 30px 80px #000c,0 0 0 1px #d4a72c22}
.caja-entrada .logo-f2o{width:84px;height:84px;animation:f2o-flota 4s ease-in-out infinite}
.caja-entrada h1{background:linear-gradient(90deg,#f4f4f4 0%,#f4f4f4 40%,#ffd86b 50%,#f4f4f4 60%,#f4f4f4 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:f2o-texto 5s linear infinite}
@keyframes f2o-texto{from{background-position:100% 0}to{background-position:-150% 0}}
/* Cabecera */
.cab .logo-f2o{width:34px;height:34px;border-radius:9px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cab .logo-f2o:hover{transform:rotate(-8deg) scale(1.08)}
.cab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#d4a72c88,transparent);background-size:50% 100%;background-repeat:no-repeat;animation:f2o-linea 6s linear infinite}
@keyframes f2o-linea{from{background-position:-50% 0}to{background-position:150% 0}}
/* Botones y menús */
.btn,.atajo,.item,.combate,.chip,.abajo button,.lateral button{transition:transform .15s ease,background-color .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:active,.atajo:active,.item:active,.combate:active,.chip:active{transform:scale(.97)}
.btn.acc{position:relative;overflow:hidden}
.btn.acc::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(90deg,transparent,#fff7,transparent);transform:translateX(-140%) skewX(-20deg);animation:f2o-brillo 5s ease-in-out infinite 2s;pointer-events:none}
@media (hover:hover){ .atajo:hover,.item:hover,.combate:hover{border-color:#d4a72c88;transform:translateY(-2px);box-shadow:0 8px 24px #0008,0 0 0 1px #d4a72c22} .btn:hover{border-color:#d4a72c88} }
.lateral button{position:relative}
.lateral button::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--acc);transform:scaleY(0);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.lateral button.on::before{transform:scaleY(1)}
.lateral button.on .i,.abajo button.on .i{animation:f2o-salto .45s cubic-bezier(.2,.8,.2,1)}
@keyframes f2o-salto{0%{transform:scale(1)}40%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1)}}
.lateral .marca{display:flex;align-items:center;gap:10px;margin-top:auto;padding:14px 8px 4px;opacity:.55;font-family:Anton,Impact,sans-serif;letter-spacing:.08em;font-size:13px;color:var(--mut)}
.lateral .marca .logo-f2o{width:26px;height:26px;border-radius:7px}
/* Entrada de cada pantalla, en cascada */
main.entra>*{animation:f2o-sube .45s cubic-bezier(.2,.8,.2,1) both}
main.entra>*:nth-child(2){animation-delay:.05s}main.entra>*:nth-child(3){animation-delay:.1s}main.entra>*:nth-child(4){animation-delay:.15s}main.entra>*:nth-child(n+5){animation-delay:.2s}
main.entra :is(.lista,.atajos,.cifras,.menu-mas,.chip-row)>*{animation:f2o-sube .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.12s + var(--n,0)*.045s)}
main.entra.lleno>*{animation:f2o-aparece .5s both}
@keyframes f2o-aparece{from{opacity:0}to{opacity:1}}
/* Portada del inicio */
.portada{position:relative;overflow:hidden;isolation:isolate}
.portada::before{content:"";position:absolute;right:-50px;top:50%;width:230px;height:230px;margin-top:-115px;background:url(logo.jpg) center/contain no-repeat;opacity:.09;filter:grayscale(.3);animation:f2o-gira 60s linear infinite;z-index:-1;border-radius:50%}
.portada::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#d4a72c1c 50%,transparent 70%);background-size:250% 100%;animation:f2o-texto 7s linear infinite;z-index:-1;pointer-events:none}
.dona circle+circle{animation:f2o-dona 1.2s cubic-bezier(.2,.8,.2,1) both .2s}
.falta .item.urg{animation:f2o-urgente 2.4s ease-in-out infinite}
@keyframes f2o-urgente{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 1px #ff5a6855,0 0 18px #ff5a6833}}
.vacio{position:relative;overflow:hidden}
.vacio::before{content:"";display:block;width:46px;height:46px;margin:0 auto 10px;background:url(logo.jpg) center/contain no-repeat;border-radius:12px;opacity:.85;animation:f2o-flota 4s ease-in-out infinite}
/* Formularios y avisos */
.velo{animation:f2o-aparece .2s both}
.velo .form{animation:f2o-sube .3s cubic-bezier(.2,.8,.2,1) both}
.toast.on{animation:f2o-pop .35s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
@media print{ .cab,.lateral,.abajo,.titulo .btn,.toast{display:none!important} main{margin:0!important;padding:0!important} body{background:#fff;color:#000} .tarjeta{border:none;background:#fff;color:#000} .sub,.grupo{color:#444!important} }
@media (min-width:900px){
  .abajo{display:none}
  .lateral{display:flex;flex-direction:column;gap:4px;position:fixed;top:63px;left:0;bottom:0;width:220px;padding:14px 10px;border-right:1px solid var(--line);background:#050505;overflow-y:auto}

/* ───────── Cálculos ───────── */
const pel=id=>S.peleadores.find(p=>p.id===id);

function dinero(){

    merch=S.merch.reduce((a,m)=>a+m.vendidas*m.precio,0);
  const bolsas=S.combates.filter(c=>c.estado!=='cancelado').reduce((a,c)=>a+Number(c.bolsa_a)+Number(c.bolsa_b)+Number(c.ajuste_a||0)+Number(c.ajuste_b||0),0), bolsasPag=S.combates.filter(c=>c.estado!=='cancelado').reduce((a,c)=>a+Number(c.pagado_a)+Number(c.pagado_b),0);

  const ingresos=entradas+patro+merch, total=bolsas+gastos+equipo+viajes, pagado=bolsasPag+gastosPag+equipoPag+viajesPag;
  return { entradas,patro,merch,ingresos,bolsas,bolsasPag,gastos,equipo,viajes,total,pagado,porPagar:total-pagado,balance:ingresos-total };

  const conf=S.combates.filter(c=>c.estado==='confirmado').length, ids=peleadoresVelada(), pap=ids.length*TIPOS_PAPEL.length, papOk=ids.reduce((a,id)=>a+papelesDe(id).filter(x=>x.fila?.estado==='ok').length,0);

  const d=dinero(), patroObj=Number(v.objetivo_patrocinio)||0;

  return partes.reduce((a,[x,w])=>a+x*w,0)/partes.reduce((a,[,w])=>a+w,0);
}

/* ───────── Lo que falta (para que Moi no tenga que acordarse de nada) ───────── */
function loQueFalta(){

/* ───────── Pintar secciones ───────── */
function pintar(){
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===SECCION||(SECCION!=='inicio'&&!ABAJO.includes(SECCION)&&b.dataset.s==='mas'&&b.closest('.abajo'))));
  const m=$('#main'); m.classList.toggle('lleno',SECCION==='estadio'||SECCION==='vuelos3d');
  if(!S.velada&&!['peleadores','mas','archivos'].includes(SECCION)){ m.innerHTML=`<div class="vacio" style="margin-top:30px"><b>Aún no hay ninguna velada</b>Crea la primera para empezar.<br><br><button class="btn acc" onclick="abrirForm('velada')">+ Nueva velada</button></div>`; return; }
  const f=PANTALLAS[SECCION]||PANTALLAS.inicio; m.innerHTML=f();
  const nueva=SECCION+'|'+(S.velada&&S.velada.id); if(nueva!==_ultimaPantalla){ _ultimaPantalla=nueva; animarPantalla(m); }
}
let _ultimaPantalla='';
function animarPantalla(m){
  m.classList.remove('entra'); void m.offsetWidth; m.classList.add('entra');
  m.querySelectorAll(':is(.lista,.atajos,.cifras,.menu-mas,.chip-row)').forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty('--n',Math.min(i,12))));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  // Las cifras cuentan hacia arriba
  m.querySelectorAll('.cifra b,.dona b,.atajo b').forEach(el=>{
    const t=el.textContent.trim(), r=t.match(/^(-?[\d.]+)(\s?(?:%|€|de .*)?)$/); if(!r) return;
    const fin=Number(r[1].replace(/\./g,'')); if(!isFinite(fin)||fin===0) return;
    const ini=performance.now(), dur=900;
    const paso=ahora=>{ const k=Math.min(1,(ahora-ini)/dur), e=1-Math.pow(1-k,3); el.textContent=Math.round(fin*e).toLocaleString('es-ES')+r[2]; if(k<1) requestAnimationFrame(paso); else el.textContent=t; };
    requestAnimationFrame(paso);
  });
}

  archivos(){ const f=FILTRO_ARCH, l=S.archivos.filter(a=>f==='todos'||(f==='peleadores'&&a.peleador_id)||(f==='patro'&&a.patrocinador_id)||(f==='velada'&&!a.peleador_id&&!a.patrocinador_id&&a.velada_id===S.velada?.id));

  dia(){ const l=S.programa, hechos=l.filter(x=>x.hecho).length;
    return `<div class="titulo"><h2>DÍA DE LA VELADA</h2><button class="btn acc peq" onclick="abrirForm('programa')">+ Añadir</button></div>
      <p class="sub">El horario de la víspera y del día, minuto a minuto. ${l.length?`${hechos} de ${l.length} hechos.`:''}</p>

      :`<div class="vacio"><b>Sin horario todavía</b>Puedes cargar el horario habitual de una velada y cambiar lo que quieras.<br><br><button class="btn acc" onclick="cargarHorario(this)">Cargar horario habitual</button></div>`}`; },

  pesaje(){ const tol=Number(S.velada.tolerancia_kg??0.5), cs=S.combates.filter(c=>c.estado!=='cancelado');
    return `<div class="titulo"><h2>PESAJE</h2></div><p class="sub">Peso pactado de cada combate + margen de ${String(tol).replace('.',',')} kg (se cambia en Velada).</p>

        const fila=id=>{ if(!id) return ''; const w=estadoPeso(c,id,tol); return `<div class="item" style="padding:10px 12px"><span class="t"><b>${esc(nombrePel(id))}</b><small>${w.ultimo?`${String(w.ultimo.peso).replace('.',',')} kg · ${w.ultimo.tipo} · ${horaCorta(w.ultimo.hora)}`:'Sin pesar'}</small></span><span class="tag ${w.cls}">${w.txt}</span><button class="btn acc peq" onclick="abrirForm('pesaje',null,{peleador_id:'${id}',combate_id:'${c.id}'})">⚖️ Pesar</button></div>`; };
        return `<div class="tarjeta"><div class="sub" style="margin:0 0 8px;font-weight:700">${esc([c.modalidad,c.peso?'pactado '+c.peso:'sin peso pactado',c.titulo].filter(Boolean).join(' · '))}${pac?'':` · <a href="#" onclick="abrirForm('combate','${c.id}');return false">poner peso</a>`}</div><div class="lista">${fila(c.peleador_a)}${fila(c.peleador_b)}</div></div>`; }).join('')}</div>`
      :'<div class="vacio">Primero añade los combates con su peso pactado.</div>'}`; },

  pagos(){ const ids=peleadoresVelada();

          <button class="btn peq ancho" style="margin-top:8px" onclick="abrirForm('pago',null,{peleador_id:'${id}'})">+ Apuntar pago a ${esc(nombrePel(id).split(' ')[0])}</button></div>`; }).join('')}</div>`

  mensajes(){ const pl=PLANTILLAS[PLANTILLA]; const gente=pl.para();

      <div class="chip-row" style="margin-bottom:14px">${Object.entries(PLANTILLAS).map(([k,x])=>`<button class="chip ${k===PLANTILLA?'on':''}" onclick="elegirPlantilla('${k}')">${x.nom}</button>`).join('')}</div>

  informe(){ return `<div class="titulo"><h2>INFORME</h2><button class="btn acc peq" onclick="window.print()">🖨️ Imprimir o PDF</button></div><div id="informe">${informeHTML()}</div>`; },

  votacion(){ const V=S.vot;

        <button class="btn acc" onclick="crearVotacion(this)">🗳️ Crear la votación</button></div>`;

      <div class="cifras"><div class="cifra"><b id="vot-n">${num(R?.votantes||0)}</b><small>personas han votado</small></div><div class="cifra"><b>${S.vcats.length}</b><small>categorías</small></div></div>
      <div class="lista" style="margin-bottom:14px">
        ${V.estado==='abierta'?`<button class="btn peligro" style="width:100%" onclick="estadoVotacion('terminada',this)">⏹ Cerrar la votación</button>`
          :`<button class="btn acc" style="width:100%" onclick="estadoVotacion('abierta',this)">▶️ ${V.estado==='terminada'?'Volver a abrir':'Abrir la votación'}</button>`}

      <p class="sub" style="margin:0 0 10px">Pulsa un botón para cambiar lo que sale en la pantalla grande (tarda 2 segundos).</p>
      <div class="lista" style="margin-bottom:6px">
        <button class="item ${(V.pantalla_modo||'votad')==='votad'?'on-pant':''}" onclick="modoPantalla('votad',null,this)"><span class="ic">📣</span><span class="t"><b>¡Vota ya!</b><small>QR gigante, fotos de los peleadores y contador de votos</small></span>${(V.pantalla_modo||'votad')==='votad'?'<span class="tag ok">▶ Se ve ahora</span>':''}</button>
        <button class="item ${V.pantalla_modo==='directo'?'on-pant':''}" onclick="modoPantalla('directo',null,this)"><span class="ic">📊</span><span class="t"><b>Resultados en directo</b><small>Barras que suben con cada voto</small></span>${V.pantalla_modo==='directo'?'<span class="tag ok">▶ Se ve ahora</span>':''}</button>
        ${S.vcats.map(c=>{ const on=V.pantalla_modo==='ganador'&&V.pantalla_categoria===c.id; return `<button class="item ${on?'on-pant':''}" onclick="modoPantalla('ganador','${c.id}',this)"><span class="ic">🏆</span><span class="t"><b>Revelar: ${esc(c.nombre)}</b><small>Cuenta atrás 3-2-1 y aparece el ganador con lluvia de oro</small></span>${on?'<span class="tag ok">▶ Se ve ahora</span>':''}</button>`; }).join('')}
      </div>
      <div class="grupo">QR para votar</div>
      <div class="item" style="flex-direction:column;align-items:center;text-align:center;gap:10px">
        <div id="vot-qr" style="background:#fff;padding:12px;border-radius:14px;width:min(240px,70vw)"></div>

          <button class="btn peq" onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>toast('Enlace copiado'))">🔗 Copiar enlace</button>
          <a class="btn peq" href="../fight2one-votar/pantalla.html?v=${V.id}" target="_blank" rel="noopener">📺 Pantalla grande</a>

        <small style="color:var(--mut)">Pon el QR en las pantallas y en la cartelería. La «Pantalla grande» enseña el QR y los resultados en directo (ábrela en el ordenador conectado a la pantalla del pabellón).</small>

      <label class="check"><input type="checkbox" ${V.resultados_publicos?'checked':''} onchange="ajusteVotacion('resultados_publicos',this.checked)"> Enseñar los resultados al público (en su móvil y en la pantalla grande aunque no esté abierta desde el panel)</label>
      ${V.requiere_codigo?`<div class="item" style="flex-wrap:wrap"><span class="ic">🎟️</span><span class="t"><b>${num(S.vcod.total)} códigos · ${num(S.vcod.usados)} usados</b><small>Imprime un código en cada entrada. Si no lleva código válido, no puede votar.</small></span>

function abrirSubida(pre={}){
  const pels=peleadoresVelada(), otros=S.peleadores.filter(p=>!pels.includes(p.id));
  const velo=document.createElement('div'); velo.className='velo';
  velo.innerHTML=`<form class="form" novalidate><div class="fcab"><h3>Subir documento</h3><button type="button" class="x" aria-label="Cerrar">✕</button></div>
    <label class="campo"><span>Archivo (foto o PDF, hasta 25 MB)</span><input type="file" name="archivo" multiple accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx" required></label>
    <label class="campo"><span>Qué es</span>${chips('categoria',CATEGORIAS.map(c=>[c,c]),pre.categoria||'Contrato')}</label>
    <label class="campo"><span>De quién</span><select name="dueno">
      <option value="velada:${S.velada?.id||''}">📅 De la velada (${esc(S.velada?.nombre||'general')})</option>
      ${pels.length?`<optgroup label="Peleadores de esta velada">${pels.map(id=>`<option value="pel:${id}" ${pre.peleador_id===id?'selected':''}>👊 ${esc(nombrePel(id))}</option>`).join('')}</optgroup>`:''}
      ${S.patro.length?`<optgroup label="Patrocinadores">${S.patro.map(p=>`<option value="pat:${p.id}" ${pre.patrocinador_id===p.id?'selected':''}>🤝 ${esc(p.nombre)}</option>`).join('')}</optgroup>`:''}
      ${otros.length?`<optgroup label="Otros peleadores">${otros.map(p=>`<option value="pel:${p.id}" ${pre.peleador_id===p.id?'selected':''}>👊 ${esc(p.nombre)}</option>`).join('')}</optgroup>`:''}
    </select></label>
    <label class="campo"><span>Nombre (opcional)</span><input name="nombre" placeholder="Si lo dejas vacío, se usa el nombre del archivo"></label>
    <p class="error" role="alert"></p><div class="pie"><button class="btn acc" type="submit">Subir</button></div></form>`;
  document.body.appendChild(velo); document.body.style.overflow='hidden';
  const form=velo.querySelector('form'), err=form.querySelector('.error'), cerrar=()=>{ velo.remove(); if(!document.querySelector('.velo')) document.body.style.overflow=''; };
  velo.addEventListener('click',e=>{ if(e.target===velo) cerrar(); }); form.querySelector('.x').onclick=cerrar;
  form.querySelectorAll('[data-chips]').forEach(g=>g.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); g.nextElementSibling.value=b.dataset.v; }));
  form.addEventListener('submit',async e=>{ e.preventDefault(); err.textContent='';
    const files=[...form.archivo.files]; if(!files.length){ err.textContent='Elige un archivo'; return; }
    const grande=files.find(f=>f.size>25*1048576); if(grande){ err.textContent=`«${grande.name}» pesa más de 25 MB`; return; }
    const cat=form.categoria.value, [tipo,did]=form.dueno.value.split(':'), btn=form.querySelector('[type=submit]'); btn.disabled=true;
    let hechos=0;
    try{ for(const f of files){ btn.textContent=`Subiendo ${hechos+1} de ${files.length}…`;
        const limpio=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'-').slice(-80);
        const ruta=`${S.velada?.id||'general'}/${crypto.randomUUID()}-${limpio}`;
        const up=await sb.storage.from('f2o-archivos').upload(ruta,f,{contentType:f.type||'application/octet-stream',upsert:false}); if(up.error) throw up.error;
        try{ const fila=await guardar('f2o_archivos',{ velada_id:S.velada?.id||null, peleador_id:tipo==='pel'?did:null, patrocinador_id:tipo==='pat'?did:null, categoria:cat,
            nombre:(files.length===1&&form.nombre.value.trim())||f.name, ruta, tamano:f.size, tipo:f.type||null, subido_por:S.yo?.nombre||null }); S.archivos.unshift(fila); }
        catch(e2){ await sb.storage.from('f2o-archivos').remove([ruta]); throw e2; }
        hechos++; }
      // un papel subido pasa a «recibido» para revisarlo
      if(tipo==='pel'&&TIPOS_PAPEL.includes(cat)&&S.velada&&peleadoresVelada().includes(did)){ const ya=S.papeles.find(x=>x.peleador_id===did&&x.tipo===cat);
        if(!ya||ya.estado==='falta'){ const u=await sb.from('f2o_papeles').upsert({velada_id:S.velada.id,peleador_id:did,tipo:cat,estado:'recibido'},{onConflict:'velada_id,peleador_id,tipo'}).select(); if(!u.error&&u.data?.[0]){ S.papeles=S.papeles.filter(x=>x.id!==u.data[0].id).concat(u.data[0]); } } }
        // si la ficha del combate sigue abierta, que su selector no lo devuelva a «Falta» al guardar
        document.querySelectorAll('.velo form').forEach(fm=>['a','b'].forEach(l=>{ const sel=fm.querySelector(`[name="peleador_${l}"]`), h=fm.querySelector(`[name="papel_${l}_${cat}"]`);
          if(sel&&h&&sel.value===did&&h.value==='falta'){ h.value='recibido'; h.previousElementSibling.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v==='recibido')); } }));
      cerrar(); toast(hechos>1?`✓ ${hechos} documentos subidos`:'✓ Documento subido'); pintar();
    }catch(e3){ btn.disabled=false; btn.textContent='Subir'; err.textContent=(hechos?`Se subieron ${hechos}, pero falló uno: `:'No se pudo subir: ')+textoError(e3); } });
}

function estadoPeso(c,pid,tol){ tol=tol??Number(S.velada?.tolerancia_kg??0.5); const pac=pesoNum(c.peso); const l=S.pesajes.filter(x=>x.peleador_id===pid&&(!x.combate_id||x.combate_id===c.id)).sort((a,b)=>new Date(b.hora)-new Date(a.hora)); const u=l[0];
  if(!u) return {ultimo:null,txt:'Sin pesar',cls:'gris',fuera:false};
  if(!pac) return {ultimo:u,txt:'Sin peso pactado',cls:'med',fuera:false};
  const dif=Math.round((u.peso-pac)*10)/10; if(dif>tol) return {ultimo:u,txt:`Se pasa ${String(dif).replace('.',',')} kg`,cls:'no',fuera:true,dif};
  return {ultimo:u,txt:'Da el peso ✓',cls:'ok',fuera:false,dif}; }
function bolsaDe(pid){ let bolsa=0, ajuste=0, pagado=0; S.combates.filter(c=>c.estado!=='cancelado').forEach(c=>{ if(c.peleador_a===pid){ bolsa+=Number(c.bolsa_a); ajuste=Number(c.ajuste_a||0); pagado=Number(c.pagado_a||0); } if(c.peleador_b===pid){ bolsa+=Number(c.bolsa_b); ajuste=Number(c.ajuste_b||0); pagado=Number(c.pagado_b||0); } });
  const total=bolsa+ajuste; return {bolsa,ajuste,pagado,total,falta:Math.max(0,total-pagado)}; }

    <label class="check"><input type="checkbox" name="pagado" ${g?.pagado?'checked':''}> Ya está pagado</label>
    ${campo('Notas',`<textarea name="notas">${esc(g?.notas||'')}</textarea>`)}`,
    leer:f=>({ velada_id:S.velada.id, concepto:f.concepto.trim(), proveedor:f.proveedor||null, importe:Number(f.importe)||0, vence:f.vence||null, pagado:!!f.pagado, notas:f.notas||null }) },
  equipo:{ tabla:'f2o_equipo', titulo:'Persona del equipo', fila:id=>S.equipo.find(x=>x.id===id), html:e=>`
    ${campo('Nombre',inp('nombre',e?.nombre,'required'))}
    ${campo('Qué hace',chips('rol',[['Árbitro','Árbitro'],['Juez','Juez'],['Médico','Médico'],['Seguridad','Seguridad'],['Producción','Producción']],e?.rol||'Producción'))}
    <div class="dos">${campo('Teléfono',inp('telefono',e?.telefono,'type="tel" inputmode="tel"'))}${campo('Se le paga (€)',inp('pago',e?.pago??0,'type="number" inputmode="decimal" min="0"'))}</div>
    <label class="check"><input type="checkbox" name="confirmado" ${e?.confirmado?'checked':''}> Ha confirmado que viene</label>
    <label class="check"><input type="checkbox" name="pagado" ${e?.pagado?'checked':''}> Ya está pagado</label>`,
    leer:f=>({ velada_id:S.velada.id, nombre:f.nombre.trim(), rol:f.rol||'Producción', telefono:f.telefono||null, pago:Number(f.pago)||0, confirmado:!!f.confirmado, pagado:!!f.pagado }) },
  tarea:{ tabla:'f2o_tareas', titulo:'Tarea', fila:id=>S.tareas.find(x=>x.id===id), html:t=>`
    ${campo('Qué hay que hacer',inp('titulo',t?.titulo,'required'))}
    <div class="dos">${campo('Quién',inp('quien',t?.quien,'placeholder="Moi, Susi…"'))}${campo('Para cuándo',`<input type="date" name="fecha" value="${t?.fecha||''}">`)}</div>
    ${campo('Tema',chips('area',[['General','General'],['Pabellón','Pabellón'],['Combates','Combates'],['Viajes','Viajes'],['Marketing','Marketing'],['Dinero','Dinero']],t?.area||'General'))}
    ${campo('Prioridad',chips('prioridad',[['normal','Normal'],['urgente','Urgente']],t?.prioridad||'normal'))}
    ${campo('Estado',chips('estado',[['por_hacer','Por hacer'],['en_marcha','En marcha'],['hecha','Hecha ✓']],t?.estado||'por_hacer'))}`,
    leer:f=>({ velada_id:S.velada.id, titulo:f.titulo.trim(), quien:f.quien||null, fecha:f.fecha||null, area:f.area||'General', prioridad:f.prioridad||'normal', estado:f.estado||'por_hacer' }) },
  merch:{ tabla:'f2o_merch', titulo:'Producto', fila:id=>S.merch.find(x=>x.id===id), html:m=>`
    ${campo('Nombre',inp('nombre',m?.nombre,'required placeholder="Camiseta de la edición"'))}
    <div class="dos">${campo('Precio (€)',inp('precio',m?.precio??0,'type="number" inputmode="decimal" min="0"'))}${campo('Cuántas hay',inp('stock',m?.stock??0,'type="number" inputmode="numeric" min="0"'))}</div>
    ${campo('Vendidas',inp('vendidas',m?.vendidas??0,'type="number" inputmode="numeric" min="0"'))}
    ${campo('Color',`<input type="color" name="color" value="${esc(m?.color||'#0b0b0b')}" style="height:52px;padding:6px">`)}`,
    leer:f=>({ velada_id:S.velada.id, nombre:f.nombre.trim(), precio:Number(f.precio)||0, stock:Number(f.stock)||0, vendidas:Number(f.vendidas)||0, color:f.color||'#0b0b0b' }) },
};
/* ───────── Votación del público ───────── */
const urlVotar=()=>new URL('../fight2one-votar/?v='+S.vot.id,location.href).href;
const fotoAbs=u=>!u?null:/^https?:\/\//.test(u)?u:'/'+String(u).replace(/^\/+/,'');
async function cargarVotacion(){
  S.vot=null; S.vcats=[]; S.vops=[]; S.vres=null; S.vcod={total:0,usados:0};
  if(!S.velada) return;
  try{
    const { data:v, error }=await sb.from('f2o_votaciones').select('*').eq('velada_id',S.velada.id).maybeSingle(); if(error) throw error;
    S.vot=v; if(!v) return;
    S.vcats=await q(sb.from('f2o_vot_categorias').select('*').eq('votacion_id',v.id).order('orden').order('created_at'));
    S.vops=S.vcats.length?await q(sb.from('f2o_vot_opciones').select('*').in('categoria_id',S.vcats.map(c=>c.id)).order('orden').order('created_at')):[];
    await refrescarResultados(false);
    if(v.requiere_codigo){
      const t=await sb.from('f2o_vot_codigos').select('codigo',{count:'exact',head:true}).eq('votacion_id',v.id);
      const u=await sb.from('f2o_vot_codigos').select('codigo',{count:'exact',head:true}).eq('votacion_id',v.id).not('usado_at','is',null);
      S.vcod={total:t.count||0,usados:u.count||0};
    }
  }catch(e){ console.warn('Votación:',e); }
}
async function refrescarResultados(repintar=true){
  if(!S.vot) return; const { data, error }=await sb.rpc('f2o_vot_resultados',{p_votacion:S.vot.id}); if(error) return;
  const antes=JSON.stringify(S.vres); S.vres=data; if(!repintar||SECCION!=='votacion'||antes===JSON.stringify(data)) return;
  // Solo cambian los números: se actualizan en su sitio para no recargar la vista previa de la pantalla
  const n=document.getElementById('vot-n'); if(n) n.textContent=num(data?.votantes||0);
  (data?.categorias||[]).forEach(c=>{ const tot=c.opciones.reduce((a,o)=>a+(o.votos||0),0); c.opciones.forEach(o=>{
    const t=document.querySelector(`[data-vop="${o.id}"]`); if(t){ t.textContent=`${num(o.votos)} · ${tot?Math.round(o.votos*100/tot):0}%`; t.className='tag '+(o.votos?'ok':'gris'); }
    const b=document.querySelector(`[data-vbar="${o.id}"]`); if(b) b.style.width=(tot?o.votos*100/tot:0)+'%'; }); });
}
setInterval(()=>{ if(SECCION==='votacion'&&S.vot&&!document.hidden) refrescarResultados(); },5000);
// El QR se dibuja después de pintar la sección
function escalarVista(){ const c=document.getElementById('pant-prev'); if(!c) return; const f=c.querySelector('iframe'); f.style.transform=`scale(${c.clientWidth/1600})`; }
addEventListener('resize',escalarVista);
new MutationObserver(()=>{ escalarVista(); const el=document.getElementById('vot-qr'); if(el&&!el.dataset.ok&&window.QRCode&&S.vot){ el.dataset.ok='1'; new QRCode(el,{text:urlVotar(),width:512,height:512,correctLevel:QRCode.CorrectLevel.M}); el.querySelectorAll('img,canvas').forEach(x=>{ x.style.width='100%'; x.style.height='auto'; }); } }).observe(document.getElementById('main'),{childList:true});
window.bajarQR=()=>{ const c=document.querySelector('#vot-qr canvas'); if(!c) return; const g=document.createElement('canvas'), m=48; g.width=c.width+m*2; g.height=c.height+m*2;
  const x=g.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,g.width,g.height); x.drawImage(c,m,m);
  const a=document.createElement('a'); a.download='QR-votacion-'+(S.velada.nombre||'fight2one').replace(/[^\w]+/g,'-')+'.png'; a.href=g.toDataURL('image/png'); a.click(); };
window.crearVotacion=async btn=>{ btn.disabled=true; btn.textContent='Creando…';
  try{
    const v=await guardar('f2o_votaciones',{ velada_id:S.velada.id, titulo:'Vota a los mejores de la noche' });
    const cp=await guardar('f2o_vot_categorias',{ votacion_id:v.id, nombre:'Mejor peleador de la noche', orden:0 });
    const cc=await guardar('f2o_vot_categorias',{ votacion_id:v.id, nombre:'Mejor combate de la noche', orden:1 });
    const pels=peleadoresVelada().map(pel).filter(Boolean), combs=S.combates.filter(c=>c.estado!=='cancelado'&&c.peleador_a&&c.peleador_b);
    const ops=[...pels.map((p,i)=>({ categoria_id:cp.id, etiqueta:p.nombre, detalle:[p.apodo?'«'+p.apodo+'»':'',p.pais].filter(Boolean).join(' · ')||null, foto_url:fotoAbs(p.foto_url), peleador_id:p.id, orden:i })),
      ...combs.map((c,i)=>({ categoria_id:cc.id, etiqueta:nombrePel(c.peleador_a)+' vs '+nombrePel(c.peleador_b), detalle:[c.modalidad,c.peso,c.titulo].filter(Boolean).join(' · ')||null, combate_id:c.id, orden:i }))];
    if(ops.length){ const r=await sb.from('f2o_vot_opciones').insert(ops).select('id'); if(r.error) throw r.error; }
    toast('✓ Votación creada'+(ops.length?'':' (añade los candidatos)')); await cargarVotacion(); pintar();
  }catch(e){ btn.disabled=false; btn.textContent='🗳️ Crear la votación'; toast(/f2o_vot|does not exist|schema cache/i.test(String(e?.message))?'Falta instalar la votación en la base de datos (avisa a Fabio).':textoError(e),true); } };
window.estadoVotacion=async(estado,btn)=>{ if(estado==='terminada'&&!confirmarDoble(btn,'¿Cerrar? Pulsa otra vez')) return;
  if(estado==='abierta'&&!S.vops.length){ toast('Añade candidatos antes de abrir',true); return; }
  if(estado==='abierta'&&S.vot.requiere_codigo&&!S.vcod.total){ toast('Genera los códigos de las entradas antes de abrir',true); return; }
  btn.disabled=true; try{ S.vot=await guardar('f2o_votaciones',{estado},S.vot.id); toast(estado==='abierta'?'✓ Votación abierta: ya se puede votar':'✓ Votación cerrada'); pintar(); }catch(e){ btn.disabled=false; toast(textoError(e),true); } };
window.modoPantalla=async(modo,cat,btn)=>{ if(modo==='ganador'&&!confirmarDoble(btn.querySelector('b'),'¿Revelar ya? Pulsa otra vez')) return; btn.disabled=true;
  try{ S.vot=await guardar('f2o_votaciones',{ pantalla_modo:modo, pantalla_categoria:cat, pantalla_cambio:new Date().toISOString() },S.vot.id); toast(modo==='ganador'?'🏆 Revelando en la pantalla…':'✓ Pantalla cambiada'); pintar(); }
  catch(e){ btn.disabled=false; toast(/pantalla_/i.test(String(e?.message))?'Falta actualizar la base de datos (avisa a Fabio).':textoError(e),true); } };
window.ajusteVotacion=async(campo,val)=>{ try{ S.vot=await guardar('f2o_votaciones',{[campo]:val},S.vot.id); if(campo==='requiere_codigo') await cargarVotacion(); toast('✓ Guardado'); pintar(); }catch(e){ toast(textoError(e),true); pintar(); } };
window.reiniciarVotos=async btn=>{ if(!confirmarDoble(btn,'¿Borrar TODOS los votos? Pulsa otra vez')) return; btn.disabled=true;
  try{ const r=await sb.from('f2o_votos').delete().eq('votacion_id',S.vot.id); if(r.error) throw r.error;
    const c=await sb.from('f2o_vot_codigos').update({usado_at:null}).eq('votacion_id',S.vot.id); if(c.error) throw c.error;
    toast('✓ Votos borrados'); await cargarVotacion(); pintar(); }catch(e){ btn.disabled=false; toast(textoError(e),true); } };
window.bajarCodigos=async btn=>{ btn.disabled=true; try{ const filas=[]; for(let i=0;;i+=1000){ const r=await q(sb.from('f2o_vot_codigos').select('codigo,usado_at').eq('votacion_id',S.vot.id).order('created_at').order('codigo').range(i,i+999)); filas.push(...r); if(r.length<1000) break; }
    const csv='codigo,usado\n'+filas.map(f=>f.codigo+','+(f.usado_at?'si':'no')).join('\n');
    const a=document.createElement('a'); a.download='codigos-votacion-'+(S.velada.nombre||'fight2one').replace(/[^\w]+/g,'-')+'.csv'; a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.click();
  }catch(e){ toast(textoError(e),true); } btn.disabled=false; };
const ALFABETO='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const nuevoCodigo=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>ALFABETO[b%ALFABETO.length]).join('');
FORMS.vcat={ tabla:'f2o_vot_categorias', titulo:'Categoría', fila:id=>S.vcats.find(x=>x.id===id), html:c=>`
    ${campo('Nombre',inp('nombre',c?.nombre,'required placeholder="Mejor peleador de la noche, mejor KO…"'))}
    ${campo('Orden',inp('orden',c?.orden??S.vcats.length,'type="number" inputmode="numeric" min="0"'))}`,
  leer:f=>({ votacion_id:S.vot.id, nombre:f.nombre.trim(), orden:Number(f.orden)||0 }) };
FORMS.vopc={ tabla:'f2o_vot_opciones', titulo:'Candidato', fila:id=>S.vops.find(x=>x.id===id), html:(o,extra)=>`
    <input type="hidden" name="categoria_id" value="${esc(o?.categoria_id||extra?.categoria_id||'')}">
    ${campo('Elegir de la velada',`<select name="origen"><option value="">— Escribirlo a mano —</option>
      <optgroup label="Peleadores">${S.peleadores.map(p=>`<option value="p:${p.id}" ${o?.peleador_id===p.id?'selected':''}>${esc(p.nombre)}${p.pais?' · '+esc(p.pais):''}</option>`).join('')}</optgroup>
      <optgroup label="Combates">${S.combates.filter(c=>c.peleador_a&&c.peleador_b).map(c=>`<option value="c:${c.id}" ${o?.combate_id===c.id?'selected':''}>${esc(nombrePel(c.peleador_a)+' vs '+nombrePel(c.peleador_b))}</option>`).join('')}</optgroup></select>`)}
    ${campo('O escribe el nombre',inp('etiqueta',o&&!o.peleador_id&&!o.combate_id?o.etiqueta:'','placeholder="Solo si no está en la lista"'))}
    ${campo('Debajo del nombre (opcional)',inp('detalle',o?.detalle,'placeholder="País, apodo, modalidad…"'))}`,
  validar:f=>!f.origen&&!f.etiqueta.trim()?'Elige un peleador o combate, o escribe un nombre':'',
  leer:f=>{ const [t,id]=(f.origen||':').split(':'); const p=t==='p'?pel(id):null, c=t==='c'?S.combates.find(x=>x.id===id):null;
    return { categoria_id:f.categoria_id, etiqueta:p?p.nombre:c?nombrePel(c.peleador_a)+' vs '+nombrePel(c.peleador_b):f.etiqueta.trim(),
      detalle:f.detalle.trim()||(p?[p.apodo?'«'+p.apodo+'»':'',p.pais].filter(Boolean).join(' · ')||null:c?[c.modalidad,c.peso,c.titulo].filter(Boolean).join(' · ')||null:null),
      foto_url:p?fotoAbs(p.foto_url):null, peleador_id:p?.id||null, combate_id:c?.id||null }; } };
FORMS.vcodigos={ tabla:'f2o_vot_codigos', titulo:'Códigos de entrada', fila:()=>null, html:()=>`
    <p class="sub" style="margin:0 0 12px">Se crean códigos de 6 letras y números (sin O/0 ni I/1 para que no se confundan). Descarga el CSV y pásaselo a quien imprime las entradas.</p>
    ${campo('Cuántos',inp('n',Math.max(100,(S.velada.aforo||2000)-S.vcod.total),'required type="number" inputmode="numeric" min="1" max="10000"'))}`,
  validar:f=>!(Number(f.n)>=1&&Number(f.n)<=10000)?'Entre 1 y 10.000':'',
  antes:async f=>{ const n=Number(f.n), set=new Set(); while(set.size<n) set.add(nuevoCodigo());
    const filas=[...set].map(codigo=>({ votacion_id:S.vot.id, codigo }));
    for(let i=0;i<filas.length;i+=500){ const r=await sb.from('f2o_vot_codigos').upsert(filas.slice(i,i+500),{onConflict:'votacion_id,codigo',ignoreDuplicates:true}); if(r.error) throw r.error; } },
  sinGuardar:true, leer:()=>null };
function abrirForm(tipo,id,extra){
  const F=FORMS[tipo], fila=id?F.fila(id):null; if(id&&!fila){ toast('No se encontró',true); return; }
  const velo=document.createElement('div'); velo.className='velo';
  velo.innerHTML=`<form class="form" novalidate><div class="fcab"><h3>${fila?'Editar':'Nuevo'}: ${F.titulo}</h3><button type="button" class="x" aria-label="Cerrar">✕</button></div>
    ${F.html(fila,extra)}<p class="error" role="alert"></p>
    <div class="pie">${fila&&tipo!=='velada'?'<button type="button" class="btn peligro" data-borrar>Borrar</button>':''}<button class="btn acc" type="submit">Guardar</button></div></form>`;
  document.body.appendChild(velo); document.body.style.overflow='hidden';
  const form=velo.querySelector('form'), err=form.querySelector('.error');
  const cerrar=()=>{ velo.remove(); document.body.style.overflow=''; };
  velo.addEventListener('click',e=>{ if(e.target===velo) cerrar(); });
  form.querySelector('.x').onclick=cerrar;
  form.querySelectorAll('[data-chips]').forEach(g=>g.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b)); g.nextElementSibling.value=b.dataset.v; }));
  form.querySelectorAll('[data-entregables]').forEach(g=>g.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; const st=(Number(b.dataset.st)+1)%3; b.dataset.st=st; const n=b.dataset.e;
    b.classList.toggle('on',st===1); b.style.cssText=st===2?'background:var(--ok);border-color:var(--ok);color:#000':''; b.textContent=(st===2?'✓ ':'')+n;
    const ent=[...g.querySelectorAll('.chip')].filter(x=>x.dataset.st!=='0').map(x=>x.dataset.e), hecho=[...g.querySelectorAll('.chip')].filter(x=>x.dataset.st==='2').map(x=>x.dataset.e);
    g.nextElementSibling.value=JSON.stringify({ent,hecho}); }));
  form.querySelectorAll('select[data-pel]').forEach(s=>s.addEventListener('change',()=>{ const n=form.querySelector(`[name="${s.name}__nuevo"]`); n.classList.toggle('oculto',s.value!=='__nuevo'); if(s.value==='__nuevo') n.focus(); }));
  const bb=form.querySelector('[data-borrar]'); if(bb) bb.onclick=async()=>{ if(!confirmarDoble(bb,'¿Seguro? Pulsa otra vez')) return; bb.disabled=true;
    try{ await borrar(F.tabla,id); cerrar(); toast('Borrado'); await cargarTodo(); }catch(e){ bb.disabled=false; err.textContent=textoError(e); } };
  form.addEventListener('submit',async e=>{ e.preventDefault(); err.textContent='';
    const f={}; new FormData(form).forEach((v,k)=>f[k]=typeof v==='string'?v:''); form.querySelectorAll('input[type=checkbox]').forEach(c=>f[c.name]=c.checked);
    const req=[...form.querySelectorAll('[required]')].find(x=>!x.value.trim()); if(req){ err.textContent='Falta: '+req.closest('.campo').querySelector('span').textContent; req.focus(); return; }
    const msg=F.validar?.(f); if(msg){ err.textContent=msg; return; }
    const btn=form.querySelector('[type=submit]'); btn.disabled=true; btn.textContent='Guardando…';
    try{ if(F.antes) await F.antes(f); const r=F.sinGuardar?null:await guardar(F.tabla,F.leer(f),id); if(F.despues) await F.despues(r,!id,f);
      cerrar(); toast('✓ Guardado'); if(tipo!=='velada') await cargarTodo(); }
    catch(e2){ btn.disabled=false; btn.textContent='Guardar'; err.textContent='No se pudo guardar: '+textoError(e2); } });
  setTimeout(()=>form.querySelector('input:not([type=hidden]),select')?.focus({preventScroll:true}),60);
}
window.abrirForm=abrirForm;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ const v=document.querySelector('.velo'); if(v){ v.remove(); document.body.style.overflow=''; } } });

sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ $('#app').classList.add('oculto'); $('#entrada').classList.remove('oculto'); } });
entrarConLlave().finally(arrancar);
</script>
