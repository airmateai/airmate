L.forEach((x,i)=>{const d=!!hechos[x.t];if(d)n++;const c=document.createElement("div");c.className="card"+(d?" done":"");
c.innerHTML=`<div class="n"></div><div class="m"></div><div class="row"><a class="wa" target="_blank" rel="noopener">💬 Abrir WhatsApp</a><button>${d?"✓ Enviado":"Enviado"}</button></div>`;
c.querySelector(".n").textContent=x.n;c.querySelector(".m").textContent=x.s+" · "+x.z;c.querySelector("a").href=x.u;
c.querySelector("button").onclick=()=>{if(hechos[x.t])delete hechos[x.t];else hechos[x.t]=1;guardar();pinta()};el.appendChild(c)});
document.getElementById("cnt").textContent=n+" de "+L.length+" enviados";document.getElementById("pr").style.width=(100*n/L.length)+"%"}
pinta();
</script></body></html>
