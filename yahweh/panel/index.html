<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Yahweh Family · Panel (demo)</title>
<meta name="theme-color" content="#f7f3ee">
<link rel="icon" href="../img/logo-letrero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Panel demo Yahweh Family · datos de ejemplo guardados en este navegador (compartidos con la web) */
:root{--cr:#f7f3ee;--cr2:#efe9e1;--st:#e2dbd1;--w:#fff;--ink:#2a2420;--mu:#857a6f;--g:#b08a3e;--g2:#e3c47c;--gb:#f5ecd9;--ok:#4f7a57;--okb:#e6efe6;--wa:#9a6a20;--wab:#f7ead3;--r:#a6402e;--rb:#f6e0da;--bl:#4c6176;--blb:#e3e9ef;--bd:rgba(42,36,32,.08);--e:cubic-bezier(.16,1,.3,1);--s:cubic-bezier(.34,1.56,.64,1);--side:236px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cr);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
.serif{font-family:'Cormorant Garamond',serif;font-weight:400}
.mono{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mu);font-weight:600}
/* intro */
#intro{position:fixed;inset:0;z-index:200;background:var(--cr);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .8s var(--e),visibility .8s}
#intro.fuera{opacity:0;visibility:hidden}
#intro svg{width:130px;animation:pop 1s var(--s) both}
#intro .bar{width:150px;height:2px;background:var(--st);border-radius:2px;overflow:hidden}#intro .bar i{display:block;height:100%;width:0;background:var(--g);animation:carga 1.5s .3s var(--e) forwards}
@keyframes pop{from{transform:scale(.4) rotate(-20deg);opacity:0}}@keyframes carga{to{width:100%}}
/* layout */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--w);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;z-index:30}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px 22px}
.marca svg{width:44px;height:44px}
.marca b{display:block;font-family:Cinzel,serif;letter-spacing:.14em;font-size:15px}.marca i{display:block;font-family:'Pinyon Script';font-style:normal;color:var(--g);font-size:17px;margin:-3px 0 0 14px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;font-weight:500;color:#544b43;transition:.2s}
.nav button:hover{background:var(--cr)}
.nav button.on{background:var(--gb);color:var(--g);font-weight:600}
.nav .ic{width:20px;text-align:center}
.nav .bd{margin-left:auto;background:var(--g);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px}
.yo{display:flex;align-items:center;gap:10px;padding:12px 6px 0;border-top:1px solid var(--bd)}
.av{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.main{margin-left:var(--side);padding:26px 32px 90px;min-height:100vh}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hd h1{margin:4px 0 0;font-family:'Cormorant Garamond';font-weight:400;font-size:42px;line-height:1}
.hd h1 em{color:var(--g)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;transition:transform .25s var(--s);text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.bp{background:var(--ink);color:#fff}.bs,.bs:visited{color:var(--ink)}.bg{background:linear-gradient(100deg,#8a6a2a,var(--g),var(--g2));color:#fff}.bs{background:var(--w);box-shadow:0 0 0 1px var(--bd)}.bw{background:#25d366;color:#05301a}
.peq{padding:6px 11px;font-size:12px}
.demo{margin:12px 0 0;align-self:flex-start;background:var(--ink);color:#efe6d6;font-size:11.5px;padding:7px 12px;border-radius:999px;display:flex;gap:10px;align-items:center}
.demo button,.demo a{color:var(--g2);font-weight:600;font-size:11.5px;text-decoration:none}
.card{background:var(--w);border-radius:18px;box-shadow:0 0 0 1px var(--bd);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi small{color:var(--mu);font-size:12.5px}.kpi b{display:block;font-family:'Cormorant Garamond';font-weight:400;font-size:44px;line-height:1;margin-top:6px}
.kpi .tr{font-size:12px;color:var(--ok);font-weight:600;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-wa{background:var(--wab);color:var(--wa)}.c-g{background:var(--gb);color:var(--g)}.c-bl{background:var(--blb);color:var(--bl)}.c-r{background:var(--rb);color:var(--r)}.c-n{background:var(--cr2);color:#6e655c}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:10px}
.sec-t h3{margin:0;font-family:'Cormorant Garamond';font-weight:500;font-size:25px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .t{font-size:12px;color:var(--mu);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.row .x{flex:1;min-width:0}.row .x b{font-weight:600;display:block}.row .x small{color:var(--mu);font-size:12.5px}
.row.click{cursor:pointer;border-radius:10px}.row.click:hover{background:var(--cr)}
.empty{color:var(--mu);text-align:center;padding:24px 0;font-size:13.5px}
.vista{animation:vIn .5s var(--e)}.vista .card{animation:cUp .55s var(--e) both}
.vista .card:nth-child(2){animation-delay:.05s}.vista .card:nth-child(3){animation-delay:.1s}.vista .card:nth-child(4){animation-delay:.15s}
@keyframes vIn{from{opacity:0}}@keyframes cUp{from{opacity:0;transform:translateY(14px)}}
.brilla{animation:brilla 2.4s var(--e)}@keyframes brilla{0%,30%{box-shadow:0 0 0 3px var(--g),0 0 30px rgba(176,138,62,.6)}}
/* agenda por áreas */
.dia-nav{display:flex;gap:6px;align-items:center}
.ag{display:grid;grid-template-columns:54px repeat(3,1fr);background:var(--w);border-radius:18px;box-shadow:0 0 0 1px var(--bd);overflow:hidden;position:relative}
.ag .h{padding:12px 8px;text-align:center;font-weight:600;font-size:13px;border-bottom:1px solid var(--bd);background:#fbf8f4;position:sticky;top:0;z-index:3}
.ag .h i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.col{position:relative;border-left:1px solid var(--bd)}
.hcol .hr{height:44px;font-size:10.5px;color:var(--mu);padding:3px 6px;border-top:1px solid var(--bd);font-variant-numeric:tabular-nums}
.col .sl{height:44px;border-top:1px solid var(--bd);cursor:pointer}.col .sl:hover{background:#fbf8f4}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;color:#fff;transition:transform .2s;box-shadow:0 4px 12px -6px rgba(0,0,0,.35);z-index:2}
.ev:hover{transform:scale(1.015)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{opacity:.85}
.ev.hecha{opacity:.55}
.ev.web::after{content:'WEB';position:absolute;right:6px;top:5px;font-size:9px;font-weight:700;background:rgba(255,255,255,.25);padding:1px 5px;border-radius:5px}
.ahora{position:absolute;left:54px;right:0;height:2px;background:var(--r);z-index:4}
.ahora::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--r)}
/* clientas */
.cl-wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.search{width:100%;border:0;background:var(--w);box-shadow:0 0 0 1px var(--bd);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.clist{max-height:calc(100vh - 220px);overflow:auto;display:flex;flex-direction:column;gap:6px}
.ci{background:var(--w);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--bd);display:flex;gap:10px;align-items:center;cursor:pointer;transition:.2s}
.ci:hover{box-shadow:0 0 0 1.5px var(--g2)}.ci.on{box-shadow:0 0 0 2px var(--g)}
.ci b{font-weight:600;display:block}.ci small{color:var(--mu);font-size:12px}
textarea.nota{width:100%;border:0;background:var(--cr);border-radius:12px;padding:12px;min-height:70px;resize:vertical}
/* barras */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--g2);transform-origin:bottom;animation:crece 1s var(--e) both}
.bars div:last-child i{background:var(--g)}
.bars span{font-size:11px;color:var(--mu)}.bars em{font-style:normal;font-size:11.5px;font-weight:600}
@keyframes crece{from{transform:scaleY(0)}}
.lg div{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}.lg i{width:10px;height:10px;border-radius:3px}.lg b{margin-left:auto}
/* caja */
.cj{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.cj-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cj-s button{background:var(--w);box-shadow:0 0 0 1px var(--bd);border-radius:14px;padding:12px;text-align:left;transition:.2s}
.cj-s button:hover{box-shadow:0 0 0 2px var(--g2)}
.cj-s button b{display:block;font-weight:600;font-size:13px}.cj-s button span{font-family:'Cormorant Garamond';font-size:22px}
.tk{position:sticky;top:20px}
.tk .ln{display:flex;justify-content:space-between;padding:7px 0;border-top:1px dashed var(--st);font-size:13.5px}
.tk .tot{font-family:'Cormorant Garamond';font-size:40px;text-align:right;margin:10px 0}
.pagos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pagos button{background:var(--cr);border-radius:10px;padding:10px 0;font-weight:600;font-size:12.5px}.pagos button.on{background:var(--ink);color:#fff}
/* web */
.webw{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
.movil{width:340px;height:690px;border-radius:46px;background:#1d1916;padding:12px;box-shadow:0 40px 80px -40px rgba(60,40,20,.6)}
.movil iframe{width:100%;height:100%;border:0;border-radius:36px;background:#fff}
/* modal */
.velo{position:fixed;inset:0;background:rgba(42,36,32,.42);backdrop-filter:blur(4px);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:vIn .3s}
.modal{background:var(--w);border-radius:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px;animation:mIn .45s var(--s)}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.96)}}
.modal h3{margin:0 0 6px;font-family:'Cormorant Garamond';font-weight:500;font-size:30px}
.modal label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px;font-weight:500}
.modal input,.modal select{width:100%;border:0;background:var(--cr);border-radius:10px;padding:10px 12px}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.wab{background:#e7f8ec;border-radius:14px;padding:13px;font-size:13.5px;line-height:1.5;white-space:pre-wrap}
/* aviso de reserva web */
#toasts{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:#efe6d6;padding:12px 16px;border-radius:14px;font-size:13.5px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:tIn .5s var(--s);max-width:360px}
.toast.web{background:linear-gradient(100deg,#8a6a2a,var(--g));color:#fff;padding:16px 18px;font-size:14px}
.toast.web b{display:block;font-size:15px;margin-bottom:2px}
@keyframes tIn{from{opacity:0;transform:translateY(16px) scale(.9)}}
.bnav{display:none}.mtop{display:none;align-items:center;justify-content:space-between;margin-bottom:16px}
@media(max-width:900px){
 .side{display:none}.main{margin-left:0;padding:16px 14px 100px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--bd);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom));overflow-x:auto}
 .bnav button{flex:1;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mu);padding:5px 2px;border-radius:10px}
 .bnav .ic{font-size:17px}.bnav button.on{color:var(--g);background:var(--gb)}
 .g4{grid-template-columns:1fr 1fr}.g2,.g21,.g3,.cl-wrap,.cj,.webw{grid-template-columns:1fr}
 .ag{grid-template-columns:42px repeat(3,minmax(110px,1fr));overflow-x:auto}
 .hd h1{font-size:34px}.kpi b{font-size:36px}
 .mtop{display:flex}.demo{display:none}
 .movil{width:100%;max-width:340px;margin:0 auto}
 .clist{max-height:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a2a"/><stop offset=".45" stop-color="#e3c47c"/><stop offset="1" stop-color="#9c7a34"/></linearGradient>
 <symbol id="corona" viewBox="0 0 64 40"><path d="M4 34 L8 10 L20 22 L32 4 L44 22 L56 10 L60 34 Z" fill="url(#go)"/><circle cx="8" cy="9" r="3" fill="url(#go)"/><circle cx="32" cy="3.5" r="3" fill="url(#go)"/><circle cx="56" cy="9" r="3" fill="url(#go)"/><rect x="4" y="34" width="56" height="5" rx="1.5" fill="url(#go)"/></symbol>
 <symbol id="sello" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#cfc8bd"/><circle cx="50" cy="50" r="43" fill="none" stroke="url(#go)" stroke-width="2.4"/><use href="#corona" x="38" y="16" width="24" height="15"/><text x="50" y="55" text-anchor="middle" font-family="Cinzel" font-weight="600" font-size="15" letter-spacing="1.5" fill="#fff" stroke="#8f8578" stroke-width=".55" paint-order="stroke">YAHWEH</text><text x="52" y="70" text-anchor="middle" font-family="Pinyon Script" font-size="15" fill="url(#go)">family</text><text x="50" y="80" text-anchor="middle" font-family="Inter" font-weight="600" font-size="3.6" letter-spacing="1" fill="url(#go)">PELUQUERÍA Y ESTÉTICA</text></symbol>
</defs></svg>

<div id="intro"><svg><use href="#sello"/></svg><div class="bar"><i></i></div></div>

<aside class="side">
  <div class="marca"><svg><use href="#sello"/></svg><div><b>YAHWEH</b><i>family</i></div></div>
  <nav class="nav" id="nav"></nav>
  <div style="margin-top:auto"></div>
  <div class="demo">Demo · datos de ejemplo <button onclick="reiniciar()">Reiniciar</button></div>
  <div class="yo" style="margin-top:12px"><div class="av">YF</div><div><b style="font-weight:600;font-size:13px">Equipo Yahweh</b><div style="font-size:11.5px;color:var(--mu)">La Laguna</div></div></div>
</aside>

<script src="../datos.js?v=2"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Math.round(n).toLocaleString('es-ES',{useGrouping:'always'})+' €';
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fLarga=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fCorta=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const dur=m=>m>=60?(Math.floor(m/60)+' h'+(m%60?' '+m%60:'')):m+' min';
const HOY=YH.masD(0);
let DB=yhCargar();
const CL=id=>DB.clientas.find(c=>c.id===id)||{n:'—',tel:'',orig:''};
const guardar=()=>yhGuardar(DB);
function reiniciar(){ try{localStorage.removeItem(YH_CLAVE)}catch(e){} DB=yhCargar(); toast('Demo reiniciada con los datos de ejemplo'); ir(VISTA); }

/* sonido y avisos */
let ctx; function sonido(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); [0,.12,.24].forEach((t,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=[784,988,1319][i]; g.gain.setValueAtTime(.07,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.4); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.42); }); }catch(e){} }
function toast(m,cls='',ms=3400){ const t=document.createElement('div'); t.className='toast '+cls; t.innerHTML=m; $('toasts').appendChild(t); setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity=0; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),400); },ms); }
document.addEventListener('pointerdown',()=>{ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){} },{once:true});

/* reservas que llegan desde la web (otra pestaña o el móvil de la sección «Web») */
let _vistas=new Set(DB.citas.filter(c=>c.web&&c.nueva).map(c=>c.id));
function comprobarWeb(){ const nuevo=yhCargar(); const llegan=nuevo.citas.filter(c=>c.web&&c.nueva&&!_vistas.has(c.id)); DB=nuevo;
  llegan.forEach(c=>{ _vistas.add(c.id); sonido(); const s=YH.SV(c.s); toast(`<b>🔔 Nueva reserva desde la web</b>${esc(CL(c.cl).n)} · ${esc(s.n)}<br>${fLarga(c.f)} a las ${c.h}`,'web',7000); RESALTA=c.id; if(VISTA==='agenda') DIA=c.f; });
  if(VISTA!=='web') ir(VISTA,1); else navs(); }  // en «Web» no se repinta para no recargar el móvil de prueba
addEventListener('storage',e=>{ if(e.key===YH_CLAVE) comprobarWeb(); });
let RESALTA=null;

/* WhatsApp en un toque */
const MSG={
 confirmar:(c,a)=>`¡Hola, ${c.n.split(' ')[0]}! 💛 Te confirmamos tu cita en Yahweh Family: ${YH.SV(a.s).n}, ${fLarga(a.f)} a las ${a.h}. ¡Te esperamos!`,
 recordar:(c,a)=>`¡Hola, ${c.n.split(' ')[0]}! Te recordamos tu cita de mañana en Yahweh Family: ${YH.SV(a.s).n} a las ${a.h}. Si no puedes venir, avísanos y te buscamos otro hueco 😊`,
 vuelve:(c,s,d)=>`¡Hola, ${c.n.split(' ')[0]}! 👑 Ya han pasado ${d} días desde tu ${s.n.toLowerCase()} en Yahweh Family. ¿Te reservamos hueco esta semana? Puedes elegir día y hora aquí: airmate.es/yahweh`
};
function wa(txt,quien,alHacer){ velo(`<h3>Mensaje de WhatsApp</h3><div class="mono" style="margin-bottom:10px">Para ${esc(quien)}</div><div class="wab">${esc(txt)}</div>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><a class="btn bw" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}" onclick="setTimeout(()=>{cerrar();${alHacer||''}},250)">Abrir WhatsApp</a></div>
  <p style="font-size:11.5px;color:var(--mu);margin:12px 0 0">En la demo se abre WhatsApp sin destinatario. En vuestro panel se abre el chat de esa clienta con el texto listo: un toque y enviado.</p>`); }
function avisado(k){ DB.avisados[k]=Date.now(); guardar(); toast('✓ Mensaje enviado'); ir(VISTA,1); }

/* navegación */
const VISTAS=[['hoy','◐','Hoy','Hoy'],['agenda','▦','Agenda','Agenda'],['clientas','♡','Clientas','Clientas'],['vuelven','↻','Que vuelvan','Vuelven'],['caja','€','Caja','Caja'],['cifras','▲','Cifras','Cifras'],['web','◎','Tu web de reservas','Web']];
let VISTA='hoy', DIA=HOY, SELCL='c0', TICKET=[], PAGO='Tarjeta';
function navs(){ const v=pendVuelven().length;
  $('nav').innerHTML=VISTAS.map(([k,ic,t])=>`<button class="${VISTA===k?'on':''}" onclick="ir('${k}')"><span class="ic">${ic}</span>${t}${k==='vuelven'&&v?`<span class="bd">${v}</span>`:''}</button>`).join('');
  $('bnav').innerHTML=VISTAS.map(([k,ic,t,c])=>`<button class="${VISTA===k?'on':''}" onclick="ir('${k}')"><span class="ic">${ic}</span>${c}</button>`).join(''); }
function ir(v,quieto){ VISTA=v; navs(); $('main').innerHTML=`<div class="${quieto?'':'vista'}">${R[v]()}</div>`; if(!quieto) scrollTo(0,0); (A[v]||(()=>{}))(); }
function cab(kick,tit,btns=''){ return `<div class="mtop"><div style="display:flex;align-items:center;gap:8px"><svg style="width:34px;height:34px"><use href="#sello"/></svg><b style="font-family:Cinzel;letter-spacing:.12em">YAHWEH</b></div><button class="chip c-n" onclick="reiniciar()">Demo · Reiniciar ↺</button></div><div class="hd"><div><div class="mono">${kick}</div><h1>${tit}</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div>`; }
function contar(){ document.querySelectorAll('[data-n]').forEach(el=>{ const to=+el.dataset.n,suf=el.dataset.s||'',t0=performance.now(); (function p(t){ const k=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-k,4); el.textContent=Math.round(to*e).toLocaleString('es-ES',{useGrouping:'always'})+suf; if(k<1) requestAnimationFrame(p); })(t0); }); }
const R={}, A={};

/* utilidades de negocio */
function pendVuelven(){ const out=[];
  DB.clientas.forEach(c=>{ const futuras=DB.citas.some(a=>a.cl===c.id&&a.f>=HOY&&a.est!=='cancelada'); if(futuras) return;
    const ult=DB.citas.filter(a=>a.cl===c.id&&a.est==='hecha'&&a.f<=HOY).sort((a,b)=>b.f.localeCompare(a.f))[0]; if(!ult) return;
    const s=YH.SV(ult.s); if(!s.vuelve) return; const dias=Math.round((+YH.hoy0-new Date(ult.f+'T00:00'))/864e5);
    if(dias>=s.vuelve-3) out.push({c,s,dias,f:ult.f,k:'vuelve'+c.id+ult.f}); });
  return out.sort((a,b)=>(b.dias-b.s.vuelve)-(a.dias-a.s.vuelve)); }
const citasDia=f=>DB.citas.filter(a=>a.f===f&&a.est!=='cancelada').sort((a,b)=>a.h.localeCompare(b.h));
const colorA=k=>YH.AREA(k).c;

/* HOY */
R.hoy=()=>{ const cs=citasDia(HOY), man=citasDia(YH.masD(1)), web7=DB.citas.filter(a=>a.web&&a.f>=YH.masD(-7)).length, caja=DB.ventas.filter(v=>v.f===HOY).reduce((a,v)=>a+v.imp,0), vuel=pendVuelven();
  const saludo=new Date().getHours()<14?'Buenos días':'Buenas tardes';
  return cab(fLarga(HOY),`${saludo}, <em>Yahweh.</em>`,`<a class="btn bs" href="../" target="_blank" rel="noopener">◎ Abrir la web</a><button class="btn bp" onclick="nuevaCita()">+ Cita</button>`)+
  `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><small>Citas hoy</small><b data-n="${cs.length}">0</b><div class="tr">${cs.filter(a=>a.web).length} reservadas solas desde la web</div></div>
    <div class="card kpi"><small>Reservas web · 7 días</small><b data-n="${web7}">0</b><div class="tr">sin contestar ni un DM</div></div>
    <div class="card kpi"><small>Caja de hoy</small><b data-n="${caja}" data-s=" €">0</b><div class="tr">${DB.ventas.filter(v=>v.f===HOY).length} cobros</div></div>
    <div class="card kpi"><small>Clientas que toca que vuelvan</small><b data-n="${vuel.length}">0</b><div class="tr" style="color:var(--wa)">rellenos, raíces y pestañas</div></div></div>
  <div class="grid g21">
    <div class="card"><div class="sec-t"><h3>Hoy en el salón</h3><button class="btn bs peq" onclick="DIA=HOY;ir('agenda')">Ver agenda →</button></div>
     ${cs.length?cs.map(a=>{ const c=CL(a.cl),s=YH.SV(a.s); return `<div class="row click ${a.id===RESALTA?'brilla':''}" onclick="verCita('${a.id}')"><span class="t">${a.h}</span><div class="av" style="background:${colorA(s.a)}">${ini(c.n)}</div><div class="x"><b>${esc(c.n)}</b><small>${esc(s.n)} · ${dur(s.min)}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`; }).join(''):'<div class="empty">Sin citas hoy</div>'}</div>
    <div>
     <div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Confirmar mañana</h3><span class="chip c-n">${man.length}</span></div>
      ${man.slice(0,5).map(a=>{ const c=CL(a.cl),k='rec'+a.id; return `<div class="row"><span class="t">${a.h}</span><div class="x"><b>${esc(c.n)}</b><small>${esc(YH.SV(a.s).n)}</small></div>${DB.avisados[k]?'<span class="chip c-ok">Avisada</span>':`<button class="btn bw peq" onclick="wa(MSG.recordar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${a.id}')),'${esc(c.n)}','avisado(\\'${k}\\')')">Recordar</button>`}</div>`; }).join('')||'<div class="empty">Nada para mañana</div>'}</div>
     <div class="card"><div class="sec-t"><h3>Que vuelvan</h3><button class="btn bs peq" onclick="ir('vuelven')">Ver todas →</button></div>
      ${vuel.slice(0,3).map(v=>`<div class="row"><span>↻</span><div class="x"><b>${esc(v.c.n)}</b><small>${esc(v.s.n)} hace ${v.dias} días</small></div>${DB.avisados[v.k]?'<span class="chip c-ok">Avisada</span>':'<span class="chip c-wa">Toca</span>'}</div>`).join('')||'<div class="empty">Todas al día</div>'}</div>
    </div></div>`; };
A.hoy=contar;
function chipEst(a){ return a.est==='hecha'?'<span class="chip c-ok">Atendida</span>':a.est==='noshow'?'<span class="chip c-r">No vino</span>':a.est==='cabina'?'<span class="chip c-g">En cabina</span>':'<span class="chip c-bl">Confirmada</span>'; }

/* AGENDA por áreas */
const H0=YH.min('09:30'), PX=44/30;
R.agenda=()=>{ const cs=citasDia(DIA), x=new Date(DIA+'T12:00');
  let g=`<div class="ag"><div class="h"></div>${YH_AREAS.map(a=>`<div class="h"><i style="background:${a.c}"></i>${a.n}</div>`).join('')}`;
  g+=`<div class="hcol">${YH_HORAS.map(h=>`<div class="hr">${h}</div>`).join('')}</div>`;
  g+=YH_AREAS.map(a=>`<div class="col">${YH_HORAS.map(h=>`<div class="sl" onclick="nuevaCita('${DIA}','${h}','${a.k}')"></div>`).join('')}${cs.filter(c=>YH.SV(c.s).a===a.k).map(c=>{ const s=YH.SV(c.s), top=(YH.min(c.h)-H0)*PX+1, alto=Math.max(40,s.min*PX-3);
    return `<div class="ev ${c.est==='hecha'?'hecha':''} ${c.web?'web':''} ${c.id===RESALTA?'brilla':''}" style="top:${top}px;height:${alto}px;background:${a.c}" onclick="verCita('${c.id}')"><b>${esc(CL(c.cl).n)}</b><small>${c.h} · ${esc(s.n)}</small></div>`; }).join('')}</div>`).join('');
  const ah=new Date().getHours()*60+new Date().getMinutes(); if(DIA===HOY&&ah>=H0&&ah<=20*60) g+=`<div class="ahora" style="top:${(ah-H0)*PX+44}px"></div>`;
  return cab('Agenda · '+fLarga(DIA),`${DN[x.getDay()]} <em>${x.getDate()}</em>`,`<div class="dia-nav"><button class="btn bs" onclick="moverDia(-1)">‹</button><button class="btn bs" onclick="DIA=HOY;ir('agenda',1)">Hoy</button><button class="btn bs" onclick="moverDia(1)">›</button></div><button class="btn bp" onclick="nuevaCita('${DIA}')">+ Cita</button>`)+
  `<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:10px"><span>${cs.length} citas</span><span><b style="font-size:10px;background:var(--cr2);padding:1px 5px;border-radius:5px">WEB</b> = la reservó la clienta sola</span><span>Pulsa un hueco para añadir una cita</span></div>`+g+'</div>'; };
function moverDia(n){ let d=new Date(DIA+'T12:00'); do{ d=new Date(+d+n*864e5); }while(d.getDay()===0); DIA=YH.iso(d); ir('agenda',1); }

function verCita(id){ const a=DB.citas.find(x=>x.id===id), c=CL(a.cl), s=YH.SV(a.s);
  velo(`<h3>${esc(c.n)}</h3><div class="mono">${esc(s.n)} · ${dur(s.min)}</div><p style="font-size:15px;margin:14px 0">${fLarga(a.f)} · <b>${a.h}</b></p>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${chipEst(a)}${a.web?'<span class="chip c-g">Reservó desde la web</span>':''}<span class="chip c-n">Vino por ${esc(c.orig)}</span>${c.notas?`<span class="chip c-wa">📝 ${esc(c.notas.slice(0,40))}${c.notas.length>40?'…':''}</span>`:''}</div>
  <div class="pie">
   <button class="btn bs" onclick="estado('${id}','cancelada')">Cancelar</button>
   <button class="btn bs" onclick="cerrar();SELCL='${a.cl}';ir('clientas')">Ficha</button>
   <button class="btn bw" onclick="cerrar();wa(MSG.confirmar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${id}')),'${esc(c.n)}')">Confirmar por WhatsApp</button>
   ${a.est!=='hecha'?`<button class="btn bs" onclick="estado('${id}','noshow')">No vino</button><button class="btn bp" onclick="cobrarCita('${id}')">✓ Atendida y cobrar</button>`:''}
  </div>`); }
function estado(id,e){ const a=DB.citas.find(x=>x.id===id); a.est=e; guardar(); cerrar(); toast(e==='cancelada'?'Cita cancelada · el hueco vuelve a estar libre en la web':e==='noshow'?'Marcada como «no vino» · queda en su ficha':'✓ Hecho'); ir(VISTA,1); }
function cobrarCita(id){ const a=DB.citas.find(x=>x.id===id); a.est='hecha'; guardar(); cerrar(); TICKET=[{n:YH.SV(a.s).n,p:YH.SV(a.s).p,a:YH.SV(a.s).a,cl:a.cl}]; ir('caja'); }
function nuevaCita(f,h,area){ f=f||HOY; const ss=YH_SERV.filter(s=>!area||s.a===area);
  velo(`<h3>Nueva cita</h3><label>Clienta</label><select id="nC">${DB.clientas.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select>
  <label>Servicio</label><select id="nS">${ss.map(s=>`<option value="${s.k}">${esc(s.n)} · ${dur(s.min)}</option>`).join('')}</select>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Día</label><input type="date" id="nF" value="${f}"></div><div><label>Hora</label><select id="nH">${YH_HORAS.map(x=>`<option ${x===h?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <p id="nE" style="color:var(--r);font-size:13px;min-height:16px;margin:8px 0 0"></p>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="guardaCita()">Guardar</button></div>`); }
function guardaCita(){ const f=$('nF').value,h=$('nH').value,s=$('nS').value; if(!YH.libre(DB,f,h,s)){ $('nE').textContent='Ese hueco ya está ocupado en '+YH.AREA(YH.SV(s).a).n+'.'; return; }
  const id='a'+Date.now(); DB.citas.push({id,f,h,cl:$('nC').value,s,est:'conf'}); guardar(); cerrar(); sonido(); toast('✓ Cita guardada · ese hueco ya no sale libre en la web'); RESALTA=id; ir(VISTA,1); }

/* CLIENTAS */
R.clientas=()=>cab(DB.clientas.length+' clientas','Cada clienta, <em>con su historia.</em>',`<button class="btn bp" onclick="nuevaClienta()">+ Clienta</button>`)+
  `<div class="cl-wrap"><div><input class="search" placeholder="Buscar por nombre o teléfono…" oninput="$('clist').innerHTML=listaCl(this.value)"><div class="clist" id="clist">${listaCl('')}</div></div><div id="ficha">${ficha(CL(SELCL))}</div></div>`;
function listaCl(q){ q=q.toLowerCase(); return DB.clientas.filter(c=>c.n.toLowerCase().includes(q)||c.tel.includes(q)).map(c=>`<div class="ci ${c.id===SELCL?'on':''}" onclick="SELCL='${c.id}';document.querySelectorAll('.ci').forEach(x=>x.classList.remove('on'));this.classList.add('on');$('ficha').innerHTML=ficha(CL('${c.id}'));if(innerWidth<900)$('ficha').scrollIntoView({behavior:'smooth'})"><div class="av">${ini(c.n)}</div><div><b>${esc(c.n)}</b><small>${resumenCl(c)}</small></div></div>`).join('')||'<div class="empty">Nadie con ese nombre</div>'; }
function resumenCl(c){ const v=DB.citas.filter(a=>a.cl===c.id&&a.est==='hecha').sort((a,b)=>b.f.localeCompare(a.f)); return v.length?`Última: ${esc(YH.SV(v[0].s).n.toLowerCase())} · ${fCorta(v[0].f)}`:'Clienta nueva'; }
function ficha(c){ const vis=DB.citas.filter(a=>a.cl===c.id).sort((a,b)=>b.f.localeCompare(a.f)), hechas=vis.filter(a=>a.est==='hecha'), gast=hechas.reduce((t,a)=>t+YH.SV(a.s).p,0), fut=vis.filter(a=>a.f>=HOY&&a.est!=='hecha'&&a.est!=='cancelada');
  const ult=hechas[0], sug=ult&&YH.SV(ult.s).vuelve?YH.masD(Math.round((new Date(ult.f+'T00:00')-YH.hoy0)/864e5)+YH.SV(ult.s).vuelve):null, nos=vis.filter(a=>a.est==='noshow').length;
  return `<div class="card">
   <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
    <div style="display:flex;gap:14px;align-items:center"><div class="av" style="width:56px;height:56px;font-size:18px">${ini(c.n)}</div><div><div class="serif" style="font-size:32px;line-height:1">${esc(c.n)}</div><div style="color:var(--mu);font-size:13px;margin-top:5px">Clienta desde ${fCorta(c.alta)} · vino por ${esc(c.orig)} · ${esc(c.tel)}</div></div></div>
    <button class="btn bp peq" onclick="nuevaCita()">+ Cita</button></div>
   <div class="grid g3" style="margin:18px 0">
    <div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Visitas</small><b>${hechas.length}</b></div>
    <div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Gastado</small><b>${eur(gast)}</b></div>
    <div class="card kpi" style="box-shadow:none;background:var(--cr)"><small>Debería volver</small><b style="font-size:26px;margin-top:12px">${sug?fCorta(sug):'—'}</b></div></div>
   ${nos?`<p class="chip c-r" style="margin:0 0 12px">No vino ${nos} vez${nos>1?'es':''}</p>`:''}
   <div class="mono" style="margin-bottom:6px">Notas · fórmula de color, alergias, gustos</div>
   <textarea class="nota" onchange="CL('${c.id}').notas=this.value;guardar();toast('✓ Nota guardada')" placeholder="Ej.: tinte 6.66 + 20 vol, 35 min · alergia al látex">${esc(c.notas||'')}</textarea>
   <div class="sec-t" style="margin-top:16px"><h3>Historial</h3></div>
   ${vis.map(a=>`<div class="row"><span class="t" style="width:62px">${fCorta(a.f)}</span><div class="av" style="background:${colorA(YH.SV(a.s).a)};width:26px;height:26px;font-size:10px">${YH.AREA(YH.SV(a.s).a).n[0]}</div><div class="x"><b>${esc(YH.SV(a.s).n)}</b><small>${a.h}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`).join('')||'<div class="empty">Sin visitas todavía</div>'}
  </div>`; }
function nuevaClienta(){ velo(`<h3>Nueva clienta</h3><label>Nombre y apellidos</label><input id="cN"><label>Móvil</label><input id="cT" inputmode="tel"><label>Cómo nos conoció</label><select id="cO"><option>Instagram</option><option>Recomendación</option><option>De paso</option><option>Web</option></select>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="if($('cN').value.trim().length<3)return;const id='c'+Date.now();DB.clientas.unshift({id,n:$('cN').value.trim(),tel:$('cT').value,orig:$('cO').value,alta:HOY,notas:''});guardar();SELCL=id;cerrar();toast('✓ Clienta guardada');ir('clientas',1)">Guardar</button></div>`); }

/* QUE VUELVAN */
R.vuelven=()=>{ const l=pendVuelven();
  return cab('Rellenos, raíces y pestañas','Que <em>vuelvan.</em>')+
  `<div class="card" style="margin-bottom:14px;background:var(--gb);box-shadow:none"><b>Cómo funciona:</b> cada servicio tiene su ritmo (relleno de uñas cada 3 semanas, raíz cada 5, pestañas cada 3…). Cuando a una clienta le toca y no tiene cita, sale aquí con el mensaje ya escrito. Un toque y le llega por WhatsApp.</div>
  <div class="card">${l.map(v=>`<div class="row"><div class="av" style="background:${colorA(v.s.a)}">${ini(v.c.n)}</div><div class="x"><b>${esc(v.c.n)}</b><small>${esc(v.s.n)} el ${fCorta(v.f)} · hace ${v.dias} días (vuelve cada ${v.s.vuelve})</small></div>${v.dias>v.s.vuelve?'<span class="chip c-r">Se pasó</span>':'<span class="chip c-wa">Le toca</span>'}${DB.avisados[v.k]?'<span class="chip c-ok">Avisada</span>':`<button class="btn bw peq" onclick="wa(MSG.vuelve(CL('${v.c.id}'),YH.SV('${YH_SERV.find(s=>s===v.s).k}'),${v.dias}),'${esc(v.c.n)}','avisado(\\'${v.k}\\')')">WhatsApp</button>`}</div>`).join('')||'<div class="empty">Todas tus clientas tienen su próxima cita 👑</div>'}</div>`; };

/* CAJA */
R.caja=()=>{ const hoyV=DB.ventas.filter(v=>v.f===HOY), tot=TICKET.reduce((a,l)=>a+l.p,0), met={}; hoyV.forEach(v=>met[v.pago]=(met[v.pago]||0)+v.imp);
  return cab('Caja · '+fLarga(HOY),'Cobrar en <em>un momento.</em>')+
  `<div class="cj"><div><div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Servicios</h3><span class="mono">Toca para añadir</span></div><div class="cj-s">${YH_SERV.map(s=>`<button onclick="TICKET.push({n:'${esc(s.n)}',p:${s.p},a:'${s.a}'});ir('caja',1)"><b>${esc(s.n)}</b><span>${s.p} €</span></button>`).join('')}</div></div>
   <div class="card"><div class="sec-t"><h3>Cobrado hoy</h3><b class="serif" style="font-size:26px">${eur(hoyV.reduce((a,v)=>a+v.imp,0))}</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${Object.entries(met).map(([m,v])=>`<span class="chip c-n">${m}: ${eur(v)}</span>`).join('')}</div>
    ${hoyV.slice().reverse().map(v=>`<div class="row"><div class="x"><b>${esc(v.c)}</b><small>${esc(CL(v.cl).n)} · ${v.pago}</small></div><b>${eur(v.imp)}</b></div>`).join('')||'<div class="empty">Aún nada</div>'}</div></div>
  <div class="card tk"><div class="sec-t"><h3>Ticket</h3>${TICKET.length?'<button class="chip c-n" onclick="TICKET=[];ir(\'caja\',1)">Vaciar</button>':''}</div>
   ${TICKET.map((l,i)=>`<div class="ln"><span>${esc(l.n)}</span><span>${l.p} € <button style="color:var(--mu)" onclick="TICKET.splice(${i},1);ir('caja',1)">✕</button></span></div>`).join('')||'<div class="empty">Añade servicios o cobra una cita desde la agenda</div>'}
   <div class="tot">${eur(tot)}</div>
   <div class="pagos">${['Tarjeta','Efectivo','Bizum'].map(m=>`<button class="${PAGO===m?'on':''}" onclick="PAGO='${m}';ir('caja',1)">${m}</button>`).join('')}</div>
   <button class="btn bg" style="width:100%;justify-content:center;margin-top:12px;padding:14px" ${TICKET.length?'':'disabled'} onclick="cobrar()">Cobrar ${eur(tot)}</button></div></div>`; };
function cobrar(){ if(!TICKET.length) return; TICKET.forEach(l=>DB.ventas.push({id:'v'+Date.now()+Math.random(),f:HOY,cl:l.cl||'c0',c:l.n,a:l.a,imp:l.p,pago:PAGO})); guardar(); sonido(); toast('✓ Cobrado '+eur(TICKET.reduce((a,l)=>a+l.p,0))+' · '+PAGO); TICKET=[]; ir('caja',1); }

/* CIFRAS */
R.cifras=()=>{ const sem=[3,2,1,0].map(k=>{ const d0=YH.masD(-7*k-6), d1=YH.masD(-7*k); return {t:k?`Hace ${k} sem.`:'Esta semana', v:DB.ventas.filter(v=>v.f>=d0&&v.f<=d1).reduce((a,v)=>a+v.imp,0)}; }), mx=Math.max(...sem.map(s=>s.v))||1;
  const porA=YH_AREAS.map(a=>({a, v:DB.ventas.filter(v=>v.a===a.k&&v.f>=YH.masD(-27)).reduce((t,v)=>t+v.imp,0)})), totA=porA.reduce((t,x)=>t+x.v,0)||1;
  const orig={}; DB.clientas.forEach(c=>orig[c.orig]=(orig[c.orig]||0)+1);
  const cit=DB.citas.filter(a=>a.f>=YH.masD(-27)&&a.f<=HOY), web=cit.filter(a=>a.web).length, ns=cit.filter(a=>a.est==='noshow').length;
  let ang=0; const donut=porA.map(x=>{ const p=x.v/totA, a0=ang; ang+=p*360; const r=60, big=p>.5?1:0, rad=d=>(d-90)*Math.PI/180, x0=80+r*Math.cos(rad(a0)), y0=80+r*Math.sin(rad(a0)), x1=80+r*Math.cos(rad(ang)), y1=80+r*Math.sin(rad(ang)); return `<path d="M80 80 L${x0} ${y0} A${r} ${r} 0 ${big} 1 ${x1} ${y1} Z" fill="${x.a.c}"/>`; }).join('');
  return cab('Últimas 4 semanas','Tus <em>números.</em>')+
  `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><small>Ingresos 4 semanas</small><b data-n="${sem.reduce((a,s)=>a+s.v,0)}" data-s=" €">0</b></div>
    <div class="card kpi"><small>Citas</small><b data-n="${cit.length}">0</b></div>
    <div class="card kpi"><small>Reservadas desde la web</small><b data-n="${web}">0</b><div class="tr">${cit.length?Math.round(web*100/cit.length):0}% del total</div></div>
    <div class="card kpi"><small>No vinieron</small><b data-n="${ns}">0</b><div class="tr" style="color:var(--mu)">quedan apuntadas en su ficha</div></div></div>
  <div class="grid g21"><div class="card"><div class="sec-t"><h3>Ingresos por semana</h3></div><div class="bars">${sem.map(s=>`<div><em>${eur(s.v)}</em><i style="height:${Math.max(6,s.v*100/mx)}%"></i><span>${s.t}</span></div>`).join('')}</div></div>
   <div class="card"><div class="sec-t"><h3>Por área</h3></div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" style="width:140px;height:140px">${donut}<circle cx="80" cy="80" r="34" fill="#fff"/></svg><div class="lg" style="flex:1;min-width:150px">${porA.map(x=>`<div><i style="background:${x.a.c}"></i>${x.a.n}<b>${eur(x.v)}</b></div>`).join('')}</div></div>
    <div class="sec-t" style="margin-top:14px"><h3>Cómo os conocen</h3></div><div class="lg">${Object.entries(orig).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`<div><i style="background:var(--g2)"></i>${o}<b>${n}</b></div>`).join('')}</div></div></div>`; };
A.cifras=contar;

/* WEB */
R.web=()=>cab('airmate.es/yahweh','Tu web <em>de reservas.</em>',`<a class="btn bg" href="../" target="_blank" rel="noopener">Abrir en otra pestaña ↗</a>`)+
  `<div class="webw"><div class="movil"><iframe src="../#reservar" title="Web de Yahweh Family"></iframe></div>
   <div><div class="card" style="max-width:460px"><h3 class="serif" style="font-size:30px;margin:0 0 8px">Pruébalo ahora.</h3>
    <p style="color:var(--mu);line-height:1.6;margin:0 0 12px">Reserva una cita en el móvil de la izquierda, como lo haría una clienta a las 11 de la noche. En cuanto la confirmes, <b style="color:var(--ink)">suena aquí y aparece en tu agenda</b>, sin que nadie conteste ningún mensaje.</p>
    <div class="row"><span>✦</span><div class="x"><b>Solo enseña huecos libres</b><small>Si un servicio dura 3 horas, no deja reservar donde no cabe.</small></div></div>
    <div class="row"><span>✦</span><div class="x"><b>Abierta las 24 horas</b><small>Las clientas reservan cuando les viene bien.</small></div></div>
    <div class="row"><span>✦</span><div class="x"><b>Tu marca, tus fotos</b><small>Con vuestro trabajo de Instagram.</small></div></div></div></div></div>`;

/* modal */
function velo(h){ cerrar(); const v=document.createElement('div'); v.className='velo'; v.id='velo'; v.innerHTML=`<div class="modal">${h}</div>`; v.onclick=e=>{ if(e.target===v) cerrar(); }; document.body.appendChild(v); }
function cerrar(){ $('velo')?.remove(); }
addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });

/* arranque */
const q=new URLSearchParams(location.search); if(q.get('v')&&R[q.get('v')]) VISTA=q.get('v');
ir(VISTA);
setTimeout(()=>$('intro').classList.add('fuera'),q.has('rapido')?0:1500);
</script>
