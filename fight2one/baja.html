<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Baja · Fight2One</title>
<style>
:root{--bg:#0b0a08;--ink:#f3eee4;--mut:#9c927f;--gold:#D4A72C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px 16px;text-align:center}
.caja{max-width:440px}
.marca{color:var(--gold);font-weight:900;letter-spacing:.14em;font-size:22px;text-decoration:none}
h1{font-size:30px;text-transform:uppercase;margin:26px 0 12px;line-height:1.1}
p{color:var(--mut);line-height:1.55;margin:0 0 22px}
a.btn{display:inline-block;background:var(--gold);color:#0b0a08;font-weight:800;text-decoration:none;padding:14px 26px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;font-size:14px}
</style>
</head>
<body>
<main class="caja">
  <a class="marca" href="./">FIGHT2ONE</a>
  <h1 id="tit">Un momento…</h1>
  <p id="txt">Estamos quitando tu email de La Grada.</p>
  <a class="btn" href="./">Volver a la web</a>
</main>
<script>
const SB_URL='https://vjofxmfwdybktpwiuanc.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE';
const t=new URLSearchParams(location.search).get('t')||'';
const pon=(a,b)=>{ document.getElementById('tit').textContent=a; document.getElementById('txt').textContent=b; };
if(!/^[0-9a-f-]{36}$/i.test(t)){ pon('Enlace no válido','Usa el enlace «Darme de baja» que viene al final de cualquiera de nuestros emails.'); }
else fetch(SB_URL+'/rest/v1/rpc/f2o_lista_baja',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_ANON,Authorization:'Bearer '+SB_ANON},body:JSON.stringify({p_token:t})})
  .then(r=>{ if(!r.ok) throw 0; pon('Hecho','Ya no recibirás más emails de Fight2One. Si cambias de idea, puedes volver a apuntarte en la web.'); try{ localStorage.removeItem('f2o_lista'); }catch(e){} })
  .catch(()=>pon('No se pudo','Inténtalo de nuevo en un rato. Si sigue fallando, responde a cualquiera de nuestros emails y te damos de baja a mano.'));
</script>
</body>
</html>
