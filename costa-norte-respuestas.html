<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costa Norte · Respuestas del formulario</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0a2540;--orange:#ff5e3a;--border:#dde2ea;--light:#f7f9fc}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--light);color:#1a1a2e;min-height:100vh}

.header{background:linear-gradient(135deg,var(--blue),#1d5a7d);color:#fff;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header-left h1{font-size:20px;font-weight:800;margin-bottom:3px}
.header-left p{font-size:13px;opacity:.7}
.badge{background:var(--orange);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.btn-clear{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-clear:hover{background:rgba(255,255,255,.22)}

.wrap{max-width:900px;margin:0 auto;padding:28px 20px}

.empty{text-align:center;padding:80px 20px;color:#94a3b8}
.empty .ico{font-size:56px;margin-bottom:16px}
.empty h2{font-size:18px;font-weight:700;color:#475569;margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6}
.empty a{color:var(--orange);text-decoration:none;font-weight:600}

.submission{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sub-hd{background:var(--blue);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.sub-hd-left h2{font-size:15px;font-weight:700;margin-bottom:2px}
.sub-hd-left p{font-size:12px;opacity:.7}
.sub-hd-right{display:flex;align-items:center;gap:8px}
.n-badge{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.btn-del{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:7px;font-size:11px;cursor:pointer;font-family:inherit}
.btn-del:hover{background:rgba(239,68,68,.3);border-color:rgba(239,68,68,.5)}

.section-block{border-bottom:1px solid var(--border)}
.section-block:last-child{border-bottom:none}
.sec-title{padding:12px 22px;background:#f8fafc;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#64748b;border-bottom:1px solid var(--border)}
.qa-row{padding:12px 22px;display:grid;grid-template-columns:240px 1fr;gap:16px;border-bottom:1px solid #f1f5f9;align-items:start}
.qa-row:last-child{border-bottom:none}
.qa-q{font-size:12px;color:#64748b;font-weight:500;line-height:1.4}
.qa-a{font-size:13px;color:#1a1a2e;font-weight:600;line-height:1.5;word-break:break-word}

@media(max-width:540px){.qa-row{grid-template-columns:1fr;gap:4px}.qa-q{font-size:11px}}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar span{font-size:13px;color:#64748b}
.btn-exp{background:#fff;border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;color:#475569;transition:all .15s}
.btn-exp:hover{border-color:var(--orange);color:var(--orange)}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Costa Norte · Respuestas</h1>
    <p>Formulario de onboarding CRM · Airmate</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="badge" id="total-badge">0 envíos</span>
    <button class="btn-clear" onclick="limpiarTodo()">Borrar todo</button>
  </div>
</div>

<div class="wrap">
  <div id="content"></div>
</div>

<script>
function cargar(){
  const data=JSON.parse(localStorage.getItem('cn-respuestas')||'[]');
  const cont=document.getElementById('content');
  const badge=document.getElementById('total-badge');
  badge.textContent=data.length+' envío'+(data.length!==1?'s':'');

  if(!data.length){
    cont.innerHTML=`<div class="empty">
      <div class="ico">📭</div>
      <h2>Todavía no hay respuestas</h2>
      <p>Cuando la secretaria envíe el formulario,<br>las respuestas aparecerán aquí automáticamente.<br><br>
      <a href="costa-norte-form-secretaria.html">Abrir el formulario →</a></p>
    </div>`;
    return;
  }

  // Toolbar
  let html=`<div class="toolbar">
    <span>${data.length} envío${data.length!==1?'s'':''} recibido${data.length!==1?'s':''}</span>
    <button class="btn-exp" onclick="exportarTexto()">Exportar como texto</button>
    <a href="costa-norte-form-secretaria.html" style="margin-left:auto;color:var(--orange);font-size:12px;font-weight:600;text-decoration:none">Ver formulario →</a>
  </div>`;

  // Envíos de más reciente a más antiguo
  [...data].reverse().forEach((sub,idx)=>{
    html+=`<div class="submission">
      <div class="sub-hd">
        <div class="sub-hd-left">
          <h2>${sub.quien}</h2>
          <p>${sub.fecha}${sub.email?' · '+sub.email:''}</p>
        </div>
        <div class="sub-hd-right">
          <span class="n-badge">Envío ${data.length-idx}</span>
          <button class="btn-del" onclick="borrarEnvio(${sub.id})">Borrar</button>
        </div>
      </div>`;

    Object.entries(sub.campos).forEach(([seccion,preguntas])=>{
      html+=`<div class="section-block">
        <div class="sec-title">${seccion}</div>`;
      preguntas.forEach(({pregunta,respuesta})=>{
        html+=`<div class="qa-row">
          <div class="qa-q">${pregunta}</div>
          <div class="qa-a">${respuesta.replace(/\n/g,'<br>')}</div>
        </div>`;
      });
      html+=`</div>`;
    });

    html+=`</div>`;
  });

  cont.innerHTML=html;
}

function borrarEnvio(id){
  if(!confirm('¿Borrar este envío?'))return;
  const data=JSON.parse(localStorage.getItem('cn-respuestas')||'[]');
  localStorage.setItem('cn-respuestas',JSON.stringify(data.filter(s=>s.id!==id)));
  cargar();
}

function limpiarTodo(){
  if(!confirm('¿Borrar TODOS los envíos? Esto no se puede deshacer.'))return;
  localStorage.removeItem('cn-respuestas');
  cargar();
}

function exportarTexto(){
  const data=JSON.parse(localStorage.getItem('cn-respuestas')||'[]');
  let txt='RESPUESTAS COSTA NORTE · CRM AIRMATE\n';
  txt+='Exportado: '+new Date().toLocaleString('es-ES')+'\n';
  txt+='='.repeat(50)+'\n\n';
  [...data].reverse().forEach((sub,i)=>{
    txt+=`ENVÍO ${i+1} · ${sub.quien} · ${sub.fecha}\n`;
    txt+='-'.repeat(40)+'\n';
    Object.entries(sub.campos).forEach(([sec,qs])=>{
      txt+=`\n[${sec.toUpperCase()}]\n`;
      qs.forEach(({pregunta,respuesta})=>{txt+=`  · ${pregunta}: ${respuesta}\n`;});
    });
    txt+='\n';
  });
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='costa-norte-respuestas-'+Date.now()+'.txt';
  a.click();
}

cargar();
// Refresca si otra pestaña actualiza localStorage
window.addEventListener('storage',e=>{if(e.key==='cn-respuestas')cargar();});
</script>
</body>
</html>
