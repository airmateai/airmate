<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Costa Norte · Respuestas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#0a2540;--orange:#ff5e3a;--border:#dde2ea;--light:#f7f9fc}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--light);color:#1a1a2e;min-height:100vh}
.header{background:linear-gradient(135deg,var(--blue),#1d5a7d);color:#fff;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:800;margin-bottom:3px}
.header p{font-size:13px;opacity:.7}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--orange);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);padding:8px 16px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn-ref{background:var(--orange);border-color:var(--orange)}

.wrap{max-width:920px;margin:0 auto;padding:28px 20px}

.empty{text-align:center;padding:80px 20px;color:#94a3b8}
.empty .ico{font-size:56px;margin-bottom:16px}
.empty h2{font-size:18px;font-weight:700;color:#475569;margin-bottom:8px}
.empty p{font-size:14px;line-height:1.6}
.empty a{color:var(--orange);font-weight:600}

.loading{text-align:center;padding:60px;color:#64748b;font-size:14px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar span{font-size:13px;color:#64748b}

.submission{background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.sub-hd{background:var(--blue);color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.sub-hd h2{font-size:15px;font-weight:700;margin-bottom:2px}
.sub-hd p{font-size:12px;opacity:.7}
.sub-hd-right{display:flex;align-items:center;gap:8px}
.n-badge{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}

.sec-title{padding:11px 22px;background:#f8fafc;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#64748b;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.qa-row{padding:12px 22px;display:grid;grid-template-columns:240px 1fr;gap:16px;border-bottom:1px solid #f1f5f9;align-items:start}
.qa-row:last-child{border-bottom:none}
.qa-q{font-size:12px;color:#64748b;font-weight:500;line-height:1.4}
.qa-a{font-size:13px;color:#1a1a2e;font-weight:600;line-height:1.5;word-break:break-word}

@media(max-width:540px){.qa-row{grid-template-columns:1fr;gap:3px}.qa-q{font-size:11px;color:#94a3b8}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Costa Norte · Respuestas del formulario</h1>
    <p>CRM Airmate · onboarding</p>
  </div>
  <div class="hright">
    <span class="badge" id="total-badge">Cargando…</span>
    <button class="btn btn-ref" onclick="cargar()">Actualizar</button>
    <button class="btn" onclick="exportarTexto()">Exportar .txt</button>
  </div>
</div>

<div class="wrap">
  <div id="content"><div class="loading">Cargando respuestas…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _sb=supabase.createClient(
  'https://vjofxmfwdybktpwiuanc.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqb2Z4bWZ3ZHlia3Rwd2l1YW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzU5NDYsImV4cCI6MjA5MDA1MTk0Nn0.ixU-33c0FEkO7F5xjWb3YHkvj_pQuR0gsJETrGA8ZTE'
);

let _data=[];

async function cargar(){
  document.getElementById('content').innerHTML='<div class="loading">Cargando…</div>';
  const {data,error}=await _sb.from('cn_form_respuestas').select('*').order('created_at',{ascending:false});
  if(error){
    document.getElementById('content').innerHTML=`<div class="empty"><div class="ico">⚠️</div><h2>Error al cargar</h2><p>${error.message}</p></div>`;
    return;
  }
  _data=data||[];
  render(_data);
}

function render(data){
  const badge=document.getElementById('total-badge');
  badge.textContent=data.length+' envío'+(data.length!==1?'s':'');
  const cont=document.getElementById('content');

  if(!data.length){
    cont.innerHTML=`<div class="empty">
      <div class="ico">📭</div>
      <h2>Todavía no hay respuestas</h2>
      <p>Cuando la secretaria envíe el formulario aparecerá aquí.<br><br>
      <a href="costa-norte-form-secretaria.html">Ver el formulario →</a></p>
    </div>`;
    return;
  }

  let html=`<div class="toolbar">
    <span>${data.length} envío${data.length!==1?'s':''} recibido${data.length!==1?'s':''}</span>
    <a href="costa-norte-form-secretaria.html" style="margin-left:auto;color:var(--orange);font-size:12px;font-weight:600;text-decoration:none">Ver formulario →</a>
  </div>`;

  data.forEach((sub,idx)=>{
    const fecha=new Date(sub.created_at).toLocaleString('es-ES');
    html+=`<div class="submission">
      <div class="sub-hd">
        <div>
          <h2>${sub.quien||'Sin nombre'}</h2>
          <p>${fecha}${sub.email?' · '+sub.email:''}</p>
        </div>
        <div class="sub-hd-right">
          <span class="n-badge">Envío ${data.length-idx}</span>
        </div>
      </div>`;

    const campos=sub.campos||{};
    Object.entries(campos).forEach(([seccion,preguntas])=>{
      html+=`<div class="sec-title">${seccion}</div>`;
      (preguntas||[]).forEach(({pregunta,respuesta})=>{
        html+=`<div class="qa-row">
          <div class="qa-q">${pregunta}</div>
          <div class="qa-a">${String(respuesta).replace(/\n/g,'<br>')}</div>
        </div>`;
      });
    });
    html+=`</div>`;
  });

  cont.innerHTML=html;
}

function exportarTexto(){
  if(!_data.length){alert('No hay respuestas todavía.');return;}
  let txt='RESPUESTAS COSTA NORTE · CRM AIRMATE\n';
  txt+='Exportado: '+new Date().toLocaleString('es-ES')+'\n'+'='.repeat(50)+'\n\n';
  _data.forEach((sub,i)=>{
    txt+=`ENVÍO ${i+1} · ${sub.quien||'—'} · ${new Date(sub.created_at).toLocaleString('es-ES')}\n`;
    txt+='-'.repeat(40)+'\n';
    Object.entries(sub.campos||{}).forEach(([sec,qs])=>{
      txt+=`\n[${sec.toUpperCase()}]\n`;
      (qs||[]).forEach(({pregunta,respuesta})=>{txt+=`  · ${pregunta}: ${respuesta}\n`;});
    });
    txt+='\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
  a.download='costa-norte-respuestas.txt';
  a.click();
}

cargar();
// Refresco automático cada 30s
setInterval(cargar,30000);
</script>
</body>
</html>
