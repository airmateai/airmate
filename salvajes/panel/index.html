<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Salvajes · Panel 3 sedes (demo)</title>
<meta name="theme-color" content="#f6f6f4">
<link rel="icon" href="../img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Salvajes · Panel · sistema visual sobrio tipo software de gestión */
:root{--bg:#f6f6f4;--bg2:#efeeeb;--w:#fff;--ink:#17171a;--ink2:#3a3a40;--mu:#6e6e76;--mu2:#9b9ba3;--bd:#e4e3df;--bd2:#d6d5d0;--acc:#7a1f2b;--acc2:#5f1621;--accb:#f6eceb;--ok:#1d7a46;--okb:#eaf5ee;--wa:#a15c07;--wab:#fbf1e1;--r:#b42318;--rb:#fdeceb;--bl:#2c5aa0;--blb:#ebf1fa;--side:248px;--rad:8px;--sh:0 1px 2px rgba(16,16,20,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111113;--bg2:#19191c;--w:#18181b;--ink:#ededef;--ink2:#cfcfd4;--mu:#9a9aa3;--mu2:#6f6f78;--bd:#27272b;--bd2:#34343a;--accb:#2a1619;--okb:#132219;--wab:#2a1f10;--rb:#2c1514;--blb:#141d2b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mono{font-size:12px;color:var(--mu);font-weight:500}
/* barra lateral */
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);background:var(--bg2);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;z-index:30}
.ws{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.ws img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.ws b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}.ws small{display:block;color:var(--mu);font-size:12px}
.sede-sel{display:block;margin:0 4px 14px;position:relative}
.sede-sel select{appearance:none;width:100%;background:var(--w);border:1px solid var(--bd);border-radius:var(--rad);padding:8px 30px 8px 10px;font-size:13px;font-weight:500;box-shadow:var(--sh);cursor:pointer}
.sede-sel::after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--mu);border-bottom:1.5px solid var(--mu);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.nav{display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav .grp{font-size:11px;font-weight:600;color:var(--mu2);padding:14px 10px 6px;letter-spacing:.02em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;color:var(--ink2);font-weight:500;font-size:13.5px;text-align:left}
.nav button svg{color:var(--mu)}
.nav button:hover{background:rgba(127,127,135,.1)}
.nav button.on{background:var(--w);color:var(--ink);box-shadow:0 0 0 1px var(--bd),var(--sh)}.nav button.on svg{color:var(--acc)}
.nav .bd{margin-left:auto;color:var(--mu);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.yo{display:flex;align-items:center;gap:10px;border-top:1px solid var(--bd);padding:12px 8px 2px;font-size:12px;color:var(--mu)}
.yo b{color:var(--ink);display:block;font-size:13px;font-weight:600}
.demo{font-size:11.5px;color:var(--mu);padding:8px;margin-top:auto}.demo button{text-decoration:underline;text-underline-offset:2px;font-size:11.5px;color:var(--ink2)}
/* contenido */
.main{margin-left:var(--side);min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;height:52px;padding:0 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.miga{font-size:13px;color:var(--mu);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}.miga b{color:var(--ink);font-weight:500}
.buscar{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--w);border:1px solid var(--bd);border-radius:var(--rad);padding:0 10px;height:32px;width:260px;color:var(--mu)}
.buscar input{border:0;background:none;outline:0;width:100%;font-size:13px;color:var(--ink)}
.buscar kbd{font-family:inherit;font-size:11px;border:1px solid var(--bd);border-radius:4px;padding:0 5px;color:var(--mu2)}
.pag{padding:24px 28px 90px;max-width:1440px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.hd h1{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--rad);font-weight:500;font-size:13px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.bp,.br{background:var(--ink);color:var(--bg)}.bp:hover,.br:hover{background:var(--ink2)}
.br{background:var(--acc);color:#fff}.br:hover{background:var(--acc2)}
.bs{background:var(--w);border:1px solid var(--bd);color:var(--ink);box-shadow:var(--sh)}.bs:hover{border-color:var(--bd2);background:var(--bg)}
.bw{background:var(--w);border:1px solid var(--bd);color:var(--ink)}.bw::before{content:'';width:7px;height:7px;border-radius:50%;background:#25a35a}
.peq{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--w);border:1px solid var(--bd);border-radius:10px;padding:16px;box-shadow:var(--sh)}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpi small{color:var(--mu);font-size:12.5px;font-weight:500}.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .tr{font-size:12px;color:var(--mu);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink2)}
.chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--mu2)}
.c-ok{color:var(--ok)}.c-ok::before{background:var(--ok)}.c-wa{color:var(--wa)}.c-wa::before{background:#d88a1d}.c-r{color:var(--r)}.c-r::before{background:var(--r)}.c-bl{color:var(--bl)}.c-bl::before{background:var(--bl)}.c-o{color:var(--acc)}.c-o::before{background:var(--acc)}.c-n{color:var(--mu)}
select.chip{border:1px solid var(--bd)!important;border-radius:6px;background:var(--w);padding:4px 8px!important}select.chip::before{display:none}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;gap:10px;min-height:28px}.sec-t h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row .t{font-size:12.5px;color:var(--mu);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.row .x{flex:1;min-width:0}.row .x b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .x small{color:var(--mu);font-size:12.5px}
.row.click{cursor:pointer;border-radius:6px;margin:0 -6px;padding-left:8px;padding-right:8px}.row.click:hover{background:var(--bg)}
.av{width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--ink2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--bd)}
.av[style*=background]{color:#fff;box-shadow:none}
.empty{color:var(--mu);text-align:center;padding:28px 0;font-size:13px}
.brilla{background:var(--accb)!important}
/* calendario */
.ag{display:grid;background:var(--w);border:1px solid var(--bd);border-radius:10px;overflow:auto;position:relative;box-shadow:var(--sh)}
.ag .h{padding:10px 8px;text-align:left;font-weight:600;font-size:13px;border-bottom:1px solid var(--bd);background:var(--w);position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px}
.ag .h i{display:inline-block;width:22px;height:22px;border-radius:50%;flex-shrink:0}.ag .h small{display:block;color:var(--mu);font-weight:400;font-size:11.5px}
.col{position:relative;border-left:1px solid var(--bd)}
.hcol .hr{height:40px;font-size:11px;color:var(--mu2);padding:2px 8px 0 0;text-align:right;font-variant-numeric:tabular-nums}
.col .sl{height:40px;border-top:1px solid var(--bd);cursor:pointer}.col .sl:nth-child(even){border-top-style:dashed;border-top-color:color-mix(in srgb,var(--bd) 60%,transparent)}.col .sl:hover{background:var(--bg)}
.ev{position:absolute;left:3px;right:4px;border-radius:5px;padding:4px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;color:var(--ink);z-index:2;background:color-mix(in srgb,var(--c) 13%,var(--w));border-left:3px solid var(--c)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev small{color:var(--mu)}
.ev.hecha{background:var(--bg);border-left-color:var(--bd2)}.ev.hecha b{color:var(--mu)}.ev.noshow{background:var(--bg);border-left-color:var(--r)}.ev.noshow b{text-decoration:line-through;color:var(--mu)}
.ev.web::after{content:'Web';position:absolute;right:6px;top:4px;font-size:10.5px;font-weight:600;color:var(--mu)}
.ev:hover{box-shadow:0 4px 12px -4px rgba(0,0,0,.18);z-index:5}
.ahora{position:absolute;left:52px;right:0;height:1.5px;background:var(--r);z-index:4}.ahora::before{content:'';position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--r)}
.blq{position:absolute;left:0;right:0;z-index:1;background:repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--mu2) 16%,transparent) 5px 6px);font-size:11.5px;color:var(--mu);padding:5px 8px;cursor:pointer;border-top:1px solid var(--bd)}
.blq.off{cursor:default;background:repeating-linear-gradient(-45deg,var(--bg) 0 5px,color-mix(in srgb,var(--mu2) 12%,var(--bg)) 5px 6px)}
.ev.arrastra{z-index:20;box-shadow:0 14px 30px -8px rgba(0,0,0,.3);cursor:grabbing}
.sl.destino{background:var(--accb)!important;outline:1.5px dashed var(--acc);outline-offset:-2px}
.ev{touch-action:none}
/* clientes */
.cl-wrap{display:grid;grid-template-columns:320px 1fr;gap:12px;align-items:start}
.search{width:100%;border:1px solid var(--bd);background:var(--w);border-radius:var(--rad);padding:8px 12px;margin-bottom:8px;outline:0}.search:focus{border-color:var(--ink2)}
.clist{max-height:calc(100vh - 190px);overflow:auto;background:var(--w);border:1px solid var(--bd);border-radius:10px}
.ci{padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-top:1px solid var(--bd)}.ci:first-child{border-top:0}
.ci:hover{background:var(--bg)}.ci.on{background:var(--accb)}.ci b{font-weight:500;display:block}.ci small{color:var(--mu);font-size:12px}
textarea.nota{width:100%;border:1px solid var(--bd);background:var(--bg);border-radius:var(--rad);padding:10px 12px;min-height:64px;resize:vertical;outline:0}
/* gráficos */
.bars{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:stretch;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--bd2)}.bars div:last-child i{background:var(--acc)}
.bars span{font-size:11.5px;color:var(--mu)}.bars em{font-style:normal;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.hb{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:13px}.hb span{width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb i{height:6px;border-radius:3px;display:block}.hb b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}
/* caja */
.cj{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.cj-s{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.cj-s button{background:var(--w);border:1px solid var(--bd);border-radius:var(--rad);padding:10px 12px;text-align:left;transition:border-color .15s}
.cj-s button:hover{border-color:var(--ink2)}.cj-s button b{display:block;font-weight:500;font-size:13px}.cj-s button span{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.tk{position:sticky;top:68px}.tk .ln{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd);font-size:13px;font-variant-numeric:tabular-nums}
.tk .tot{font-size:30px;font-weight:600;letter-spacing:-.02em;text-align:right;margin:12px 0;font-variant-numeric:tabular-nums}
.pagos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.pagos button{border:1px solid var(--bd);border-radius:var(--rad);padding:8px 0;font-weight:500;font-size:12.5px;background:var(--w)}.pagos button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.movil{width:320px;height:650px;border-radius:40px;background:#0c0c0e;padding:10px;margin:0 auto;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.movil iframe{width:100%;height:100%;border:0;border-radius:31px;background:#000}
/* modales y avisos */
.velo{position:fixed;inset:0;background:rgba(10,10,12,.42);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--w);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:460px;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);animation:sube .2s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}@keyframes sube{from{opacity:0;transform:translateY(8px) scale(.99)}}
.modal h3{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal label{display:block;font-size:12.5px;color:var(--ink2);margin:12px 0 5px;font-weight:500}
.modal input,.modal select{width:100%;border:1px solid var(--bd);background:var(--w);border-radius:var(--rad);padding:8px 10px;outline:0}.modal input:focus,.modal select:focus{border-color:var(--ink2)}
.modal .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--bd)}
.wab{background:var(--bg);border:1px solid var(--bd);border-radius:var(--rad);padding:12px;font-size:13px;line-height:1.55;white-space:pre-wrap}
#toasts{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:var(--rad);font-size:13px;max-width:380px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);animation:sube .2s}
.toast.web{border-left:3px solid #e0a3ab}.toast.web b{display:block;font-weight:600;margin-bottom:2px}
.bnav{display:none}.mtop{display:none}
/* acceso */
#login{position:fixed;inset:0;z-index:150;background:var(--bg);display:grid;grid-template-columns:1fr 1fr}
#login .foto{background:#000 url(../img/ovejas.jpg) center/cover;position:relative}
#login .foto::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7))}
#login .foto p{position:absolute;left:32px;bottom:28px;z-index:2;color:#fff;margin:0;font-size:13px;opacity:.85}
#login .lg-c{width:100%;max-width:360px;margin:auto;padding:24px}
#login img.lg{width:40px;height:40px;border-radius:8px;margin-bottom:20px;object-fit:cover}
#login h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
#login p{color:var(--mu);margin:0 0 22px}
#login .us{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
#login .us button{display:flex;align-items:center;gap:10px;background:var(--w);border:1px solid var(--bd);border-radius:var(--rad);padding:9px 10px;text-align:left;font-size:13px}
#login .us button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
#login .us button i{display:flex;width:28px;height:28px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-weight:600;font-size:11px;color:#fff;flex-shrink:0}
#login .us button span{color:var(--mu)!important;margin-left:auto;font-size:12px}
#login label{display:block;font-size:12.5px;font-weight:500;margin:14px 0 6px}
#login input{width:100%;background:var(--w);border:1px solid var(--bd);border-radius:var(--rad);padding:9px 10px;margin-bottom:12px;outline:0}
#login .entrar{width:100%;background:var(--ink);color:var(--bg);border-radius:var(--rad);height:38px;font-weight:500}
#login small{display:block;margin-top:12px;color:var(--mu2);font-size:12px}
/* equipo, sedes, cobros */
.hor{width:100%;border-collapse:collapse;font-size:12.5px}.hor th{font-weight:500;color:var(--mu);text-align:left;padding:8px 6px;font-size:12px;border-bottom:1px solid var(--bd)}.hor td{padding:8px 6px;border-top:1px solid var(--bd);vertical-align:middle}
.hor input[type=time]{border:1px solid var(--bd);border-radius:6px;padding:3px 4px;font-size:12px;width:84px;background:var(--w);font-variant-numeric:tabular-nums}
.dia-t{display:flex;flex-direction:column;gap:3px;align-items:flex-start}.dia-t .libra{font-size:12px;color:var(--mu);font-weight:500}
.tg{font-size:11.5px;color:var(--mu);text-decoration:underline;text-underline-offset:2px}.tg:hover{color:var(--ink)}
.sedes3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opcion-pago{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--rad);border:1px solid var(--bd);margin-top:8px;cursor:pointer}
.opcion-pago.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.opcion-pago input{margin-top:3px;accent-color:var(--ink)}
.cifra{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:12px 0 2px}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.buscar{width:200px}}
@media(max-width:900px){
 .side{transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:none;width:280px}
 .side.abierta{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
 .main{margin-left:0}.top{padding:0 14px}.buscar{display:none}.pag{padding:16px 14px 96px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--w) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd);z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu);padding:4px 2px}
 .bnav button svg{width:20px;height:20px}.bnav button.on{color:var(--acc)}
 .g2,.g21,.g3,.cl-wrap,.cj,.sedes3{grid-template-columns:1fr}
 .hd h1{font-size:20px}.kpi b{font-size:22px}.hd>div:last-child{width:100%}
 .ag{max-width:calc(100vw - 28px)}.clist{max-height:none}.hor-wrap{overflow-x:auto}
 .tk{position:static}.movil{width:100%;max-width:320px}
 #login{grid-template-columns:1fr}#login .foto{display:none}
 .mbtn{display:inline-flex!important}
}
.mbtn{display:none;margin-left:-6px;padding:6px;border-radius:6px;color:var(--ink)}
</style></head><body>

<aside class="side" id="side">
  <div class="ws"><img src="../img/logo.jpg" alt=""><div><b>Salvajes</b><small>Barcelona · Dubái</small></div></div>
  <label class="sede-sel"><select id="selSede" aria-label="Sede" onchange="cambiarSede(this.value)"></select></label>
  <nav class="nav" id="nav"></nav>
  <div class="demo">Demo con datos de ejemplo · <button onclick="reiniciar()">Reiniciar</button></div>
  <div class="yo"><span class="av" style="background:#7a1f2b">A</span><div><b>Anuar</b>Dueño · 3 sedes</div></div>
</aside>
<div id="login"><div class="lg-c">
  <img class="lg" src="../img/logo.jpg" alt="Salvajes"><h2>Entrar en Salvajes</h2><p>Un panel para las 3 barberías. Cada persona entra con su usuario y ve lo que le toca.</p>
  <div class="us" id="lgUs"></div>
  <label for="lgPw">Contraseña</label><input id="lgPw" type="password" value="salvajes">
  <button class="entrar" onclick="entrar()">Entrar</button>
  <small>Demo: la contraseña ya está puesta.</small>
</div><div class="foto"><p>Salvajes Barbershop · desde 2022</p></div></div>
<main class="main" id="main"></main>
<nav class="bnav" id="bnav"></nav>

<script src="../datos.js?v=3"></script>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aed=n=>SV.din(n);
const WEB_URL=SEDE.pais==='AE'?'../dubai/':'../barcelona/?sede='+SV_SEDE;
const BONO=SEDE.pais==='AE'?{c5:360,b10:400}:{c5:55,b10:60};
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const fLarga=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const fCorta=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const HOY=SV.masD(0);
let DB=svCargar();
const CL=id=>DB.clientes.find(c=>c.id===id)||{n:'—',tel:'',orig:'',lang:'ES'};
const guardar=()=>svGuardar(DB);
function reiniciar(){ try{localStorage.removeItem(SV_CLAVE)}catch(e){} DB=svCargar(); toast('Demo reiniciada'); ir(VISTA); }

/* sonido y avisos */
let ctx; function sonido(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); [0,.12,.24].forEach((t,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=[659,880,1175][i]; g.gain.setValueAtTime(.07,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.4); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.42); }); }catch(e){} }
function toast(m,cls='',ms=3400){ const t=document.createElement('div'); t.className='toast '+cls; t.innerHTML=m; $('toasts').appendChild(t); setTimeout(()=>{ t.style.transition='.4s'; t.style.opacity=0; setTimeout(()=>t.remove(),400); },ms); }
document.addEventListener('pointerdown',()=>{ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); }catch(e){} },{once:true});

/* lo que llega desde la web: reservas y tarjetas regalo */
let _vistas=new Set([...DB.citas.filter(c=>c.web&&c.nueva).map(c=>c.id),...DB.regalos.filter(r=>r.nueva).map(r=>r.id)]);
let RESALTA=null;
function comprobarWeb(){ const n=svCargar();
  const llegan=n.citas.filter(c=>c.web&&c.nueva&&!_vistas.has(c.id)), regs=n.regalos.filter(r=>r.nueva&&!_vistas.has(r.id)); DB=n;
  llegan.forEach(c=>{ _vistas.add(c.id); sonido(); toast(`<b>Nueva reserva desde la web</b>${esc(CL(c.cl).n)} · ${esc(SV.S(c.s).es)} con ${esc(SV.E(c.e).n)}<br>${fLarga(c.f)} a las ${c.h}`,'web',7000); RESALTA=c.id; if(VISTA==='agenda') DIA=c.f; });
  regs.forEach(r=>{ _vistas.add(r.id); sonido(); toast(`<b>Tarjeta regalo vendida online</b>${r.id} · ${aed(r.imp)} · pagada con tarjeta`,'web',7000); });
  if(VISTA!=='web') ir(VISTA,1); else navs(); }
addEventListener('storage',e=>{ if(e.key===SV_CLAVE) comprobarWeb(); });

/* WhatsApp en un toque (en el idioma del cliente) */
const MSG={
 recordar:(c,a)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! Te recordamos tu cita de mañana en Salvajes: ${SV.S(a.s).es} con ${SV.E(a.e).n} a las ${a.h}. Si no puedes venir, avísanos y te buscamos otro hueco`:`Hi ${c.n.split(' ')[0]}! Reminder of your appointment tomorrow at Salvajes: ${SV.S(a.s).n} with ${SV.E(a.e).n} at ${a.h}. If you can’t make it, just reply and we’ll find you another slot`,
 confirmar:(c,a)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! Tu cita en Salvajes está confirmada: ${SV.S(a.s).es}, ${fLarga(a.f)} a las ${a.h}. ${SEDE.dir}.`:`Hi ${c.n.split(' ')[0]}! Your appointment at Salvajes is confirmed: ${SV.S(a.s).n}, ${new Date(a.f+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} at ${a.h}. ${SEDE.dir}.`,
 vuelve:(c,s,d)=>c.lang==='ES'?`¡Hola, ${c.n.split(' ')[0]}! Ya van ${d} días desde tu último ${s.es.toLowerCase()} en Salvajes. ¿Te guardamos silla esta semana? Reserva aquí: airmate.es/salvajes/${SEDE.pais==='AE'?'dubai':'barcelona'}`:`Hi ${c.n.split(' ')[0]}! It’s been ${d} days since your last ${s.n.toLowerCase()} at Salvajes. Shall we save you a chair this week? Book here: airmate.es/salvajes/${SEDE.pais==='AE'?'dubai':'barcelona'}`
};
function wa(txt,quien,alHacer){ velo(`<h3>Mensaje de WhatsApp</h3><div class="mono" style="margin-bottom:10px">Para ${esc(quien)}</div><div class="wab">${esc(txt)}</div>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><a class="btn bw" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}" onclick="setTimeout(()=>{cerrar();${alHacer||''}},250)">Abrir WhatsApp</a></div>
  <p style="font-size:11.5px;color:var(--mu);margin:12px 0 0">En la demo se abre WhatsApp sin destinatario. En vuestro panel se abre el chat de ese cliente con el texto listo: un toque y enviado.</p>`); }
function avisado(k){ DB.avisados[k]=Date.now(); guardar(); toast('Mensaje enviado'); ir(VISTA,1); }

/* navegación */
const ICO={home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',users:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7M16 4.1a4 4 0 0 1 0 7.8M22 21c0-3-1.8-5.6-4.5-6.6"/>',back:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',caja:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/>',gift:'<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4 8 8 12 8zM12 8s2-5 4.5-4S16 8 12 8z"/>',box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',chart:'<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',org:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',plus:'<path d="M12 5v14M5 12h14"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',izq:'<path d="m15 18-6-6 6-6"/>',der:'<path d="m9 18 6-6-6-6"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',mas:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const I=(n)=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICO[n]||''}</svg>`;
const VISTAS=[['hoy','home','Inicio','Inicio','Día a día'],['agenda','cal','Calendario','Agenda','Día a día'],['clientes','users','Clientes','Clientes','Día a día'],['caja','caja','Caja','Caja','Día a día'],['vuelven','back','Recuperar clientes','Vuelven','Clientes'],['bonos','gift','Bonos y tarjetas regalo','Bonos','Clientes'],['equipo','clock','Equipo y horarios','Equipo','Gestión'],['stock','box','Productos y stock','Stock','Gestión'],['cifras','chart','Informes','Informes','Gestión'],['sedes','org','Grupo · 3 sedes','Grupo','Gestión'],['web','globe','Reservas online','Web','Gestión']];
let VISTA='hoy', DIA=HOY, SELCL='c0', TICKET=[], PAGO='Tarjeta';
function navs(){ const v=pendVuelven().length, bajo=SV_PROD.filter(p=>DB.stock[p.k]<=p.min).length; let g='';
  $('nav').innerHTML=VISTAS.map(([k,ic,t,,grp])=>{ const cab=grp!==g?`<div class="grp">${grp}</div>`:''; g=grp; return cab+`<button class="${VISTA===k?'on':''}" onclick="ir('${k}');$('side').classList.remove('abierta')">${I(ic)}${t}${k==='vuelven'&&v?`<span class="bd">${v}</span>`:''}${k==='stock'&&bajo?`<span class="bd">${bajo}</span>`:''}</button>`; }).join('');
  $('bnav').innerHTML=VISTAS.slice(0,4).map(([k,ic,t,c])=>`<button class="${VISTA===k?'on':''}" onclick="ir('${k}')">${I(ic)}${c}</button>`).join('')+`<button onclick="$('side').classList.add('abierta')">${I('mas')}Más</button>`; }
function barra(){ const t=(VISTAS.find(x=>x[0]===VISTA)||[])[2]||'';
  return `<div class="top"><button class="mbtn" onclick="$('side').classList.add('abierta')" aria-label="Menú">${I('menu')}</button><div class="miga">${esc(SEDE.n)}<span>/</span><b>${t}</b></div>
   <label class="buscar">${I('search')}<input placeholder="Buscar cliente…" onkeydown="if(event.key==='Enter'){const q=this.value.trim().toLowerCase();const c=DB.clientes.find(c=>c.n.toLowerCase().includes(q)||c.tel.replace(/\s/g,'').includes(q.replace(/\s/g,'')));if(c){SELCL=c.id;ir('clientes')}else toast('No hay ningún cliente con «'+esc(this.value)+'»')}"><kbd>↵</kbd></label>
   <button class="btn br" onclick="nuevaCita()">${I('plus')}Nueva cita</button></div>`; }
function ir(v,quieto){ VISTA=v; navs(); $('main').innerHTML=barra()+'<div class="pag">'+R[v]()+'</div>'; if(!quieto) scrollTo(0,0); animar(v,quieto); if(v==='agenda') activarArrastre(); }
function animar(){}
/* arrastrar y soltar citas en la agenda */
function activarArrastre(){ document.querySelectorAll('.ev').forEach(ev=>{ ev.addEventListener('pointerdown',e=>{ e.preventDefault(); const id=ev.dataset.id, x0=e.clientX, y0=e.clientY; let mov=false, dest=null; ev.setPointerCapture(e.pointerId);
  const move=m=>{ const dx=m.clientX-x0, dy=m.clientY-y0; if(!mov&&Math.hypot(dx,dy)<6) return; mov=true; ev.classList.add('arrastra'); ev.style.transform=`translate(${dx}px,${dy}px)`; ev.style.pointerEvents='none';
    const el=document.elementFromPoint(m.clientX,m.clientY); ev.style.pointerEvents=''; document.querySelectorAll('.sl.destino').forEach(x=>x.classList.remove('destino')); dest=el&&el.classList.contains('sl')?el:null; if(dest) dest.classList.add('destino'); };
  const up=()=>{ ev.removeEventListener('pointermove',move); ev.removeEventListener('pointerup',up); ev.removeEventListener('pointercancel',up); document.querySelectorAll('.sl.destino').forEach(x=>x.classList.remove('destino'));
    if(!mov){ verCita(id); return; }
    const a=DB.citas.find(x=>x.id===id); if(dest){ const ne=dest.dataset.e, nh=dest.dataset.h, prev=a.est; a.est='cancelada'; const ok=SV.libreCon(DB,DIA,nh,a.s,ne); a.est=prev;
      if(ok){ a.e=ne; a.h=nh; a.f=DIA; guardar(); sonido(); toast(`${esc(CL(a.cl).n)} movido a las ${nh} con ${esc(SV.E(ne).n)}`); RESALTA=id; ir('agenda',1); return; }
      toast(SV.puede(ne,a.s)?`${esc(SV.E(ne).n)} ya tiene ese hueco ocupado`:`${esc(SV.E(ne).n)} no hace ${esc(SV.S(a.s).es.toLowerCase())}`); }
    ev.style.transition='transform .2s'; ev.style.transform=''; setTimeout(()=>{ ev.style.transition=''; ev.classList.remove('arrastra'); },200); };
  ev.addEventListener('pointermove',move); ev.addEventListener('pointerup',up); ev.addEventListener('pointercancel',up); }); }); }
function cab(kick,tit,btns=''){ const t=(VISTAS.find(x=>x[0]===VISTA)||[])[2]||''; return `<div class="hd"><div><div class="mono">${kick}</div><h1>${t}</h1></div><div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div></div>`; }
const R={};

/* utilidades */
function pendVuelven(){ const out=[];
  DB.clientes.forEach(c=>{ if(DB.citas.some(a=>a.cl===c.id&&a.f>=HOY&&a.est==='conf')) return;
    const ult=DB.citas.filter(a=>a.cl===c.id&&a.est==='hecha'&&a.f<=HOY).sort((a,b)=>b.f.localeCompare(a.f))[0]; if(!ult) return;
    const s=SV.S(ult.s); if(!s.vuelve) return; const dias=Math.round((+SV.hoy0-new Date(ult.f+'T00:00'))/864e5);
    if(dias>=s.vuelve-2) out.push({c,s,dias,f:ult.f,k:'vuelve'+c.id+ult.f}); });
  return out.sort((a,b)=>(b.dias-b.s.vuelve)-(a.dias-a.s.vuelve)); }
const citasDia=f=>DB.citas.filter(a=>a.f===f&&a.est!=='cancelada').sort((a,b)=>a.h.localeCompare(b.h));
function chipEst(a){ return a.est==='hecha'?'<span class="chip c-ok">Atendido</span>':a.est==='noshow'?'<span class="chip c-r">No vino</span>':'<span class="chip c-bl">Confirmada</span>'; }

/* HOY */
R.hoy=()=>{ const cs=citasDia(HOY), man=citasDia(SV.masD(1)), web7=DB.citas.filter(a=>a.web&&a.f>=SV.masD(-7)).length, caja=DB.ventas.filter(v=>v.f===HOY).reduce((a,v)=>a+v.imp,0), vuel=pendVuelven();
  const ocup=SV_EQUIPO.map(e=>({e,n:cs.filter(a=>a.e===e.k).length}));
  return cab(fLarga(HOY),'',`<a class="btn bs" href="${WEB_URL}" target="_blank" rel="noopener">${I('ext')}Ver la web</a>`)+
  `<div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><small>Citas hoy</small><b>${cs.length}</b><div class="tr">${cs.filter(a=>a.web).length} reservadas solas desde la web</div></div>
    <div class="card kpi"><small>Reservas web · 7 días</small><b>${web7}</b><div class="tr">sin contestar un solo mensaje</div></div>
    <div class="card kpi"><small>Caja de hoy</small><b>${aed(caja)}</b><div class="tr">${DB.ventas.filter(v=>v.f===HOY).length} cobros</div></div>
    <div class="card kpi"><small>Clientes que toca que vuelvan</small><b>${vuel.length}</b><div class="tr" style="color:var(--wa)">cortes y barbas pendientes</div></div></div>
  <div class="grid g21">
    <div class="card"><div class="sec-t"><h3>Hoy en la barbería</h3><button class="btn bs peq" onclick="DIA=HOY;ir('agenda')">Agenda</button></div>
     <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${ocup.map(o=>`<span class="chip c-n"><i style="width:8px;height:8px;border-radius:50%;background:${o.e.c};display:inline-block"></i>${esc(o.e.n)} · ${o.n}</span>`).join('')}</div>
     ${cs.map(a=>{ const c=CL(a.cl),s=SV.S(a.s),e=SV.E(a.e); return `<div class="row click ${a.id===RESALTA?'brilla':''}" onclick="verCita('${a.id}')"><span class="t">${a.h}</span><div class="av" style="background:${e.c}">${ini(c.n)}</div><div class="x"><b>${esc(c.n)}</b><small>${esc(s.es)} · ${esc(e.n)}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`; }).join('')||'<div class="empty">Sin citas hoy</div>'}</div>
    <div>
     <div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Recordar mañana</h3><span class="chip c-n">${man.length}</span></div>
      ${man.slice(0,6).map(a=>{ const c=CL(a.cl),k='rec'+a.id; return `<div class="row"><span class="t">${a.h}</span><div class="x"><b>${esc(c.n)}</b><small>${esc(SV.S(a.s).es)} · ${c.lang}</small></div>${DB.avisados[k]?'<span class="chip c-ok">Avisado</span>':`<button class="btn bw peq" onclick="wa(MSG.recordar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${a.id}')),'${esc(c.n)}','avisado(\\'${k}\\')')">Recordar</button>`}</div>`; }).join('')||'<div class="empty">Nada para mañana</div>'}</div>
     <div class="card"><div class="sec-t"><h3>Que vuelvan</h3><button class="btn bs peq" onclick="ir('vuelven')">Ver</button></div>
      ${vuel.slice(0,3).map(v=>`<div class="row"><div class="x"><b>${esc(v.c.n)}</b><small>${esc(v.s.es)} hace ${v.dias} días</small></div>${DB.avisados[v.k]?'<span class="chip c-ok">Avisado</span>':'<span class="chip c-wa">Toca</span>'}</div>`).join('')||'<div class="empty">Todos al día</div>'}</div>
    </div></div>`; };

/* AGENDA por barbero */
const H0=SV.min('10:00'), PX=40/30;
R.agenda=()=>{ const cs=citasDia(DIA), x=new Date(DIA+'T12:00'), cols=SV_EQUIPO.length;
  let g=`<div class="ag" style="grid-template-columns:52px repeat(${cols},minmax(120px,1fr))"><div class="h"></div>${SV_EQUIPO.map(e=>`<div class="h"><span class="av" style="background:${e.c}">${ini(e.n)}</span><span>${esc(e.n)}<small>${esc(e.rol)}</small></span></div>`).join('')}`;
  g+=`<div class="hcol">${SV_HORAS.map(h=>`<div class="hr">${h}</div>`).join('')}</div>`;
  g+=SV_EQUIPO.map(e=>`<div class="col">${SV_HORAS.map(h=>`<div class="sl" data-e="${e.k}" data-h="${h}" onclick="nuevaCita('${DIA}','${h}','${e.k}')"></div>`).join('')}${capasBloqueo(e.k)}${cs.filter(c=>c.e===e.k).map(c=>{ const s=SV.S(c.s), top=(SV.min(c.h)-H0)*PX+1, alto=Math.max(36,s.min*PX-3);
    return `<div class="ev ${c.est} ${c.web?'web':''} ${c.id===RESALTA?'brilla':''}" data-id="${c.id}" style="top:${top}px;height:${alto}px;--c:${e.c}"><b>${esc(CL(c.cl).n)}</b><small>${c.h} · ${esc(s.es)}</small></div>`; }).join('')}</div>`).join('');
  const ah=new Date().getHours()*60+new Date().getMinutes(); if(DIA===HOY&&ah>=H0&&ah<=22*60) g+=`<div class="ahora" style="top:${(ah-H0)*PX+46}px"></div>`;
  return cab('Agenda · '+fLarga(DIA),`${DN[x.getDay()]} <em>${x.getDate()}</em>`,`<button class="btn bs" onclick="moverDia(-1)" aria-label="Día anterior">${I('izq')}</button><button class="btn bs" onclick="DIA=HOY;ir('agenda',1)">Hoy</button><button class="btn bs" onclick="moverDia(1)" aria-label="Día siguiente">${I('der')}</button><button class="btn bs" onclick="nuevoBloqueo('${DIA}')">${I('lock')}Bloquear horas</button>`)+
  `<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:10px"><span>${cs.length} citas</span><span>«Web»: la reservó el cliente</span><span>Toca un hueco para añadir una cita · arrastra una cita para moverla</span><span>Rayado: hora bloqueada o fuera de turno</span></div>`+g+'</div>'; };
function moverDia(n){ DIA=SV.iso(+new Date(DIA+'T12:00')+n*864e5); ir('agenda',1); }
function verCita(id){ const a=DB.citas.find(x=>x.id===id), c=CL(a.cl), s=SV.S(a.s), e=SV.E(a.e);
  velo(`<h3>${esc(c.n)}</h3><div class="mono">${esc(s.es)} · ${s.min} min · ${aed(s.p)}</div><p style="font-size:15px;margin:14px 0">${fLarga(a.f)} · <b>${a.h}</b> · con ${esc(e.n)}</p>
  <div style="display:flex;gap:6px;flex-wrap:wrap">${chipEst(a)}${a.web?'<span class="chip c-o">Reservó desde la web</span>':''}<span class="chip c-n">Idioma: ${c.lang}</span>${c.notas?`<span class="chip c-wa">${esc(c.notas.slice(0,46))}${c.notas.length>46?'…':''}</span>`:''}</div>
  <div class="pie"><button class="btn bs" onclick="estado('${id}','cancelada')">Cancelar</button><button class="btn bs" onclick="cerrar();SELCL='${a.cl}';ir('clientes')">Ficha</button>
   <button class="btn bw" onclick="cerrar();wa(MSG.confirmar(CL('${a.cl}'),DB.citas.find(x=>x.id==='${id}')),'${esc(c.n)}')">WhatsApp</button>
   ${a.est==='conf'?`<button class="btn bs" onclick="estado('${id}','noshow')">No vino</button><button class="btn bp" onclick="cobrarCita('${id}')">Atendido y cobrar</button>`:''}</div>`); }
function estado(id,e){ DB.citas.find(x=>x.id===id).est=e; guardar(); cerrar(); toast(e==='cancelada'?'Cita cancelada · el hueco vuelve a salir libre en la web':'Marcado como «no vino» · queda en su ficha'); ir(VISTA,1); }

    <button class="btn br peq" onclick="nuevaCita()">+ Cita</button></div>
   <div class="grid g3" style="margin:16px 0"><div class="card kpi" style="box-shadow:none;background:var(--bg)"><small>Visitas</small><b>${hechas.length}</b></div><div class="card kpi" style="box-shadow:none;background:var(--bg)"><small>Gastado</small><b style="font-size:28px">${aed(gast)}</b></div><div class="card kpi" style="box-shadow:none;background:var(--bg)"><small>Debería volver</small><b style="font-size:24px;margin-top:10px">${sug?fCorta(sug):'—'}</b></div></div>
   ${bono?`<p class="chip c-o" style="margin:0 6px 12px 0">${esc(bono.n)}: le quedan ${bono.total-bono.usadas}</p>`:''}${nos?`<p class="chip c-r" style="margin:0 0 12px">No vino ${nos} vez${nos>1?'es':''}</p>`:''}
   <div class="mono" style="margin-bottom:6px">Notas · cómo le gusta el corte</div>
   <textarea class="nota" onchange="CL('${c.id}').notas=this.value;guardar();toast('Nota guardada')" placeholder="Ej.: fade 0.5, tijera arriba, raya a la izquierda">${esc(c.notas||'')}</textarea>
   <div class="sec-t" style="margin-top:16px"><h3>Historial</h3></div>
   ${vis.map(a=>`<div class="row"><span class="t" style="width:60px">${fCorta(a.f)}</span><div class="av" style="background:${SV.E(a.e).c};width:26px;height:26px;font-size:10px">${SV.E(a.e).n[0]}</div><div class="x"><b>${esc(SV.S(a.s).es)}</b><small>${a.h} · ${esc(SV.E(a.e).n)}${a.web?' · reservó en la web':''}</small></div>${chipEst(a)}</div>`).join('')||'<div class="empty">Sin visitas todavía</div>'}</div>`; }
function nuevoCliente(){ velo(`<h3>Nuevo cliente</h3><label>Nombre</label><input id="cN"><label>Móvil</label><input id="cT" inputmode="tel" placeholder="${SEDE.prefijo}"><label>Idioma</label><select id="cL"><option>ES</option><option>EN</option><option>AR</option></select><label>Cómo nos conoció</label><select id="cO"><option>Instagram</option><option>Recomendación</option><option>${SEDE.pais==='AE'?'Vive en JVC':'Vive en el barrio'}</option><option>Booksy</option><option>Google Maps</option><option>Fresha</option></select>

function cobrar(){ if(!TICKET.length) return; TICKET.forEach(l=>{ DB.ventas.push({id:'v'+Date.now()+Math.random(),f:HOY,cl:l.cl||'c0',c:l.n,e:l.e||'b1',imp:l.p,pago:PAGO,tipo:l.tipo}); if(l.tipo==='prod') DB.stock[l.k]=Math.max(0,DB.stock[l.k]-1); });

function capasBloqueo(e){ const tu=SV.turno(DB,e,DIA), a0=SV.min(SV_HORAS[0]), a1=SV.min(SV_HORAS[SV_HORAS.length-1])+30, y=m=>(m-a0)*PX;
  if(!tu) return `<div class="blq off" style="top:0;height:${y(a1)}px">Libra este día</div>`;
  let h=''; const t0=SV.min(tu[0]), t1=SV.min(tu[1]);
  if(t0>a0) h+=`<div class="blq off" style="top:0;height:${y(t0)}px">Entra a las ${tu[0]}</div>`;
  if(t1<a1) h+=`<div class="blq off" style="top:${y(t1)}px;height:${y(a1)-y(t1)}px">Sale a las ${tu[1]}</div>`;
  (DB.bloqueos||[]).filter(b=>b.f===DIA&&(b.e===e||b.e==='todos')).forEach(b=>{ h+=`<div class="blq" style="top:${y(SV.min(b.ini))}px;height:${Math.max(20,y(SV.min(b.fin))-y(SV.min(b.ini)))}px" onclick="event.stopPropagation();verBloqueo('${b.id}')">${esc(b.motivo)} · ${b.ini}–${b.fin}</div>`; });
  return h; }
function nuevoBloqueo(f,e){ f=f||HOY;
  velo(`<h3>Bloquear horas</h3><p style="color:var(--mu);font-size:13px;margin:4px 0 8px">Esas horas dejan de salir libres en la web al momento.</p>
  <label>Quién</label><select id="bqE"><option value="todos">Toda la barbería</option>${SV_EQUIPO.map(x=>`<option value="${x.k}" ${x.k===e?'selected':''}>${esc(x.n)}</option>`).join('')}</select>
  <label>Día</label><input type="date" id="bqF" value="${f}">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Desde</label><select id="bqI">${SV_HORAS.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Hasta</label><select id="bqH">${SV_HORAS.slice(1).concat(SEDE.cierra).map((x,i)=>`<option ${i===1?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <label>Motivo</label><select id="bqM"><option>Médico</option><option>Comida</option><option>Formación del equipo</option><option>Asuntos propios</option><option>Vacaciones</option><option>Festivo</option></select>
  <p id="bqX" style="color:var(--acc);font-size:13px;min-height:16px;margin:8px 0 0"></p>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cancelar</button><button class="btn bp" onclick="guardaBloqueo()">Bloquear</button></div>`); }
function guardaBloqueo(){ const b={id:'bl'+Date.now(),e:$('bqE').value,f:$('bqF').value,ini:$('bqI').value,fin:$('bqH').value,motivo:$('bqM').value};
  if(SV.min(b.fin)<=SV.min(b.ini)){ $('bqX').textContent='La hora de fin tiene que ser después.'; return; }
  const choca=DB.citas.filter(a=>a.f===b.f&&a.est==='conf'&&(b.e==='todos'||a.e===b.e)&&SV.min(a.h)<SV.min(b.fin)&&SV.min(a.h)+SV.S(a.s).min>SV.min(b.ini));
  DB.bloqueos=(DB.bloqueos||[]).concat(b); guardar(); cerrar(); sonido();
  toast('Bloqueado · '+(b.e==='todos'?'toda la barbería':esc(SV.E(b.e).n))+' de '+b.ini+' a '+b.fin+(choca.length?`<br>Hay ${choca.length} cita${choca.length>1?'s':''} en esas horas: muévelas o avisa al cliente`:''),'',choca.length?7000:3400);
  if(VISTA==='agenda') DIA=b.f; ir(VISTA,1); }
function verBloqueo(id){ const b=DB.bloqueos.find(x=>x.id===id); if(!b) return;
  velo(`<h3>${esc(b.motivo)}</h3><p style="font-size:15px">${fLarga(b.f)} · <b>${b.ini}–${b.fin}</b> · ${b.e==='todos'?'toda la barbería':esc(SV.E(b.e).n)}</p>
  <div class="pie"><button class="btn bs" onclick="cerrar()">Cerrar</button><button class="btn br" onclick="quitarBloqueo('${id}')">Quitar bloqueo</button></div>`); }
function quitarBloqueo(id){ DB.bloqueos=DB.bloqueos.filter(x=>x.id!==id); guardar(); cerrar(); toast('Bloqueo quitado · esas horas vuelven a salir libres en la web'); ir(VISTA,1); }

/* ── EQUIPO Y HORARIOS ── */
const DSEM=[1,2,3,4,5,6,0];
R.equipo=()=>{ const mes=DB.ventas.filter(v=>v.f>=SV.masD(-27)&&v.tipo==='serv'), prox=(DB.bloqueos||[]).filter(b=>b.f>=HOY).sort((a,b)=>(a.f+a.ini).localeCompare(b.f+b.ini));
  return cab(SEDE.n+' · '+SV_EQUIPO.length+' personas','Equipo y <em>horarios.</em>',`<button class="btn bs" onclick="nuevoBloqueo()">${I('lock')}Bloquear horas</button>`)+
  `<div class="card" style="margin-bottom:14px"><div class="sec-t"><h3>Horario de cada uno</h3><span class="mono">La web solo ofrece las horas en las que trabaja cada barbero</span></div>
   <div class="hor-wrap"><table class="hor"><tr><th>Barbero</th>${DSEM.map(d=>`<th>${DN[d]}</th>`).join('')}</tr>
   ${SV_EQUIPO.map(e=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px"><i style="width:9px;height:9px;border-radius:50%;background:${e.c}"></i><b>${esc(e.n)}</b></span><br><small style="color:var(--mu)">${esc(e.rol)}</small></td>${DSEM.map(d=>{ const t=DB.horarios[e.k][d]; return `<td><div class="dia-t">${t?`<input type="time" step="1800" value="${t[0]}" onchange="setTurno('${e.k}',${d},0,this.value)"><input type="time" step="1800" value="${t[1]}" onchange="setTurno('${e.k}',${d},1,this.value)"><button class="tg" onclick="setLibra('${e.k}',${d},true)">Libra</button>`:`<span class="libra">Libra</span><button class="tg" onclick="setLibra('${e.k}',${d},false)">Trabaja</button>`}</div></td>`; }).join('')}</tr>`).join('')}</table></div></div>
  <div class="grid g2"><div class="card"><div class="sec-t"><h3>Liquidación del mes</h3><span class="mono">Servicios · 4 semanas</span></div>
    ${SV_EQUIPO.map(e=>{ const fact=mes.filter(v=>v.e===e.k).reduce((t,v)=>t+v.imp,0), pct=DB.comision[e.k]??45; return `<div class="row"><div class="av" style="background:${e.c}">${ini(e.n)}</div><div class="x"><b>${esc(e.n)}</b><small>Ha facturado ${aed(fact)} · ${mes.filter(v=>v.e===e.k).length} servicios</small></div><label style="font-size:12px;color:var(--mu)">Comisión <input type="number" min="0" max="100" value="${pct}" style="width:52px;border:1px solid var(--bd);border-radius:6px;padding:4px" onchange="DB.comision['${e.k}']=+this.value;guardar();ir('equipo',1)"> %</label><b style="min-width:90px;text-align:right">${aed(fact*pct/100)}</b></div>`; }).join('')}
    <p style="font-size:12px;color:var(--mu);margin:10px 0 0">Lo que le toca a cada uno sale solo, sin sumar tickets a mano.</p></div>
   <div class="card"><div class="sec-t"><h3>Próximos bloqueos</h3><span class="chip c-n">${prox.length}</span></div>
    ${prox.map(b=>`<div class="row click" onclick="verBloqueo('${b.id}')"><div class="x"><b>${esc(b.motivo)}</b><small>${fLarga(b.f)} · ${b.ini}–${b.fin} · ${b.e==='todos'?'toda la barbería':esc(SV.E(b.e).n)}</small></div><span class="chip c-n">Quitar</span></div>`).join('')||'<div class="empty">Nada bloqueado</div>'}</div></div>`; };
function setTurno(e,d,i,v){ DB.horarios[e][d][i]=v; guardar(); toast('Horario guardado · la web ya lo tiene en cuenta'); }
function setLibra(e,d,libra){ DB.horarios[e][d]=libra?null:[SEDE.abre,SEDE.cierra]; guardar(); toast(libra?''+esc(SV.E(e).n)+' libra los '+DN[d].toLowerCase():''+esc(SV.E(e).n)+' trabaja los '+DN[d].toLowerCase()); ir('equipo',1); }

/* ── LAS 3 SEDES ── */
const A_EUR=0.24; // 1 AED ≈ 0,24 € (aprox., solo para sumar el grupo)
R.sedes=()=>{ const d0=SV.masD(-27);
  const filas=Object.values(SV_SEDES).map(x=>{ const d=x.k===SV_SEDE?DB:svVentasDe(x.k); if(!d) return {x,d:null};
    const v=d.ventas.filter(v=>v.f>=d0), tot=v.reduce((t,v)=>t+v.imp,0), cit=d.citas.filter(a=>a.f>=d0&&a.f<=HOY), web=cit.filter(a=>a.web).length, hoy=d.citas.filter(a=>a.f===HOY&&a.est!=='cancelada').length, ns=cit.filter(a=>a.est==='noshow').length;
    const porE=x.equipo.map(e=>({e,v:v.filter(y=>y.e===e.k&&y.tipo==='serv').reduce((t,y)=>t+y.imp,0)}));
    return {x,d,tot,eur:x.mon==='AED'?tot*A_EUR:tot,web,cit:cit.length,hoy,ns,porE}; });
  const ok=filas.filter(f=>f.d), grupo=ok.reduce((t,f)=>t+f.eur,0), top=ok.flatMap(f=>f.porE.map(p=>({...p,sede:f.x,eur:f.x.mon==='AED'?p.v*A_EUR:p.v}))).sort((a,b)=>b.eur-a.eur).slice(0,6), mx=Math.max(...top.map(t=>t.eur),1);
  return cab('Últimas 4 semanas · las 3 barberías','Todo Salvajes, <em>en una pantalla.</em>')+
  `<div class="grid g4" style="margin-bottom:14px"><div class="card kpi"><small>Facturación del grupo</small><b>${SV.din(grupo,'€')}</b><div class="tr" style="color:var(--mu)">Dubái pasado a euros (aprox.)</div></div><div class="card kpi"><small>Citas</small><b>${ok.reduce((t,f)=>t+f.cit,0)}</b></div><div class="card kpi"><small>Reservadas en vuestras webs</small><b>${ok.reduce((t,f)=>t+f.web,0)}</b><div class="tr">sin comisión de plataforma</div></div><div class="card kpi"><small>No vinieron</small><b>${ok.reduce((t,f)=>t+f.ns,0)}</b></div></div>
  <div class="sedes3" style="margin-bottom:14px">${filas.map(f=>f.d?`<div class="card" style="${f.x.k===SV_SEDE?'box-shadow:0 0 0 2px var(--acc)':''}"><div class="mono">${f.x.ciudad}</div><h3 style="font-size:16px;font-weight:600;margin:4px 0 2px">${esc(f.x.n)}</h3><small style="color:var(--mu)">${esc(f.x.dir)}</small>
     <div class="cifra">${SV.din(f.tot,f.x.mon)}</div><small style="color:var(--mu)">${f.x.mon==='AED'?'≈ '+SV.din(f.eur,'€')+' · ':''}4 semanas</small>
     <div class="row" style="margin-top:10px"><div class="x"><small>Hoy</small></div><b>${f.hoy} citas</b></div><div class="row"><div class="x"><small>Desde la web</small></div><b>${f.cit?Math.round(f.web*100/f.cit):0} %</b></div><div class="row"><div class="x"><small>Equipo</small></div><b>${f.x.equipo.length}</b></div>
     ${f.x.k===SV_SEDE?'<span class="chip c-o" style="margin-top:8px">Estás aquí</span>':`<button class="btn bs peq" style="margin-top:8px" onclick="cambiarSede('${f.x.k}')">Entrar en esta sede</button>`}</div>`:`<div class="card"><h3 style="">${esc(f.x.n)}</h3><div class="empty">Cargando datos… <button class="tg" onclick="ir('sedes',1)">recargar</button></div></div>`).join('')}</div>
  <div class="card"><div class="sec-t"><h3>Mejores barberos del grupo</h3><span class="mono">servicios · 4 semanas · en €</span></div>${top.map(t=>`<div class="hb"><span>${esc(t.e.n)} <small style="color:var(--mu)">· ${esc(t.sede.corto)}</small></span><i style="width:${Math.max(4,t.eur*55/mx)}%;background:${t.e.c}"></i><b>${SV.din(t.eur,'€')}</b></div>`).join('')}</div>`; };
addEventListener('storage',e=>{ if(e.key&&e.key.startsWith('salvajes_multi_v2_')&&e.key!==SV_CLAVE&&VISTA==='sedes') ir('sedes',1); });

/* ── COBRO DE LAS RESERVAS WEB ── */
const SENAL=SEDE.pais==='AE'?20:5;
function setPago(m){ DB.pagoWeb=m; guardar(); toast('Guardado · la web ya lo aplica'); ir('web',1); }
function bloquePago(){ const m=DB.pagoWeb||'centro', o=(k,t,d)=>`<label class="opcion-pago ${m===k?'on':''}"><input type="radio" name="pg" ${m===k?'checked':''} onchange="setPago('${k}')"><div><b>${t}</b><br><small style="color:var(--mu)">${d}</small></div></label>`;
  return `<div class="card" style="margin-top:14px"><div class="sec-t"><h3>Cómo se paga la reserva online</h3><span class="mono">Lo cambiáis cuando queráis</span></div>
   ${o('centro','Pago en la barbería','El cliente reserva gratis y paga al terminar, como ahora. Sin comisiones de nadie.')}
   ${o('senal','Señal de '+aed(SENAL)+' con Stripe, solo clientes nuevos','Se descuenta del servicio. Si no viene, os la quedáis: adiós a los «no vino».')}
   ${o('total','Pago completo online con Stripe','El cliente paga al reservar. Stripe cobra su comisión por tarjeta; Airmate no cobra nada por reserva.')}</div>`; }

function velo(h){ cerrar(); const v=document.createElement('div'); v.className='velo'; v.id='velo'; v.innerHTML=`<div class="modal">${h}</div>`; v.onclick=e=>{ if(e.target===v) cerrar(); }; document.body.appendChild(v); }
function cerrar(){ $('velo')?.remove(); }
addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });
const q=new URLSearchParams(location.search); if(q.get('v')&&R[q.get('v')]) VISTA=q.get('v');
ir(VISTA);
const USERS=[['Anuar','Dueño · 3 sedes','#7a1f2b'],['Laia','Dueña · 3 sedes','#9b4d6a'],[SV_EQUIPO[0].n,'Barbero · '+SEDE.corto,'#3f5a4a']]; let USEL=0;
function pintarUs(){ $('lgUs').innerHTML=USERS.map((u,i)=>`<button class="${i===USEL?'on':''}" onclick="USEL=${i};pintarUs()"><i style="background:${u[2]}">${u[0][0]}</i>${u[0]}<span>${u[1]}</span></button>`).join(''); }
function entrar(){ const u=USERS[USEL]; document.querySelector('.yo').innerHTML=`<b>${u[0]} · ${u[1]}</b>Acceso con usuario propio`; try{sessionStorage.setItem('sv_in','1')}catch(e){}
  if(window.gsap){ gsap.to('#login .lg-c',{y:-20,opacity:0,duration:.4,ease:'power2.in'}); gsap.to('#login',{clipPath:'inset(0 0 100% 0)',duration:.9,ease:'expo.inOut',delay:.25,onComplete:()=>$('login').remove()}); gsap.from('.side',{x:-40,opacity:0,duration:1,ease:'expo.out',delay:.6}); setTimeout(()=>ir(VISTA),500); } else $('login').remove(); }
(()=>{ let dentro=false; try{dentro=sessionStorage.getItem('sv_in')==='1'}catch(e){} if(dentro||q.has('rapido')) $('login').remove(); else { pintarUs(); if(window.gsap) gsap.from('#login .lg-c > *',{y:20,opacity:0,duration:.8,ease:'expo.out',stagger:.07}); } })();
</script>
</body></html>
