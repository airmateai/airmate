<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fitenia · Panel de gestión (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#111417; --side2:#1b1f24; --bg:#f4f5f7; --card:#fff; --line:#e6e8ec;
  --ink:#101418; --mut:#6b7280; --acc:#0e9fc4; --acc2:#0b7f9d; --ok:#14a35a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.side img{width:170px;margin:4px 8px 6px}
.side .sub{font-size:10px;letter-spacing:.2em;color:#8a9099;margin:0 8px 22px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav .grp{font-size:10px;letter-spacing:.18em;color:#5f6670;font-weight:700;margin:14px 14px 6px}
.nav button{background:none;border:0;color:#b9bec6;text-align:left;padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.badge{background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:2px 8px}
.badge.w{background:var(--warn)}
.side .foot{margin-top:auto;font-size:11px;color:#6b7280;padding:18px 8px 0;line-height:1.6}
.side .foot button{background:none;border:1px solid #2a2f36;color:#8a9099;border-radius:8px;padding:6px 10px;font-size:11px;margin-top:8px}
main{padding:28px 34px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:-.02em}
.sub2{color:var(--mut);font-size:13px;margin-top:3px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block}
.btn.acc{background:var(--acc)} .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn)} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)} .k3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.kpi .l{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:700;text-transform:uppercase}
.kpi .v{font-size:28px;font-weight:800;margin-top:6px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:14px}
.ttl{font-size:15px;font-weight:800;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:#f8fafb;cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.t-ok{background:#dcf5e7;color:var(--ok)} .t-warn{background:#fdf0d5;color:#b7791f} .t-bad{background:#fde2e2;color:var(--bad)} .t-acc{background:#dff4fa;color:var(--acc2)} .t-mut{background:#eef0f3;color:var(--mut)}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.col{background:#eceef1;border-radius:14px;padding:12px;min-height:300px}
.col h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:4px 6px 12px;display:flex;justify-content:space-between}
.lead{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.lead.new{animation:flash 1.6s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:none}}
.lead b{font-size:15px}
.lead .meta{color:var(--mut);font-size:12px;margin:4px 0 10px}
.lead .acts{display:flex;gap:6px;flex-wrap:wrap}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.sc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.06)}
.av{width:42px;height:42px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.bar{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;display:block;margin:12px 0 6px}
.modal{position:fixed;inset:0;background:rgba(10,12,15,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:26px;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mbox h2{margin:0 0 4px;font-size:20px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-weight:700}
.pick button small{display:block;color:var(--mut);font-weight:500;margin-top:3px}
.pick button.on{border-color:var(--acc);background:#eaf7fb}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.chk input{width:18px;height:18px;flex-shrink:0}
label.chk{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500;margin:0 0 6px;cursor:pointer}
.msg{white-space:pre-wrap;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.sea{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sea div{background:#f1f9fc;border-radius:12px;padding:12px;text-align:center}
.sea b{display:block;font-size:22px;color:var(--acc2)}
.sea small{font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:700}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.fc .d{border-radius:12px;padding:10px 8px;text-align:center;border:1px solid var(--line);background:#fff}
.fc .d small{display:block;font-size:10px;letter-spacing:.1em;color:var(--mut);font-weight:700;text-transform:uppercase}
.fc .d b{display:block;font-size:17px;margin:4px 0 2px}
.fc .d .w{font-size:11px;color:var(--mut)}
.fc .d .r{margin-top:6px;font-size:10px;font-weight:800;border-radius:99px;padding:3px 6px;display:inline-block}
.r-ok{background:#dcf5e7;color:var(--ok)} .r-warn{background:#fdf0d5;color:#b7791f} .r-bad{background:#fde2e2;color:var(--bad)} .r-flat{background:#eef0f3;color:var(--mut)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:220px;padding:8px}
.wd.today{border-color:var(--acc);box-shadow:0 0 0 2px #dff4fa}
.wd h4{margin:2px 4px 8px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;text-transform:capitalize}
.cl{border-radius:10px;padding:8px 9px;margin-bottom:6px;cursor:pointer;font-size:12px;border-left:4px solid var(--acc);background:#f1f9fc}
.cl.realizada{border-color:var(--ok);background:#effaf3}
.cl.cancelada{border-color:var(--bad);background:#fdf1f1;text-decoration:line-through;color:var(--mut)}
.cl b{display:block;font-size:12px}
.occ{height:5px;background:#dfe3e8;border-radius:99px;margin-top:5px;overflow:hidden}.occ i{display:block;height:100%;background:var(--acc2)}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:14px 18px;border-radius:12px;font-weight:600;z-index:60;transform:translateY(140px);transition:transform .25s;max-width:360px}
.toast.on{transform:none}
.demo{position:fixed;left:252px;bottom:14px;background:#fff3e0;color:#9a5b00;font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;z-index:40}
.page{display:none}.page.on{display:block}
.empty{color:var(--mut);text-align:center;padding:30px}
.chart{display:flex;align-items:flex-end;gap:14px;height:200px;padding:10px 4px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .b i{width:100%;max-width:56px;background:linear-gradient(180deg,var(--acc),var(--acc2));border-radius:8px 8px 3px 3px;min-height:4px}
.chart .b span{font-size:11px;color:var(--mut);margin-top:6px;text-transform:capitalize}
.chart .b em{font-style:normal;font-size:11px;font-weight:700;margin-bottom:4px}
.hb{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hb .n{width:150px;font-size:13px;font-weight:600}
.hb .t{flex:1;height:12px;background:#eef0f3;border-radius:99px;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--acc)}
.hb .v{width:70px;text-align:right;font-weight:700;font-size:13px}
.web{background:linear-gradient(160deg,#0b2a36,#0e9fc4);border-radius:16px;padding:22px;color:#fff}
.web h3{margin:0 0 4px;font-size:20px}.web p{margin:0 0 12px;opacity:.85;font-size:13px}
.web input,.web select{border:0;margin-bottom:8px}
.stock{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stock div{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stock b{display:block;font-size:22px}
.stock small{color:var(--mut);font-size:11px;font-weight:700}
@media(max-width:1100px){.week,.fc{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.k4,.k3,.kan{grid-template-columns:1fr 1fr}.row{flex-direction:column}.demo{left:12px}.week,.fc{grid-template-columns:repeat(2,1fr)}main{padding:20px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <img src="logo-fitenia.png" alt="Fitenia Surf School">
    <div class="sub">PANEL DE GESTIÓN</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Hecho por Airmate · demo con datos de prueba<br><button onclick="reiniciar()">↺ Reiniciar datos de prueba</button></div>
  </aside>
  <main>
    <section class="page" id="p-inicio"></section>
    <section class="page" id="p-interesados"></section>
    <section class="page" id="p-clases"></section>
    <section class="page" id="p-cobrar"></section>
    <section class="page" id="p-alumnos"></section>
    <section class="page" id="p-campamentos"></section>
    <section class="page" id="p-monitores"></section>
    <section class="page" id="p-material"></section>
    <section class="page" id="p-caja"></section>
    <section class="page" id="p-informes"></section>
  </main>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div class="demo">DEMO · datos ficticios</div>

<script>
/* ───────── Utilidades de fecha y formato ───────── */
const hoy = new Date(); hoy.setHours(0,0,0,0);
const dd = n => { const d = new Date(hoy); d.setDate(d.getDate()+n); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtD = s => new Date(s+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
const eur = n => Number(n).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const ini = n => n.split(' ').map(w=>w[0]).slice(0,2).join('');
const nombre1 = n => n.split(' ')[0];
const wa = (tel,txt) => `https://wa.me/34${String(tel).replace(/\D/g,'')}?text=${encodeURIComponent(txt)}`;

/* ───────── Catálogo (precios de ejemplo: se ponen los reales de la escuela) ───────── */
const PRODUCTOS = [
  {id:'c1', n:'Curso 1 día', clases:1, precio:40},
  {id:'c2', n:'Curso 2 días', clases:2, precio:75},
  {id:'c4', n:'Curso 4 días', clases:4, precio:140},
  {id:'b8', n:'Bono 8 clases', clases:8, precio:240},
  {id:'part', n:'Clase particular', clases:1, precio:60},
];
const EXTRAS = [
  {id:'alqT', n:'Alquiler tabla (día)', precio:15},
  {id:'alqN', n:'Alquiler neopreno (día)', precio:8},
];
const PLAYAS = ['Playa del Roque', 'Playa de Almáciga'];
const NIVELES = ['Iniciación', 'Intermedio', 'Avanzado'];
const TALLAS = ['XS','S','M','L','XL'];
const TALLAS_NINO = ['6','8','10','12','14'];

/* ───────── Datos de prueba (se guardan en este navegador) ───────── */
let _id = 1000; const nid = () => ++_id;
const CLAVE = 'fitenia-demo-v2';

function semilla(){
  _id = 1000;
  const S = {};
  S.monitores = [
    {id:nid(),nombre:'Dani Hernández',tel:'622 100 201',tarifa:22,color:'#0e9fc4'},
    {id:nid(),nombre:'Laura Pérez',tel:'622 100 202',tarifa:22,color:'#14a35a'},
    {id:nid(),nombre:'Rubén Afonso',tel:'622 100 203',tarifa:18,color:'#d97706'},
  ];
  S.material = {
    tablas:[{id:'esp8',n:'Espuma 8\'',total:14},{id:'esp7',n:'Espuma 7\'',total:8},{id:'evo',n:'Evolutiva 7\'2',total:4},{id:'sup',n:'Tabla SUP',total:3}],
    neoprenos:{XS:4,S:6,M:8,L:7,XL:3,'6':3,'8':4,'10':4,'12':4,'14':3},
    averiadas:[{id:nid(),que:'Espuma 8\' #11',nota:'Quilla rota',fecha:iso(dd(-3))}],
  };
  const A = [
    ['Carla Méndez','612 345 101','Iniciación','S',false],['Hugo Ferrer','612 345 102','Iniciación','M',false],['Sara Lozano','612 345 103','Intermedio','S',false],
    ['Leo Castro','612 345 104','Iniciación','12',true],['Irene Soto','612 345 105','Intermedio','M',false],['Daniel Prieto','612 345 106','Avanzado','L',false],
    ['Noa Herrera','612 345 107','Iniciación','10',true],['Adrián Cano','612 345 108','Intermedio','L',false],['Julia Ramos','612 345 109','Iniciación','S',false],
    ['Mario Fuentes','612 345 110','Iniciación','XL',false],['Elena Ortiz','612 345 111','Avanzado','M',false],['Bruno Serrano','612 345 112','Intermedio','M',false],
    ['Martina Díaz','612 345 113','Iniciación','8',true],['Óscar Rivas','612 345 114','Iniciación','L',false],
  ];
  S.alumnos = A.map(([nombre,tel,nivel,talla,menor],i)=>({id:nid(),nombre,tel,nivel,talla,menor,tutor:menor?'Madre/padre de '+nombre1(nombre):'',
    alta:iso(dd(-150+i*9)),total:0,restantes:0,notas:'',origen:['Web','Tienda','Recomendación','Instagram'][i%4]}));
  S.interesados = [
    {id:nid(),nombre:'Marta Gil',tel:'611 222 301',interes:'Curso 2 días',fecha:'Este sábado',origen:'Web',estado:'nuevo',creado:iso(hoy)},
    {id:nid(),nombre:'Pablo Díaz',tel:'611 222 302',interes:'Campamento',fecha:'Julio',origen:'Instagram',estado:'nuevo',creado:iso(dd(-1))},
    {id:nid(),nombre:'Lucía Vera',tel:'611 222 303',interes:'Curso 1 día',fecha:'Domingo',origen:'Web',estado:'contactado',creado:iso(dd(-2))},
    {id:nid(),nombre:'Iván Ruiz',tel:'611 222 304',interes:'Bono 8 clases',fecha:'Entre semana',origen:'Tienda',estado:'contactado',creado:iso(dd(-4))},
  ];
  /* Historial de cobros de 6 meses (para Informes) */
  S.pagos = [];
  let k=0;
  for(let m=5;m>=0;m--){
    const nVentas=[7,9,12,16,21,14][5-m];
    for(let j=0;j<nVentas;j++){
      const d=new Date(hoy.getFullYear(),hoy.getMonth()-m,1+((j*3+m)%27));
      if(d>hoy) continue;
      const prod=PRODUCTOS[(j*7+m)%PRODUCTOS.length];
      const a=S.alumnos[(j+m*3)%9]; // los 9 primeros son habituales
      S.pagos.push({id:nid(),alumno:a.id,concepto:prod.n,importe:prod.precio,metodo:['Efectivo','Tarjeta','Bizum'][(k++)%3],fecha:iso(d)});
    }
  }
  /* Los últimos alumnos solo han comprado una vez (nuevos este mes o el anterior) */
  S.alumnos.slice(9).forEach((a,i)=>{ const prod=PRODUCTOS[i%3]; S.pagos.push({id:nid(),alumno:a.id,concepto:prod.n,importe:prod.precio,metodo:['Tarjeta','Bizum','Efectivo'][i%3],fecha:iso(dd(-(i*6+2)))}); });
  /* Estado de bonos actual */
  [[0,'b8',5],[1,'c4',2],[2,'b8',1],[3,'c2',0],[4,'b8',6],[5,'c4',3],[6,'c4',1],[7,'b8',0],[8,'c2',2],[9,'c4',4],[10,'b8',2],[11,'c2',1],[12,'c4',3],[13,'c2',2]].forEach(([i,pid,rest])=>{
    const a=S.alumnos[i], p=PRODUCTOS.find(x=>x.id===pid); a.total=p.clases; a.restantes=rest;
  });
  /* Clases: pasadas, canceladas y convocadas esta semana */
  const m=S.monitores, al=S.alumnos;
  const cl=(n,hora,playa,mon,nivel,ids,estado)=>({id:nid(),fecha:iso(dd(n)),hora,playa,monitor:mon.id,nivel,plazas:8,alumnos:ids.map(i=>al[i].id),estado,asistieron:estado==='realizada'?ids.map(i=>al[i].id):[]});
  S.clases = [
    cl(-6,'10:00',PLAYAS[0],m[0],'Iniciación',[0,1,6,8,12],'realizada'),
    cl(-5,'10:00',PLAYAS[1],m[1],'Intermedio',[2,4,7,11],'realizada'),
    cl(-4,'16:00',PLAYAS[0],m[0],'Iniciación',[0,3,9,13],'cancelada'),
    cl(-3,'10:00',PLAYAS[0],m[2],'Iniciación',[1,6,8,9,12,13],'realizada'),
    cl(-2,'10:00',PLAYAS[0],m[0],'Iniciación',[0,1,6],'realizada'),
    cl(-1,'11:00',PLAYAS[1],m[1],'Intermedio',[2,4],'cancelada'),
    cl(1,'10:00',PLAYAS[0],m[0],'Iniciación',[0,4,8,9,12,13],'convocada'),
    cl(2,'11:00',PLAYAS[1],m[1],'Intermedio',[2,7,11],'convocada'),
    cl(3,'10:00',PLAYAS[0],m[2],'Iniciación',[1,6,8],'convocada'),
    cl(4,'16:30',PLAYAS[1],m[0],'Avanzado',[5,10],'convocada'),
  ];
  /* Campamentos de verano */
  S.campSemanas = [
    {id:nid(),nombre:'Semana 1 · 30 jun – 4 jul',plazas:16,precio:180},
    {id:nid(),nombre:'Semana 2 · 7 – 11 jul',plazas:16,precio:180},
    {id:nid(),nombre:'Semana 3 · 14 – 18 jul',plazas:16,precio:180},
  ];
  const ninos=[['Álex Martín',9,'Ana Martín','633 400 101','',true,true,'10'],['Vega Suárez',11,'Pedro Suárez','633 400 102','Frutos secos',true,true,'12'],
    ['Teo García',8,'Laura García','633 400 103','',false,true,'8'],['Lola Pérez',12,'Javier Pérez','633 400 104','',true,false,'12'],
    ['Nico Ramos',10,'Eva Ramos','633 400 105','Asma (lleva inhalador)',true,true,'10'],['Zoe Díaz',7,'Marta Díaz','633 400 106','',false,false,'6'],
    ['Hugo León',13,'Raúl León','633 400 107','',true,true,'14']];
  S.campInscritos = ninos.map(([nino,edad,tutor,tel,alergias,aut,pag,talla],i)=>({id:nid(),semana:S.campSemanas[i%3===2?1:0].id,nino,edad,tutor,tel,alergias,autorizacion:aut,pagado:pag,talla}));
  return S;
}
let S;
function cargar(){
  try{ const g=localStorage.getItem(CLAVE); if(g){ const d=JSON.parse(g); S=d.S; _id=d.id; return; } }catch(e){}
  S=semilla();
}

/* ───────── Mar: ahora + previsión 7 días (open-meteo, gratis y en directo) ───────── */
let MAR = null, PREV = null;
const LAT=28.578, LON=-16.141; // Almáciga / Roque de las Bodegas
async function cargarMar(){
  try{
    const [m,w] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&current=wave_height,wave_period,sea_surface_temperature&daily=wave_height_max,wave_period_max&timezone=Atlantic%2FCanary&forecast_days=7`).then(r=>r.json()),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m&daily=wind_speed_10m_max,temperature_2m_max&timezone=Atlantic%2FCanary&forecast_days=7`).then(r=>r.json()),
    ]);
    MAR = {ola:m.current?.wave_height, periodo:m.current?.wave_period, agua:m.current?.sea_surface_temperature, viento:w.current?.wind_speed_10m};
    PREV = (m.daily?.time||[]).map((t,i)=>({fecha:t, ola:m.daily.wave_height_max[i], periodo:m.daily.wave_period_max[i], viento:w.daily?.wind_speed_10m_max?.[i], temp:w.daily?.temperature_2m_max?.[i]}));
  }catch(e){ MAR=null; PREV=null; }
  if(actual==='inicio'||actual==='clases') render();
}
/* Veredicto sencillo para iniciación: lo ajusta la escuela a su criterio */
function veredicto(d){
  if(!d||d.ola==null) return {t:'—',c:'r-flat'};
  if(d.viento!=null&&d.viento>32) return {t:'Mucho viento',c:'r-bad'};
  if(d.ola>2.0) return {t:'Grande · solo avanzado',c:'r-bad'};
  if(d.ola>1.5) return {t:'Fuerte · intermedio+',c:'r-warn'};
  if(d.ola<0.4) return {t:'Casi plano',c:'r-flat'};
  return {t:'Bueno para clase',c:'r-ok'};
}
const prevDe = f => PREV ? PREV.find(p=>p.fecha===f) : null;
function bloquePrevision(){
  if(!PREV) return '<div class="empty">Cargando previsión del mar…</div>';
  return `<div class="fc">${PREV.map(p=>{const v=veredicto(p);const n=S.clases.filter(c=>c.fecha===p.fecha&&c.estado==='convocada').length;return `<div class="d">
    <small>${new Date(p.fecha+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric'})}</small>
    <b>${p.ola!=null?p.ola.toFixed(1)+' m':'—'}</b><div class="w">${p.periodo!=null?Math.round(p.periodo)+' s':''} · 💨 ${p.viento!=null?Math.round(p.viento):'—'} km/h</div>
    <span class="r ${v.c}">${v.t}</span>
    ${n?`<div style="margin-top:6px"><button class="btn sm ${v.c==='r-bad'?'bad':'ghost'}" style="padding:4px 8px;font-size:11px" onclick="cancelarDia('${p.fecha}')">${v.c==='r-bad'?'Cancelar ':''}${n} clase${n>1?'s':''}</button></div>`:''}
  </div>`}).join('')}</div>`;
}

function filtrarNivel(){ const n=$('nc-n').value; document.querySelectorAll('.nc-row').forEach(r=>{ const ok=r.dataset.nivel===n; r.style.display=ok?'':'none'; r.querySelector('input').checked=ok; }); }
function avisoMar(){ const f=$('nc-f').value, p=prevDe(f), v=veredicto(p); $('nc-mar').innerHTML=p?`<span class="tag ${v.c==='r-ok'?'t-ok':v.c==='r-bad'?'t-bad':'t-warn'}">🌊 ${p.ola.toFixed(1)} m · ${v.t}</span>`:''; }
function guardarClase(){
  const ids=[...document.querySelectorAll('.nc-a:checked')].filter(x=>x.closest('.nc-row').style.display!=='none').map(x=>+x.value);
  const plazas=+$('nc-pl').value||8;
  if(!ids.length) return toast('⚠ Elige al menos un alumno');
  if(ids.length>plazas) return toast(`⚠ La furgoneta tiene ${plazas} plazas y has elegido ${ids.length}`);
  const c={id:nid(),fecha:$('nc-f').value,hora:$('nc-h').value,playa:$('nc-p').value,monitor:+$('nc-m').value,nivel:$('nc-n').value,plazas,alumnos:ids,estado:'convocada',asistieron:[]};
  S.clases.push(c); render(); mensaje(c.id,'convocar');
  const f=faltaMaterial().filter(x=>x.fecha===c.fecha); if(f.length) setTimeout(()=>toast(`⚠ Ese día faltan neoprenos talla ${f.map(x=>x.talla).join(', ')}`),600);
}
function textoMsg(c,tipo){
  const nombres=c.alumnos.map(id=>'• '+alumno(id).nombre).join('\n');
  const m=monitor(c.monitor);
  if(tipo==='cancelar') return `🌊 AVISO FITENIA\n\nLa clase del ${fmtD(c.fecha)} a las ${c.hora} en ${c.playa} se SUSPENDE por las condiciones del mar.\n\nNo perdéis la clase: os avisamos en cuanto haya buen día 🤙\n\n${nombres}`;
  if(tipo==='recordar') return `⏰ RECORDATORIO FITENIA\n\nMañana ${fmtD(c.fecha)} tenéis clase a las ${c.hora} en ${c.playa}.\n🚐 Salida en furgoneta desde la tienda (Av. Ángel Guimerá 13), 30 min antes.\n\nTraed bañador, toalla y crema. ¡Hasta mañana! 🤙`;
  return `🏄 CLASE CONFIRMADA · FITENIA\n\n📅 ${fmtD(c.fecha)} · ${c.hora}\n📍 ${c.playa}\n🚐 Salida en furgoneta desde la tienda (Av. Ángel Guimerá 13), 30 min antes\n👨‍🏫 Monitor: ${nombre1(m.nombre)}\n\nVienen:\n${nombres}\n\nTraed bañador, toalla y crema. ¡Nos vemos en el agua! 🤙`;
}
let MSG='';
function copiarMsg(){ (navigator.clipboard?navigator.clipboard.writeText(MSG):Promise.reject()).then(()=>toast('✓ Mensaje copiado'),()=>toast('Selecciona el texto y cópialo')); }
function mensaje(id,tipo){
  const c=S.clases.find(x=>x.id===id), t=textoMsg(c,tipo); MSG=t;
  const tit={cancelar:'Aviso de cancelación',recordar:'Recordatorio para mañana',convocar:'Mensaje para el grupo'}[tipo];
  modal(`<h2>${tit}</h2><div class="sub2">Cópialo al grupo de WhatsApp o envíalo a cada alumno</div>
  <div class="msg" style="margin-top:14px">${esc(t)}</div>
  <div class="ttl" style="margin-top:16px">Enviar uno a uno</div>
  ${c.alumnos.map(aid=>{const a=alumno(aid);return `<div class="chk" style="justify-content:space-between"><span>${esc(a.nombre)}${a.menor?' <span class="tag t-mut">menor · al tutor</span>':''}</span><a class="btn sm ok" target="_blank" href="${wa(a.tel,t)}">WhatsApp</a></div>`}).join('')}
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cerrar</button><button class="btn acc" onclick="copiarMsg()">Copiar para el grupo</button></div>`);
}
function cancelar(id){ const c=S.clases.find(x=>x.id===id); c.estado='cancelada'; toast('Clase cancelada · nadie pierde su clase'); render(); mensaje(id,'cancelar'); }
function cancelarDia(f){
  const cs=S.clases.filter(c=>c.fecha===f&&c.estado==='convocada'); if(!cs.length) return;
  cs.forEach(c=>c.estado='cancelada');
  const ids=[...new Set(cs.flatMap(c=>c.alumnos))];
  const fake={fecha:f,hora:cs.map(c=>c.hora).join(' y '),playa:[...new Set(cs.map(c=>c.playa))].join(' / '),alumnos:ids,monitor:cs[0].monitor};
  MSG=textoMsg(fake,'cancelar'); render();
  modal(`<h2>${cs.length} clase${cs.length>1?'s':''} cancelada${cs.length>1?'s':''} · ${fmtD(f)}</h2><div class="sub2">${ids.length} alumnos avisados con un mensaje. Ninguno pierde su clase del bono.</div>

  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cerrar</button><button class="btn acc" onclick="copiarMsg()">Copiar para el grupo</button></div>`);
}
function lista(id){
  const c=S.clases.find(x=>x.id===id);
  modal(`<h2>Pasar lista</h2><div class="sub2">${fmtD(c.fecha)} · ${c.hora} · ${c.playa}. Al confirmar, se descuenta una clase a quien vino.</div>
  <div style="margin-top:14px">${c.alumnos.map(aid=>{const a=alumno(aid);return `<label class="chk"><input type="checkbox" class="pl-a" value="${a.id}" checked> <b>${esc(a.nombre)}</b> · le quedan ${a.restantes} <span class="tag t-acc" style="margin-left:auto">Neo ${a.talla}</span></label>`}).join('')}</div>
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn ok" onclick="confirmarLista(${id})">Confirmar asistencia</button></div>`);

function confirmarLista(id){
  const c=S.clases.find(x=>x.id===id);

  const sin=vinieron.map(alumno).filter(a=>a.restantes===0);

function verClase(id){
  const c=S.clases.find(x=>x.id===id), m=monitor(c.monitor);
  const tallas={}; c.alumnos.forEach(a=>{const t=alumno(a).talla;tallas[t]=(tallas[t]||0)+1;});
  modal(`<h2>${fmtD(c.fecha)} · ${c.hora} · ${c.nivel}</h2><div class="sub2">${c.playa} · ${m.nombre} · 🚐 ${c.alumnos.length}/${c.plazas}</div>

  <div class="row" style="gap:8px;flex-wrap:wrap"><span class="tag t-acc">🏄 ${c.alumnos.length} tablas</span>${Object.entries(tallas).map(([t,n])=>`<span class="tag t-mut">Neopreno ${t} × ${n}</span>`).join('')}</div>
  <div class="ttl" style="margin-top:16px">Alumnos</div>
  ${c.alumnos.map(aid=>{const a=alumno(aid);return `<div class="chk">${c.asistieron.includes(aid)?'✅':c.estado==='cancelada'?'🌊':c.estado==='convocada'?'🕒':'❌'} ${esc(a.nombre)} <span class="sub2" style="margin:0 0 0 auto">${a.nivel}${a.menor?' · menor':''}</span> <span class="tag t-acc">Neo ${a.talla}</span></div>`}).join('')}
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cerrar</button>${c.estado==='convocada'?botonesClase(c):''}</div>`);

/* ───────── Cobrar (TPV) ───────── */

  const ex = EXTRAS.filter(e=>COBRO.extras.includes(e.id));

  $('p-cobrar').innerHTML = `
  <div class="top"><div><h1>Cobrar</h1><div class="sub2">Cobras en la tienda y el bono se crea solo</div></div></div>
  <div class="row">
    <div class="card" style="flex:1.4">
      <label style="margin-top:0">Alumno</label>
      ${inter?`<div class="chk"><b>${esc(inter.nombre)}</b> · nuevo alumno (desde Interesados)</div>`:
      `<select id="cb-a" onchange="COBRO.alumno=+this.value||null;$('cb-nuevo').style.display=this.value?'none':''"><option value="">+ Alumno nuevo…</option>${S.alumnos.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(a=>`<option value="${a.id}" ${COBRO.alumno===a.id?'selected':''}>${esc(a.nombre)} · le quedan ${a.restantes}</option>`).join('')}</select>
      <div id="cb-nuevo" style="${COBRO.alumno?'display:none':''}"><div class="row" style="gap:8px;margin-top:8px"><input id="cb-n" placeholder="Nombre"><input id="cb-t" placeholder="Teléfono"><select id="cb-ta" style="max-width:110px">${TALLAS.map(t=>`<option ${t==='M'?'selected':''}>${t}</option>`).join('')}</select></div></div>`}
      <label>Qué compra</label>
      <div class="pick">${PRODUCTOS.map(x=>`<button class="${x.id===COBRO.producto?'on':''}" onclick="COBRO.producto='${x.id}';rCobrar()">${x.n}<small>${x.clases} clase${x.clases>1?'s':''} · ${eur(x.precio)}</small></button>`).join('')}</div>
      <label>Extras</label>
      <div class="pick">${EXTRAS.map(x=>`<button class="${COBRO.extras.includes(x.id)?'on':''}" onclick="togExtra('${x.id}')">${x.n}<small>${eur(x.precio)}</small></button>`).join('')}</div>
      <label>Cómo paga</label>
      <div class="pick">${['Efectivo','Tarjeta','Bizum'].map(m=>`<button class="${m===COBRO.metodo?'on':''}" onclick="COBRO.metodo='${m}';rCobrar()">${{Efectivo:'💵',Tarjeta:'💳',Bizum:'📱'}[m]} ${m}</button>`).join('')}</div>
    </div>
    <div class="card" style="flex:1;align-self:flex-start">
      <div class="ttl">Resumen</div>
      <div class="chk" style="justify-content:space-between"><span>${p.n}</span><b>${eur(p.precio)}</b></div>
      ${ex.map(e=>`<div class="chk" style="justify-content:space-between"><span>${e.n}</span><b>${eur(e.precio)}</b></div>`).join('')}
      <div class="chk" style="justify-content:space-between"><span>Clases que se suman</span><b>+${p.clases}</b></div>
      <div class="chk" style="justify-content:space-between"><span>Pago</span><b>${COBRO.metodo}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:24px;font-weight:800;margin:16px 4px">Total<span>${eur(total)}</span></div>
      <button class="btn ok" style="width:100%;padding:16px;font-size:15px" onclick="confirmarCobro()">Cobrar ${eur(total)}</button>
    </div>
  </div>
  <div class="sub2" style="margin-top:14px">Precios de ejemplo para la demo: se ponen los reales de la escuela.</div>`;
}
function togExtra(id){ COBRO.extras=COBRO.extras.includes(id)?COBRO.extras.filter(x=>x!==id):[...COBRO.extras,id]; rCobrar(); }
function confirmarCobro(){
  const p = PRODUCTOS.find(x=>x.id===COBRO.producto);
  const ex = EXTRAS.filter(e=>COBRO.extras.includes(e.id));
  let a;
  if(COBRO.interesado){
    const i=S.interesados.find(x=>x.id===COBRO.interesado);
    a={id:nid(),nombre:i.nombre,tel:i.tel,nivel:'Iniciación',talla:'M',menor:false,tutor:'',alta:iso(hoy),total:0,restantes:0,notas:'',origen:i.origen}; S.alumnos.push(a); i.estado='pagado';
  } else if(COBRO.alumno){ a=alumno(COBRO.alumno); }
  else {
    const n=$('cb-n').value.trim(); if(!n) return toast('⚠ Elige un alumno o escribe el nombre');
    a={id:nid(),nombre:n,tel:$('cb-t').value||'—',nivel:'Iniciación',talla:$('cb-ta').value,menor:false,tutor:'',alta:iso(hoy),total:0,restantes:0,notas:'',origen:'Tienda'}; S.alumnos.push(a);
  }
  a.total = a.restantes + p.clases; a.restantes += p.clases;
  S.pagos.unshift({id:nid(),alumno:a.id,concepto:p.n,importe:p.precio,metodo:COBRO.metodo,fecha:iso(hoy)});
  ex.forEach(e=>S.pagos.unshift({id:nid(),alumno:a.id,concepto:e.n,importe:e.precio,metodo:COBRO.metodo,fecha:iso(hoy)}));
  const total=p.precio+ex.reduce((s,e)=>s+e.precio,0);
  COBRO = {alumno:null, producto:'c2', metodo:'Efectivo', extras:[]};
  render();
  modal(`<div style="text-align:center"><div style="font-size:56px">✅</div><h2>Cobrado · ${eur(total)}</h2><div class="sub2">${esc(a.nombre)} ya tiene <b>${a.restantes} clase${a.restantes>1?'s':''}</b> en su bono</div>
  <div class="mact" style="justify-content:center"><a class="btn ok" target="_blank" href="${wa(a.tel,`¡Gracias ${nombre1(a.nombre)}! 🏄 Pago recibido: ${p.n} (${eur(total)}). Te quedan ${a.restantes} clases. Te avisamos por aquí de cada salida según el mar 🌊`)}">Enviar recibo por WhatsApp</a><button class="btn acc" onclick="cerrar();nuevaClase()">Convocar clase</button></div></div>`);
}

    <div class="card kpi"><div class="l">Cobrado</div><div class="v">${eur(cobrado)}</div></div>
    <div class="card kpi"><div class="l">Sin autorización</div><div class="v" style="color:var(--warn)">${S.campInscritos.filter(c=>!c.autorizacion).length}</div></div>
    <div class="card kpi"><div class="l">Pendiente de pago</div><div class="v" style="color:var(--bad)">${S.campInscritos.filter(c=>!c.pagado).length}</div></div>
  </div>
  <div class="row" style="gap:8px;margin:16px 0 12px;flex-wrap:wrap">${S.campSemanas.map(s=>{const n=S.campInscritos.filter(c=>c.semana===s.id).length;return `<button class="btn ${s.id===CAMP?'':'ghost'}" onclick="CAMP=${s.id};rCampamentos()">${s.nombre} · ${n}/${s.plazas}</button>`}).join('')}</div>
  <div class="card"><div class="ttl">${esc(sem.nombre)} <span class="row" style="gap:6px"><button class="btn sm ghost" onclick="listaCamp()">Lista para monitores</button><button class="btn sm ok" onclick="msgCamp()">Mensaje a las familias</button></span></div>
  ${ins.length?`<table><tr><th>Niño/a</th><th>Edad</th><th>Tutor</th><th>Alergias / salud</th><th>Talla</th><th>Autorización</th><th>Pago</th></tr>
  ${ins.map(c=>`<tr><td><b>${esc(c.nino)}</b></td><td>${c.edad}</td><td>${esc(c.tutor)}<div class="sub2" style="margin:0">${esc(c.tel)}</div></td>
    <td>${c.alergias?`<span class="tag t-bad">⚠ ${esc(c.alergias)}</span>`:'<span class="sub2">—</span>'}</td><td>${c.talla}</td>
    <td>${c.autorizacion?'<span class="tag t-ok">Firmada</span>':`<a class="btn sm warn" target="_blank" onclick="setTimeout(()=>{marcarCamp(${c.id},'autorizacion')},400)" href="${wa(c.tel,`Hola ${nombre1(c.tutor)}, somos Fitenia 🏄 Para el campamento de ${nombre1(c.nino)} nos falta la autorización firmada. Puedes firmarla aquí: [enlace] o traerla a la tienda. ¡Gracias!`)}">Pedir firma</a>`}</td>
    <td>${c.pagado?'<span class="tag t-ok">Pagado</span>':`<button class="btn sm" onclick="cobrarCamp(${c.id})">Cobrar ${eur(sem.precio)}</button>`}</td></tr>`).join('')}</table>`:'<div class="empty">Nadie inscrito todavía en esta semana</div>'}
  </div>`;
}
function marcarCamp(id,campo){ const c=S.campInscritos.find(x=>x.id===id); c[campo]=true; toast(campo==='autorizacion'?'✓ Marcada como firmada':'✓ Pagado'); render(); }
function cobrarCamp(id){
  const c=S.campInscritos.find(x=>x.id===id), s=S.campSemanas.find(x=>x.id===c.semana);
  modal(`<h2>Cobrar campamento</h2><div class="sub2">${esc(c.nino)} · ${esc(s.nombre)}</div>
  <label>Cómo paga</label><div class="pick" id="cc-m">${['Efectivo','Tarjeta','Bizum'].map((m,i)=>`<button class="${i===0?'on':''}" onclick="document.querySelectorAll('#cc-m button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${m}</button>`).join('')}</div>
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn ok" onclick="confirmarCamp(${id})">Cobrar ${eur(s.precio)}</button></div>`);
}
function confirmarCamp(id){
  const c=S.campInscritos.find(x=>x.id===id), s=S.campSemanas.find(x=>x.id===c.semana);
  const metodo=document.querySelector('#cc-m button.on').textContent;
  let a=S.alumnos.find(x=>x.nombre===c.nino);
  if(!a){ a={id:nid(),nombre:c.nino,tel:c.tel,nivel:'Iniciación',talla:c.talla,menor:true,tutor:c.tutor,alta:iso(hoy),total:0,restantes:0,notas:c.alergias?'Salud: '+c.alergias:'',origen:'Campamento'}; S.alumnos.push(a); }
  S.pagos.unshift({id:nid(),alumno:a.id,concepto:'Campamento · '+s.nombre.split('·')[0].trim(),importe:s.precio,metodo,fecha:iso(hoy)});
  c.pagado=true; cerrar(); toast(`✓ Campamento cobrado · ${eur(s.precio)}`); render();
}
function inscribir(nombre,tel,tutor){
  modal(`<h2>Inscribir en campamento</h2><div class="sub2">Los datos que la familia rellena (también puede hacerlo desde la web)</div>
  <label>Semana</label><select id="ci-s">${S.campSemanas.map(s=>`<option value="${s.id}" ${s.id===CAMP?'selected':''}>${s.nombre} · ${S.campInscritos.filter(c=>c.semana===s.id).length}/${s.plazas}</option>`).join('')}</select>
  <div class="row" style="gap:10px"><div style="flex:2"><label>Niño/a</label><input id="ci-n" value="${esc(nombre||'')}"></div><div style="flex:1"><label>Edad</label><input id="ci-e" type="number" value="10"></div><div style="flex:1"><label>Talla</label><select id="ci-t">${TALLAS_NINO.map(t=>`<option>${t}</option>`).join('')}</select></div></div>
  <div class="row" style="gap:10px"><div style="flex:1"><label>Madre / padre / tutor</label><input id="ci-tu" value="${esc(tutor||'')}"></div><div style="flex:1"><label>Teléfono</label><input id="ci-te" value="${esc(tel||'')}"></div></div>
  <label>Alergias o algo de salud</label><input id="ci-a" placeholder="Ej: alergia a frutos secos, asma…">
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="ci-au"> Autorización firmada (salida en furgoneta, baño, fotos)</label>
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn acc" onclick="guardarInscripcion()">Inscribir</button></div>`);
}
function guardarInscripcion(){
  const n=$('ci-n').value.trim(); if(!n) return toast('⚠ Escribe el nombre del niño/a');
  const s=+$('ci-s').value, sem=S.campSemanas.find(x=>x.id===s);
  if(S.campInscritos.filter(c=>c.semana===s).length>=sem.plazas) return toast('⚠ Esa semana está completa');
  S.campInscritos.push({id:nid(),semana:s,nino:n,edad:+$('ci-e').value,tutor:$('ci-tu').value,tel:$('ci-te').value,alergias:$('ci-a').value.trim(),autorizacion:$('ci-au').checked,pagado:false,talla:$('ci-t').value});
  CAMP=s; cerrar(); toast('✓ Inscrito'); go('campamentos');
}
function inscribirDesdeInteresado(id){ const i=S.interesados.find(x=>x.id===id); i.estado='pagado'; go('campamentos'); inscribir('',i.tel,i.nombre); }
function listaCamp(){
  const ins=S.campInscritos.filter(c=>c.semana===CAMP), s=S.campSemanas.find(x=>x.id===CAMP);
  modal(`<h2>Lista · ${esc(s.nombre)}</h2><div class="sub2">Para el monitor: con teléfonos de los tutores y avisos de salud</div>
  ${ins.map(c=>`<div class="chk" style="justify-content:space-between"><span><b>${esc(c.nino)}</b> (${c.edad}) · ${esc(c.tutor)} ${esc(c.tel)}</span>${c.alergias?`<span class="tag t-bad">⚠ ${esc(c.alergias)}</span>`:''}</div>`).join('')}
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cerrar</button><button class="btn acc" onclick="window.print()">Imprimir</button></div>`);
}
function msgCamp(){
  const ins=S.campInscritos.filter(c=>c.semana===CAMP), s=S.campSemanas.find(x=>x.id===CAMP);
  MSG=`🏕️ CAMPAMENTO FITENIA · ${s.nombre}\n\n¡Ya queda poco! Recordad:\n• Entrada 9:00 y recogida 14:00 en la tienda (Av. Ángel Guimerá 13)\n• Bañador, toalla, crema, gorra y agua\n• Desayuno a media mañana\n\n¡Va a ser una semana increíble! 🤙`;
  modal(`<h2>Mensaje a las familias</h2><div class="msg" style="margin-top:12px">${esc(MSG)}</div>
  ${ins.map(c=>`<div class="chk" style="justify-content:space-between;margin-top:6px"><span>${esc(c.tutor)} · ${esc(c.nino)}</span><a class="btn sm ok" target="_blank" href="${wa(c.tel,MSG)}">WhatsApp</a></div>`).join('')}
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cerrar</button><button class="btn acc" onclick="copiarMsg()">Copiar</button></div>`);
}

/* ───────── Monitores ───────── */
function rMonitores(){
  const lunes=dd(-((hoy.getDay()+6)%7)), dom=dd(6-((hoy.getDay()+6)%7));
  const enSemana=c=>c.fecha>=iso(lunes)&&c.fecha<=iso(dom);
  const mes=iso(hoy).slice(0,7);
  $('p-monitores').innerHTML = `
  <div class="top"><div><h1>Monitores</h1><div class="sub2">Quién da cada clase y cuánto se le paga este mes, sin hacer cuentas a mano</div></div><button class="btn acc" onclick="nuevoMonitor()">+ Añadir monitor</button></div>
  <div class="grid k3">${S.monitores.map(m=>{
    const sem=S.clases.filter(c=>c.monitor===m.id&&enSemana(c)&&c.estado!=='cancelada');
    const dadasMes=S.clases.filter(c=>c.monitor===m.id&&c.estado==='realizada'&&c.fecha.startsWith(mes));
    const prox=S.clases.filter(c=>c.monitor===m.id&&c.estado==='convocada').sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    return `<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="background:${m.color}">${ini(m.nombre)}</div><div><b>${esc(m.nombre)}</b><div class="sub2" style="margin:0">${eur(m.tarifa)} por clase</div></div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px">
      <div class="kpi"><div class="l">Esta semana</div><div class="v" style="font-size:22px">${sem.length} clases</div></div>
      <div class="kpi"><div class="l">A pagar mes</div><div class="v" style="font-size:22px">${eur(dadasMes.length*m.tarifa)}</div><div class="s">${dadasMes.length} clases dadas</div></div>
    </div>
    <div class="ttl" style="margin-top:14px;font-size:13px">Próximas</div>
    ${prox.slice(0,3).map(c=>`<div class="chk" style="font-size:13px">🕒 ${fmtD(c.fecha)} · ${c.hora} · ${c.nivel} · ${c.alumnos.length} alumnos</div>`).join('')||'<div class="sub2">Sin clases convocadas</div>'}
    <div class="mact" style="justify-content:flex-start"><a class="btn sm ok" target="_blank" href="${wa(m.tel,`Hola ${nombre1(m.nombre)}, tus próximas clases:\n${prox.map(c=>`• ${fmtD(c.fecha)} ${c.hora} · ${c.playa} · ${c.alumnos.length} alumnos`).join('\n')||'ninguna por ahora'}`)}">Enviarle su horario</a></div></div>`;}).join('')}</div>`;
}
function nuevoMonitor(){
  modal(`<h2>Nuevo monitor</h2><label>Nombre</label><input id="nm-n"><label>Teléfono</label><input id="nm-t"><label>€ por clase</label><input id="nm-p" type="number" value="20">
  <div class="mact"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn acc" onclick="guardarMonitor()">Guardar</button></div>`);
}
function guardarMonitor(){
  const n=$('nm-n').value.trim(); if(!n) return toast('⚠ Escribe el nombre');
  S.monitores.push({id:nid(),nombre:n,tel:$('nm-t').value,tarifa:+$('nm-p').value||20,color:['#7c3aed','#db2777','#0891b2'][S.monitores.length%3]});
  cerrar(); toast('✓ Monitor añadido'); render();
}

/* ───────── Material ───────── */
/* Neoprenos que hacen falta cada día con clases convocadas vs los que hay */
function faltaMaterial(){
  const out=[];
  const dias=[...new Set(S.clases.filter(c=>c.estado==='convocada'&&c.fecha>=iso(hoy)).map(c=>c.fecha))];
  dias.forEach(f=>{
    const nec={};
    S.clases.filter(c=>c.fecha===f&&c.estado==='convocada').forEach(c=>c.alumnos.forEach(a=>{const t=alumno(a).talla;nec[t]=(nec[t]||0)+1;}));
    Object.entries(nec).forEach(([t,n])=>{const hay=S.material.neoprenos[t]||0; if(n>hay) out.push({fecha:f,talla:t,falta:n-hay});});
  });
  return out;
}
function rMaterial(){
  const M=S.material, falta=faltaMaterial();
  const prox=S.clases.filter(c=>c.estado==='convocada'&&c.fecha>=iso(hoy)).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  $('p-material').innerHTML = `
  <div class="top"><div><h1>Material</h1><div class="sub2">Tablas y neoprenos: qué hay, qué hace falta para cada salida y qué está roto</div></div><button class="btn acc" onclick="averia()">+ Apuntar avería</button></div>
  ${falta.length?`<div class="card" style="border-color:#f5c27a;background:#fff8ec;margin-bottom:14px"><div class="ttl">⚠ Faltan neoprenos</div>${falta.map(f=>`<div class="chk" style="background:#fff">${fmtD(f.fecha)} · talla <b>${f.talla}</b>: faltan ${f.falta}</div>`).join('')}</div>`:''}
  <div class="row">
    <div class="card" style="flex:1"><div class="ttl">Tablas</div><div class="stock">${M.tablas.map(t=>`<div><b>${t.total}</b><small>${esc(t.n)}</small></div>`).join('')}</div>
      <div class="ttl" style="margin-top:18px">Neoprenos adulto</div><div class="stock">${TALLAS.map(t=>`<div><b>${M.neoprenos[t]||0}</b><small>Talla ${t}</small><div style="margin-top:6px"><button class="btn sm ghost" style="padding:2px 8px" onclick="ajNeo('${t}',-1)">−</button> <button class="btn sm ghost" style="padding:2px 8px" onclick="ajNeo('${t}',1)">+</button></div></div>`).join('')}</div>
      <div class="ttl" style="margin-top:18px">Neoprenos niño</div><div class="stock">${TALLAS_NINO.map(t=>`<div><b>${M.neoprenos[t]||0}</b><small>Talla ${t}</small><div style="margin-top:6px"><button class="btn sm ghost" style="padding:2px 8px" onclick="ajNeo('${t}',-1)">−</button> <button class="btn sm ghost" style="padding:2px 8px" onclick="ajNeo('${t}',1)">+</button></div></div>`).join('')}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:14px">
      <div class="card"><div class="ttl">Para cargar en la furgo</div>${prox.slice(0,4).map(c=>{const tl={};c.alumnos.forEach(a=>{const t=alumno(a).talla;tl[t]=(tl[t]||0)+1});return `<div class="chk" style="display:block"><b>${fmtD(c.fecha)} · ${c.hora}</b> · ${c.alumnos.length} tablas<div style="margin-top:6px">${Object.entries(tl).map(([t,n])=>`<span class="tag t-mut" style="margin:2px">Neo ${t} × ${n}</span>`).join('')}</div></div>`}).join('')||'<div class="empty">Sin salidas convocadas</div>'}</div>
      <div class="card"><div class="ttl">Averías</div>${M.averiadas.map(x=>`<div class="chk" style="justify-content:space-between"><span>🔧 <b>${esc(x.que)}</b> · ${esc(x.nota)} · ${fmtD(x.fecha)}</span><button class="btn sm ok" onclick="reparada(${x.id})">Reparada</button></div>`).join('')||'<div class="empty">Todo en orden ✓</div>'}</div>
    </div>
  </div>`;
}
function ajNeo(t,n){ S.material.neoprenos[t]=Math.max(0,(S.material.neoprenos[t]||0)+n); render(); }
function averia(){ modal(`<h2>Apuntar avería</h2><label>¿Qué?</label><input id="av-q" placeholder="Ej: Espuma 7' #4"><label>¿Qué le pasa?</label><input id="av-n" placeholder="Ej: quilla rota, neopreno rajado"><div class="mact"><button class="btn ghost" onclick="cerrar()">Cancelar</button><button class="btn acc" onclick="guardarAveria()">Guardar</button></div>`); }
function guardarAveria(){ const q=$('av-q').value.trim(); if(!q) return toast('⚠ Escribe qué está roto'); S.material.averiadas.push({id:nid(),que:q,nota:$('av-n').value,fecha:iso(hoy)}); cerrar(); toast('✓ Avería apuntada'); render(); }
function reparada(id){ S.material.averiadas=S.material.averiadas.filter(x=>x.id!==id); toast('✓ Reparada'); render(); }

/* ───────── Caja ───────── */
function rCaja(){
  const hoyS=iso(hoy);
  const deHoy=S.pagos.filter(p=>p.fecha===hoyS);
  const por=m=>S.pagos.filter(p=>p.fecha.startsWith(hoyS.slice(0,7))&&p.metodo===m).reduce((s,p)=>s+p.importe,0);
  $('p-caja').innerHTML = `
  <div class="top"><div><h1>Caja</h1><div class="sub2">Todos los cobros, sin Excel</div></div><button class="btn ghost" onclick="exportar()">Descargar Excel (CSV)</button></div>
  <div class="grid k4">
    <div class="card kpi"><div class="l">Hoy</div><div class="v">${eur(deHoy.reduce((s,p)=>s+p.importe,0))}</div><div class="s">${deHoy.length} cobros</div></div>
    <div class="card kpi"><div class="l">💵 Efectivo (mes)</div><div class="v">${eur(por('Efectivo'))}</div></div>
    <div class="card kpi"><div class="l">💳 Tarjeta (mes)</div><div class="v">${eur(por('Tarjeta'))}</div></div>
    <div class="card kpi"><div class="l">📱 Bizum (mes)</div><div class="v">${eur(por('Bizum'))}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ttl">Últimos cobros</div>
  <table><tr><th>Fecha</th><th>Alumno</th><th>Concepto</th><th>Método</th><th style="text-align:right">Importe</th></tr>
  ${S.pagos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,40).map(p=>`<tr class="click" onclick="ficha(${p.alumno})"><td>${fmtD(p.fecha)}</td><td><b>${esc(alumno(p.alumno).nombre)}</b></td><td>${esc(p.concepto)}</td><td>${p.metodo}</td><td style="text-align:right"><b>${eur(p.importe)}</b></td></tr>`).join('')}
  </table></div>`;
}
function exportar(){
  const filas=[['Fecha','Alumno','Concepto','Método','Importe'],...S.pagos.slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(p=>[p.fecha,alumno(p.alumno).nombre,p.concepto,p.metodo,String(p.importe).replace('.',',')])];
  const csv='﻿'+filas.map(f=>f.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='fitenia-cobros.csv'; a.click();
  toast('✓ Descargado: ábrelo con Excel');
}

/* ───────── Informes ───────── */
function rInformes(){
  const meses=[...Array(6)].map((_,i)=>{const d=new Date(hoy.getFullYear(),hoy.getMonth()-5+i,1);return iso(d).slice(0,7);});
  const porMes=meses.map(m=>S.pagos.filter(p=>p.fecha.startsWith(m)).reduce((s,p)=>s+p.importe,0));
  const max=Math.max(...porMes,1);
  const prod={}; S.pagos.forEach(p=>{prod[p.concepto]=(prod[p.concepto]||0)+p.importe;});
  const topProd=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,6), maxP=topProd[0]?.[1]||1;
  const clasesTot=S.clases.filter(c=>c.estado!=='convocada');
  const canc=clasesTot.filter(c=>c.estado==='cancelada').length;
  const real=clasesTot.filter(c=>c.estado==='realizada');
  const ocup=real.length?Math.round(real.reduce((s,c)=>s+c.asistieron.length/c.plazas,0)/real.length*100):0;
  const compras={}; S.pagos.forEach(p=>{compras[p.alumno]=(compras[p.alumno]||0)+1;});
  const repiten=Object.values(compras).filter(n=>n>1).length, conCompra=Object.keys(compras).length;
  const origen={}; S.alumnos.forEach(a=>{origen[a.origen||'—']=(origen[a.origen||'—']||0)+1;});
  const ticket=S.pagos.length?S.pagos.reduce((s,p)=>s+p.importe,0)/S.pagos.length:0;
  $('p-informes').innerHTML = `
  <div class="top"><div><h1>Informes</h1><div class="sub2">Lo que antes no se veía en el Excel: qué se vende, cuánto se cancela por el mar y quién repite</div></div></div>
  <div class="grid k4">
    <div class="card kpi"><div class="l">Ingresos 6 meses</div><div class="v">${eur(porMes.reduce((s,x)=>s+x,0))}</div></div>
    <div class="card kpi"><div class="l">Ticket medio</div><div class="v">${eur(Math.round(ticket))}</div></div>
    <div class="card kpi"><div class="l">Alumnos que repiten</div><div class="v">${conCompra?Math.round(repiten/conCompra*100):0}%</div><div class="s">${repiten} de ${conCompra} han comprado más de una vez</div></div>
    <div class="card kpi"><div class="l">Canceladas por el mar</div><div class="v">${clasesTot.length?Math.round(canc/clasesTot.length*100):0}%</div><div class="s">${canc} de ${clasesTot.length} clases · furgo al ${ocup}%</div></div>
  </div>
  <div class="row" style="margin-top:14px">
    <div class="card" style="flex:1.3"><div class="ttl">Ingresos por mes</div>
      <div class="chart">${meses.map((m,i)=>`<div class="b"><em>${porMes[i]?eur(porMes[i]):''}</em><i style="height:${porMes[i]/max*85}%"></i><span>${new Date(m+'-15').toLocaleDateString('es-ES',{month:'short'})}</span></div>`).join('')}</div></div>
    <div class="card" style="flex:1"><div class="ttl">Lo que más se vende</div>
      ${topProd.map(([n,v])=>`<div class="hb"><div class="n">${esc(n)}</div><div class="t"><i style="width:${v/maxP*100}%"></i></div><div class="v">${eur(v)}</div></div>`).join('')}</div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ttl">¿Cómo llegan los alumnos?</div>
    ${Object.entries(origen).sort((a,b)=>b[1]-a[1]).map(([o,n])=>`<div class="hb"><div class="n">${esc(o)}</div><div class="t"><i style="width:${n/S.alumnos.length*100}%;background:var(--acc2)"></i></div><div class="v">${n} alumnos</div></div>`).join('')}
  </div>`;
}

render(); cargarMar();
</script>
</body>
</html>
