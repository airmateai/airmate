<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0c">
<title>Fight2One · Panel del evento</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0b0c;--panel:#131315;--panel2:#1a1a1d;--line:#26262a;--ink:#f3f3f2;--mut:#9a9ca1;--red:#e3172f;--redsoft:#3a1219;--gold:#e5b54c;--goldsoft:#33290f;--ok:#4fcf8a;--oksoft:#10261a;--blue:#5b8cff;--bluesoft:#152040;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Inter Tight",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.anton{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
aside{background:#09090a;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .lg{width:38px;height:38px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:15px}
.brand b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.04em;display:block;line-height:1}
.brand small{color:var(--mut);font-size:11.5px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;color:#c9cacd;border:none;background:none;text-align:left;width:100%;font-weight:500}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--ink);color:#0b0b0c}
.nav .ic{width:20px;text-align:center}
.nav .bd{margin-left:auto;font-size:11px;font-weight:700;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.nav.on .bd{background:#0b0b0c;color:#fff}
.sep{height:1px;background:var(--line);margin:10px 6px}
.aside-ft{margin-top:auto;font-size:11.5px;color:var(--mut);padding:10px 8px}
.aside-ft button{margin-top:8px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;font-size:12px}
main{min-width:0;padding:22px 26px 90px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.top .sub{color:var(--mut);font-size:13.5px;margin-top:6px}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold);background:var(--goldsoft);border-radius:6px;padding:3px 8px;margin-left:8px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#3a3a3f}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mut)}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--red);transition:width .6s}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.c-ok{background:var(--oksoft);color:var(--ok)}.c-no{background:var(--redsoft);color:#ff6b7c}.c-w{background:var(--goldsoft);color:var(--gold)}.c-b{background:var(--bluesoft);color:var(--blue)}.c-n{background:var(--panel2);color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#17171a}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.alerta:hover{background:#202024}
.alerta .ic{font-size:16px}
.alerta b{display:block;font-size:13.5px}
.alerta span{font-size:12.5px;color:var(--mut)}
.cd{display:flex;gap:10px}
.cd div{background:var(--panel2);border-radius:12px;padding:10px 12px;text-align:center;min-width:64px}
.cd b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1}
.cd small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.hero{background:linear-gradient(120deg,#1c0a0d,#0b0b0c 60%);border:1px solid #3a1219;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:40px;line-height:1;text-transform:uppercase}
.hero p{margin:6px 0 0;color:#c9cacd}
/* cartelera */
.bout{display:grid;grid-template-columns:34px 1fr auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.bout.main{border-color:var(--gold);background:linear-gradient(90deg,#1f1a0b,var(--panel) 40%,var(--panel) 60%,#1f1a0b)}
.bout .ord{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--mut);text-align:center}
.f{display:flex;align-items:center;gap:10px;min-width:0}
.f.r{flex-direction:row-reverse;text-align:right}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.f b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f small{color:var(--mut);font-size:12px}
.vs{text-align:center}
.vs b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;color:var(--red)}
.vs small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap}
.bout .ops{display:flex;flex-direction:column;gap:4px}
.ttl{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.08em}
@media (max-width:760px){.bout{grid-template-columns:1fr auto 1fr;}.bout .ord,.bout .ops{display:none}.f{flex-direction:column;text-align:center}.f.r{flex-direction:column;text-align:center}.av{width:38px;height:38px}}
/* fichas peleadores */
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ficha{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:grid;gap:10px;transition:border-color .2s}
.ficha:hover{border-color:#3a3a3f}
.ficha .hd{display:flex;gap:10px;align-items:center}
.ficha .rec{font-family:Anton,Impact,sans-serif;font-size:18px;margin-left:auto}
.checks{display:flex;flex-wrap:wrap;gap:5px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fl{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.fl.on{background:var(--ink);color:#0b0b0c;border-color:var(--ink)}
.buscar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:220px}
/* kanban */
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:200px}
.col h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.tk{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.tk b{display:block;font-size:13.5px;margin-bottom:4px}
.tk .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.tk.urg{border-left:3px solid var(--red)}
.col.drop{outline:2px dashed var(--red);outline-offset:-4px}
/* gráfico */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{width:100%;max-width:34px;background:var(--red);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .6s}
.chart .c small{font-size:10.5px;color:var(--mut)}
.hbar{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin-bottom:8px;font-size:13.5px}
.hbar .p{height:14px;background:var(--panel2);border-radius:6px;overflow:hidden}
.hbar .p i{display:block;height:100%;border-radius:6px}
@media (max-width:560px){.hbar{grid-template-columns:100px 1fr 72px;font-size:12.5px}}
/* runsheet */
.run{position:relative;padding-left:28px}
.run::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rs{position:relative;padding:8px 0 12px;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start}
.rs::before{content:'';position:absolute;left:-24px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--mut)}
.rs.hecho::before{background:var(--ok);border-color:var(--ok)}
.rs.bout-r::before{border-color:var(--red)}
.rs .h{font-family:Anton,Impact,sans-serif;font-size:17px}
.rs small{display:block;color:var(--mut);font-size:12px}
/* merch */
.merch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.prod svg{width:100%;height:auto;background:var(--panel2);border-radius:12px}
.tallas{display:flex;gap:4px;flex-wrap:wrap}
.tallas span{font-size:11.5px;background:var(--panel2);border-radius:6px;padding:2px 7px}
.tallas span.bajo{background:var(--redsoft);color:#ff6b7c}
/* asistente */
.chat{display:flex;flex-direction:column;gap:10px;height:min(58vh,520px);overflow-y:auto;padding:4px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:14px;white-space:pre-wrap}
.msg.yo{align-self:flex-end;background:var(--ink);color:#0b0b0c;border-bottom-right-radius:5px}
.msg.ia{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
.chatin{display:flex;gap:8px;margin-top:12px}
.chatin input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sug button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer}
/* modal */
.mod-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;animation:modin .18s ease}
@keyframes modin{from{transform:translateY(12px) scale(.98);opacity:0}}
.mod header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.mod header b{font-size:16px}
.mod .bd{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod .bd .full{grid-column:1/-1}
.mod label{display:grid;gap:5px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.03em}
.mod input,.mod select,.mod textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:14px;width:100%}
.mod .ck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:500;background:var(--panel2);border-radius:10px;padding:9px 11px}
.mod .ck input{width:auto}
.mod footer{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#0b0b0c;font-weight:600;padding:10px 16px;border-radius:12px;z-index:60;animation:modin .2s}
.vacio{color:var(--mut);text-align:center;padding:30px 10px;font-size:13.5px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* móvil */
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:16px 14px 96px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  .kan{grid-template-columns:1fr}
  .top h1{font-size:28px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#09090aee;backdrop-filter:blur(10px);border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;scrollbar-width:none}
  .tabbar button{flex:none;border:none;background:none;color:#c9cacd;display:grid;justify-items:center;gap:2px;font-size:10.5px;padding:6px 8px;border-radius:10px;min-width:62px}
  .tabbar button span{font-size:18px}
  .tabbar button.on{background:var(--ink);color:#0b0b0c}
  .mod .bd{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <aside id="aside"></aside>

</div>

<script>
/* ═════════ DATOS DE EJEMPLO (inventados) ═════════ */
const HOY=new Date(); HOY.setHours(0,0,0,0);
const enDias=n=>{const d=new Date(HOY); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);};
const uid=()=>Math.random().toString(36).slice(2,9);
const COLS=['#e3172f','#5b8cff','#e5b54c','#4fcf8a','#b46cff','#ff8a3d','#2bc4c4','#ff5fa2'];
function semilla(){
  const P=[
    ['Álex «El Muro» Herrera','España','Fight Club Añaza','MMA',70,'9-2-0',{con:1,med:1,lic:1,vue:0,hot:1,tra:0},1200],

    ['Marco Bellini','Italia','Roma Fight','MMA',77,'7-3-0',{con:0,med:0,lic:1,vue:0,hot:0,tra:0},800],
    ['Sara «Rayo» Delgado','España','Fight Club Añaza','K1',57,'8-1-0',{con:1,med:1,lic:1,vue:1,hot:1,tra:1},600],
    ['Ana Kowalska','Polonia','Warsaw Kick','K1',57,'9-4-0',{con:1,med:1,lic:1,vue:1,hot:0,tra:0},700],
    ['Jonay Perdomo','España','La Laguna Fight','Muay Thai',67,'10-2-0',{con:1,med:1,lic:1,vue:1,hot:1,tra:1},500],
    ['Rui Carvalho','Portugal','Lisboa Muay','Muay Thai',67,'9-5-0',{con:1,med:0,lic:1,vue:1,hot:1,tra:0},600],
    ['Kevin Afonso','España','Sur Fight Team','MMA',84,'5-0-0',{con:1,med:1,lic:1,vue:1,hot:1,tra:1},500],
    ['Tomás Ferraz','Brasil','Rio Combat','MMA',84,'8-2-0',{con:1,med:1,lic:1,vue:0,hot:1,tra:0},900],

  const peleadores=P.map((p,i)=>({id:'p'+i,nombre:p[0],pais:p[1],gym:p[2],mod:p[3],peso:p[4],record:p[5],...p[6],bolsa:p[7],manager:'Mánager '+(i+1),tel:'',vuelo:p[6].vue?('Llega '+enDias(26+(i%3))):'',hotel:p[6].hot?'Hotel Laguna Nivaria':'',notas:'',color:COLS[i%COLS.length]}));
  const B=[[0,1,'MMA',70,5,'Título mundial',1],[4,5,'Muay Thai',61,5,'Título mundial',0],[2,3,'K1',65,3,'',0],[6,7,'MMA',77,3,'',0],[8,9,'K1',57,3,'Título europeo',0],[10,11,'Muay Thai',67,3,'',0],[12,13,'MMA',84,3,'',0],[14,15,'K1',75,3,'',0]];
  const combates=B.map((b,i)=>({id:'b'+i,a:'p'+b[0],b:'p'+b[1],mod:b[2],peso:b[3],rounds:b[4],titulo:b[5],estado:i===3?'pendiente':'confirmado',orden:i,resultado:''}));
  return {
    v:3,
    evento:{nombre:'Fight2One 13',fecha:enDias(31),hora:'18:00',lugar:'Pabellón Santiago Martín · La Laguna',aforo:3000},
    peleadores, combates,
    staff:[
      {id:uid(),nombre:'Árbitro principal',rol:'Árbitro',tel:'',pago:250,conf:1},
      {id:uid(),nombre:'Árbitro 2',rol:'Árbitro',tel:'',pago:200,conf:1},
      {id:uid(),nombre:'Juez A',rol:'Juez',tel:'',pago:150,conf:1},
      {id:uid(),nombre:'Juez B',rol:'Juez',tel:'',pago:150,conf:1},
      {id:uid(),nombre:'Juez C',rol:'Juez',tel:'',pago:150,conf:0},
      {id:uid(),nombre:'Médico del evento',rol:'Médico',tel:'',pago:400,conf:1},
      {id:uid(),nombre:'Ambulancia (empresa)',rol:'Médico',tel:'',pago:350,conf:0},
      {id:uid(),nombre:'Speaker',rol:'Producción',tel:'',pago:300,conf:1},
      {id:uid(),nombre:'Equipo de streaming',rol:'Producción',tel:'',pago:900,conf:1},
      {id:uid(),nombre:'Seguridad (6 personas)',rol:'Seguridad',tel:'',pago:720,conf:1},
      {id:uid(),nombre:'Ring girls (2)',rol:'Producción',tel:'',pago:200,conf:0},
      {id:uid(),nombre:'Voluntarios (8)',rol:'Voluntario',tel:'',pago:0,conf:1},
    ],
    patrocinadores:[

/* ═════════ UTILIDADES ═════════ */
const miles=n=>(Math.round(n)<0?'-':'')+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const eur=n=>miles(n)+' €';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pel=id=>S.peleadores.find(p=>p.id===id);
const ini=n=>n.replace(/«.*?»/g,'').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
const av=p=>p?`<span class="av" style="background:${p.color}">${esc(ini(p.nombre))}</span>`:'<span class="av" style="background:#333">?</span>';
const fechaL=f=>new Date(f+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1900);}
const CHECKS=[['con','Contrato'],['med','Médico'],['lic','Licencia'],['vue','Vuelo'],['hot','Hotel'],['tra','Traslado']];
const pend=p=>CHECKS.filter(([k])=>!p[k]);
const enCartel=()=>new Set(S.combates.flatMap(c=>[c.a,c.b]));

/* cálculos */
function vendidas(){const r={};S.tipos.forEach(t=>r[t.id]=0);S.ventas.forEach(v=>r[v.tipo]=(r[v.tipo]||0)+v.cant);return r;}
function ingresosEntradas(){const v=vendidas();return S.tipos.reduce((a,t)=>a+t.precio*(v[t.id]||0),0);}
function totalEntradas(){return Object.values(vendidas()).reduce((a,b)=>a+b,0);}
const bolsas=()=>S.combates.reduce((a,c)=>a+(pel(c.a)?.bolsa||0)+(pel(c.b)?.bolsa||0),0);
const staffCoste=()=>S.staff.reduce((a,s)=>a+(+s.pago||0),0);
const gastosOtros=()=>S.gastos.reduce((a,g)=>a+(+g.importe||0),0);
const gastosTot=()=>bolsas()+staffCoste()+gastosOtros();
const patroCobrado=()=>S.patrocinadores.filter(p=>p.estado==='cobrado').reduce((a,p)=>a+ +p.importe,0);
const patroAcept=()=>S.patrocinadores.filter(p=>p.estado!=='propuesta').reduce((a,p)=>a+ +p.importe,0);
const merchIng=()=>S.merch.reduce((a,m)=>a+m.vendidas*(m.precio-m.coste),0);
const ingresosTot=()=>ingresosEntradas()+patroAcept()+merchIng();
const diasFalta=()=>Math.ceil((new Date(S.evento.fecha+'T00:00')-HOY)/864e5);
function equilibrio(){const falta=gastosTot()-ingresosTot(); return Math.max(0,Math.ceil(falta/15));} // entradas anticipadas (15 €) que faltan por vender para cubrir gastos

/* ═════════ MODAL GENÉRICO ═════════ */
function form(titulo,campos,valores,onSave,onDel){
  const bg=document.createElement('div');bg.className='mod-bg';
  bg.innerHTML=`<div class="mod" role="dialog" aria-label="${esc(titulo)}"><header><b>${esc(titulo)}</b><button class="btn sm ghost" data-x>✕</button></header><div class="bd">${campos.map(c=>{
    const v=valores[c.k]??c.def??''; const cl=c.full?' class="full"':'';
    if(c.t==='ck') return `<label class="ck${c.full?' full':''}"><input type="checkbox" name="${c.k}" ${v?'checked':''}>${esc(c.l)}</label>`;
    if(c.t==='sel') return `<label${cl}>${esc(c.l)}<select name="${c.k}">${c.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select></label>`;
    if(c.t==='area') return `<label class="full">${esc(c.l)}<textarea name="${c.k}" rows="3">${esc(v)}</textarea></label>`;
    return `<label${cl}>${esc(c.l)}<input name="${c.k}" type="${c.t||'text'}" value="${esc(v)}" ${c.t==='number'?'step="any"':''}></label>`;
  }).join('')}</div><footer><div>${onDel?'<button class="btn" data-del style="color:#ff6b7c">Eliminar</button>':''}</div><div class="acc"><button class="btn" data-x>Cancelar</button><button class="btn pri" data-ok>Guardar</button></div></footer></div>`;
  document.body.appendChild(bg);
  const cerrar=()=>bg.remove();
  bg.addEventListener('click',e=>{
    if(e.target===bg||e.target.closest('[data-x]')) return cerrar();
    if(e.target.closest('[data-del]')){ if(bg.dataset.seguro){onDel();guardar();cerrar();render();toast('Eliminado');} else {bg.dataset.seguro=1;e.target.textContent='Pulsa otra vez para eliminar';} return; }
    if(e.target.closest('[data-ok]')){
      const o={}; campos.forEach(c=>{const el=bg.querySelector(`[name="${c.k}"]`); o[c.k]=c.t==='ck'?(el.checked?1:0):c.t==='number'?(+el.value||0):el.value.trim();});
      onSave(o); guardar(); cerrar(); render(); toast('Guardado ✓');
    }
  });
  bg.querySelector('input,select,textarea')?.focus();
}

  S.combates.filter(c=>c.estado!=='confirmado').forEach(c=>alertas.push(['🥊',`Combate sin cerrar: ${pel(c.a)?.nombre||'?'} vs ${pel(c.b)?.nombre||'?'}`,`${c.mod} · ${c.peso} kg`,'cartel']));
  S.patrocinadores.filter(p=>p.estado==='aceptado').forEach(p=>alertas.push(['💶',`Cobrar patrocinio: ${p.nombre}`,eur(p.importe),'patro']));
  S.staff.filter(s=>!s.conf).forEach(s=>alertas.push(['🧑‍⚖️',`Sin confirmar: ${s.nombre}`,s.rol,'staff']));
  const urg=S.tareas.filter(t=>t.estado!=='hecho').sort((a,b)=>b.urg-a.urg||b.sem-a.sem).slice(0,5);

  `<div class="hero"><div><span class="chip c-w">COMBATE ESTELAR</span><h2 style="margin-top:8px">${esc(pel(main?.a)?.nombre||'—')} <span style="color:var(--red)">vs</span> ${esc(pel(main?.b)?.nombre||'—')}</h2><p>${main?`${main.mod} · ${main.peso} kg · ${main.rounds} asaltos${main.titulo?' · '+esc(main.titulo):''}`:''}</p></div>
   <div class="cd"><div><b>${d}</b><small>días</small></div><div><b>${conf}/${S.combates.length}</b><small>combates</small></div></div></div>`+
  `<div class="grid g4">
    <div class="card kpi"><small>Entradas vendidas</small><b>${miles(tot)}</b><span>de ${miles(af)} de aforo</span><div class="bar"><i style="width:${Math.min(100,tot/af*100)}%"></i></div></div>
    <div class="card kpi"><small>Ingresos previstos</small><b>${eur(ing)}</b><span>entradas + patrocinios + merch</span></div>
    <div class="card kpi"><small>Gastos previstos</small><b>${eur(g)}</b><span>bolsas, personal y producción</span></div>

  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>Lo que necesita tu atención <span class="chip c-no">${alertas.length}</span></h3>${alertas.slice(0,7).map(a=>`<div class="alerta" data-v="${a[3]}"><span class="ic">${a[0]}</span><div><b>${esc(a[1])}</b><span>${esc(a[2])}</span></div></div>`).join('')||'<div class="vacio">Todo en orden 💪</div>'}${alertas.length>7?`<div class="mut" style="font-size:12.5px">y ${alertas.length-7} más…</div>`:''}</div>

      <h3 style="margin-top:16px">Ventas de entradas · últimos 14 días</h3>${graficoVentas(14)}</div>
  </div>`;

function graficoVentas(n){
  const m={};S.ventas.forEach(v=>m[v.fecha]=(m[v.fecha]||0)+v.cant);
  const dias=[...Array(n)].map((_,i)=>enDias(i-n+1)); const mx=Math.max(1,...dias.map(d=>m[d]||0));
  return `<div class="chart">${dias.map(d=>`<div class="c" title="${fechaL(d)}: ${m[d]||0}"><small>${m[d]||0}</small><i style="height:${(m[d]||0)/mx*100}%"></i><small>${new Date(d+'T12:00').getDate()}</small></div>`).join('')}</div>`;
}

      <div class="f r">${av(B)}<div><b>${esc(B?.nombre||'Por decidir')}</b><small>${esc(B?.record||'')} · ${esc(B?.pais||'')}</small></div></div>

function editarCombate(c){
  const ops=S.peleadores.map(p=>[p.id,`${p.nombre} (${p.mod} ${p.peso} kg)`]);
  form(c?'Editar combate':'Nuevo combate',[
    {k:'a',l:'Esquina roja',t:'sel',o:ops},{k:'b',l:'Esquina azul',t:'sel',o:ops},
    {k:'mod',l:'Modalidad',t:'sel',o:['MMA','K1','Muay Thai','Kickboxing','Boxeo']},{k:'peso',l:'Peso (kg)',t:'number'},
    {k:'rounds',l:'Asaltos',t:'number',def:3},{k:'titulo',l:'Título en juego (opcional)'},
    {k:'estado',l:'Estado',t:'sel',o:[['confirmado','Confirmado'],['pendiente','Pendiente'],['caido','Caído']]},{k:'resultado',l:'Resultado (tras la velada)'}],
    c||{a:ops[0]?.[0],b:ops[1]?.[0],mod:'MMA',peso:70,rounds:3,estado:'pendiente'},
    o=>{ if(c) Object.assign(c,o); else S.combates.push({id:uid(),orden:S.combates.length,...o}); },
    c?()=>{S.combates=S.combates.filter(x=>x.id!==c.id);}:null);
}
function mover(id,d){const cs=S.combates.slice().sort((a,b)=>a.orden-b.orden);const i=cs.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=cs.length)return;[cs[i],cs[j]]=[cs[j],cs[i]];cs.forEach((c,k)=>c.orden=k);guardar();render();}

  `<div class="grid g2"><div class="card"><h3>Antes de los combates</h3><div class="run">${S.run.slice().sort((a,b)=>a.h.localeCompare(b.h)).map(r=>`<div class="rs${r.hecho?' hecho':''}"><span class="h">${esc(r.h)}</span><div><b>${esc(r.t)}</b><small>${esc(r.d)}</small></div><button class="btn sm" data-run="${r.id}">${r.hecho?'✓':'Hecho'}</button></div>`).join('')}</div></div>
  <div class="card"><h3>Orden de combates (hora estimada)</h3><div class="run">${bouts.map(b=>`<div class="rs bout-r"><span class="h">${b.h}</span><div><b>${esc(pel(b.c.a)?.nombre||'?')} vs ${esc(pel(b.c.b)?.nombre||'?')}</b><small>${b.c.mod} · ${b.c.peso} kg · ${b.c.rounds} asaltos${b.c.titulo?' · 🏆 '+esc(b.c.titulo):''}</small></div><span class="chip ${b.i===bouts.length-1?'c-w':'c-n'}">${b.i===bouts.length-1?'Estelar':'#'+(b.i+1)}</span></div>`).join('')}</div>
  <p class="mut" style="font-size:12.5px;margin:6px 0 0">Calculado con 3 min por asalto, 1 de descanso y 8 de entrada y presentación. Se recalcula si cambias la cartelera.</p></div></div>`;
}

/* ═════════ ASISTENTE (demo: responde con los datos del panel) ═════════ */
let CHAT=[{r:'ia',t:'¡Hola Moi! Soy el asistente de Fight2One. Pregúntame lo que quieras sobre la velada: vuelos, hoteles, dinero, entradas, patrocinios, combates o tareas.'}];
function responder(q){
  const s=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); const ec=[...enCartel()].map(pel).filter(Boolean); const L=a=>a.map(x=>'· '+x).join('\n');
  if(/vuelo|avion/.test(s)){const f=ec.filter(p=>!p.vue);return f.length?`Faltan ${f.length} vuelos:\n${L(f.map(p=>`${p.nombre} (${p.pais})`))}\n\n¿Te escribo un mensaje para sus mánagers?`:'Todos los peleadores del cartel tienen vuelo ✅';}
  if(/hotel|habitaci/.test(s)){const f=ec.filter(p=>!p.hot);return f.length?`Sin hotel todavía:\n${L(f.map(p=>p.nombre))}`:'Todos tienen hotel ✅';}
  if(/medic|revision|analitica/.test(s)){const f=ec.filter(p=>!p.med);return f.length?`Revisión médica pendiente:\n${L(f.map(p=>p.nombre))}\n\nSin ella no pueden pelear.`:'Todas las revisiones médicas están hechas ✅';}
  if(/contrato/.test(s)){const f=ec.filter(p=>!p.con);return f.length?`Sin contrato firmado:\n${L(f.map(p=>p.nombre))}`:'Todos los contratos firmados ✅';}
  if(/traslad|recog|aeropuerto|conduc/.test(s)){return `Próximos traslados:\n${L(S.traslados.filter(t=>!t.hecho).map(t=>`${fechaL(t.fecha)} ${t.hora}: ${t.desde} → ${t.hasta} (${t.conductor})`))}`;}
  if(/patrocin|sponsor/.test(s)){const a=S.patrocinadores.filter(p=>p.estado==='aceptado'),pr=S.patrocinadores.filter(p=>p.estado==='propuesta');return `Cobrado: ${eur(patroCobrado())}.\nPor cobrar (${a.length}): ${a.map(p=>`${p.nombre} ${eur(p.importe)}`).join(', ')||'ninguno'}.\nEn negociación (${pr.length}): ${pr.map(p=>`${p.nombre} ${eur(p.importe)}`).join(', ')||'ninguno'}.`;}
  if(/entrada|vend|taquilla|aforo/.test(s)){const v=vendidas();return `Llevas ${miles(totalEntradas())} entradas vendidas de ${miles(S.evento.aforo)} (${Math.round(totalEntradas()/S.evento.aforo*100)} %), ${eur(ingresosEntradas())}.\n${L(S.tipos.map(t=>`${t.nombre}: ${v[t.id]||0}`))}`;}
  if(/gast|cuest|dinero|presupuesto|balance|benefici|perd|gan/.test(s)){const b=ingresosTot()-gastosTot();return `Gastos previstos: ${eur(gastosTot())} (bolsas ${eur(bolsas())}, personal ${eur(staffCoste())}, producción ${eur(gastosOtros())}).\nIngresos previstos: ${eur(ingresosTot())}.\n${b>=0?`Vas en beneficio: +${eur(b)} 💪`:`Te faltan ${eur(-b)}: unas ${miles(equilibrio())} entradas anticipadas más.`}`;}
  if(/combate|cartel|pelea|estelar/.test(s)){const cs=S.combates.slice().sort((a,b)=>a.orden-b.orden);return `Cartelera (${cs.length} combates):\n${L(cs.map((c,i)=>`${i===0?'★ ':''}${pel(c.a)?.nombre} vs ${pel(c.b)?.nombre} · ${c.mod} ${c.peso} kg${c.estado!=='confirmado'?' (PENDIENTE)':''}`))}`;}
  if(/tarea|pendiente|falta|hacer|urgente/.test(s)){const t=S.tareas.filter(x=>x.estado!=='hecho').sort((a,b)=>b.urg-a.urg);return `Tienes ${t.length} tareas abiertas. Las más urgentes:\n${L(t.slice(0,5).map(x=>`${x.t} (${x.quien})`))}`;}
  if(/personal|arbitr|juez|staff|segurid/.test(s)){const f=S.staff.filter(x=>!x.conf);return `Personal: ${S.staff.length} personas, coste ${eur(staffCoste())}.\n${f.length?'Sin confirmar:\n'+L(f.map(x=>`${x.nombre} (${x.rol})`)):'Todo el mundo confirmado ✅'}`;}
  if(/merch|camiset|sudadera|ropa|talla/.test(s)){return `Merch: ${S.merch.reduce((a,m)=>a+m.vendidas,0)} prendas vendidas.\nTallas con poco stock: ${S.merch.flatMap(m=>Object.entries(m.tallas).filter(([,n])=>n<5).map(([t,n])=>`${m.nombre} ${t} (${n})`)).join(', ')||'ninguna'}.`;}
  if(/dia|hora|cuando|fecha/.test(s)){return `${S.evento.nombre}: ${fechaL(S.evento.fecha)} a las ${S.evento.hora} en ${S.evento.lugar}. Quedan ${diasFalta()} días.`;}
  const p=S.peleadores.find(x=>s.includes(x.nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/«.*?»/g,'').trim().split(' ')[0]));
  if(p){const f=pend(p);return `${p.nombre} · ${p.mod} ${p.peso} kg · récord ${p.record} · ${p.gym} (${p.pais}).\nBolsa: ${eur(p.bolsa)}.\n${f.length?'Le falta: '+f.map(x=>x[1]).join(', '):'Lo tiene todo listo ✅'}`;}
  return 'En esta demo puedo contestarte sobre vuelos, hoteles, médicos, contratos, traslados, patrocinios, entradas, dinero, combates, tareas, personal y merch. Prueba con una de las preguntas de abajo 👇';
}
function vIA(){
  return cab('Asistente IA',`Contesta con los datos de este panel <span class="demo-tag">VERSIÓN DEMO</span>`)+
  `<div class="card"><div class="chat" id="chat">${CHAT.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('')}</div>
  <form class="chatin" id="chatf"><input id="chatq" placeholder="Pregunta lo que quieras de la velada…" autocomplete="off"><button class="btn pri">Enviar</button></form>
  <div class="sug">${['¿Quién no tiene vuelo?','¿Cómo vamos de dinero?','¿Cuántas entradas llevamos?','¿Qué patrocinios faltan por cobrar?','¿Qué tareas son urgentes?','¿Quién falta por pasar el médico?'].map(q=>`<button type="button" data-q="${q}">${q}</button>`).join('')}</div></div>
  <p class="mut" style="font-size:12.5px">En la versión real, el asistente usa una IA de verdad conectada a estos datos: entiende cualquier pregunta, redacta mensajes y prepara documentos.</p>`;
}
function preguntar(q){if(!q.trim())return;CHAT.push({r:'yo',t:q});CHAT.push({r:'ia',t:responder(q)});render();const c=document.getElementById('chat');c.scrollTop=c.scrollHeight;document.getElementById('chatq')?.focus();}

/* ═════════ RENDER Y EVENTOS ═════════ */
const R={inicio:vInicio,cartel:vCartel,peleadores:vPeleadores,logistica:vLogistica,staff:vStaff,patro:vPatro,entradas:vEntradas,finanzas:vFinanzas,tareas:vTareas,merch:vMerch,dia:vDia,ia:vIA};
function render(){pintarNav();document.getElementById('main').innerHTML=R[VISTA]();const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;}
const busca=(arr,id)=>arr.find(x=>x.id===id);
document.getElementById('main').addEventListener('click',e=>{
  const g=(a)=>e.target.closest(`[${a}]`)?.getAttribute(a);
  let id;
  if(e.target.closest('#ed-evento')) return form('Datos del evento',[{k:'nombre',l:'Nombre',full:1},{k:'fecha',l:'Fecha',t:'date'},{k:'hora',l:'Hora primer combate',t:'time'},{k:'lugar',l:'Lugar',full:1},{k:'aforo',l:'Aforo',t:'number'}],S.evento,o=>Object.assign(S.evento,o));
  if(e.target.closest('#nuevo-combate')) return editarCombate(null);
  if(id=g('data-edc')) return editarCombate(busca(S.combates,id));
  if(id=g('data-sube')) return mover(id,-1);
  if(id=g('data-baja')) return mover(id,1);
  if(e.target.closest('.bout')&&innerWidth<=760){const b=e.target.closest('.bout');const i=[...b.parentNode.querySelectorAll('.bout')].indexOf(b);return editarCombate(S.combates.slice().sort((a,b)=>a.orden-b.orden)[i]);}
  if(e.target.closest('#nuevo-pel')) return editarPel(null);
  if(id=g('data-edp')) return editarPel(pel(id));
  if(id=g('data-fp')){FP=id;return render();}
  if(e.target.closest('#nuevo-tras')) return editarTras(null);
  if(id=g('data-edt')) return editarTras(busca(S.traslados,id));
  if(e.target.closest('#nuevo-staff')) return editarStaff(null);
  if(id=g('data-eds')) return editarStaff(busca(S.staff,id));
  if(e.target.closest('#nuevo-patro')) return editarPatro(null);
  if(id=g('data-edpa')) return editarPatro(busca(S.patrocinadores,id));
  if(e.target.closest('#nueva-venta')) return nuevaVenta();
  if(e.target.closest('#nuevo-tipo')) return editarTipo(null);
  if(id=g('data-edtipo')) return editarTipo(busca(S.tipos,id));
  if(e.target.closest('#nuevo-gasto')) return editarGasto(null);
  if(id=g('data-edg')) return editarGasto(busca(S.gastos,id));
  if(e.target.closest('#nueva-tarea')) return editarTarea(null);
  if(id=g('data-edtk')) return editarTarea(busca(S.tareas,id));
  if(e.target.closest('#nuevo-merch')) return editarMerch(null);
  if(id=g('data-edm')) return editarMerch(busca(S.merch,id));
  if(id=g('data-vende')){const m=busca(S.merch,id);const t=Object.entries(m.tallas).sort((a,b)=>b[1]-a[1])[0];if(t&&t[1]>0){m.tallas[t[0]]--;m.vendidas++;guardar();render();toast(`Vendida 1 ${m.nombre} (${t[0]})`);}else toast('Sin stock');return;}
  if(e.target.closest('#nuevo-run')) return form('Nuevo momento',[{k:'h',l:'Hora',t:'time'},{k:'t',l:'Qué',full:1},{k:'d',l:'Dónde / quién',full:1}],{h:'12:00'},o=>S.run.push({id:uid(),hecho:0,...o}));
  if(id=g('data-run')){const r=busca(S.run,id);r.hecho=r.hecho?0:1;guardar();return render();}
  if(id=g('data-q')) return preguntar(id);
});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='qp'){QP=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('qp');q.focus();q.setSelectionRange(pos,pos);}});
document.getElementById('main').addEventListener('submit',e=>{if(e.target.id==='chatf'){e.preventDefault();preguntar(document.getElementById('chatq').value);}});
/* arrastrar tarjetas (tareas y patrocinios) */
let DRAG=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest('[data-drag],[data-drag-p]');if(t){DRAG={id:t.dataset.drag||t.dataset.dragP,tipo:t.dataset.drag?'t':'p'};e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-col],[data-col-p]');if(c&&DRAG){e.preventDefault();document.querySelectorAll('.col.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop');}});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-col],[data-col-p]');if(c&&DRAG){e.preventDefault();if(DRAG.tipo==='t'&&c.dataset.col){busca(S.tareas,DRAG.id).estado=c.dataset.col;}else if(DRAG.tipo==='p'&&c.dataset.colP){busca(S.patrocinadores,DRAG.id).estado=c.dataset.colP;}DRAG=null;guardar();render();}});
document.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'));});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(R[v]&&v!==VISTA){VISTA=v;render();}});
render();
</script>
</body>
</html>
