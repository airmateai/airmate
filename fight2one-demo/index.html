<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Fight2One · Gestión de veladas</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo-512.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#000;--panel:#0f0f10;--panel2:#171718;--panel3:#1f1f21;--line:#29292c;--ink:#f2f2f2;--mut:#9a9a9e;--acc:#d4a72c;--acc2:#8a6a00;--accsoft:#2a2108;--silver:#c8c8c8;--red:#ff4d5e;--redsoft:#341016;--ok:#4fcf8a;--oksoft:#0f2419;--warn:#f0b43c;--warnsoft:#2e230a;--blue:#7aa2ff;--bluesoft:#141d36;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 520px at 85% -8%,#d4a72c14,transparent 70%),radial-gradient(800px 500px at -10% 110%,#d4a72c0d,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:14.5px/1.5 "Inter Tight",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
aside{background:#070707;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand img{width:40px;height:40px;border-radius:11px;object-fit:cover;border:1px solid #2a2208}
.brand b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:19px;letter-spacing:.05em;display:block;line-height:1}
.brand small{color:var(--mut);font-size:11px}
.grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6d6d72;padding:12px 10px 4px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:#c4c4c8;border:none;background:none;text-align:left;width:100%;font-weight:500;font-size:13.8px}
.nav:hover{background:var(--panel2);color:var(--ink)}
.nav.on{background:var(--accsoft);color:var(--acc)}
.nav .ic{width:18px;text-align:center;font-size:14px}
.nav .bd{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--redsoft);color:var(--red);border-radius:99px;padding:1px 7px}
.aside-ft{margin-top:auto;font-size:11px;color:#6d6d72;padding:14px 8px 4px;line-height:1.5}
.aside-ft button{margin-top:8px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;font-size:12px;color:var(--mut)}
main{min-width:0;padding:0 26px 90px}
.bar-top{position:sticky;top:0;z-index:30;background:#000000e6;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.edsel{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px}
.edsel select{background:none;border:none;font-weight:700;padding:4px 2px;max-width:220px;cursor:pointer}
.edsel option{background:#111}
.gsearch{flex:1;position:relative;max-width:520px}
.gsearch input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px}
.gsearch::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-52%);color:var(--mut);font-size:16px}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.6);z-index:40}
.gres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.gres button:hover{background:var(--panel2)}
.gres small{color:var(--mut);margin-left:auto;font-size:11.5px;white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;letter-spacing:.03em;line-height:1;text-transform:uppercase}
.top .sub{color:var(--mut);font-size:13.5px;margin-top:6px}
.tag-demo{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--acc);background:var(--accsoft);border-radius:6px;padding:3px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag-cerr{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--silver);background:var(--panel3);border-radius:6px;padding:3px 7px;margin-left:6px;vertical-align:middle}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;min-height:38px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:#3d3d42}
.btn.pri{background:linear-gradient(180deg,#e2b843,#b88a12);border-color:#b88a12;color:#0b0b0b}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px;min-height:32px}
.btn.ghost{background:none}
.btn.dang{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.kpi small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--mut)}
.prog{height:7px;background:var(--panel3);border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.c-ok{background:var(--oksoft);color:var(--ok)}.c-no{background:var(--redsoft);color:var(--red)}.c-w{background:var(--warnsoft);color:var(--warn)}.c-b{background:var(--bluesoft);color:var(--blue)}.c-n{background:var(--panel3);color:var(--mut)}.c-a{background:var(--accsoft);color:var(--acc)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.clic{cursor:pointer}
tbody tr.clic:hover{background:#151517}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel2);margin-bottom:7px;cursor:pointer;border-left:3px solid transparent}
.alerta:hover{background:var(--panel3)}
.alerta.critica{border-left-color:var(--red)}.alerta.alta{border-left-color:var(--warn)}.alerta.media{border-left-color:#555}
.alerta b{display:block;font-size:13.5px}
.alerta span{font-size:12.5px;color:var(--mut)}
.alerta .g{margin-left:auto;flex:none}
.hero{background:radial-gradient(ellipse 60% 120% at 0% 0%,#2a2006,#000 70%);border:1px solid #3d300a;border-radius:20px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;margin-bottom:12px}
.hero h2{margin:6px 0 4px;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1;text-transform:uppercase}
.hero p{margin:0;color:#c4c4c8}
.ring{width:120px;height:120px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1}
.ring small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.cd{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cd div{background:#0b0b0cbb;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:74px}
.cd b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;line-height:1.1}
.cd small{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.bout{display:grid;grid-template-columns:30px 1fr minmax(150px,auto) 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.bout.main{border-color:#5c4a12;background:linear-gradient(90deg,#1c1606,var(--panel) 35%,var(--panel) 65%,#1c1606)}
.bout .ord{font-family:Anton,Impact,sans-serif;font-size:20px;color:var(--mut);text-align:center}
.f{display:flex;align-items:center;gap:10px;min-width:0}
.f.r{flex-direction:row-reverse;text-align:right}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:italic 700 13px/1 'Inter Tight',sans-serif;flex:none;color:#fff;border:2px solid #000;box-shadow:0 0 0 1.5px #5c4a12;background:linear-gradient(145deg,var(--c,#444),#050505 85%);object-fit:cover;object-position:top}
.av.xl{width:104px;height:104px;font-size:30px;box-shadow:0 0 0 2px var(--acc),0 12px 40px #000c}
.av.sm{width:30px;height:30px;font-size:11px}
.f b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f small{color:var(--mut);font-size:12px}
.f .win{color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.06em}
.vs{text-align:center}
.vs b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;color:var(--acc)}
.vs small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap}
.ttl{font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.06em}
.ops{display:flex;gap:4px}
@media (max-width:820px){.bout{grid-template-columns:1fr auto 1fr}.bout .ord{display:none}.bout .ops{grid-column:1/-1;justify-content:center}.f,.f.r{flex-direction:column;text-align:center}}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.ficha{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:grid;gap:10px;align-content:start;overflow:hidden}
.ficha:hover{border-color:#3d3d42}
.ficha .hd{display:flex;gap:10px;align-items:center;min-width:0}
.ficha .rec{font-family:Anton,Impact,sans-serif;font-size:17px;margin-left:auto;white-space:nowrap}
.checks{display:flex;flex-wrap:wrap;gap:5px;align-items:flex-start}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.fl{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;min-height:34px}
.fl.on{background:var(--accsoft);color:var(--acc);border-color:#5c4a12}
.inp{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px}
.kan{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:180px}
.col h4{margin:2px 4px 10px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;gap:6px}
.tk{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.tk b{display:block;font-size:13.5px;margin-bottom:4px}
.tk .m{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.tk.critica{border-left:3px solid var(--red)}.tk.alta{border-left:3px solid var(--warn)}
.col.drop{outline:2px dashed var(--acc);outline-offset:-4px}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.chart .c i{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;min-height:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
.chart .c small{font-size:10px;color:var(--mut)}
.hbar{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;margin-bottom:8px;font-size:13.5px}
.hbar .p{height:12px;background:var(--panel3);border-radius:6px;overflow:hidden;display:flex}
.hbar .p i{display:block;height:100%}
@media (max-width:560px){.hbar{grid-template-columns:96px 1fr 78px;font-size:12.5px}}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:10px}
.leg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.run{position:relative;padding-left:26px}
.run::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.rs{position:relative;padding:7px 0 11px;display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:start}
.rs::before{content:'';position:absolute;left:-23px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--mut)}
.rs.hecho::before{background:var(--ok);border-color:var(--ok)}
.rs.bt::before{border-color:var(--acc)}
.rs .h{font-family:Anton,Impact,sans-serif;font-size:17px;line-height:1.1}
.rs .h s{display:block;font-family:"Inter Tight",sans-serif;font-size:11px;color:var(--mut)}
.rs small{display:block;color:var(--mut);font-size:12px}
.merch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.prod svg{width:100%;height:auto;background:var(--panel2);border-radius:12px}
.tallas{display:flex;gap:4px;flex-wrap:wrap}
.tallas span{font-size:11.5px;background:var(--panel3);border-radius:6px;padding:2px 7px}
.tallas span.bajo{background:var(--redsoft);color:var(--red)}
.chat{display:flex;flex-direction:column;gap:10px;height:min(56vh,520px);overflow-y:auto;padding:4px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px;white-space:pre-wrap}
.msg.yo{align-self:flex-end;background:var(--ink);color:#0b0b0c;border-bottom-right-radius:5px}
.msg.ia{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
.chatin{display:flex;gap:8px;margin-top:12px}
.chatin input{flex:1}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sug button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer;min-height:32px}
.mod-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(660px,100%);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;animation:modin .18s ease}
.mod.wide{width:min(940px,100%)}
@keyframes modin{from{transform:translateY(10px);opacity:0}}
.mod header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mod header b{font-size:16px}
.mod .bd{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mod .bd.one{display:block}
.mod .full{grid-column:1/-1}
.mod label{display:grid;gap:5px;font-size:12px;color:var(--mut);font-weight:600}
.mod label .rq{color:var(--acc)}
.mod input,.mod select,.mod textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font-size:15px;width:100%;min-height:40px}
.mod input.err,.mod select.err{border-color:var(--red)}
.mod .ck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:500;background:var(--panel2);border-radius:10px;padding:9px 11px;cursor:pointer}
.mod .ck input{width:18px;min-height:0;height:18px}
.mod .multi{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel2);border-radius:10px;padding:8px;max-height:180px;overflow-y:auto}
.mod .multi label{display:flex;flex-direction:row;align-items:center;gap:6px;background:var(--panel3);border-radius:8px;padding:5px 8px;color:var(--ink);font-weight:500;cursor:pointer}
.mod .multi input{width:16px;height:16px;min-height:0}
.mod .sec{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.mod footer{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.mod .msg-err{grid-column:1/-1;background:var(--redsoft);color:var(--red);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.mod .nota{grid-column:1/-1;background:var(--panel2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--mut)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#0b0b0c;font-weight:600;padding:10px 16px;border-radius:12px;z-index:80;animation:modin .2s;max-width:calc(100vw - 30px)}
.toast.err{background:var(--red);color:#fff}
.vacio{color:var(--mut);text-align:center;padding:26px 10px;font-size:13.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:none;background:none;padding:9px 12px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.liq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
.liq div{background:var(--panel2);border-radius:10px;padding:8px 10px}
.liq small{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.liq b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.poster{width:min(540px,100%);aspect-ratio:4/5;margin:0 auto;background:radial-gradient(ellipse 80% 50% at 50% 0%,#3a2c07,#000 70%);border:1px solid #3d300a;border-radius:8px;padding:6% 6% 4%;display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;position:relative;overflow:hidden}
.poster img.lg{width:16%;border-radius:12%}
.poster .t{font-family:Anton,Impact,sans-serif;font-size:clamp(26px,7vw,46px);line-height:.95;letter-spacing:.04em;margin-top:3%}
.poster .t span{color:#d4a72c}
.poster .fecha{font-size:clamp(11px,2.4vw,14px);letter-spacing:.2em;text-transform:uppercase;color:#c8c8c8;margin-top:1%}
.poster .main{margin:5% 0 3%;width:100%}
.poster .main .n{font-family:Anton,Impact,sans-serif;font-size:clamp(20px,5.2vw,34px);line-height:1}
.poster .main .vs{font-family:Anton,Impact,sans-serif;color:#d4a72c;font-size:clamp(16px,3.6vw,24px);margin:1% 0}
.poster .main .tt{font-size:clamp(9px,2vw,12px);letter-spacing:.18em;color:#d4a72c;font-weight:700}
.poster .und{width:100%;display:grid;gap:1.6%;margin-top:2%}

const miles=n=>{const r=Math.round(+n||0);return (r<0?'-':'')+String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const eur=n=>{const v=Math.round((+n||0)*100)/100; const ent=Math.trunc(Math.abs(v)); const dec=Math.round((Math.abs(v)-ent)*100); return (v<0?'-':'')+String(ent).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(dec?','+String(dec).padStart(2,'0'):'')+' €';};
const kg=n=>n===''||n==null||!isFinite(+n)?'—':(+n).toFixed(1).replace('.',',')+' kg';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fecha=f=>f?new Date(f+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'—';
const fechaC=f=>f?new Date(f+'T12:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'—';
const dias=f=>Math.round((new Date(f+'T00:00')-HOY)/864e5);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/«.*?»/g,'').replace(/\s+/g,' ').trim();

    {k:'a',l:'Esquina roja',t:'sel',o:ops,req:1,full:1},{k:'b',l:'Esquina azul',t:'sel',o:ops,req:1,full:1},
    {k:'mod',l:'Modalidad',t:'sel',o:['MMA','K1','Muay Thai','Kickboxing','Boxeo']},{k:'peso',l:'Peso pactado (kg)',t:'number',req:1},
    {k:'rounds',l:'Asaltos',t:'number',req:1},{k:'dur',l:'Minutos por asalto',t:'number',req:1},

    {sec:'Bolsas'},{k:'bolsaA',l:'Bolsa esquina roja (€)',t:'number',req:1},{k:'bolsaB',l:'Bolsa esquina azul (€)',t:'number',req:1}],
    val:c||{mod:'MMA',peso:70,rounds:3,dur:3,tipo:'Profesional',estado:'pendiente',reglas:'',bolsaA:500,bolsaB:500},

      if(v.rounds<1||v.rounds>12) return 'Los asaltos tienen que estar entre 1 y 12.'; if(v.bolsaA<0||v.bolsaB<0) return 'Las bolsas no pueden ser negativas.';

      if(otro&&v.estado!=='caido') return `${pel([otro.a,otro.b].find(p=>p===v.a||p===v.b))?.nombre} ya tiene otro combate en esta edición.`;
      const pa=pel(v.a),pb=pel(v.b); const aviso=[pa,pb].filter(p=>Math.abs(p.peso-v.peso)>5).map(p=>p.nombre);
      if(c) aplicar('combate',c,v,['a','b','peso','estado','bolsaA','bolsaB','rounds']); else { const n={id:uid(),ed:S.ed,orden:de('combates').length,res:{gan:'',met:'',asalto:'',tiempo:'',estado:''},retraso:0,...v}; S.combates.push(n); hist('combate',n.id,'creado','',`${pa.nombre} vs ${pb.nombre}`); }
      if(aviso.length) setTimeout(()=>toast('Ojo: '+aviso.join(' y ')+' compite habitualmente a más de 5 kg de este peso','err'),400);
    },
    borrar:c&&!cerrada()?()=>{ if(de('liq').some(x=>x.estado==='confirmado'&&(x.pel===c.a||x.pel===c.b))&&c.estado!=='caido'){toast('Tiene pagos confirmados: márcalo como «Caído» en lugar de eliminarlo','err');return false;} S.combates=S.combates.filter(x=>x.id!==c.id);hist('combate',c.id,'eliminado','',`${pel(c.a)?.nombre} vs ${pel(c.b)?.nombre}`);}:null});
}

function horario(){
  const e=ED(); const cs=de('combates').filter(c=>c.estado!=='caido').sort((a,b)=>b.orden-a.orden); const [h0,m0]=e.hora.split(':').map(Number);

}
const hhmm=x=>String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0');

  if(pl.id==='pl4') de('staff').filter(s=>!s.conf).forEach(s=>L.push({id:s.id,nombre:s.nombre,ref:s.rol,tel:s.tel,v:{...base,nombre:s.nombre}}));

  if(pl.id==='pl6') de('vuelos').filter(v=>v.estado==='confirmado'&&v.sentido==='ida').forEach(v=>{const p=pel(v.persona);const tr=de('traslados').find(t=>t.quien.includes(v.persona));const h=de('reservas').find(r=>r.ocupantes.includes(v.persona));L.push({id:v.persona,nombre:nomPersona(v.persona),ref:v.loc,tel:p?.tel||'',v:{...base,nombre:nomPersona(v.persona).replace(/«.*?»\s*/,''),llegada:tr?`${fechaC(tr.fecha)} a las ${tr.hora} en ${tr.desde} (${tr.conductor})`:`${fechaC(v.fecha)} ${v.hora} en ${v.destino}`,hotel:h?`${h.hotel}${h.hab?', habitación '+h.hab:''}`:'por confirmar'}});});
  return L;
}

function buscar(q){
  const s=norm(q); if(s.length<2) return [];
  const R=[]; const add=(ic,t,sub,go)=>R.push({ic,t,sub,go});
  S.peleadores.forEach(p=>{if(norm(p.nombre+' '+p.legal+' '+p.gym+' '+p.pais).includes(s))add('👊',p.nombre,`Peleador · ${p.mod} ${pk(p.peso)}`,'pel:'+p.id);});
  de('combates').forEach(c=>{if(norm(pel(c.a)?.nombre+' '+pel(c.b)?.nombre+' '+c.mod+' '+c.titulo).includes(s))add('🥊',`${pel(c.a)?.nombre} vs ${pel(c.b)?.nombre}`,`Combate · ${c.mod} ${pk(c.peso)}`,'com:'+c.id);});
  de('patro').forEach(p=>{if(norm(p.nombre+' '+p.contacto).includes(s))add('🤝',p.nombre,`Patrocinador · ${eur(p.importe)}`,'pat:'+p.id);});
  de('docs').forEach(d=>{const t=d.titT==='peleador'?pel(d.tit)?.nombre:d.tit;if(norm(d.tipo+' '+t+' '+d.ref).includes(s))add('📄',d.tipo,`Documento · ${t} · ${DOC_EST[estadoDoc(d)][0]}`,'doc:'+d.id);});
  de('tareas').forEach(t=>{if(norm(t.t+' '+t.quien+' '+t.vinc).includes(s))add('✅',t.t,`Tarea · ${t.quien}`,'tar:'+t.id);});
  de('gastos').forEach(g=>{if(norm(g.concepto+' '+g.prov+' '+g.factura).includes(s))add('💶',g.concepto,`Proveedor · ${g.prov} · ${eur(g.importe)}`,'gas:'+g.id);});
  de('staff').forEach(x=>{if(norm(x.nombre+' '+x.rol).includes(s))add('🧑‍⚖️',x.nombre,`Personal · ${x.rol}`,'stf:'+x.id);});
  de('vuelos').forEach(v=>{if(v.loc&&norm(v.loc+' '+v.aerolinea+' '+nomPersona(v.persona)).includes(s))add('✈️',`Vuelo ${v.loc}`,nomPersona(v.persona),'vue:'+v.id);});
  return R.slice(0,25);
}

    case 'csv-gastos': { const ec=eco(); return csv('presupuesto-'+norm(ED().nombre).replace(/\s/g,'-')+'.csv',[['Tipo','Partida','Total','Comprometido o cobrado','Pagado'],...Object.entries(ec.ing).map(([k,v])=>['Ingreso',k,v.prev,v.cob,'']),...Object.entries(ec.gas).filter(([,v])=>v.pres).map(([k,v])=>['Gasto',k,v.pres,v.comp,v.pag]),[],['Concepto','Proveedor','Partida','Factura','Vence','Importe','Estado'],...de('gastos').map(g=>[g.concepto,g.prov,g.cat,g.factura,g.vence,g.importe,g.estado])]); }
    case 'csv-ventas': { const ts=de('tipos'); return csv('entradas-'+norm(ED().nombre).replace(/\s/g,'-')+'.csv',[['Fecha','Referencia','Tipo','Canal','Cantidad','Precio','Estado'],...de('ventas').map(v=>{const t=ts.find(x=>x.id===v.tipo);return [v.fecha,v.ref,t?.nombre,v.canal,v.cant,t?.precio,v.estado];})]); }
    case 'csv-pesaje': return csv('pesaje.csv',[['Fecha','Hora','Peleador','Tipo','Peso','Responsable','Observaciones'],...de('pesajes').map(w=>[w.fecha,w.hora,pel(w.pel)?.nombre,w.tipoP,w.peso,w.resp,w.obs])]);
    case 'csv-rooming': return csv('rooming-list.csv',[['Hotel','Habitación','Tipo','Ocupantes','Entrada','Salida','Estado'],...de('reservas').map(r=>[r.hotel,r.hab||'Sin asignar',r.tipo,r.ocupantes.map(nomPersona).join(' / '),r.entrada,r.salida,r.estado])]);
    case 'imp-rooming': return imprimir(`<h1>Rooming list · ${esc(ED().nombre)}</h1>${[...new Set(de('reservas').map(r=>r.hotel))].map(h=>`<h2>${esc(h)}</h2><table><tr><th>Habitación</th><th>Tipo</th><th>Ocupantes</th><th>Entrada</th><th>Salida</th><th>Noches</th></tr>${de('reservas').filter(r=>r.hotel===h).map(r=>`<tr><td>${esc(r.hab||'Por asignar')}</td><td>${esc(r.tipo)}</td><td>${r.ocupantes.map(o=>esc(nomPersona(o))).join(', ')}</td><td>${fecha(r.entrada)}</td><td>${fecha(r.salida)}</td><td>${dias(r.salida)-dias(r.entrada)}</td></tr>`).join('')}</table>`).join('')}`);
    case 'imp-pesaje': { const cs=de('combates').filter(c=>c.estado!=='caido').sort((a,b)=>a.orden-b.orden); return imprimir(`<h1>Hoja de pesaje · ${esc(ED().nombre)}</h1><div>Tolerancia: ${String(ED().tolerancia).replace('.',',')} kg</div><table><tr><th>Combate</th><th>Peleador</th><th>Pactado</th><th>Límite</th><th>Peso</th><th>Hora</th><th>Firma</th></tr>${cs.map(c=>[c.a,c.b].map(p=>`<tr><td>${c.mod} ${pk(c.peso)}</td><td>${esc(pel(p)?.nombre)}</td><td>${kg(c.peso)}</td><td>${kg(limite(c))}</td><td></td><td></td><td></td></tr>`).join('')).join('')}</table>`); }
    case 'imp-presupuesto': { const ec=eco(); return imprimir(`<h1>Presupuesto · ${esc(ED().nombre)}</h1><table><tr><th>Ingresos previstos</th><th>Cobrados</th><th>Gastos</th><th>Pagados</th><th>Resultado previsto</th><th>Caja real</th></tr><tr><td>${eur(ec.ingPrev)}</td><td>${eur(ec.ingCob)}</td><td>${eur(ec.gasTot)}</td><td>${eur(ec.gasPag)}</td><td>${eur(ec.balPrev)}</td><td>${eur(ec.caja)}</td></tr></table><h2>Gastos por partida</h2><table><tr><th>Partida</th><th>Total</th><th>Comprometido</th><th>Pagado</th></tr>${Object.entries(ec.gas).filter(([,v])=>v.pres).map(([k,v])=>`<tr><td>${k}</td><td>${eur(v.pres)}</td><td>${eur(v.comp)}</td><td>${eur(v.pag)}</td></tr>`).join('')}</table><h2>Ingresos</h2><table><tr><th>Concepto</th><th>Previsto</th><th>Cobrado</th></tr>${Object.entries(ec.ing).map(([k,v])=>`<tr><td>${k}</td><td>${eur(v.prev)}</td><td>${eur(v.cob)}</td></tr>`).join('')}</table>`); }
  }}
  const zm=g('data-zoom'); if(zm){ modalInfo('Fight2One 12',`<img src="${esc(zm)}" alt="" style="width:100%;border-radius:12px">`); return; }
  const op=g('data-open'); if(op) return abrir(op);
});
M.addEventListener('change',e=>{if(e.target.id==='sel-ed'){S.ed=e.target.value;guardar();render();toast('Edición activa: '+ED().nombre);}});
M.addEventListener('input',e=>{
  if(e.target.id==='qp'){QP=e.target.value;render();}
  if(e.target.id==='gq'){const r=buscar(e.target.value);const box=document.getElementById('gres');box.hidden=!e.target.value.trim();box.innerHTML=r.length?r.map(x=>`<button data-go="${x.go}"><span>${x.ic}</span><span><b>${esc(x.t)}</b></span><small>${esc(x.sub)}</small></button>`).join(''):'<div class="vacio">Sin resultados</div>';}
});
M.addEventListener('submit',e=>{if(e.target.id==='chatf'){e.preventDefault();preguntar(document.getElementById('chatq').value);}});
let DRAG=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest?.('[data-drag],[data-drag-p]');if(t){DRAG={id:t.dataset.drag||t.dataset.dragP,tipo:t.dataset.drag?'t':'p'};e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('[data-col],[data-col-p]');if(c&&DRAG){e.preventDefault();document.querySelectorAll('.col.drop').forEach(x=>x!==c&&x.classList.remove('drop'));c.classList.add('drop');}});
document.addEventListener('drop',e=>{const c=e.target.closest?.('[data-col],[data-col-p]');if(!c||!DRAG)return;e.preventDefault();if(cerrada()){toast(CERR,'err');DRAG=null;return render();}
  if(DRAG.tipo==='t'&&c.dataset.col){const x=S.tareas.find(y=>y.id===DRAG.id);if(x.estado!==c.dataset.col){hist('tarea',x.id,'estado',x.estado,c.dataset.col);x.estado=c.dataset.col;}}
  else if(DRAG.tipo==='p'&&c.dataset.colP){const x=S.patro.find(y=>y.id===DRAG.id);if(x.estado!==c.dataset.colP){(x.hist=x.hist||[]).push({f:HOYS,de:x.estado,a:c.dataset.colP});hist('patrocinio',x.id,'estado',x.estado,c.dataset.colP);x.estado=c.dataset.colP;}}
  DRAG=null;guardar();render();});
document.addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'));});
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(R[v]&&v!==VISTA){VISTA=v;render();}});
render();
(function(){ const sp=document.getElementById('splash'); let visto=false; try{visto=sessionStorage.getItem('f2o_splash')==='1';}catch(e){}
  if(visto||matchMedia('(prefers-reduced-motion: reduce)').matches){sp.remove();return;}
  const fuera=()=>{sp.classList.add('fuera');try{sessionStorage.setItem('f2o_splash','1');}catch(e){}setTimeout(()=>sp.remove(),700);};
  sp.addEventListener('click',fuera); setTimeout(fuera,2500); })();
</script>
</body>
